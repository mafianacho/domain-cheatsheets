<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="클립 A가 끝나는 지점에서 효과 없이 바로 클립 B 화면으로 바뀌는 컷 편집">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.ph{animation:ph 3.6s linear infinite}@keyframes ph{0%{transform:translateX(0)}100%{transform:translateX(272px)}}.pa{animation:pa 3.6s steps(1,end) infinite}.pb{opacity:0;animation:pb 3.6s steps(1,end) infinite}@keyframes pa{0%{opacity:1}50%{opacity:0}100%{opacity:1}}@keyframes pb{0%{opacity:0}50%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<rect x="100" y="10" width="120" height="68" rx="6" fill="#1e293b" stroke="#475569"/><g class="pa"><circle cx="160" cy="44" r="17" fill="#38bdf8"/><text x="160" y="49" class="k" style="font-size:14px">A</text></g><g class="pb"><rect x="143" y="27" width="34" height="34" rx="4" fill="#f59e0b"/><text x="160" y="49" class="k" style="font-size:14px">B</text></g><rect x="24" y="104" width="136" height="36" rx="4" fill="#38bdf8" opacity="0.9"/><text x="92.0" y="125.0" class="k">클립 A</text><rect x="160" y="104" width="136" height="36" rx="4" fill="#f59e0b" opacity="0.9"/><text x="228.0" y="125.0" class="k">클립 B</text><line x1="160" y1="96" x2="160" y2="148" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="3 3"/><text x="160" y="160" class="s c">컷(자르는 지점)</text><g class="ph"><line x1="24" y1="94" x2="24" y2="146" stroke="#e2e8f0" stroke-width="1.5"/><polygon points="20,88 28,88 24,94" fill="#e2e8f0"/></g><text x="160" y="180" class="m c b">클립 A에서 B로 바로 넘어감</text><text x="160" y="194" class="s c">효과 없이 이어 붙이는 가장 기본 편집</text>
</svg>
