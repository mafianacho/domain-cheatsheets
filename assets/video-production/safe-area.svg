<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="세로 화면에서 위아래와 오른쪽 가장자리는 버튼과 제목에 가려질 수 있어 자막을 파란 점선 안쪽에 두라는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}@keyframes cp{0%,25%{transform:translateY(0)}45%,80%{transform:translateY(74px)}100%{transform:translateY(0)}}.cp{animation:cp 3.6s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
