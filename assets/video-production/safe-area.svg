<rect x="115" y="8" width="90" height="160" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/><rect x="116" y="9" width="88" height="22" rx="9" fill="#f59e0b" opacity="0.22"/><rect x="116" y="124" width="88" height="43" rx="9" fill="#f59e0b" opacity="0.22"/><rect x="182" y="70" width="22" height="54" fill="#f59e0b" opacity="0.22"/><rect x="122" y="34" width="58" height="86" fill="none" stroke="#38bdf8" stroke-dasharray="4 3" stroke-width="1.5"/><circle cx="193" cy="82" r="5" fill="none" stroke="#94a3b8"/><circle cx="193" cy="98" r="5" fill="none" stroke="#94a3b8"/><circle cx="193" cy="114" r="5" fill="none" stroke="#94a3b8"/><rect x="124" y="140" width="52" height="5" rx="2" fill="#94a3b8"/><rect x="124" y="150" width="38" height="4" rx="2" fill="#94a3b8"/><rect class="cp" x="126" y="60" width="50" height="14" rx="3" fill="#e2e8f0"/><text x="16" y="50" class="m b">파란 점선 안</text><text x="16" y="66" class="m">= 안전 영역</text><text x="16" y="90" class="s">자막·핵심은</text><text x="16" y="103" class="s">여기에 두기</text><text x="214" y="50" class="m b">노란 영역</text><text x="214" y="66" class="s">제목·버튼이</text><text x="214" y="79" class="s">글자를 가릴</text><text x="214" y="92" class="s">수 있음</text><text x="160" y="190" class="s c">쇼츠 같은 세로 화면의 가려지는 가장자리 피하기</text>
