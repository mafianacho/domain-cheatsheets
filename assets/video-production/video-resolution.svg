<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="4K, 1440p, 1080p, 720p, 480p 해상도의 크기를 겹쳐서 비교한 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}@keyframes hh{0%,19%{opacity:1}20%,100%{opacity:0}}.hh{opacity:0;animation:hh 5s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="22" class="m b">해상도 = 가로 × 세로 픽셀</text><rect x="16" y="34" width="180.0" height="101.2" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="16" y="34" width="120.0" height="67.5" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="16" y="34" width="90.0" height="50.6" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="16" y="34" width="60.0" height="33.8" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="16" y="34" width="40.0" height="22.5" fill="none" stroke="#475569" stroke-width="1.5"/><rect class="hh" style="animation-delay:0s" x="16" y="34" width="180.0" height="101.2" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/><text x="212" y="52" class="s" style="fill:#94a3b8">4K 3840×2160</text><text class="hh s" style="animation-delay:0s;fill:#f59e0b;font-weight:700" x="212" y="52">4K 3840×2160</text><rect class="hh" style="animation-delay:-4s" x="16" y="34" width="120.0" height="67.5" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/><text x="212" y="74" class="s" style="fill:#94a3b8">1440p 2560×1440</text><text class="hh s" style="animation-delay:-4s;fill:#f59e0b;font-weight:700" x="212" y="74">1440p 2560×1440</text><rect class="hh" style="animation-delay:-3s" x="16" y="34" width="90.0" height="50.6" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/><text x="212" y="96" class="s" style="fill:#94a3b8">1080p 1920×1080</text><text class="hh s" style="animation-delay:-3s;fill:#f59e0b;font-weight:700" x="212" y="96">1080p 1920×1080</text><rect class="hh" style="animation-delay:-2s" x="16" y="34" width="60.0" height="33.8" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/><text x="212" y="118" class="s" style="fill:#94a3b8">720p 1280×720</text><text class="hh s" style="animation-delay:-2s;fill:#f59e0b;font-weight:700" x="212" y="118">720p 1280×720</text><rect class="hh" style="animation-delay:-1s" x="16" y="34" width="40.0" height="22.5" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/><text x="212" y="140" class="s" style="fill:#94a3b8">480p 854×480</text><text class="hh s" style="animation-delay:-1s;fill:#f59e0b;font-weight:700" x="212" y="140">480p 854×480</text><text x="16" y="156" class="s">숫자가 클수록 점이 많아 선명하고 파일도 커짐</text><text x="16" y="172" class="s">HD = 1080p 부근, UHD = 4K (3840×2160)</text><text x="16" y="188" class="s">16:9 기준 표준 크기</text>
</svg>
