<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="영상 장면 중 한 장을 골라 큰 글씨를 얹어 썸네일로 만드는 과정">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}@keyframes sel{0%,24%{transform:translateX(0)}25%,49%{transform:translateX(58px)}50%,74%{transform:translateX(116px)}75%,100%{transform:translateX(174px)}}.sel{animation:sel 4s steps(1,end) infinite}@keyframes i1{0%,24%{opacity:1}25%,100%{opacity:0}}@keyframes i2{0%,24%{opacity:0}25%,49%{opacity:1}50%,100%{opacity:0}}@keyframes i3{0%,49%{opacity:0}50%,74%{opacity:1}75%,100%{opacity:0}}@keyframes i4{0%,74%{opacity:0}75%,100%{opacity:1}}.i1{animation:i1 4s steps(1,end) infinite}.i2{opacity:0;animation:i2 4s steps(1,end) infinite}.i3{opacity:0;animation:i3 4s steps(1,end) infinite}.i4{opacity:0;animation:i4 4s steps(1,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<rect x="24" y="10" width="50" height="28" rx="3" fill="#1e293b" stroke="#475569"/><circle cx="49" cy="24" r="7" fill="#38bdf8"/><rect x="82" y="10" width="50" height="28" rx="3" fill="#1e293b" stroke="#475569"/><rect x="100" y="17" width="14" height="14" rx="2" fill="#f59e0b"/><rect x="140" y="10" width="50" height="28" rx="3" fill="#1e293b" stroke="#475569"/><polygon points="165,17 172,31 158,31" fill="#e2e8f0"/><rect x="198" y="10" width="50" height="28" rx="3" fill="#1e293b" stroke="#475569"/><polygon points="223,17 230,24 223,31 216,24" fill="#94a3b8"/><rect class="sel" x="22" y="8" width="54" height="32" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5"/><path d="M160 44 v10 m-4 -5 l4 5 l4 -5" stroke="#94a3b8" stroke-width="1.5" fill="none"/><rect x="80" y="58" width="160" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><g class="i1"><circle cx="160" cy="96" r="20" fill="#38bdf8"/></g><g class="i2"><rect x="140" y="76" width="40" height="40" rx="2" fill="#f59e0b"/></g><g class="i3"><polygon points="160,76 180,116 140,116" fill="#e2e8f0"/></g><g class="i4"><polygon points="160,76 180,96 160,116 140,96" fill="#94a3b8"/></g><text x="90" y="138" class="m b am">큰 글씨</text><rect x="198" y="132" width="36" height="12" rx="2" fill="#0f172a" opacity="0.85"/><text x="216" y="141" class="s c" style="fill:#e2e8f0">10:24</text><text x="160" y="170" class="m c b">영상을 대표하는 한 장면 + 큰 글씨</text><text x="160" y="186" class="s c">일반 영상은 16:9, 쇼츠는 9:16 권장</text>
