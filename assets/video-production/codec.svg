<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="큰 원본 영상이 코덱 상자를 지나며 작은 파일로 줄어드는 압축 과정">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}@keyframes cd{0%,8%{transform:translate(46px,100px) scale(1)}32%{transform:translate(150px,100px) scale(1)}50%{transform:translate(160px,100px) scale(0.3)}68%{transform:translate(170px,100px) scale(0.3)}92%,100%{transform:translate(268px,100px) scale(0.3)}}.mb{transform-origin:0 0;transform:translate(46px,100px);animation:cd 3.6s ease-in-out infinite}@keyframes gr{0%,100%{opacity:1}50%{opacity:0.55}}.gr{animation:gr 1.8s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="46" y="52" class="m c b">원본</text><text x="268" y="52" class="m c b">압축본</text><rect x="256" y="92" width="24" height="16" rx="2" fill="none" stroke="#475569" stroke-dasharray="3 2"/><g class="mb"><rect x="-30" y="-22" width="60" height="44" rx="4" fill="#38bdf8"/><rect x="-22" y="-14" width="44" height="28" rx="2" fill="#0f172a" opacity="0.35"/></g><rect class="gr" x="116" y="62" width="88" height="76" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2"/><text x="160" y="96" class="t c" style="text-anchor:middle">코덱</text><text x="160" y="114" class="s c">H.264 등</text><text x="160" y="128" class="s c">줄이고 다시 풀기</text><path d="M92 100 h18 m-5 -4 l5 4 l-5 4 M210 100 h38 m-5 -4 l5 4 l-5 4" stroke="#94a3b8" stroke-width="1.5" fill="none"/><text x="46" y="140" class="s c">크고 무거움</text><text x="268" y="140" class="s c">작은 파일</text><text x="160" y="172" class="s c b">Codec: 영상을 작게 줄이고(인코딩) 다시 푸는(디코딩) 방식</text><text x="160" y="188" class="s c">MP4는 이 영상과 소리를 담는 상자(컨테이너)</text>
</svg>
