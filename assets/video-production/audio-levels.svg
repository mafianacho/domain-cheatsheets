<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="목소리와 배경음악 소리 크기를 막대로 보여주고 맨 위 0dB를 넘으면 소리가 깨진다는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}@keyframes v{0%,100%{transform:scaleY(0.5)}20%{transform:scaleY(0.38)}40%{transform:scaleY(0.62)}60%{transform:scaleY(0.42)}80%{transform:scaleY(0.58)}}@keyframes mu{0%,100%{transform:scaleY(0.78)}30%{transform:scaleY(0.7)}60%{transform:scaleY(0.82)}}.cv{transform-box:fill-box;transform-origin:top;transform:scaleY(0.5);animation:v 2.4s ease-in-out infinite}.cm2{transform-box:fill-box;transform-origin:top;transform:scaleY(0.78);animation:mu 2.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<rect x="104" y="30" width="40" height="12" fill="#f87171"/><rect x="104" y="42" width="40" height="26" fill="#f59e0b"/><rect x="104" y="68" width="40" height="82" fill="#38bdf8"/><rect x="184" y="30" width="40" height="12" fill="#f87171"/><rect x="184" y="42" width="40" height="26" fill="#f59e0b"/><rect x="184" y="68" width="40" height="82" fill="#38bdf8"/><rect class="cv" x="104" y="30" width="40" height="120" fill="#0f172a" fill-opacity="0.82"/><rect class="cm2" x="184" y="30" width="40" height="120" fill="#0f172a" fill-opacity="0.82"/><line x1="96" y1="30" x2="232" y2="30" stroke="#e2e8f0" stroke-dasharray="3 3"/><text x="240" y="36" class="s">0 dB 넘으면</text><text x="240" y="48" class="s">소리가 깨짐</text><text x="16" y="24" class="m b">소리 크기(레벨)</text><text x="124" y="166" class="m c">목소리</text><text x="204" y="166" class="m c">배경음악</text><text x="160" y="190" class="s c">목소리가 중심, 음악은 아래로 깔고 빨간 구간은 피함</text>
</svg>
