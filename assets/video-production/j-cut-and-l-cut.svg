<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="J-cut은 다음 장면의 소리가 먼저 시작되고 L-cut은 앞 장면의 소리가 다음 화면까지 이어지는 타임라인 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.ph{animation:ph 3.6s linear infinite}@keyframes ph{0%{transform:translateX(0)}100%{transform:translateX(272px)}}@keyframes pu{0%,100%{opacity:0.15}50%{opacity:0.55}}.ov{animation:pu 1.8s ease-in-out infinite}@keyframes ph2{0%{transform:translateX(0)}100%{transform:translateX(268px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="22" class="m b">J-cut: 다음 소리가 먼저 들어옴</text><text x="14" y="46" class="s">화면</text><text x="14" y="70" class="s">소리</text><rect x="38" y="36" width="118" height="18" rx="3" fill="#38bdf8" opacity="0.95"/><text x="97.0" y="48.0" class="k">화면 A</text><rect x="156" y="36" width="150" height="18" rx="3" fill="#f59e0b" opacity="0.95"/><text x="231.0" y="48.0" class="k">화면 B</text><rect x="38" y="60" width="82" height="18" rx="3" fill="#38bdf8" opacity="0.55"/><text x="79.0" y="72.0" class="k">소리 A</text><rect x="120" y="60" width="186" height="18" rx="3" fill="#f59e0b" opacity="0.55"/><text x="213.0" y="72.0" class="k">소리 B</text><rect x="120" y="58" width="36" height="22" fill="none" stroke="#e2e8f0" stroke-dasharray="3 2"/><rect class="ov" x="120" y="58" width="36" height="22" fill="#e2e8f0"/><text x="16" y="106" class="m b">L-cut: 앞 소리가 뒤 화면까지 이어짐</text><text x="14" y="130" class="s">화면</text><text x="14" y="154" class="s">소리</text><rect x="38" y="120" width="118" height="18" rx="3" fill="#38bdf8" opacity="0.95"/><text x="97.0" y="132.0" class="k">화면 A</text><rect x="156" y="120" width="150" height="18" rx="3" fill="#f59e0b" opacity="0.95"/><text x="231.0" y="132.0" class="k">화면 B</text><rect x="38" y="144" width="156" height="18" rx="3" fill="#38bdf8" opacity="0.55"/><text x="116.0" y="156.0" class="k">소리 A</text><rect x="194" y="144" width="112" height="18" rx="3" fill="#f59e0b" opacity="0.55"/><text x="250.0" y="156.0" class="k">소리 B</text><rect x="156" y="142" width="38" height="22" fill="none" stroke="#e2e8f0" stroke-dasharray="3 2"/><rect class="ov" x="156" y="142" width="38" height="22" fill="#e2e8f0"/><g class="ph" style="animation-name:ph2"><line x1="38" y1="28" x2="38" y2="168" stroke="#e2e8f0" stroke-width="1.5"/></g><text x="160" y="190" class="s c">화면과 소리가 바뀌는 시점을 일부러 어긋나게 함</text>
