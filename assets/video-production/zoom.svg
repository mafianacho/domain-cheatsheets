<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="카메라는 제자리에 두고 렌즈 화각만 좁혀 화면 속 인물이 커지는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.cm{transform-origin:110px 146px;animation:dl 3.4s ease-in-out infinite}@keyframes dl{0%,12%{transform:scaleX(1.2)}55%,88%{transform:scaleX(0.4)}100%{transform:scaleX(1.2)}}.pv{transform-origin:268px 122px;animation:pv 3.4s ease-in-out infinite}@keyframes pv{0%,12%{transform:scale(0.7)}55%,88%{transform:scale(1.5)}100%{transform:scale(0.7)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">Zoom: 카메라는 그대로, 렌즈만 당김</text><line x1="30" y1="36" x2="190" y2="36" stroke="#475569" stroke-width="3"/><circle cx="110" cy="66" r="11" fill="#38bdf8"/><line x1="104" y1="158" x2="96" y2="178" stroke="#475569" stroke-width="2"/><line x1="116" y1="158" x2="124" y2="178" stroke="#475569" stroke-width="2"/><g class="cm"><polygon points="110,146 76,60 144,60" fill="#f59e0b" opacity="0.22" stroke="#f59e0b"/></g><rect x="100" y="144" width="20" height="14" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><clipPath id="pc"><rect x="232" y="90" width="72" height="64" rx="5"/></clipPath><rect x="232" y="90" width="72" height="64" rx="5" fill="#1e293b" stroke="#475569"/><g clip-path="url(#pc)"><line x1="232" y1="104" x2="304" y2="104" stroke="#475569" stroke-width="3"/><g class="pv"><circle cx="268" cy="122" r="10" fill="#38bdf8"/></g></g><text x="268" y="168" class="s c">화면</text><text x="16" y="194" class="s">화각이 좁아지며 확대 (카메라는 안 움직임)</text>
</svg>
