<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="카메라가 삼각대 위에서 제자리 좌우로 돌며 장면을 훑는 위에서 본 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.w{transform-origin:160px 150px;animation:pn 3.6s ease-in-out infinite}@keyframes pn{0%,100%{transform:rotate(-36deg)}50%{transform:rotate(36deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">Pan: 제자리에서 좌우로 회전</text><path d="M40 150 A120 120 0 0 1 280 150" fill="none" stroke="#334155" stroke-dasharray="3 4"/><circle cx="80" cy="62" r="11" fill="#334155" stroke="#475569"/><circle cx="160" cy="44" r="11" fill="#38bdf8" stroke="#475569"/><circle cx="240" cy="62" r="11" fill="#334155" stroke="#475569"/><g class="w"><polygon points="160,150 112,52 208,52" fill="#f59e0b" opacity="0.22" stroke="#f59e0b"/></g><line x1="160" y1="158" x2="148" y2="180" stroke="#475569" stroke-width="2"/><line x1="160" y1="158" x2="172" y2="180" stroke="#475569" stroke-width="2"/><line x1="160" y1="158" x2="160" y2="182" stroke="#475569" stroke-width="2"/><rect x="150" y="144" width="20" height="14" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><text x="160" y="195" class="s c">카메라 위치는 그대로, 방향만 돌림</text>
</svg>
