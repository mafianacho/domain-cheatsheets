<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="촬영한 색이 표에서 한 줄씩 찾아져 정해진 색으로 바뀌는 룩업 테이블 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}@keyframes hl{0%,24%{transform:translateY(0)}25%,49%{transform:translateY(28px)}50%,74%{transform:translateY(56px)}75%,100%{transform:translateY(84px)}}.hl{animation:hl 3.2s steps(1,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="22" class="m b">LUT: 입력 색 → 출력 색 변환표</text><text x="60" y="40" class="s c">촬영한 색</text><text x="260" y="40" class="s c">바뀐 색</text><text x="160" y="40" class="s c">표에서 찾아 바꿈</text><rect x="24" y="48" width="272" height="24" rx="4" fill="#1e293b" stroke="#334155"/><rect x="36" y="52" width="48" height="16" rx="3" fill="#3b4252"/><rect x="236" y="52" width="48" height="16" rx="3" fill="#0f4c75"/><path d="M120 60 h80 m-6 -4 l6 4 l-6 4" stroke="#94a3b8" stroke-width="1.5" fill="none"/><rect x="24" y="76" width="272" height="24" rx="4" fill="#1e293b" stroke="#334155"/><rect x="36" y="80" width="48" height="16" rx="3" fill="#5b6573"/><rect x="236" y="80" width="48" height="16" rx="3" fill="#2a9d8f"/><path d="M120 88 h80 m-6 -4 l6 4 l-6 4" stroke="#94a3b8" stroke-width="1.5" fill="none"/><rect x="24" y="104" width="272" height="24" rx="4" fill="#1e293b" stroke="#334155"/><rect x="36" y="108" width="48" height="16" rx="3" fill="#7c8696"/><rect x="236" y="108" width="48" height="16" rx="3" fill="#f59e0b"/><path d="M120 116 h80 m-6 -4 l6 4 l-6 4" stroke="#94a3b8" stroke-width="1.5" fill="none"/><rect x="24" y="132" width="272" height="24" rx="4" fill="#1e293b" stroke="#334155"/><rect x="36" y="136" width="48" height="16" rx="3" fill="#a3acb9"/><rect x="236" y="136" width="48" height="16" rx="3" fill="#f43f5e"/><path d="M120 144 h80 m-6 -4 l6 4 l-6 4" stroke="#94a3b8" stroke-width="1.5" fill="none"/><rect class="hl" x="22" y="46" width="276" height="28" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="160" y="176" class="m c b">영상의 모든 색을 이 표대로 한 번에 바꿈</text><text x="160" y="192" class="s c">같은 LUT를 여러 영상에 씌우면 색감이 통일됨</text>
</svg>
