<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="카메라가 삼각대 위에서 제자리 위아래로 고개를 움직여 높은 건물을 훑는 옆에서 본 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.w{transform-origin:0 0;transform:translate(70px,112px) rotate(-22deg);animation:tl 3.6s ease-in-out infinite}@keyframes tl{0%,100%{transform:translate(70px,112px) rotate(-22deg)}50%{transform:translate(70px,112px) rotate(22deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">Tilt: 제자리에서 위아래로 회전</text><line x1="10" y1="172" x2="310" y2="172" stroke="#475569" stroke-width="2"/><rect x="226" y="40" width="34" height="132" rx="3" fill="#1e293b" stroke="#475569"/><rect x="234" y="50" width="6" height="8" fill="#334155"/><rect x="246" y="50" width="6" height="8" fill="#334155"/><rect x="234" y="74" width="6" height="8" fill="#334155"/><rect x="246" y="74" width="6" height="8" fill="#334155"/><rect x="234" y="98" width="6" height="8" fill="#334155"/><rect x="246" y="98" width="6" height="8" fill="#334155"/><rect x="234" y="122" width="6" height="8" fill="#334155"/><rect x="246" y="122" width="6" height="8" fill="#334155"/><rect x="234" y="146" width="6" height="8" fill="#334155"/><rect x="246" y="146" width="6" height="8" fill="#334155"/><g class="w"><polygon points="0,0 150,-40 150,40" fill="#f59e0b" opacity="0.22" stroke="#f59e0b"/></g><line x1="70" y1="124" x2="58" y2="172" stroke="#475569" stroke-width="2"/><line x1="70" y1="124" x2="84" y2="172" stroke="#475569" stroke-width="2"/><rect x="58" y="104" width="24" height="16" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><text x="16" y="192" class="s">카메라 위치는 그대로, 위·아래로 고개만 듦</text>
</svg>
