<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="클립 A와 B 사이 겹치는 구간에서 화면 A가 서서히 사라지고 B가 나타나는 전환 효과">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.ph{animation:ph 3.6s linear infinite}@keyframes ph{0%{transform:translateX(0)}100%{transform:translateX(272px)}}.pa{animation:pa 3.6s linear infinite}.pb{opacity:0;animation:pb 3.6s linear infinite}@keyframes pa{0%,42.6%{opacity:1}57.4%,100%{opacity:0}}@keyframes pb{0%,42.6%{opacity:0}57.4%,100%{opacity:1}}@keyframes ph{0%{transform:translateX(0)}100%{transform:translateX(272px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<rect x="100" y="10" width="120" height="68" rx="6" fill="#1e293b" stroke="#475569"/><g class="pa"><circle cx="160" cy="44" r="17" fill="#38bdf8"/><text x="160" y="49" class="k" style="font-size:14px">A</text></g><g class="pb"><rect x="143" y="27" width="34" height="34" rx="4" fill="#f59e0b"/><text x="160" y="49" class="k" style="font-size:14px">B</text></g><rect x="24" y="104" width="136" height="36" rx="4" fill="#38bdf8" opacity="0.9"/><text x="92.0" y="125.0" class="k">클립 A</text><rect x="160" y="104" width="136" height="36" rx="4" fill="#f59e0b" opacity="0.9"/><text x="228.0" y="125.0" class="k">클립 B</text><rect x="140" y="100" width="40" height="44" rx="4" fill="#e2e8f0" opacity="0.4" stroke="#e2e8f0"/><text x="160" y="156" class="s c">전환 효과 구간</text><g class="ph"><line x1="24" y1="94" x2="24" y2="146" stroke="#e2e8f0" stroke-width="1.5"/><polygon points="20,88 28,88 24,94" fill="#e2e8f0"/></g><text x="160" y="177" class="m c b">Transition: 두 장면 사이를 부드럽게 잇는 효과</text><text x="160" y="192" class="s c">디졸브(겹침) · 페이드(어두워짐) · 와이프(밀어내기)</text>
</svg>
