<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="현장의 넓은 밝기 범위를 좁은 칸에 납작하게 눌러 담는 로그 촬영 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.sq{transform-origin:160px 0;animation:sq 3.6s ease-in-out infinite}@keyframes sq{0%,15%{transform:scaleX(1.65)}55%,90%{transform:scaleX(1)}100%{transform:scaleX(1.65)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">현장의 밝기: 아주 어두움 ~ 아주 밝음</text><rect x="24" y="32" width="34" height="26" fill="#111827"/><rect x="58" y="32" width="34" height="26" fill="#1f2937"/><rect x="92" y="32" width="34" height="26" fill="#374151"/><rect x="126" y="32" width="34" height="26" fill="#4b5563"/><rect x="160" y="32" width="34" height="26" fill="#6b7280"/><rect x="194" y="32" width="34" height="26" fill="#9ca3af"/><rect x="228" y="32" width="34" height="26" fill="#d1d5db"/><rect x="262" y="32" width="34" height="26" fill="#f3f4f6"/><path d="M104 66 v22 m-5 -6 l5 6 l5 -6 M216 66 v22 m-5 -6 l5 6 l5 -6" stroke="#f59e0b" stroke-width="2" fill="none"/><text x="160" y="82" class="m c b am">눌러 담기</text><clipPath id="lg"><rect x="60" y="100" width="200" height="30"/></clipPath><g clip-path="url(#lg)"><g class="sq"><rect x="84" y="100" width="19" height="30" fill="#4b5563"/><rect x="103" y="100" width="19" height="30" fill="#525b69"/><rect x="122" y="100" width="19" height="30" fill="#596270"/><rect x="141" y="100" width="19" height="30" fill="#616a77"/><rect x="160" y="100" width="19" height="30" fill="#69717e"/><rect x="179" y="100" width="19" height="30" fill="#717985"/><rect x="198" y="100" width="19" height="30" fill="#79808c"/><rect x="217" y="100" width="19" height="30" fill="#818793"/></g></g><rect x="84" y="100" width="152" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/><text x="160" y="148" class="m c b">Log 촬영본: 넓은 밝기를 납작하게 담음</text><text x="160" y="168" class="s c">그래서 화면은 회색빛으로 밋밋해 보임</text><text x="160" y="188" class="s c">색보정이나 LUT로 되살려서 사용</text>
</svg>
