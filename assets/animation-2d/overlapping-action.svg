<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="겹치기 동작: 몸이 먼저 움직이고 팔·꼬리 같은 부분이 조금씩 늦게 따라와 멈춘다">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,22%{transform:translateX(0px)}57%{transform:translateX(150px)}67%,95%{transform:translateX(150px)}100%{transform:translateX(0px)}}.k1{animation:k1 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,34%{transform:translateX(0px)}69%{transform:translateX(150px)}79%,95%{transform:translateX(150px)}100%{transform:translateX(0px)}}.k2{animation:k2 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,46%{transform:translateX(0px)}81%{transform:translateX(150px)}91%,95%{transform:translateX(150px)}100%{transform:translateX(0px)}}.k3{animation:k3 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,10%{transform:translateX(0px)}45%{transform:translateX(150px)}55%,95%{transform:translateX(150px)}100%{transform:translateX(0px)}}.k4{animation:k4 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,10%{transform:translateX(0px)}45%{transform:translateX(150px)}55%,95%{transform:translateX(150px)}100%{transform:translateX(0px)}}.k5{animation:k5 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k6{0%,10%{transform:translateX(0px)}45%{transform:translateX(150px)}55%,95%{transform:translateX(150px)}100%{transform:translateX(0px)}}.k6{animation:k6 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Overlapping Action · 오버래핑 액션</text>
<line x1="16" y1="140" x2="304" y2="140" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<text x="16" y="62" font-size="10" fill="#38bdf8" font-weight="700">몸 → 먼저 출발·먼저 멈춤</text>
<text x="16" y="78" font-size="10" fill="#f59e0b" font-weight="700">꼬리 → 차례로 늦게 출발·늦게 멈춤</text>
<circle cx="44" cy="116" r="7" fill="#f59e0b" class="k1"/>
<circle cx="31" cy="116" r="6" fill="#f59e0b" class="k2"/>
<circle cx="20" cy="116" r="5" fill="#f59e0b" class="k3"/>
<rect x="60" y="100" width="40" height="40" rx="10" fill="#38bdf8" class="k4"/>
<circle cx="80" cy="116" r="4" fill="#0f172a" class="k5"/>
<circle cx="92" cy="116" r="4" fill="#0f172a" class="k6"/>
</svg>
