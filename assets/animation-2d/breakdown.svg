<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="브레이크다운: 두 원화 사이에서 움직임의 경로(호)를 정해 주는 중간 핵심 그림">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,38%{opacity:1}45%,100%{opacity:0}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,35%{stroke-dashoffset:1}60%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,36%{opacity:0}40%,92%{opacity:1}100%{opacity:0}}.k3{animation:k3 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,55%{opacity:0}62%,94%{opacity:1}100%{opacity:0}}.k4{animation:k4 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Breakdown · 브레이크다운</text>
<line x1="64" y1="148" x2="256" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="160" y="164" font-size="9" fill="#94a3b8" text-anchor="middle" class="k1">브레이크다운 없이는 직선 이동</text>
<path pathLength="1" stroke-dasharray="1" d="M50 148 Q160 20 270 148" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="k2"/>
<circle cx="50" cy="148" r="9" fill="#f59e0b"/>
<circle cx="270" cy="148" r="9" fill="#f59e0b"/>
<text x="50" y="183" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="700">원화 A</text>
<text x="270" y="183" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="700">원화 B</text>
<circle cx="160" cy="82" r="9" fill="#38bdf8" class="k3"/>
<text x="160" y="56" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" class="k3">브레이크다운</text>
<text x="160" y="164" font-size="9" fill="#f59e0b" text-anchor="middle" opacity="0" class="k4">원화 사이 핵심 자세가 호를 만든다</text>
