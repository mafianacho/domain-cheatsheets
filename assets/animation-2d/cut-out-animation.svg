<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="컷아웃 애니메이션: 머리·몸·팔을 따로 만든 조각을 이동·회전해서 움직이는 방식">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes k2{0%{transform:rotate(-40deg)}25%{transform:rotate(30deg)}50%{transform:rotate(-40deg)}75%{transform:rotate(30deg)}100%{transform:rotate(-40deg)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:view-box;transform-origin:168px 96px}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Cut-out Animation · 컷아웃 애니메이션</text>
<rect x="16" y="40" width="288" height="130" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="142" y="90" width="36" height="50" rx="8" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
<rect x="146" y="140" width="12" height="22" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
<rect x="162" y="140" width="12" height="22" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
<g class="k1"><circle cx="160" cy="72" r="16" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
<circle cx="154" cy="70" r="2.5" fill="#e2e8f0"/>
<circle cx="166" cy="70" r="2.5" fill="#e2e8f0"/>
<path d="M154 78 Q160 82 166 78" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="k2"><rect x="164" y="94" width="9" height="38" rx="4" fill="#f59e0b"/></g>

<text x="60" y="80" font-size="10" fill="#94a3b8" text-anchor="middle">조각 = 레이어</text>
<text x="60" y="96" font-size="9" fill="#38bdf8" text-anchor="middle">머리</text>
<text x="60" y="112" font-size="9" fill="#38bdf8" text-anchor="middle">몸통</text>
<text x="60" y="128" font-size="9" fill="#f59e0b" text-anchor="middle">팔 · 다리</text>
<text x="250" y="80" font-size="10" fill="#94a3b8" text-anchor="middle">회전·이동만</text>
<text x="250" y="96" font-size="10" fill="#94a3b8" text-anchor="middle">새 그림 없이</text>
<text x="250" y="112" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">재사용</text>
</svg>
