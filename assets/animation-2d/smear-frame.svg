<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="스미어 프레임: 아주 빠른 움직임 사이에 물체를 길게 늘이거나 번지게 그린 한 장">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,33.99%{opacity:1}34%,100%{opacity:0}}.k1{animation:k1 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,33.99%{opacity:0}34%,51.99%{opacity:1}52%,100%{opacity:0}}.k2{animation:k2 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,51.99%{opacity:0}52%,99.99%{opacity:1}}.k3{animation:k3 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,33.99%{opacity:1}34%,100%{opacity:0}}.k4{animation:k4 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,33.99%{opacity:0}34%,51.99%{opacity:1}52%,100%{opacity:0}}.k5{animation:k5 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k6{0%,51.99%{opacity:0}52%,99.99%{opacity:1}}.k6{animation:k6 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
