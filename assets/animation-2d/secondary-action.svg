<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="보조 동작: 주 동작(걷기)을 돋보이게 곁들이는 작은 동작(손 흔들기 등)">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%{transform:translate(0px,0px)}25%{transform:translate(55px,-6px)}50%{transform:translate(110px,0px)}75%{transform:translate(55px,-6px)}100%{transform:translate(0px,0px)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%{transform:rotate(-35deg)}12.5%{transform:rotate(25deg)}25%{transform:rotate(-35deg)}37.5%{transform:rotate(25deg)}50%{transform:rotate(-35deg)}62.5%{transform:rotate(25deg)}75%{transform:rotate(-35deg)}87.5%{transform:rotate(25deg)}100%{transform:rotate(-35deg)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
