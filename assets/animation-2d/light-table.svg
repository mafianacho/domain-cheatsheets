<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="라이트 테이블: 밑에서 빛을 쏴서 아래 종이의 그림이 비쳐 보이게 하는 작업대">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,10%{transform:translate(0px,-24px);opacity:0}28%,92%{transform:translate(0px,0px);opacity:.16}100%{transform:translate(0px,-24px);opacity:0}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,32%{transform:scaleX(0)}50%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k3{0%,36%{opacity:0}40%,92%{opacity:1}100%{opacity:0}}.k3{animation:k3 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,36%{opacity:0}40%,92%{opacity:1}100%{opacity:0}}.k4{animation:k4 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Light Table · 라이트 테이블</text>
<rect x="36" y="150" width="248" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<rect x="46" y="146" width="228" height="8" rx="3" fill="#f59e0b" opacity="0.55"/>
<text x="160" y="169" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">라이트 테이블 (아래에서 빛)</text>
<rect x="60" y="62" width="150" height="86" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<circle cx="110" cy="110" r="16" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
<text x="110" y="140" font-size="9" fill="#38bdf8" text-anchor="middle">아래 장</text>
<rect x="100" y="50" width="150" height="86" rx="4" fill="#e2e8f0" opacity="0.16" class="k1"/>
<path d="M158 98 A16 16 0 1 1 190 98 A16 16 0 1 1 158 98" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="k3"/>
<text x="214" y="78" font-size="9" fill="#f59e0b" font-weight="700" class="k4">위 장</text>
