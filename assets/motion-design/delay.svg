<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="딜레이: B는 기다렸다가 늦게 시작">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.a,.b{transform-box:fill-box;transform-origin:left}.a{animation:a 3s linear infinite}.b{animation:b 3s linear infinite}.p{animation:p 3s linear infinite}@keyframes a{0%{transform:scaleX(0)}50%,100%{transform:scaleX(1)}}@keyframes b{0%,30%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}@keyframes p{0%{transform:translateX(0)}100%{transform:translateX(200px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<text class="m" x="22" y="64">A</text><text class="m" x="22" y="104">B</text>
<rect x="40" y="52" width="100" height="16" rx="4" fill="#334155"/><rect class="a" x="40" y="52" width="100" height="16" rx="4" fill="#f59e0b"/>
<line x1="40" y1="96" x2="100" y2="96" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
<text class="s" x="46" y="90">delay</text>
<rect x="100" y="88" width="100" height="16" rx="4" fill="#334155"/><rect class="b" x="100" y="88" width="100" height="16" rx="4" fill="#38bdf8"/>
<line x1="40" y1="130" x2="250" y2="130" stroke="#475569" stroke-width="2"/><text class="s" x="40" y="146">time</text>
<line class="p" x1="40" y1="40" x2="40" y2="134" stroke="#e2e8f0" stroke-width="2"/>
<text class="s" x="22" y="184">B waits, then starts</text>

</svg>
