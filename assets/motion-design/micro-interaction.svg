<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="마이크로 인터랙션: 한 번 누르면 작게 반응">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.hrt{animation:h 2.4s infinite}.ring{transform-origin:140px 100px;animation:r 2.4s infinite}.burst{transform-origin:140px 100px;animation:b 2.4s infinite}.tap{transform-origin:140px 100px;animation:t 2.4s infinite}@keyframes h{0%,20%{transform:scale(1);fill:#475569}28%{transform:scale(1.5);fill:#f59e0b}40%{transform:scale(.9)}52%,100%{transform:scale(1);fill:#f59e0b}}@keyframes r{0%,26%{transform:scale(.6);opacity:0}30%{transform:scale(.6);opacity:1}60%,100%{transform:scale(1.9);opacity:0}}@keyframes b{0%,26%{transform:scale(.5);opacity:0}32%{opacity:1}60%,100%{transform:scale(1.3);opacity:0}}@keyframes t{0%{transform:scale(2);opacity:0}12%{transform:scale(1.6);opacity:1}24%{transform:scale(.8);opacity:1}34%,100%{transform:scale(.8);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<rect x="100" y="70" width="120" height="60" rx="30" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<circle class="ring" cx="140" cy="100" r="18" fill="none" stroke="#f59e0b" stroke-width="2"/>
<g class="burst"><line x1="160.0" y1="100.0" x2="168.0" y2="100.0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="150.0" y1="117.3" x2="154.0" y2="124.2" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="130.0" y1="117.3" x2="126.0" y2="124.2" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="120.0" y1="100.0" x2="112.0" y2="100.0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="130.0" y1="82.7" x2="126.0" y2="75.8" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="150.0" y1="82.7" x2="154.0" y2="75.8" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/></g>
<g transform="translate(140 100)"><g class="hrt"><path d="M0 10 C-18 -3 -10 -16 0 -6 C10 -16 18 -3 0 10 Z" fill="#475569"/></g></g>
<text x="174" y="107" style="font-size:17px;font-weight:700">128</text>
<circle class="tap" cx="140" cy="100" r="14" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text class="s" x="64" y="168">a tiny reaction to one tap (like, toggle, check)</text>

</svg>
