<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="예비 동작: 움직이기 전에 반대로 살짝 준비">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.ob{animation:a 3s infinite}@keyframes a{0%{transform:translateX(0);opacity:1;animation-timing-function:ease-in-out}20%,28%{transform:translateX(-22px);animation-timing-function:cubic-bezier(.2,.8,.3,1)}50%{transform:translateX(160px);opacity:1}86%{transform:translateX(160px);opacity:1}92%{transform:translateX(160px);opacity:0}93%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<line x1="20" y1="136" x2="300" y2="136" stroke="#475569" stroke-width="2"/>
<g id="ob"><rect class="ob" x="64" y="100" width="36" height="36" rx="4" fill="#38bdf8"/></g>
<path d="M60 84 H34 M42 78 L34 84 L42 90" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
<path d="M112 84 H280 M270 77 L280 84 L270 91" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0"/>
<circle cx="24" cy="60" r="9" fill="#f59e0b"/><text class="s c" x="24" y="63" style="fill:#0f172a;font-weight:700">1</text>
<circle cx="296" cy="60" r="9" fill="#38bdf8"/><text class="s c" x="296" y="63" style="fill:#0f172a;font-weight:700">2</text>
<text class="s" x="24" y="166">1: a small move the opposite way, 2: the real move</text>

</svg>
