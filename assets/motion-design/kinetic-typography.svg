<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="키네틱 타이포그래피: 글자가 박자에 맞춰 움직임">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:46px;font-weight:800;text-anchor:middle;transform-box:fill-box;transform-origin:center bottom;animation:k 1.6s ease-in-out infinite}@keyframes k{0%,100%{transform:translateY(0) rotate(0) scale(1,1)}30%{transform:translateY(-24px) rotate(-10deg) scale(1.15,1.15)}55%{transform:translateY(0) rotate(0) scale(1.2,.8)}75%{transform:scale(.95,1.05)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<line x1="28" y1="130" x2="292" y2="130" stroke="#334155" stroke-width="2"/>
<text class="k" style="animation-delay:-0.00s;fill:#f59e0b" x="50" y="115">M</text><text class="k" style="animation-delay:-0.18s;fill:#38bdf8" x="94" y="115">O</text><text class="k" style="animation-delay:-0.36s;fill:#f59e0b" x="138" y="115">T</text><text class="k" style="animation-delay:-0.54s;fill:#e2e8f0" x="182" y="115">I</text><text class="k" style="animation-delay:-0.72s;fill:#f59e0b" x="226" y="115">O</text><text class="k" style="animation-delay:-0.90s;fill:#e2e8f0" x="270" y="115">N</text>
<text class="s" x="28" y="170">글자마다 제 박자에 맞춰 움직임</text>

</svg>
