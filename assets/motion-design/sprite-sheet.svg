<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="스프라이트 시트: 여러 장면을 한 장에 붙이고 한 칸씩 보여줌">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.sl{animation:s 1.2s steps(4,end) infinite}@keyframes s{from{transform:translateX(0)}to{transform:translateX(-240px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<defs><g id="cells"><rect x="0" y="0" width="60" height="60" fill="#1e293b" stroke="#475569"/><circle cx="30" cy="14" r="8" fill="#f59e0b"/><rect x="60" y="0" width="60" height="60" fill="#1e293b" stroke="#475569"/><circle cx="90" cy="30" r="8" fill="#f59e0b"/><rect x="120" y="0" width="60" height="60" fill="#1e293b" stroke="#475569"/><circle cx="150" cy="46" r="8" fill="#f59e0b"/><rect x="180" y="0" width="60" height="60" fill="#1e293b" stroke="#475569"/><circle cx="210" cy="30" r="8" fill="#f59e0b"/></g><clipPath id="win"><rect x="130" y="108" width="60" height="60"/></clipPath></defs>
<use href="#cells" x="40" y="20"/>
<text class="s c" x="70" y="92">1</text><text class="s c" x="130" y="92">2</text><text class="s c" x="190" y="92">3</text><text class="s c" x="250" y="92">4</text>
<path d="M160 98 V106 M155 101 L160 107 L165 101" fill="none" stroke="#f59e0b" stroke-width="2"/>
<g clip-path="url(#win)"><g class="sl"><use href="#cells" x="130" y="108"/></g></g>
<rect x="130" y="108" width="60" height="60" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text class="s" x="200" y="142">한 번에 한 칸씩</text>

</svg>
