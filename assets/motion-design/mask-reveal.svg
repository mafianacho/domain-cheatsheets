<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="마스크 리빌: 가려진 창이 열리며 드러남">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.wipe{transform-box:fill-box;transform-origin:left;animation:w 2.8s ease-in-out -1.2s infinite}.edge{animation:e 2.8s ease-in-out -1.2s infinite}@keyframes w{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}@keyframes e{0%{transform:translateX(0)}70%,100%{transform:translateX(240px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<defs><mask id="m"><rect class="wipe" x="40" y="50" width="240" height="90" fill="#fff"/></mask></defs>
<rect x="36" y="46" width="248" height="98" rx="6" fill="none" stroke="#475569" stroke-dasharray="4 3"/>
<text class="c" x="160" y="115" style="font-size:52px;font-weight:800;fill:none;stroke:#475569;stroke-width:1.2" stroke-dasharray="3 3">REVEAL</text>
<text class="c" x="160" y="115" mask="url(#m)" style="font-size:52px;font-weight:800;fill:#f59e0b">REVEAL</text>
<line class="edge" x1="40" y1="46" x2="40" y2="144" stroke="#38bdf8" stroke-width="3"/>
<text class="s" x="36" y="170">가려진 창이 열리며 글자가 드러남</text>

</svg>
