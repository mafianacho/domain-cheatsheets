<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Cubic Bezier easing">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.mk{animation:mk 2.8s linear infinite}@keyframes mk{0.00%{transform:translate(0.0px,-0.0px)}1.88%{transform:translate(3.8px,-0.2px)}3.75%{transform:translate(7.5px,-0.7px)}5.62%{transform:translate(11.2px,-1.6px)}7.50%{transform:translate(15.0px,-3.1px)}9.38%{transform:translate(18.8px,-5.2px)}11.25%{transform:translate(22.5px,-8.0px)}13.12%{transform:translate(26.2px,-11.9px)}15.00%{transform:translate(30.0px,-17.0px)}16.88%{transform:translate(33.8px,-23.6px)}18.75%{transform:translate(37.5px,-31.8px)}20.62%{transform:translate(41.2px,-41.4px)}22.50%{transform:translate(45.0px,-51.3px)}24.38%{transform:translate(48.8px,-60.4px)}26.25%{transform:translate(52.5px,-68.1px)}28.12%{transform:translate(56.2px,-74.3px)}30.00%{transform:translate(60.0px,-79.2px)}31.88%{transform:translate(63.8px,-83.1px)}33.75%{transform:translate(67.5px,-86.2px)}35.62%{transform:translate(71.2px,-88.6px)}37.50%{transform:translate(75.0px,-90.4px)}39.38%{transform:translate(78.8px,-91.8px)}41.25%{transform:translate(82.5px,-92.8px)}43.12%{transform:translate(86.2px,-93.5px)}45.00%{transform:translate(90.0px,-93.9px)}46.88%{transform:translate(93.8px,-94.0px)}48.75%{transform:translate(97.5px,-94.0px)}50.62%{transform:translate(101.2px,-93.7px)}52.50%{transform:translate(105.0px,-93.2px)}54.38%{transform:translate(108.8px,-92.6px)}56.25%{transform:translate(112.5px,-91.9px)}58.12%{transform:translate(116.2px,-91.0px)}60.00%{transform:translate(120.0px,-90.0px)}100%{transform:translate(120px,-90px)}}.tr{animation:tr 2.8s infinite}@keyframes tr{0%{transform:translateX(0);animation-timing-function:cubic-bezier(0.5,0,0.2,1.3)}60%{transform:translateX(106px)}100%{transform:translateX(106px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
