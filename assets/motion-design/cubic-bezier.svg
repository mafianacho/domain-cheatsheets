<text class="s e" x="146" y="36">progress</text>
<line x1="26" y1="160" x2="152" y2="160" stroke="#475569" stroke-width="1.5"/>
<line x1="26" y1="160" x2="26" y2="42" stroke="#475569" stroke-width="1.5"/>
<line x1="26" y1="70" x2="146" y2="70" stroke="#334155" stroke-dasharray="3 3"/>
<text class="s e" x="146" y="174">time</text>
<line x1="26" y1="160" x2="86.0" y2="160.0" stroke="#38bdf8" stroke-width="1.5"/>
<line x1="146" y1="70" x2="50.0" y2="43.0" stroke="#38bdf8" stroke-width="1.5"/>
<path d="M26 160 C86.0 160.0 50.0 43.0 146 70" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
<circle cx="86.0" cy="160.0" r="5" fill="#38bdf8"/><text class="s" x="93.0" y="155.0">P1</text>
<circle cx="50.0" cy="43.0" r="5" fill="#38bdf8"/><text class="s" x="57.0" y="37.0">P2</text>
