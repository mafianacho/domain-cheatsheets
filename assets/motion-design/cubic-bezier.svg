<line x1="190" y1="118" x2="296" y2="118" stroke="#475569" stroke-width="2"/>
<circle cx="296" cy="118" r="8" fill="none" stroke="#475569" stroke-dasharray="3 3"/>
<circle class="tr" cx="190" cy="118" r="8" fill="#38bdf8"/>
<text class="s c" x="243" y="146">your own curve</text>
<text class="s" x="20" y="190">cubic-bezier(0.5, 0, 0.2, 1.3)  = x1, y1, x2, y2</text>
</svg>
