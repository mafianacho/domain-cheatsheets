<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="패스 애니메이션: 그려둔 선을 따라 이동">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<defs><path id="p" d="M30 150 C70 30 140 30 165 100 S250 175 290 60"/></defs>
<use href="#p" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="30" cy="150" r="5" fill="#f59e0b"/><circle cx="290" cy="60" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/><circle cx="290" cy="60" r="3" fill="#38bdf8"/>
<polygon points="-10,-7 10,0 -10,7" fill="#f59e0b"><animateMotion dur="3s" repeatCount="indefinite" rotate="auto"><mpath href="#p"/></animateMotion></polygon>
<text class="s" x="22" y="182">물체가 그려둔 경로를 따라 이동(방향도 함께 돎)</text>

</svg>
