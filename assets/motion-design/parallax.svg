<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="패럴랙스: 멀리 있는 층은 느리게, 가까운 층은 빠르게">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.l0{animation:p0 3s ease-in-out infinite alternate}.l1{animation:p1 3s ease-in-out infinite alternate}.l2{animation:p2 3s ease-in-out infinite alternate}.l3{animation:p3 3s ease-in-out infinite alternate}@keyframes p0{from{transform:translateX(3px)}to{transform:translateX(-3px)}}@keyframes p1{from{transform:translateX(10px)}to{transform:translateX(-10px)}}@keyframes p2{from{transform:translateX(24px)}to{transform:translateX(-24px)}}@keyframes p3{from{transform:translateX(46px)}to{transform:translateX(-46px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
