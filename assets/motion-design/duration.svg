<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="길이: 같은 거리를 빠르게 vs 느리게">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.f{animation:f 2.4s linear infinite}.sl{animation:s 2.4s linear infinite}@keyframes f{0%{transform:translateX(0)}12.5%{transform:translateX(220px)}100%{transform:translateX(220px)}}@keyframes s{0%{transform:translateX(0)}50%{transform:translateX(220px)}100%{transform:translateX(220px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<text class="m" x="30" y="48">0.3s</text><text class="m" x="30" y="108">1.2s</text>
<line x1="30" y1="70" x2="250" y2="70" stroke="#475569" stroke-width="2"/><line x1="30" y1="130" x2="250" y2="130" stroke="#475569" stroke-width="2"/>
<g stroke="#475569" stroke-width="2"><line x1="250" y1="58" x2="250" y2="82"/><line x1="250" y1="118" x2="250" y2="142"/></g>
<circle class="f" cx="30" cy="70" r="9" fill="#f59e0b"/><circle class="sl" cx="30" cy="130" r="9" fill="#38bdf8"/>
<text class="s" x="262" y="73">fast</text><text class="s" x="262" y="133">slow</text>
<text class="s" x="30" y="180">same distance, different duration</text>

</svg>
