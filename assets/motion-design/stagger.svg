<rect x="40" y="138" width="60" height="4" rx="2" fill="#38bdf8"/><rect x="60" y="145" width="60" height="4" rx="2" fill="#38bdf8"/><rect x="80" y="152" width="60" height="4" rx="2" fill="#38bdf8"/><rect x="100" y="159" width="60" height="4" rx="2" fill="#38bdf8"/><rect x="120" y="166" width="60" height="4" rx="2" fill="#38bdf8"/><rect x="140" y="173" width="60" height="4" rx="2" fill="#38bdf8"/>
<text class="s" x="170" y="160">+0.15s each</text>

</svg>
