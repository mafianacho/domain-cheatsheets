<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="스태거: 요소들이 일정한 간격으로 차례로 움직임">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.d{animation:w 1.2s ease-in-out infinite}@keyframes w{0%,100%{transform:translateY(0)}50%{transform:translateY(-42px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
