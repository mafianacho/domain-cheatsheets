<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Linear easing">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.mk{animation:mk 2.8s linear infinite}@keyframes mk{0.00%{transform:translate(0.0px,-0.0px)}1.88%{transform:translate(3.8px,-2.8px)}3.75%{transform:translate(7.5px,-5.6px)}5.62%{transform:translate(11.2px,-8.4px)}7.50%{transform:translate(15.0px,-11.2px)}9.38%{transform:translate(18.8px,-14.1px)}11.25%{transform:translate(22.5px,-16.9px)}13.12%{transform:translate(26.2px,-19.7px)}15.00%{transform:translate(30.0px,-22.5px)}16.88%{transform:translate(33.8px,-25.3px)}18.75%{transform:translate(37.5px,-28.1px)}20.62%{transform:translate(41.2px,-30.9px)}22.50%{transform:translate(45.0px,-33.8px)}24.38%{transform:translate(48.8px,-36.6px)}26.25%{transform:translate(52.5px,-39.4px)}28.12%{transform:translate(56.2px,-42.2px)}30.00%{transform:translate(60.0px,-45.0px)}31.88%{transform:translate(63.8px,-47.8px)}33.75%{transform:translate(67.5px,-50.6px)}35.62%{transform:translate(71.2px,-53.4px)}37.50%{transform:translate(75.0px,-56.2px)}39.38%{transform:translate(78.8px,-59.1px)}41.25%{transform:translate(82.5px,-61.9px)}43.12%{transform:translate(86.2px,-64.7px)}45.00%{transform:translate(90.0px,-67.5px)}46.88%{transform:translate(93.8px,-70.3px)}48.75%{transform:translate(97.5px,-73.1px)}50.62%{transform:translate(101.2px,-75.9px)}52.50%{transform:translate(105.0px,-78.8px)}54.38%{transform:translate(108.8px,-81.6px)}56.25%{transform:translate(112.5px,-84.4px)}58.12%{transform:translate(116.2px,-87.2px)}60.00%{transform:translate(120.0px,-90.0px)}100%{transform:translate(120px,-90px)}}.tr{animation:tr 2.8s infinite}@keyframes tr{0%{transform:translateX(0);animation-timing-function:cubic-bezier(0,0,1,1)}60%{transform:translateX(106px)}100%{transform:translateX(106px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="20" y="22">Linear</text>
<text class="s e" x="146" y="36">progress</text>
<line x1="26" y1="160" x2="152" y2="160" stroke="#475569" stroke-width="1.5"/>
<line x1="26" y1="160" x2="26" y2="42" stroke="#475569" stroke-width="1.5"/>
<line x1="26" y1="70" x2="146" y2="70" stroke="#334155" stroke-dasharray="3 3"/>
<text class="s e" x="146" y="174">time</text>
<path d="M26 160 C26.0 160.0 146.0 70.0 146 70" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
<circle class="mk" cx="26" cy="160" r="5" fill="#e2e8f0"/>
<line x1="190" y1="118" x2="296" y2="118" stroke="#475569" stroke-width="2"/>
<circle cx="296" cy="118" r="8" fill="none" stroke="#475569" stroke-dasharray="3 3"/>
<circle class="tr" cx="190" cy="118" r="8" fill="#38bdf8"/>
<text class="s c" x="243" y="146">constant speed</text>
<text class="s" x="20" y="190">cubic-bezier(0, 0, 1, 1)  =  linear</text>
</svg>
