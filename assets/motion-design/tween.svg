<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="트윈: 시작과 끝만 정하면 사이 장면을 자동으로 채움">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;opacity:.75}.m{font-size:10px;opacity:.85}.c{text-anchor:middle}.e{text-anchor:end}.mv{animation:t 2.4s ease-in-out infinite alternate}@keyframes t{0%{transform:translateX(0);fill:#f59e0b;rx:2px}100%{transform:translateX(232px);fill:#38bdf8;rx:11px}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.mv{display:none}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>

<rect x="24" y="80" width="40" height="40" rx="2" fill="#f59e0b"/><circle cx="276" cy="100" r="20" fill="#38bdf8"/>
<rect x="82" y="80" width="40" height="40" rx="6.5" fill="rgb(197, 165, 70)" opacity=".45" stroke-dasharray="3 2" stroke="#e2e8f0" stroke-opacity=".5"/><rect x="140" y="80" width="40" height="40" rx="11.0" fill="rgb(150, 173, 129)" opacity=".45" stroke-dasharray="3 2" stroke="#e2e8f0" stroke-opacity=".5"/><rect x="198" y="80" width="40" height="40" rx="15.5" fill="rgb(103, 181, 188)" opacity=".45" stroke-dasharray="3 2" stroke="#e2e8f0" stroke-opacity=".5"/>
<text class="s c" x="44" y="146">A</text><text class="s c" x="276" y="146">B</text><text class="s c" x="160" y="146">사이 장면 (tween)</text>
<rect class="mv" x="24" y="40" width="40" height="22" rx="2" fill="#f59e0b"/>
<text class="s" x="24" y="182">A와 B만 정하면 컴퓨터가 중간을 채움</text>

</svg>
