<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="업체가 약속하는 가동률 목표와 측정 방법, 보상 조건이 적힌 계약 문서와, 한 달 막대에서 멈춘 시간이 약속을 넘으면 보상이 붙는 그림">
