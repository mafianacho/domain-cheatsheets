<g class="rv_260"><text x="180" y="90" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">응답까지 오래 걸림</text></g>
<g class="rv_360"><text x="210" y="138" font-size="9" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">준비 없이 바로 응답</text></g>
<line x1="110" y1="150" x2="296" y2="150" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="296" y="164" font-size="9" fill="#94a3b8" text-anchor="end" font-family="system-ui, sans-serif">시간 →</text>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">안 쓰다 처음 부르면 켜지는 시간이 든다</text>
