<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="한동안 쓰지 않은 함수를 처음 부르면 준비 시간이 길게 붙어 응답이 느리고, 바로 다음 요청은 준비 없이 빠르게 처리되는 두 막대 비교 그림">
<style>@keyframes grXleft_40_200{0%,8.0%{transform:scaleX(0)}40.0%,94%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}.grXleft_40_200{transform-box:fill-box;transform-origin:left center;animation:grXleft_40_200 5.0s linear infinite}@keyframes rv_200{0%,40.0%{opacity:0}43.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_200{animation:rv_200 5.0s linear infinite}@keyframes grXleft_200_260{0%,40.0%{transform:scaleX(0)}52.0%,94%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}.grXleft_200_260{transform-box:fill-box;transform-origin:left center;animation:grXleft_200_260 5.0s linear infinite}@keyframes rv_260{0%,52.0%{opacity:0}55.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_260{animation:rv_260 5.0s linear infinite}@keyframes grXleft_300_350{0%,60.0%{transform:scaleX(0)}70.0%,94%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}.grXleft_300_350{transform-box:fill-box;transform-origin:left center;animation:grXleft_300_350 5.0s linear infinite}@keyframes rv_350{0%,70.0%{opacity:0}73.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_350{animation:rv_350 5.0s linear infinite}@keyframes rv_360{0%,72.0%{opacity:0}75.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_360{animation:rv_360 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">콜드 스타트</text>
<text x="20" y="66" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">처음 요청</text>
<text x="20" y="114" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">바로 다음 요청</text>
<rect x="110" y="54" width="190" height="20" rx="3" fill="#334155"/>
<rect x="110" y="102" width="190" height="20" rx="3" fill="#334155"/>
<g class="grXleft_40_200"><rect x="110" y="54" width="110" height="20" rx="3" fill="#f59e0b"/></g>
<g class="rv_200"><text x="165" y="68" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">준비</text></g>
<g class="grXleft_200_260"><rect x="220" y="54" width="30" height="20" rx="3" fill="#38bdf8"/></g>
<g class="rv_260"><text x="235" y="68" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">실행</text></g>
