<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="사용량이 무료 한도선까지는 파란 막대로 차오르다가 한도를 넘으면 주황색 구간으로 바뀌어 요금이 붙는 그림">
<style>@keyframes grXleft_40_240{0%,8.0%{transform:scaleX(0)}48.0%,94%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}.grXleft_40_240{transform-box:fill-box;transform-origin:left center;animation:grXleft_40_240 5.0s linear infinite}@keyframes grXleft_240_360{0%,48.0%{transform:scaleX(0)}72.0%,94%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}.grXleft_240_360{transform-box:fill-box;transform-origin:left center;animation:grXleft_240_360 5.0s linear infinite}@keyframes rv_180{0%,36.0%{opacity:0}39.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_180{animation:rv_180 5.0s linear infinite}@keyframes rv_340{0%,68.0%{opacity:0}71.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_340{animation:rv_340 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">프리 티어 (무료 체험 한도)</text>
<rect x="30" y="82" width="260" height="24" rx="4" fill="#334155"/>
<g class="grXleft_40_240"><rect x="30" y="82" width="170" height="24" rx="4" fill="#38bdf8"/></g>
<g class="grXleft_240_360"><rect x="200" y="82" width="70" height="24" rx="4" fill="#f59e0b"/></g>
<line x1="200" y1="70" x2="200" y2="118" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="200" y="64" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">무료 한도</text>
<g class="rv_180"><text x="115" y="132" font-size="9" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">무료로 쓰는 구간</text></g>
<g class="rv_340"><text x="244" y="132" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">넘으면 요금</text></g>
<rect x="60" y="146" width="200" height="22" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="160" y="161" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">예산 알림을 켜 두면 안심</text>
<text x="160" y="188" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">한도를 넘는 순간부터 정상 요금</text>
</svg>
