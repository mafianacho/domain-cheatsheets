<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="개발 PC가 만든 이미지를 레지스트리에 올리고(push) 서버가 레지스트리에서 내려받아(pull) 실행하는 그림">
<style>@keyframes rv_140{0%,28.0%{opacity:0}31.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_140{animation:rv_140 5.0s linear infinite}@keyframes mv_30_76_100_140_112_100{0%,6.0%{opacity:0;transform:translate(76px,100px)}6.4%{opacity:1;transform:translate(76px,100px)}28.0%{opacity:1;transform:translate(112px,100px)}28.8%,100%{opacity:0;transform:translate(112px,100px)}}.mv_30_76_100_140_112_100{animation:mv_30_76_100_140_112_100 5.0s linear infinite}@keyframes mv_260_208_100_380_244_100{0%,52.0%{opacity:0;transform:translate(208px,100px)}52.4%{opacity:1;transform:translate(208px,100px)}76.0%{opacity:1;transform:translate(244px,100px)}76.8%,100%{opacity:0;transform:translate(244px,100px)}}.mv_260_208_100_380_244_100{animation:mv_260_208_100_380_244_100 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">컨테이너 레지스트리</text>
<rect x="14" y="80" width="62" height="40" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text x="45" y="105" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">개발 PC</text>
<rect x="112" y="62" width="96" height="76" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="160" y="78" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">레지스트리</text>
<rect x="122" y="90" width="34" height="20" rx="3" fill="#334155"/>
<text x="139" y="104" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">v1</text>
<rect x="164" y="90" width="34" height="20" rx="3" fill="#334155"/>
<text x="181" y="104" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">v2</text>
<g class="rv_140"><rect x="164" y="90" width="34" height="20" rx="3" fill="#f59e0b"/><text x="181" y="104" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">v2</text></g>
<rect x="244" y="80" width="62" height="40" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text x="275" y="105" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">서버</text>
<line x1="76" y1="100" x2="112" y2="100" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="208" y1="100" x2="244" y2="100" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<text x="94" y="90" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">push</text>
<text x="226" y="90" font-size="9" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">pull</text>
<rect x="-5.0" y="-5.0" width="10" height="10" rx="2" fill="#f59e0b" class="mv_30_76_100_140_112_100" opacity="0" transform="translate(76,100)"/>
<rect x="-5.0" y="-5.0" width="10" height="10" rx="2" fill="#38bdf8" class="mv_260_208_100_380_244_100" opacity="0" transform="translate(208,100)"/>
<text x="160" y="158" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이미지를 이름:버전 으로 보관</text>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">만든 이미지를 올려 두고 서버가 가져가 쓴다</text>
