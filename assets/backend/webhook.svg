<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="웹훅: 폴링은 내가 계속 물어보고, 웹훅은 일이 생기면 상대가 내 서버로 먼저 알려주는 두 줄">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes pa{0%{transform:translate(0px,0px);opacity:1}30%{transform:translate(124px,0px);opacity:1}32%{transform:translate(124px,0px);opacity:0.5}60%{transform:translate(0px,0px);opacity:0.5}62%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}@keyframes pb{0%{transform:translate(0px,0px);opacity:0}60%{transform:translate(0px,0px);opacity:0}62%{transform:translate(0px,0px);opacity:1}88%{transform:translate(124px,0px);opacity:1}92%{transform:translate(124px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}.pa{animation:pa 4.5s linear infinite;}.pb{animation:pb 4.5s linear infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">웹훅 = 일이 생기면 먼저 알려주는 주소</text><rect x="16" y="44" width="72" height="110" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="52" y="96" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">결제</text><text x="52" y="112" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">서비스</text><rect x="232" y="44" width="72" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="268" y="96" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">내 서버</text><text x="268" y="112" font-size="9" fill="#38bdf8" text-anchor="middle" class="m">/webhook</text><text x="160" y="66" font-size="10" fill="#94a3b8" text-anchor="middle">폴링 (계속 물어봄)</text><line x1="94" y1="84" x2="226" y2="84" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/><text x="160" y="120" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">웹훅 (먼저 알려줌)</text><line x1="94" y1="138" x2="221" y2="138" stroke="#f59e0b" stroke-width="2"/><polygon points="226,138 219,134 219,142" fill="#f59e0b"/><circle class="pa" cx="100" cy="84" r="5" fill="#38bdf8"/><circle class="pb" cx="100" cy="138" r="6" fill="#f59e0b"/><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">상대가 내 주소로 POST를 보내 준다</text>
</svg>
