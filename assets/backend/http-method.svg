<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="HTTP 메서드: GET은 읽기, POST는 만들기, PUT은 고치기, DELETE는 지우기 네 장의 카드">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes hl{0%{transform:translateX(0)}100%{transform:translateX(296px)}}.hl{animation:hl 4s steps(4,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">HTTP 메서드 = 요청의 동사</text><rect x="16" y="46" width="66" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="49" y="72" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700" class="m">GET</text><text x="49" y="98" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">읽기</text><text x="49" y="118" font-size="9" fill="#94a3b8" text-anchor="middle">가져오기</text><rect x="90" y="46" width="66" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="123" y="72" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" class="m">POST</text><text x="123" y="98" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">만들기</text><text x="123" y="118" font-size="9" fill="#94a3b8" text-anchor="middle">새로 보내기</text><rect x="164" y="46" width="66" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="197" y="72" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" class="m">PUT</text><text x="197" y="98" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">고치기</text><text x="197" y="118" font-size="9" fill="#94a3b8" text-anchor="middle">통째로 교체</text><rect x="238" y="46" width="66" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="271" y="72" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" class="m">DELETE</text><text x="271" y="98" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">지우기</text><text x="271" y="118" font-size="9" fill="#94a3b8" text-anchor="middle">삭제</text><rect x="16" y="46" width="66" height="90" rx="6" fill="none" stroke="#f59e0b" stroke-width="2" class="hl"/><text x="160" y="160" font-size="10" fill="#94a3b8" text-anchor="middle">GET은 읽기만 해서 몇 번 눌러도 결과가 같다</text><text x="160" y="180" font-size="10" fill="#94a3b8" text-anchor="middle">PATCH = 일부만 고치기</text>
</svg>
