<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="상태 코드: 200 성공, 404 주소 없음, 500 서버 오류가 번갈아 보이고 숫자 첫 자리 분류표">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes cy3{0%,32.33%{opacity:1}33.33%,100%{opacity:0}}.cy{animation:cy3 6s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">상태 코드 = 서버의 한 줄 답변</text><rect x="16" y="44" width="150" height="24" rx="5" fill="#1e293b"/><text x="24" y="60" font-size="11" fill="#38bdf8" font-weight="700" class="m">2xx</text><text x="62" y="60" font-size="10" fill="#e2e8f0">성공</text><rect x="16" y="72" width="150" height="24" rx="5" fill="#1e293b"/><text x="24" y="88" font-size="11" fill="#38bdf8" font-weight="700" class="m">3xx</text><text x="62" y="88" font-size="10" fill="#e2e8f0">다른 주소로 이동</text><rect x="16" y="100" width="150" height="24" rx="5" fill="#1e293b"/><text x="24" y="116" font-size="11" fill="#38bdf8" font-weight="700" class="m">4xx</text><text x="62" y="116" font-size="10" fill="#e2e8f0">요청한 쪽 문제</text><rect x="16" y="128" width="150" height="24" rx="5" fill="#1e293b"/><text x="24" y="144" font-size="11" fill="#38bdf8" font-weight="700" class="m">5xx</text><text x="62" y="144" font-size="10" fill="#e2e8f0">서버 쪽 문제</text><g class="cy"><rect x="16" y="44" width="150" height="24" rx="5" fill="none" stroke="#38bdf8" stroke-width="2"/><rect x="180" y="44" width="124" height="108" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="242" y="100" font-size="32" fill="#38bdf8" text-anchor="middle" font-weight="700" class="m">200</text><text x="242" y="128" font-size="10" fill="#e2e8f0" text-anchor="middle">OK · 성공</text></g><g class="cy" opacity="0" style="animation-delay:2.0s"><rect x="16" y="100" width="150" height="24" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/><rect x="180" y="44" width="124" height="108" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="242" y="100" font-size="32" fill="#f59e0b" text-anchor="middle" font-weight="700" class="m">404</text><text x="242" y="128" font-size="10" fill="#e2e8f0" text-anchor="middle">Not Found · 주소 없음</text></g><g class="cy" opacity="0" style="animation-delay:4.0s"><rect x="16" y="128" width="150" height="24" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/><rect x="180" y="44" width="124" height="108" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="242" y="100" font-size="32" fill="#f59e0b" text-anchor="middle" font-weight="700" class="m">500</text><text x="242" y="128" font-size="10" fill="#e2e8f0" text-anchor="middle">서버 내부 오류</text></g><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">첫 자리 숫자가 누구 탓인지 알려준다</text>
</svg>
