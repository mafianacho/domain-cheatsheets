<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="환경 변수: .env 파일의 비밀 값이 코드 안에 적히지 않고 실행 중인 앱으로 전달되는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes ch{0%{transform:translate(0px,0px);opacity:1}60%{transform:translate(134px,0px);opacity:1}70%{transform:translate(134px,0px);opacity:0}100%{transform:translate(134px,0px);opacity:0}}.ch{animation:ch 4s ease-in-out infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">환경 변수 = 코드 밖에 두는 설정</text><rect x="16" y="42" width="134" height="62" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="24" y="58" font-size="9" fill="#f59e0b" font-weight="700">.env 파일 (내 컴퓨터·서버)</text><text x="24" y="76" font-size="10" fill="#e2e8f0" class="m">API_KEY=sk-****</text><text x="24" y="92" font-size="10" fill="#e2e8f0" class="m">PORT=3000</text><rect x="170" y="42" width="134" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="178" y="58" font-size="9" fill="#38bdf8" font-weight="700">앱 코드 (공개돼도 안전)</text><text x="178" y="76" font-size="10" fill="#e2e8f0" class="m">process.env.API_KEY</text><text x="178" y="92" font-size="9" fill="#94a3b8">(값 없이 이름만)</text><line x1="40" y1="122" x2="275" y2="122" stroke="#94a3b8" stroke-width="1.5"/><polygon points="280,122 273,118 273,126" fill="#94a3b8"/><rect x="24" y="114" width="58" height="16" rx="4" fill="#f59e0b" class="ch"/><text class="m ch" x="53" y="126" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">sk-****</text><rect x="16" y="142" width="288" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="28" y="157" font-size="10" fill="#e2e8f0">.env는 GitHub에 올리지 않는다 (.gitignore)</text><text x="28" y="171" font-size="9" fill="#f59e0b">코드에 직접 적으면 저장소가 공개될 때 키도 함께 공개</text>
</svg>
