<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="API: 앱이 정해진 주문 목록(엔드포인트)으로 서버 기능을 부르는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes hl{0%{transform:translate(0px,0px);opacity:1}33%{transform:translate(0px,0px);opacity:1}34%{transform:translate(0px,26px);opacity:1}66%{transform:translate(0px,26px);opacity:1}67%{transform:translate(0px,52px);opacity:1}100%{transform:translate(0px,52px);opacity:1}}.hl{animation:hl 4.5s steps(1,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">API = 서버가 열어 둔 주문 창구</text><rect x="16" y="60" width="70" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="51" y="92" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">내 앱</text><text x="51" y="110" font-size="10" fill="#94a3b8" text-anchor="middle">(프런트)</text><rect x="112" y="46" width="112" height="98" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="168" y="62" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">API 메뉴판</text><rect x="120" y="70" width="96" height="22" rx="4" fill="#334155"/><text x="168" y="85" font-size="10" fill="#e2e8f0" text-anchor="middle" class="m">GET /menu</text><rect x="120" y="96" width="96" height="22" rx="4" fill="#334155"/><text x="168" y="111" font-size="10" fill="#e2e8f0" text-anchor="middle" class="m">POST /order</text><rect x="120" y="122" width="96" height="22" rx="4" fill="#334155"/><text x="168" y="137" font-size="10" fill="#e2e8f0" text-anchor="middle" class="m">GET /order/7</text><rect x="118" y="68" width="100" height="26" rx="5" fill="none" stroke="#38bdf8" stroke-width="2" class="hl"/><rect x="250" y="60" width="54" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="277" y="92" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">기능</text><text x="277" y="110" font-size="10" fill="#94a3b8" text-anchor="middle">데이터</text><line x1="88" y1="95" x2="105" y2="95" stroke="#94a3b8" stroke-width="2"/><polygon points="110,95 103,91 103,99" fill="#94a3b8"/><line x1="226" y1="95" x2="243" y2="95" stroke="#94a3b8" stroke-width="2"/><polygon points="248,95 241,91 241,99" fill="#94a3b8"/><text x="160" y="176" font-size="10" fill="#94a3b8" text-anchor="middle">정해진 이름으로만 부를 수 있다</text>
</svg>
