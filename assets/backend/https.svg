<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="HTTPS: HTTP에서는 비밀번호가 그대로 보이고, HTTPS에서는 암호화되어 엿보는 사람이 읽지 못하는 두 장면">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes cy2{0%,49.0%{opacity:1}50.0%,100%{opacity:0}}.cy{animation:cy2 6s linear infinite}@keyframes pk1{0%{transform:translate(0px,0px);opacity:1}35%{transform:translate(96px,0px);opacity:1}45%{transform:translate(96px,0px);opacity:0}100%{transform:translate(96px,0px);opacity:0}}@keyframes pk2{0%{transform:translate(0px,0px);opacity:0}50%{transform:translate(0px,0px);opacity:1}85%{transform:translate(96px,0px);opacity:1}95%{transform:translate(96px,0px);opacity:0}100%{transform:translate(96px,0px);opacity:0}}.pk1{animation:pk1 6s linear infinite;}.pk2{animation:pk2 6s linear infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">HTTPS = 암호화된 HTTP</text><rect x="16" y="56" width="56" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="44" y="86" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">브라우저</text><rect x="248" y="56" width="56" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="276" y="86" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">서버</text><line x1="76" y1="82" x2="244" y2="82" stroke="#334155" stroke-width="2"/><g class="cy"><ellipse cx="160" cy="134" rx="14" ry="8" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="160" cy="134" r="3.5" fill="#f59e0b"/><text x="160" y="158" font-size="10" fill="#f59e0b" text-anchor="middle">엿보는 사람: 내용이 그대로 보임</text><text x="160" y="180" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700">HTTP · 암호화 없음</text></g><g class="cy" opacity="0" style="animation-delay:3.0s"><rect x="152" y="128" width="16" height="12" rx="3" fill="#38bdf8"/><path d="M155 128 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke="#38bdf8" stroke-width="2"/><text x="160" y="158" font-size="10" fill="#38bdf8" text-anchor="middle">엿보는 사람: 알아볼 수 없음</text><text x="160" y="180" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">HTTPS · TLS로 암호화</text></g><rect x="80" y="72" width="62" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5" class="pk1"/><text class="m pk1" x="111" y="86" font-size="10" fill="#e2e8f0" text-anchor="middle">pw=1234</text><rect x="80" y="72" width="62" height="20" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="1.5" class="pk2" opacity="0"/><text class="m pk2" opacity="0" x="111" y="86" font-size="10" fill="#e2e8f0" text-anchor="middle">x9#Qz!k</text>
</svg>
