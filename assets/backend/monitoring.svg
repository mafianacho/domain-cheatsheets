<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="모니터링: 응답 시간 그래프가 경고선을 넘으면 알림이 뜨는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes dr{0%{stroke-dashoffset:100}65%,100%{stroke-dashoffset:0}}.dr{stroke-dasharray:100;stroke-dashoffset:0;animation:dr 4.5s linear infinite}@keyframes al{0%,62%{opacity:0}70%,92%{opacity:1}100%{opacity:0}}.al{animation:al 4.5s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">모니터링 = 지켜보다가 알려주기</text><rect x="16" y="40" width="288" height="112" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="58" font-size="9" fill="#94a3b8">응답 시간</text><line x1="24" y1="84" x2="296" y2="84" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="296" y="80" font-size="9" fill="#f59e0b" text-anchor="end">경고선</text><path class="dr" pathLength="100" d="M28 136 L60 132 L92 135 L124 126 L156 130 L188 120 L214 106 L238 66 L262 102 L290 124" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/><g class="al"><rect x="186" y="44" width="64" height="20" rx="5" fill="#f59e0b"/><text x="218" y="58" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">알림!</text></g><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">이상이 생기면 사람이 보기 전에 알려준다</text>
</svg>
