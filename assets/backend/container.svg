<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="컨테이너: 앱과 필요한 것을 한 상자에 담아 내 노트북과 서버에서 똑같이 실행되는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes cp{0%,10%{opacity:.15}40%,90%{opacity:1}100%{opacity:.15}}.cp{animation:cp 4.5s ease-in-out infinite}@keyframes cd{0%{transform:translate(0px,0px);opacity:1}35%{transform:translate(24px,0px);opacity:1}40%{transform:translate(24px,0px);opacity:0}100%{transform:translate(24px,0px);opacity:0}}.cd{animation:cd 4.5s linear infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">컨테이너 = 앱을 통째로 담은 상자</text><rect x="16" y="44" width="130" height="108" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="24" y="60" font-size="10" fill="#94a3b8">내 노트북</text><rect x="28" y="70" width="106" height="74" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/><text x="81" y="88" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">앱 코드</text><text x="81" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle" class="m">Node 20</text><text x="81" y="124" font-size="9" fill="#94a3b8" text-anchor="middle">필요한 라이브러리</text><rect x="174" y="44" width="130" height="108" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="182" y="60" font-size="10" fill="#94a3b8">서버</text><g class="cp"><rect x="186" y="70" width="106" height="74" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/><text x="239" y="88" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">앱 코드</text><text x="239" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle" class="m">Node 20</text><text x="239" y="124" font-size="9" fill="#94a3b8" text-anchor="middle">필요한 라이브러리</text></g><line x1="148" y1="108" x2="167" y2="108" stroke="#f59e0b" stroke-width="2"/><polygon points="172,108 165,104 165,112" fill="#f59e0b"/><circle class="cd" cx="150" cy="108" r="4" fill="#f59e0b"/><text x="160" y="176" font-size="10" fill="#94a3b8" text-anchor="middle">어디서 실행해도 똑같이 동작한다</text>
</svg>
