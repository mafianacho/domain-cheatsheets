<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="CORS: 서버가 허락 헤더를 주지 않으면 브라우저가 응답을 막고, 주면 통과하는 두 장면">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes cy2{0%,49.0%{opacity:1}50.0%,100%{opacity:0}}.cy{animation:cy2 6s linear infinite}@keyframes r1{0%{transform:translate(0px,0px);opacity:1}14%{transform:translate(88px,0px);opacity:1}16%{transform:translate(88px,0px);opacity:0}100%{transform:translate(88px,0px);opacity:0}}@keyframes s1{0%{transform:translate(0px,0px);opacity:0}16%{transform:translate(0px,0px);opacity:0}17%{transform:translate(0px,0px);opacity:1}38%{transform:translate(-88px,0px);opacity:1}46%{transform:translate(-88px,0px);opacity:1}48%{transform:translate(-88px,0px);opacity:0}100%{transform:translate(-88px,0px);opacity:0}}@keyframes r2{0%{transform:translate(0px,0px);opacity:0}50%{transform:translate(0px,0px);opacity:1}64%{transform:translate(88px,0px);opacity:1}66%{transform:translate(88px,0px);opacity:0}100%{transform:translate(88px,0px);opacity:0}}@keyframes s2{0%{transform:translate(0px,0px);opacity:0}66%{transform:translate(0px,0px);opacity:0}67%{transform:translate(0px,0px);opacity:1}90%{transform:translate(-92px,0px);opacity:1}96%{transform:translate(-92px,0px);opacity:0}100%{transform:translate(-92px,0px);opacity:0}}.r1{animation:r1 6s linear infinite;}.s1{animation:s1 6s linear infinite;}.r2{animation:r2 6s linear infinite;}.s2{animation:s2 6s linear infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">CORS = 다른 주소 사이의 호출 허락</text><rect x="16" y="50" width="96" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="64" y="70" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">브라우저 화면</text><text x="64" y="90" font-size="10" fill="#38bdf8" text-anchor="middle" class="m">myapp.com</text><rect x="208" y="50" width="96" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="256" y="70" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">API 서버</text><text x="256" y="90" font-size="8.5" fill="#38bdf8" text-anchor="middle" class="m">api.example.com</text><line x1="116" y1="78" x2="204" y2="78" stroke="#334155" stroke-width="2" stroke-dasharray="3 4"/><g class="cy"><line x1="116" y1="62" x2="116" y2="96" stroke="#f59e0b" stroke-width="4"/><text x="160" y="134" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">허락 헤더 없음 → 브라우저가 응답을 막음</text><text x="160" y="176" font-size="9" fill="#94a3b8" text-anchor="middle">CORS 오류 (서버는 응답을 보냈지만 화면이 못 받음)</text></g><g class="cy" opacity="0" style="animation-delay:3.0s"><rect x="86" y="122" width="148" height="20" rx="5" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><text x="160" y="136" font-size="9" fill="#38bdf8" text-anchor="middle" class="m">Allow-Origin: myapp.com</text><text x="160" y="176" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">서버가 허락 헤더를 주면 통과</text></g><circle class="r1" cx="120" cy="78" r="5" fill="#38bdf8"/><circle class="s1" cx="200" cy="78" r="5" fill="#f59e0b"/><circle class="r2" cx="120" cy="78" r="5" fill="#38bdf8"/><circle class="s2" cx="200" cy="78" r="5" fill="#38bdf8"/>
</svg>
