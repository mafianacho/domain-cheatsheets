<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="요청 제한: 시간당 한도 안의 요청은 서버로 통과하고, 넘친 요청은 문 앞에서 429로 튕겨 나가는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes q0{0%{transform:translate(0px,0px);opacity:1}2%{transform:translate(0px,0px);opacity:1}30%{transform:translate(142px,0px);opacity:1}34%{transform:translate(142px,0px);opacity:0}100%{transform:translate(142px,0px);opacity:0}}.q0{animation:q0 4s linear infinite;}@keyframes q1{0%{transform:translate(0px,0px);opacity:1}9%{transform:translate(0px,0px);opacity:1}37%{transform:translate(164px,0px);opacity:1}41%{transform:translate(164px,0px);opacity:0}100%{transform:translate(164px,0px);opacity:0}}.q1{animation:q1 4s linear infinite;}@keyframes q2{0%{transform:translate(0px,0px);opacity:1}16%{transform:translate(0px,0px);opacity:1}44%{transform:translate(186px,0px);opacity:1}48%{transform:translate(186px,0px);opacity:0}100%{transform:translate(186px,0px);opacity:0}}.q2{animation:q2 4s linear infinite;}@keyframes q3{0%{transform:translate(0px,0px);opacity:1}23%{transform:translate(0px,0px);opacity:1}47%{transform:translate(96px,0px);opacity:1}57%{transform:translate(96px,-34px);opacity:0.6}63%{transform:translate(96px,-44px);opacity:0}100%{transform:translate(96px,-44px);opacity:0}}.q3{animation:q3 4s linear infinite;}@keyframes q4{0%{transform:translate(0px,0px);opacity:1}30%{transform:translate(0px,0px);opacity:1}54%{transform:translate(96px,0px);opacity:1}64%{transform:translate(96px,-34px);opacity:0.6}70%{transform:translate(96px,-44px);opacity:0}100%{transform:translate(96px,-44px);opacity:0}}.q4{animation:q4 4s linear infinite;}@keyframes n429{0%,50%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}.n429{animation:n429 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">요청 제한 = 짧은 시간 안의 횟수 제한</text><rect x="176" y="56" width="10" height="88" rx="3" fill="#f59e0b"/><text x="181" y="50" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">한도: 10초에 3번 (예)</text><rect x="262" y="76" width="42" height="48" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="283" y="104" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">서버</text><line x1="16" y1="100" x2="170" y2="100" stroke="#334155" stroke-width="2" stroke-dasharray="3 4"/><circle class="q0" cx="120" cy="100" r="6" fill="#38bdf8"/><circle class="q1" cx="98" cy="100" r="6" fill="#38bdf8"/><circle class="q2" cx="76" cy="100" r="6" fill="#38bdf8"/><circle class="q3" cx="54" cy="100" r="6" fill="#f59e0b"/><circle class="q4" cx="32" cy="100" r="6" fill="#f59e0b"/><g class="n429"><text x="150" y="78" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700" class="m">429</text></g><text x="160" y="168" font-size="10" fill="#94a3b8" text-anchor="middle">넘치면 429 Too Many Requests 로 돌려보낸다</text>
</svg>
