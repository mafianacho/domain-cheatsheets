<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="크론: 분 시 일 월 요일 다섯 칸으로 적은 시간표를 한 칸씩 짚으며 매주 월요일 9시를 읽는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes hl{0%{transform:translateX(0)}100%{transform:translateX(210px)}}.hl{animation:hl 5s steps(5,end) infinite}@keyframes hd{from{transform:rotate(0)}to{transform:rotate(360deg)}}.hd{transform-box:view-box;transform-origin:44px 88px;animation:hd 5s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">크론 = 정해진 시간에 자동 실행</text><circle cx="44" cy="88" r="26" fill="#1e293b" stroke="#475569" stroke-width="2"/><circle cx="44" cy="88" r="2.5" fill="#f59e0b"/><line x1="44" y1="88" x2="44" y2="70" stroke="#f59e0b" stroke-width="2.5" class="hd"/><line x1="44" y1="88" x2="56" y2="88" stroke="#e2e8f0" stroke-width="2"/><text x="44" y="132" font-size="10" fill="#94a3b8" text-anchor="middle">때가 되면</text><rect x="92" y="56" width="38" height="36" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/><text x="111" y="80" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="m">0</text><text x="111" y="108" font-size="10" fill="#38bdf8" text-anchor="middle">분</text><rect x="134" y="56" width="38" height="36" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/><text x="153" y="80" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="m">9</text><text x="153" y="108" font-size="10" fill="#38bdf8" text-anchor="middle">시</text><rect x="176" y="56" width="38" height="36" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/><text x="195" y="80" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="m">*</text><text x="195" y="108" font-size="10" fill="#38bdf8" text-anchor="middle">일</text><rect x="218" y="56" width="38" height="36" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/><text x="237" y="80" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="m">*</text><text x="237" y="108" font-size="10" fill="#38bdf8" text-anchor="middle">월</text><rect x="260" y="56" width="38" height="36" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/><text x="279" y="80" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="m">1</text><text x="279" y="108" font-size="10" fill="#38bdf8" text-anchor="middle">요일</text><rect x="90" y="54" width="42" height="40" rx="6" fill="none" stroke="#f59e0b" stroke-width="2.5" class="hl"/><text x="92" y="140" font-size="11" fill="#94a3b8" class="m">0 9 * * 1</text><text x="160" y="140" font-size="12" fill="#f59e0b" font-weight="700">= 매주 월요일 오전 9시</text><text x="92" y="164" font-size="10" fill="#94a3b8">*는 "아무 때나", 서버의 시간대 기준</text>
</svg>
