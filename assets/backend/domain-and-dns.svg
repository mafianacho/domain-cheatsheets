<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="도메인과 DNS: 브라우저가 도메인 이름을 DNS에 물어 IP 주소를 받고 그 서버로 찾아가는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes dd{0%{transform:translate(0,0);fill:#38bdf8}20%{transform:translate(28px,-22px);fill:#38bdf8}40%{transform:translate(0,0);fill:#f59e0b}85%{transform:translate(152px,0);fill:#f59e0b}95%,100%{transform:translate(152px,0);fill:#f59e0b;opacity:0}}.dd{animation:dd 5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">도메인 + DNS = 이름을 주소로 바꾸기</text><rect x="16" y="84" width="64" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="48" y="104" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">브라우저</text><text x="48" y="118" font-size="9" fill="#38bdf8" text-anchor="middle" class="m">myapp.com</text><rect x="110" y="40" width="100" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="160" y="56" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">DNS 주소록</text><text x="160" y="70" font-size="9" fill="#e2e8f0" text-anchor="middle" class="m">→ 203.0.113.7</text><rect x="244" y="84" width="60" height="44" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="274" y="104" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">서버</text><text x="274" y="118" font-size="9" fill="#38bdf8" text-anchor="middle" class="m">203.0.113.7</text><line x1="84" y1="106" x2="240" y2="106" stroke="#334155" stroke-width="2" stroke-dasharray="3 4"/><text x="160" y="98" font-size="9" fill="#94a3b8" text-anchor="middle">③ 그 주소로 접속</text><text x="98" y="62" font-size="9" fill="#94a3b8" text-anchor="end">①물어봄</text><text x="160" y="138" font-size="9" fill="#94a3b8" text-anchor="middle">② IP 주소를 받음</text><circle class="dd" cx="84" cy="106" r="6" fill="#38bdf8"/><text x="160" y="176" font-size="10" fill="#94a3b8" text-anchor="middle">이름(도메인) → 숫자 주소(IP) 변환</text>
</svg>
