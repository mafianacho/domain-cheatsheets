<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="인덱스: 인덱스 없이는 한 칸씩 훑고, 인덱스가 있으면 찾는 칸으로 바로 점프하는 두 줄">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes scan{0%{transform:translateX(0)}70%{transform:translateX(196px)}100%{transform:translateX(196px)}}.scan{animation:scan 4s steps(7,end) infinite}@keyframes jmp{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}.jmp{animation:jmp 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
