<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="배포: 내 컴퓨터에서만 돌던 앱 상자가 서버로 옮겨져 누구나 접속할 수 있는 주소가 생기는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes bx{0%{transform:translate(0px,0px);opacity:1}55%{transform:translate(112px,0px);opacity:1}60%{transform:translate(112px,0px);opacity:0}100%{transform:translate(112px,0px);opacity:0}}@keyframes up{0%,58%{opacity:0}68%,92%{opacity:1}100%{opacity:0}}.up{animation:up 4.5s linear infinite}.bx{animation:bx 4.5s ease-in-out infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">배포 = 내 앱을 서버에 올려 공개하기</text><rect x="16" y="66" width="74" height="50" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="53" y="88" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">내 컴퓨터</text><text x="53" y="104" font-size="9" fill="#94a3b8" text-anchor="middle" class="m">localhost:3000</text><rect x="226" y="56" width="78" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="265" y="84" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">서버</text><text x="265" y="102" font-size="10" fill="#94a3b8" text-anchor="middle">(클라우드)</text><line x1="96" y1="96" x2="215" y2="96" stroke="#94a3b8" stroke-width="1.5"/><polygon points="220,96 213,92 213,100" fill="#94a3b8"/><text x="158" y="84" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">배포</text><rect x="98" y="86" width="20" height="20" rx="4" fill="#f59e0b" class="bx"/><g class="up"><rect x="200" y="132" width="104" height="20" rx="5" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><text x="252" y="146" font-size="9" fill="#38bdf8" text-anchor="middle" class="m">https://myapp.com</text><text x="252" y="172" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">누구나 접속 가능</text></g><text x="16" y="150" font-size="10" fill="#94a3b8">지금은 나만 볼 수 있음</text>
</svg>
