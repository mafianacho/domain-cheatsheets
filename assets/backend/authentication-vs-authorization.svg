<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="인증과 인가: 사용자가 첫 문(인증)은 통과하지만 두 번째 문(인가)에서 권한이 없어 막히는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes pp{0%{transform:translate(0px,0px);opacity:1}30%{transform:translate(110px,0px);opacity:1}35%{transform:translate(110px,0px);opacity:1}60%{transform:translate(150px,0px);opacity:1}100%{transform:translate(150px,0px);opacity:1}}@keyframes ok{0%,28%{opacity:0}35%,100%{opacity:1}}@keyframes no{0%,58%{opacity:0}66%,100%{opacity:1}}.pp{animation:pp 5s ease-in-out infinite}.ok{animation:ok 5s linear infinite}.no{animation:no 5s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">인증과 인가 = 문이 두 개다</text><circle class="pp" cx="40" cy="96" r="9" fill="#f59e0b"/><text x="40" y="128" font-size="10" fill="#94a3b8" text-anchor="middle">사용자</text><rect x="104" y="60" width="10" height="70" rx="3" fill="#38bdf8"/><rect x="210" y="60" width="10" height="70" rx="3" fill="#f59e0b"/><rect x="236" y="66" width="68" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="270" y="92" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">관리자</text><text x="270" y="108" font-size="10" fill="#e2e8f0" text-anchor="middle">전용 방</text><text x="109" y="148" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">인증</text><text x="109" y="164" font-size="10" fill="#94a3b8" text-anchor="middle">누구세요?</text><text x="215" y="148" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">인가</text><text x="215" y="164" font-size="10" fill="#94a3b8" text-anchor="middle">들어가도 되나요?</text><g class="ok"><text x="109" y="52" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">통과</text></g><g class="no"><text x="215" y="52" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">거부 403</text></g><text x="160" y="186" font-size="9" fill="#94a3b8" text-anchor="middle" class="m">Authentication → Authorization</text>
</svg>
