<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="캐시: 처음에는 DB까지 다녀오지만 다음부터는 캐시에서 바로 가져오는 두 장면">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes cy2{0%,49.0%{opacity:1}50.0%,100%{opacity:0}}.cy{animation:cy2 5s linear infinite}@keyframes d1{0%{transform:translate(0px,0px);opacity:1}35%{transform:translate(156px,0px);opacity:1}42%{transform:translate(156px,0px);opacity:0}100%{transform:translate(156px,0px);opacity:0}}@keyframes d2{0%{transform:translate(0px,0px);opacity:0}50%{transform:translate(0px,0px);opacity:1}60%{transform:translate(48px,0px);opacity:1}66%{transform:translate(48px,0px);opacity:0}100%{transform:translate(48px,0px);opacity:0}}.d1{animation:d1 5s linear infinite;}.d2{animation:d2 5s linear infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">캐시 = 자주 쓰는 답을 가까이 둔 선반</text><rect x="16" y="60" width="60" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="46" y="94" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">앱</text><rect x="130" y="60" width="60" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="160" y="86" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">캐시</text><text x="160" y="104" font-size="9" fill="#94a3b8" text-anchor="middle">빠른 선반</text><rect x="244" y="60" width="60" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="274" y="86" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="m">DB</text><text x="274" y="104" font-size="9" fill="#94a3b8" text-anchor="middle">느린 창고</text><g class="cy"><line x1="80" y1="90" x2="235" y2="90" stroke="#f59e0b" stroke-width="2"/><polygon points="240,90 233,86 233,94" fill="#f59e0b"/><text x="160" y="144" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">처음: DB까지 다녀옴 (느림)</text></g><g class="cy" opacity="0" style="animation-delay:2.5s"><line x1="80" y1="90" x2="121" y2="90" stroke="#38bdf8" stroke-width="2"/><polygon points="126,90 119,86 119,94" fill="#38bdf8"/><text x="160" y="144" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">다음: 캐시에서 바로 (빠름)</text></g><circle class="d1" cx="84" cy="90" r="6" fill="#f59e0b"/><circle class="d2" cx="84" cy="90" r="6" fill="#38bdf8"/><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">단, 원본이 바뀌면 캐시 속 옛 답이 남을 수 있다</text>
</svg>
