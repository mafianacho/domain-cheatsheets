<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="큐: 웹 서버가 작업을 줄 세워 두면 워커가 앞에서부터 하나씩 처리하는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes ck{0%{transform:translate(0px,0px);opacity:0}6%{transform:translate(0px,0px);opacity:1}70%{transform:translate(98px,0px);opacity:1}78%{transform:translate(98px,0px);opacity:0}100%{transform:translate(98px,0px);opacity:0}}.ck0{animation:ck 4.5s linear infinite;animation-delay:-0.0s}.ck1{animation:ck 4.5s linear infinite;animation-delay:-1.5s}.ck2{animation:ck 4.5s linear infinite;animation-delay:-3.0s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">큐 = 작업을 줄 세워 뒤에서 처리</text><rect x="16" y="72" width="66" height="56" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="49" y="96" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">웹 서버</text><text x="49" y="114" font-size="9" fill="#94a3b8" text-anchor="middle">바로 응답</text><rect x="98" y="90" width="124" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/><text x="160" y="82" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">큐 (줄 선 작업)</text><line x1="84" y1="100" x2="91" y2="100" stroke="#94a3b8" stroke-width="1.5"/><polygon points="96,100 89,96 89,104" fill="#94a3b8"/><line x1="224" y1="100" x2="231" y2="100" stroke="#94a3b8" stroke-width="1.5"/><polygon points="236,100 229,96 229,104" fill="#94a3b8"/><rect x="238" y="72" width="66" height="56" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="271" y="96" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">워커</text><text x="271" y="114" font-size="9" fill="#94a3b8" text-anchor="middle">하나씩 처리</text><rect x="104" y="93" width="18" height="14" rx="3" fill="#f59e0b" class="ck0"/><rect x="104" y="93" width="18" height="14" rx="3" fill="#f59e0b" class="ck1"/><rect x="104" y="93" width="18" height="14" rx="3" fill="#f59e0b" class="ck2"/><text x="160" y="130" font-size="9" fill="#94a3b8" text-anchor="middle">먼저 온 것부터</text><text x="160" y="168" font-size="10" fill="#94a3b8" text-anchor="middle">이메일 발송·이미지 변환처럼 오래 걸리는 일에 쓴다</text>
</svg>
