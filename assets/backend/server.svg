<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="서버: 브라우저가 요청을 보내면 서버가 응답을 돌려주는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes rq{0%{transform:translate(0px,0px);opacity:1}35%{transform:translate(104px,0px);opacity:1}40%{transform:translate(104px,0px);opacity:0}100%{transform:translate(104px,0px);opacity:0}}@keyframes rs{0%{transform:translate(0px,0px);opacity:0}45%{transform:translate(0px,0px);opacity:0}50%{transform:translate(0px,0px);opacity:1}85%{transform:translate(-104px,0px);opacity:1}90%{transform:translate(-104px,0px);opacity:0}100%{transform:translate(-104px,0px);opacity:0}}.rq{animation:rq 4s linear infinite;}.rs{animation:rs 4s linear infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">서버 = 요청을 받고 답하는 컴퓨터</text><rect x="16" y="64" width="84" height="66" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="58" y="94" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">브라우저</text><text x="58" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">(손님)</text><rect x="220" y="52" width="84" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><rect x="230" y="62" width="64" height="12" rx="3" fill="#334155"/><rect x="230" y="80" width="64" height="12" rx="3" fill="#334155"/><rect x="230" y="98" width="64" height="12" rx="3" fill="#334155"/><circle cx="238" cy="68" r="2.5" fill="#f59e0b"/><circle cx="238" cy="86" r="2.5" fill="#f59e0b"/><circle cx="238" cy="104" r="2.5" fill="#38bdf8"/><text x="262" y="130" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">서버 (주방)</text><line x1="104" y1="88" x2="211" y2="88" stroke="#f59e0b" stroke-width="2"/><polygon points="216,88 209,84 209,92" fill="#f59e0b"/><line x1="216" y1="112" x2="109" y2="112" stroke="#38bdf8" stroke-width="2"/><polygon points="104,112 111,108 111,116" fill="#38bdf8"/><text x="160" y="80" font-size="9" fill="#f59e0b" text-anchor="middle">요청 Request</text><text x="160" y="132" font-size="9" fill="#38bdf8" text-anchor="middle">응답 Response</text><circle class="rq" cx="104" cy="88" r="6" fill="#f59e0b"/><circle class="rs" cx="216" cy="112" r="6" fill="#38bdf8"/><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">손님이 주문하면 주방이 음식을 내준다</text>
</svg>
