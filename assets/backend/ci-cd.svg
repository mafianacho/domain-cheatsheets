<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="CI/CD: 코드를 푸시하면 테스트, 빌드, 배포 순서로 자동 진행되는 파이프라인">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes hl{0%{transform:translateX(0)}100%{transform:translateX(304px)}}.hl{animation:hl 4s steps(4,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">CI/CD = 푸시하면 자동 검사·배포</text><rect x="16" y="56" width="60" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="46" y="79" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">푸시</text><line x1="77" y1="74" x2="86" y2="74" stroke="#94a3b8" stroke-width="1.5"/><polygon points="91,74 84,70 84,78" fill="#94a3b8"/><rect x="92" y="56" width="60" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="122" y="79" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">테스트</text><line x1="153" y1="74" x2="162" y2="74" stroke="#94a3b8" stroke-width="1.5"/><polygon points="167,74 160,70 160,78" fill="#94a3b8"/><rect x="168" y="56" width="60" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="198" y="79" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">빌드</text><line x1="229" y1="74" x2="238" y2="74" stroke="#94a3b8" stroke-width="1.5"/><polygon points="243,74 236,70 236,78" fill="#94a3b8"/><rect x="244" y="56" width="60" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="274" y="79" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">배포</text><rect x="14" y="54" width="64" height="40" rx="7" fill="none" stroke="#f59e0b" stroke-width="2.5" class="hl"/><line x1="16" y1="110" x2="224" y2="110" stroke="#38bdf8" stroke-width="3"/><text x="120" y="130" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">CI · 합칠 때마다 자동 테스트·빌드</text><line x1="244" y1="110" x2="304" y2="110" stroke="#f59e0b" stroke-width="3"/><text x="304" y="130" font-size="10" fill="#f59e0b" text-anchor="end" font-weight="700">CD · 자동 배포</text><text x="160" y="168" font-size="10" fill="#94a3b8" text-anchor="middle">사람이 매번 손으로 하던 일을 자동화한다</text>
