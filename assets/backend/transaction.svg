<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="트랜잭션: 송금이 끝까지 성공하면 확정, 중간에 실패하면 전부 되돌리는 두 장면">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes cy2{0%,49.0%{opacity:1}50.0%,100%{opacity:0}}.cy{animation:cy2 6s linear infinite}@keyframes m1{0%{transform:translate(0px,0px);opacity:1}35%{transform:translate(80px,0px);opacity:1}40%{transform:translate(80px,0px);opacity:0}100%{transform:translate(80px,0px);opacity:0}}@keyframes m2{0%{transform:translate(0px,0px);opacity:0}50%{transform:translate(0px,0px);opacity:1}68%{transform:translate(44px,0px);opacity:1}72%{transform:translate(44px,0px);opacity:1}88%{transform:translate(0px,0px);opacity:1}92%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}.m1{animation:m1 6s linear infinite;}.m2{animation:m2 6s linear infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">트랜잭션 = 전부 성공 or 전부 취소</text><rect x="16" y="52" width="96" height="62" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="64" y="70" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">계좌 A</text><rect x="208" y="52" width="96" height="62" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="256" y="70" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">계좌 B</text><text x="160" y="76" font-size="10" fill="#94a3b8" text-anchor="middle">100 송금</text><line x1="116" y1="90" x2="199" y2="90" stroke="#94a3b8" stroke-width="2"/><polygon points="204,90 197,86 197,94" fill="#94a3b8"/><circle class="m1" cx="120" cy="90" r="6" fill="#f59e0b"/><circle class="m2" cx="120" cy="90" r="6" fill="#f59e0b"/><g class="cy"><text x="64" y="102" font-size="18" fill="#f59e0b" text-anchor="middle" font-weight="700" class="m">900</text><text x="256" y="102" font-size="18" fill="#f59e0b" text-anchor="middle" font-weight="700" class="m">600</text><rect x="16" y="130" width="288" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="160" y="151" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">모두 성공 → 확정 (commit)</text></g><g class="cy" opacity="0" style="animation-delay:3.0s"><text x="64" y="102" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="m">1000</text><text x="256" y="102" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="m">500</text><rect x="16" y="130" width="288" height="32" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="160" y="151" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">중간에 실패 → 전부 되돌림 (rollback)</text></g><text x="160" y="184" font-size="10" fill="#94a3b8" text-anchor="middle">돈이 사라지거나 두 번 생기는 일을 막는다</text>
</svg>
