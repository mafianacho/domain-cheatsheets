<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="세션과 JWT: 세션은 서버 보관함에 정보를 두고 번호표만 주고, JWT는 정보가 담긴 서명된 토큰을 손님이 가진다">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes tk{0%{transform:translate(0px,0px);opacity:1}35%{transform:translate(0px,22px);opacity:1}50%{transform:translate(0px,22px);opacity:1}85%{transform:translate(0px,0px);opacity:1}100%{transform:translate(0px,0px);opacity:1}}.tk{animation:tk 4s ease-in-out infinite;}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">세션 vs JWT</text><rect x="12" y="40" width="142" height="120" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="83" y="56" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">세션</text><rect x="20" y="62" width="126" height="32" rx="5" fill="#334155" stroke="#38bdf8" stroke-width="1"/><text x="83" y="76" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">서버 보관함</text><text x="83" y="89" font-size="9" fill="#94a3b8" text-anchor="middle">정보는 서버가 기억</text><rect x="20" y="126" width="126" height="26" rx="5" fill="#334155"/><text x="83" y="143" font-size="9" fill="#e2e8f0" text-anchor="middle">번호표(세션 ID)만 가짐</text><g class="tk"><rect x="48" y="98" width="56" height="18" rx="4" fill="#38bdf8"/><text x="76" y="111" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" class="m">sid=7f3a</text></g><text x="122" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">↕</text><rect x="166" y="40" width="142" height="120" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="237" y="56" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">JWT</text><rect x="174" y="62" width="126" height="32" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="1"/><text x="237" y="76" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">서명만 해서 발급</text><text x="237" y="89" font-size="9" fill="#94a3b8" text-anchor="middle">서버는 기억 안 함</text><rect x="174" y="126" width="126" height="26" rx="5" fill="#334155"/><text x="237" y="143" font-size="9" fill="#e2e8f0" text-anchor="middle">정보 담긴 토큰을 가짐</text><g class="tk"><rect x="202" y="98" width="56" height="18" rx="4" fill="#f59e0b"/><text x="230" y="111" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" class="m">eyJhbG</text></g><text x="276" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">↕</text><text x="160" y="182" font-size="10" fill="#94a3b8" text-anchor="middle">둘 다 "이 사람 로그인했어요"를 증명하는 방법</text>
</svg>
