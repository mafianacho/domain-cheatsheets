<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="SQL: SELECT 문이 나이 20 초과 행만 골라 결과 상자에 민수와 현우를 담는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes pk{0%,20%{opacity:0}35%,90%{opacity:1}100%{opacity:0}}.pk{animation:pk 4.5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">SQL = 데이터베이스에 보내는 질문</text><rect x="16" y="38" width="288" height="28" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="160" y="57" font-size="11" fill="#e2e8f0" text-anchor="middle" class="m">SELECT name FROM users WHERE age &gt; 20;</text><rect x="16" y="78" width="200" height="22" rx="4" fill="#334155"/><text x="30" y="93" font-size="10" fill="#38bdf8" font-weight="700" class="m">name</text><text x="130" y="93" font-size="10" fill="#38bdf8" font-weight="700" class="m">age</text><rect x="16" y="100" width="200" height="20" rx="0" fill="#1e293b"/><text x="30" y="114" font-size="10" fill="#e2e8f0">민수</text><text x="130" y="114" font-size="10" fill="#e2e8f0" class="m">25</text><rect x="16" y="120" width="200" height="20" rx="0" fill="#0f172a"/><text x="30" y="134" font-size="10" fill="#e2e8f0">지아</text><text x="130" y="134" font-size="10" fill="#e2e8f0" class="m">17</text><rect x="16" y="140" width="200" height="20" rx="0" fill="#1e293b"/><text x="30" y="154" font-size="10" fill="#e2e8f0">현우</text><text x="130" y="154" font-size="10" fill="#e2e8f0" class="m">31</text><rect x="16" y="160" width="200" height="20" rx="0" fill="#0f172a"/><text x="30" y="174" font-size="10" fill="#e2e8f0">소라</text><text x="130" y="174" font-size="10" fill="#e2e8f0" class="m">19</text><g class="pk"><rect x="16" y="100" width="200" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/><rect x="16" y="140" width="200" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/></g><rect x="228" y="78" width="76" height="102" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="266" y="93" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">결과</text><g class="pk"><text x="266" y="122" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">민수</text><text x="266" y="144" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">현우</text></g>
</svg>
