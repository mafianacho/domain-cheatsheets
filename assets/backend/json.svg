<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="JSON: 키와 값이 짝을 이룬 데이터 묶음에서 줄마다 값의 종류를 하나씩 짚는 그림">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes cy3{0%,32.33%{opacity:1}33.33%,100%{opacity:0}}.cy{animation:cy3 6s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">JSON = 키와 값의 묶음</text><rect x="16" y="40" width="172" height="112" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="60" font-size="11" fill="#e2e8f0" class="m">{</text><text x="26" y="80" font-size="11" fill="#e2e8f0" class="m">  "name": "Minsu",</text><text x="26" y="100" font-size="11" fill="#e2e8f0" class="m">  "age": 25,</text><text x="26" y="120" font-size="11" fill="#e2e8f0" class="m">  "tags": ["a", "b"]</text><text x="26" y="140" font-size="11" fill="#e2e8f0" class="m">}</text><g class="cy"><rect x="20" y="66" width="164" height="18" rx="4" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="200" y="100" font-size="12" fill="#f59e0b" font-weight="700">글자 (문자열)</text><text x="200" y="118" font-size="10" fill="#94a3b8">← 이 줄의 값</text></g><g class="cy" opacity="0" style="animation-delay:2.0s"><rect x="20" y="86" width="164" height="18" rx="4" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="200" y="100" font-size="12" fill="#f59e0b" font-weight="700">숫자</text><text x="200" y="118" font-size="10" fill="#94a3b8">← 이 줄의 값</text></g><g class="cy" opacity="0" style="animation-delay:4.0s"><rect x="20" y="106" width="164" height="18" rx="4" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="200" y="100" font-size="12" fill="#f59e0b" font-weight="700">목록 (배열)</text><text x="200" y="118" font-size="10" fill="#94a3b8">← 이 줄의 값</text></g><text x="200" y="62" font-size="11" fill="#38bdf8" font-weight="700">키 : 값</text><text x="200" y="78" font-size="10" fill="#94a3b8">짝으로 적는다</text><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">서버와 앱이 주고받는 공용 데이터 서식</text>
</svg>
