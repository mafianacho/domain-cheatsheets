<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="로깅: 서버가 무슨 일이 있었는지 시간순으로 한 줄씩 기록을 남기는 모습">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes l2{0%,20%{opacity:0}30%,100%{opacity:1}}@keyframes l3{0%,45%{opacity:0}55%,100%{opacity:1}}@keyframes l4{0%,70%{opacity:0}80%,100%{opacity:1}}.l2{animation:l2 4.5s linear infinite}.l3{animation:l3 4.5s linear infinite}.l4{animation:l4 4.5s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">로깅 = 서버가 남기는 일기장</text><rect x="16" y="40" width="288" height="112" rx="8" fill="#0b1220" stroke="#475569" stroke-width="1"/><g><text x="26" y="62" font-size="10" fill="#94a3b8" class="m">10:01:02</text><text x="84" y="62" font-size="10" fill="#38bdf8" font-weight="700" class="m">INFO</text><text x="124" y="62" font-size="11" fill="#e2e8f0">로그인 성공 user=7</text></g><g class="l2"><text x="26" y="88" font-size="10" fill="#94a3b8" class="m">10:01:09</text><text x="84" y="88" font-size="10" fill="#f59e0b" font-weight="700" class="m">WARN</text><text x="124" y="88" font-size="11" fill="#e2e8f0">응답이 느림 (2.3초)</text></g><g class="l3"><text x="26" y="114" font-size="10" fill="#94a3b8" class="m">10:01:15</text><text x="84" y="114" font-size="10" fill="#f59e0b" font-weight="700" class="m">ERROR</text><text x="124" y="114" font-size="11" fill="#e2e8f0">결제 실패 order=42</text></g><g class="l4"><text x="26" y="140" font-size="10" fill="#94a3b8" class="m">10:01:16</text><text x="84" y="140" font-size="10" fill="#38bdf8" font-weight="700" class="m">INFO</text><text x="124" y="140" font-size="11" fill="#e2e8f0">다시 시도 예약</text></g><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">문제가 생긴 뒤에 원인을 거슬러 찾는 단서</text>
</svg>
