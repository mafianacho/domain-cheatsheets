<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="REST: 주소는 자원(명사), HTTP 메서드는 하고 싶은 일(동사)로 표현하는 표">
<style>text{font-family:system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes hl{0%{transform:translateY(0)}100%{transform:translateY(104px)}}.hl{animation:hl 4s steps(4,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">REST = 주소(명사) + 메서드(동사)</text><rect x="16" y="44" width="288" height="24" rx="4" fill="#1e293b"/><text x="24" y="60" font-size="10" fill="#38bdf8" font-weight="700" class="m">GET</text><text x="78" y="60" font-size="10" fill="#e2e8f0" class="m">/users</text><text x="166" y="60" font-size="11" fill="#e2e8f0">목록 보기</text><rect x="16" y="70" width="288" height="24" rx="4" fill="#1e293b"/><text x="24" y="86" font-size="10" fill="#38bdf8" font-weight="700" class="m">GET</text><text x="78" y="86" font-size="10" fill="#e2e8f0" class="m">/users/7</text><text x="166" y="86" font-size="11" fill="#e2e8f0">7번 한 명 보기</text><rect x="16" y="96" width="288" height="24" rx="4" fill="#1e293b"/><text x="24" y="112" font-size="10" fill="#f59e0b" font-weight="700" class="m">POST</text><text x="78" y="112" font-size="10" fill="#e2e8f0" class="m">/users</text><text x="166" y="112" font-size="11" fill="#e2e8f0">새로 만들기</text><rect x="16" y="122" width="288" height="24" rx="4" fill="#1e293b"/><text x="24" y="138" font-size="10" fill="#f59e0b" font-weight="700" class="m">DELETE</text><text x="78" y="138" font-size="10" fill="#e2e8f0" class="m">/users/7</text><text x="166" y="138" font-size="11" fill="#e2e8f0">7번 지우기</text><rect x="16" y="44" width="288" height="24" rx="4" fill="none" stroke="#f59e0b" stroke-width="2" class="hl"/><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">주소 = 무엇을 · 메서드 = 어떻게</text>
</svg>
