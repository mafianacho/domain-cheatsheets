<text x="83" y="93" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">사이즈가 안 맞으면?</text>
<path d="M154,83 l6,6 l-6,6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="170" y="74" width="134" height="30" rx="8" fill="#f59e0b"/>
<text x="237" y="93" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">사이즈 교환은 무료</text>
