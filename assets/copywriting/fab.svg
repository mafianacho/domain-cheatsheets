<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="특징, 장점, 이점 세 단계로 그래서를 두 번 묻는 FAB 공식">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,58%{opacity:1}60%,62.0%{opacity:0}65.0%,100%{opacity:1}}.k1{animation:k1 4s linear infinite}@keyframes k2{0%,58%{opacity:1}60%,72.7%{opacity:0}75.7%,100%{opacity:1}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,58%{opacity:1}60%,83.3%{opacity:0}86.3%,100%{opacity:1}}.k3{animation:k3 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">FAB · 특징-장점-이점</text>
<g class="k1">
<rect x="16" y="34" width="54" height="30" rx="6" fill="#334155"/>
<text x="43.0" y="52.5" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">F 특징</text>
<rect x="76" y="34" width="228" height="30" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
<text x="88" y="53" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">방수 원단으로 만들었다</text>
<path d="M43,72 l-4,-4 m4,4 l4,-4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</g>
<g class="k2">
<rect x="16" y="76" width="54" height="30" rx="6" fill="#334155"/>
<text x="43.0" y="94.5" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">A 장점</text>
<rect x="76" y="76" width="228" height="30" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
<text x="88" y="95" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">비에 젖지 않고 금방 마른다</text>
<path d="M43,114 l-4,-4 m4,4 l4,-4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</g>
<g class="k3">
<rect x="16" y="118" width="54" height="30" rx="6" fill="#f59e0b"/>
<text x="43.0" y="136.5" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">B 이점</text>
<rect x="76" y="118" width="228" height="30" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="88" y="137" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">비 오는 날도 가방 속이 안전해요</text>
</g>
<text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">'그래서?'를 두 번 물으면 이점이 나와요</text>
</svg>
