<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="주목, 관심, 욕구, 행동 네 단계가 계단처럼 올라가는 AIDA 공식">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,23.5%{opacity:1}25.0%,100%{opacity:0}}.k1{animation:k1 4s linear infinite}@keyframes k2{0%,23.5%{opacity:0}25.0%,48.5%{opacity:1}50.0%,100%{opacity:0}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,48.5%{opacity:0}50.0%,73.5%{opacity:1}75.0%,100%{opacity:0}}.k3{animation:k3 4s linear infinite}@keyframes k4{0%,73.5%{opacity:0}75.0%,98.5%{opacity:1}100%{opacity:0}}.k4{animation:k4 4s linear infinite}@keyframes k5{0%,23.5%{fill:#f59e0b}25.0%,100%{fill:#334155}}.k5{animation:k5 4s linear infinite}@keyframes k6{0%,23.5%{fill:#0f172a}25.0%,100%{fill:#e2e8f0}}.k6{animation:k6 4s linear infinite}@keyframes k7{0%,23.5%{fill:#334155}25.0%,48.5%{fill:#f59e0b}50.0%,100%{fill:#334155}}.k7{animation:k7 4s linear infinite}@keyframes k8{0%,23.5%{fill:#e2e8f0}25.0%,48.5%{fill:#0f172a}50.0%,100%{fill:#e2e8f0}}.k8{animation:k8 4s linear infinite}@keyframes k9{0%,48.5%{fill:#334155}50.0%,73.5%{fill:#f59e0b}75.0%,100%{fill:#334155}}.k9{animation:k9 4s linear infinite}@keyframes k10{0%,48.5%{fill:#e2e8f0}50.0%,73.5%{fill:#0f172a}75.0%,100%{fill:#e2e8f0}}.k10{animation:k10 4s linear infinite}@keyframes k11{0%,73.5%{fill:#334155}75.0%,98.5%{fill:#f59e0b}100%{fill:#334155}}.k11{animation:k11 4s linear infinite}@keyframes k12{0%,73.5%{fill:#e2e8f0}75.0%,98.5%{fill:#0f172a}100%{fill:#e2e8f0}}.k12{animation:k12 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">AIDA · 주목-관심-욕구-행동</text>
<rect x="20" y="34" width="280" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="160" y="59" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k1">젖은 신발, 오늘도 찝찝하세요?</text>
<text x="160" y="59" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k2" opacity="0">방수 원단에 가벼운 밑창</text>
<text x="160" y="59" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k3" opacity="0">비 오는 출근길도 뽀송하게</text>
<text x="160" y="59" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k4" opacity="0">지금 주문하면 내일 도착</text>
<rect x="20" y="144" width="64" height="36" rx="6" fill="#334155" class="k5"/>
<text x="52" y="166" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k6">A 주목</text>
<rect x="92" y="126" width="64" height="54" rx="6" fill="#334155" class="k7"/>
<text x="124" y="148" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k8">I 관심</text>
<rect x="164" y="108" width="64" height="72" rx="6" fill="#334155" class="k9"/>
<text x="196" y="130" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k10">D 욕구</text>
<rect x="236" y="90" width="64" height="90" rx="6" fill="#334155" class="k11"/>
<text x="268" y="112" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k12">A 행동</text>
