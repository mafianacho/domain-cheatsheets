<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="누구에게·무엇을·왜 지금·말투·분량 다섯 칸을 채우는 카피 브리프 양식">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,58%{opacity:1}60%,62.0%{opacity:0}65.0%,100%{opacity:1}}.k1{animation:k1 4s linear infinite}@keyframes k2{0%,58%{opacity:1}60%,68.4%{opacity:0}71.4%,100%{opacity:1}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,58%{opacity:1}60%,74.8%{opacity:0}77.8%,100%{opacity:1}}.k3{animation:k3 4s linear infinite}@keyframes k4{0%,58%{opacity:1}60%,81.2%{opacity:0}84.2%,100%{opacity:1}}.k4{animation:k4 4s linear infinite}@keyframes k5{0%,58%{opacity:1}60%,87.6%{opacity:0}90.6%,100%{opacity:1}}.k5{animation:k5 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
