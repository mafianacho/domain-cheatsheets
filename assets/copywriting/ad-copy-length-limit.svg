<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="검색 광고 제목과 설명이 글자 수 한도를 채우는 것을 막대로 보여 주는 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%{transform:scaleX(.25)}50%,90%{transform:scaleX(1)}100%{transform:scaleX(.25)}}.k1{animation:k1 4s ease-in-out infinite}@keyframes k2{0%{transform:scaleX(.25)}50%,90%{transform:scaleX(1)}100%{transform:scaleX(.25)}}.k2{animation:k2 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">광고 글자 수 한도 · Ad Copy Length Limit</text>
<rect x="20" y="32" width="280" height="82" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="30" y="48" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">광고</text>
<text x="290" y="48" font-size="9" fill="#94a3b8" text-anchor="end" font-family="system-ui, sans-serif">반응형 검색 광고 기준</text>
<text x="30" y="70" font-size="12" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">동네 수제 케이크 당일 배송</text>
<text x="30" y="92" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">예약 없이 오늘 가져가세요. 레터링 무료.</text>
<text x="20" y="141" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">제목</text>
<rect x="56" y="132" width="150" height="10" rx="5" fill="#334155"/>
<rect x="56" y="132" width="150" height="10" rx="5" fill="#f59e0b" class="k1 tl"/>
<text x="214" y="141" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">한글 15자</text>
<text x="20" y="163" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">설명</text>
<rect x="56" y="154" width="150" height="10" rx="5" fill="#334155"/>
<rect x="56" y="154" width="150" height="10" rx="5" fill="#f59e0b" class="k2 tl"/>
<text x="214" y="163" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">한글 45자</text>
</svg>
