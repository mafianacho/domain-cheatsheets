<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="가장 중요한 내용을 맨 위에 두고 아래로 갈수록 덜 중요한 내용을 두는 역피라미드">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,28%{opacity:1}34%,94%{opacity:.3}100%{opacity:1}}.k1{animation:k1 4s ease-in-out infinite}@keyframes k2{0%,60%{opacity:1}66%,94%{opacity:.3}100%{opacity:1}}.k2{animation:k2 4s ease-in-out infinite}@keyframes k3{0%,24%{opacity:0;transform:translateY(0)}30%,60%{opacity:1;transform:translateY(0)}66%,92%{opacity:1;transform:translateY(42px)}98%,100%{opacity:0;transform:translateY(42px)}}.k3{animation:k3 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">역피라미드 · Inverted Pyramid</text>
<polygon points="40,36 280,36 250,78 70,78" fill="#f59e0b"/>
<text x="160" y="62" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">핵심: 누가·무엇·왜</text>
<polygon points="70,82 250,82 220,122 100,122" fill="#38bdf8" class="k1"/>
<text x="160" y="106" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">세부 내용·인용</text>
<polygon points="100,126 220,126 190,164 130,164" fill="#334155" class="k2"/>
<text x="160" y="149" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">배경·부가 정보</text>
<line x1="30" y1="80" x2="290" y2="80" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" class="k3" opacity="0"/>
<text x="160" y="186" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">어디서 잘려도 핵심은 전달돼요</text>
</svg>
