<path d="M40,120 L130,148 L220,92 L286,66" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="k1" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>
