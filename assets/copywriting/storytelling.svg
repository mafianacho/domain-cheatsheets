<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%{stroke-dashoffset:1}60%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}.k1{animation:k1 4s ease-in-out infinite}@keyframes k2{0%,58%{opacity:1}60%,62.0%{opacity:0}65.0%,100%{opacity:1}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,58%{opacity:1}60%,70.0%{opacity:0}73.0%,100%{opacity:1}}.k3{animation:k3 4s linear infinite}@keyframes k4{0%,58%{opacity:1}60%,78.0%{opacity:0}81.0%,100%{opacity:1}}.k4{animation:k4 4s linear infinite}@keyframes k5{0%,58%{opacity:1}60%,86.0%{opacity:0}89.0%,100%{opacity:1}}.k5{animation:k5 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
