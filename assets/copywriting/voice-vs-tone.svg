<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="늘 같은 목소리 성격 위에서 상황마다 말투가 달라지는 보이스와 톤 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,31.8%{opacity:1}33.3%,100%{opacity:0}}.k1{animation:k1 4s linear infinite}@keyframes k2{0%,31.8%{opacity:0}33.3%,65.2%{opacity:1}66.7%,100%{opacity:0}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,65.2%{opacity:0}66.7%,98.5%{opacity:1}100%{opacity:0}}.k3{animation:k3 4s linear infinite}@keyframes k4{0%,28%{transform:translateX(0)}36%,61%{transform:translateX(110px)}69%,94%{transform:translateX(220px)}100%{transform:translateX(0)}}.k4{animation:k4 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">목소리와 어조 · Voice vs Tone</text>
<rect x="20" y="32" width="280" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<circle cx="40" cy="49" r="9" fill="#f59e0b"/>
<text x="58" y="53" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">목소리: 다정하고 솔직한 동네 가게</text>
<rect x="28" y="76" width="264" height="26" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="160" y="93" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif" class="k1">어서 오세요, 처음이시죠?</text>
<text x="160" y="93" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif" class="k2" opacity="0">불편 드려 죄송해요. 바로 고칠게요</text>
<text x="160" y="93" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif" class="k3" opacity="0">오늘만 쿠키 한 봉지 더 드려요!</text>
<line x1="50" y1="124" x2="270" y2="124" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="50" cy="124" r="6" fill="#334155" stroke="#475569" stroke-width="1"/>
<circle cx="160" cy="124" r="6" fill="#334155" stroke="#475569" stroke-width="1"/>
<circle cx="270" cy="124" r="6" fill="#334155" stroke="#475569" stroke-width="1"/>
<circle cx="50" cy="124" r="8" fill="#f59e0b" class="k4"/>
<text x="50" y="150" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">환영</text>
<text x="160" y="150" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">사과</text>
<text x="270" y="150" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이벤트</text>
<text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">같은 사람, 상황마다 다른 말투</text>
</svg>
