<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="구매 전 걱정과 환불 보장이 저울 양쪽에 놓여 균형을 맞추는 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,15%{transform:rotate(-7deg)}60%,100%{transform:rotate(0deg)}}.k1{animation:k1 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">위험 줄이기 · Risk Reversal</text>
<g class="k1 tb">
<rect x="60" y="100" width="200" height="6" rx="3" fill="#475569"/>
<rect x="64" y="64" width="76" height="36" rx="8" fill="#334155"/>
<text x="102" y="86" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">구매 전 걱정</text>
<rect x="180" y="64" width="76" height="36" rx="8" fill="#f59e0b"/>
<text x="218" y="86" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">환불 보장</text>
</g>
<polygon points="160,106 144,140 176,140" fill="#475569"/>
<rect x="120" y="140" width="80" height="4" rx="2" fill="#334155"/>
<text x="160" y="168" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구매 전 걱정을 약속으로 줄이기</text>
<text x="160" y="186" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">예: 환불·교환·체험 (지킬 수 있는 것만)</text>
</svg>
