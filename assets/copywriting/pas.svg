<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="문제, 문제 키우기, 해결 세 칸이 차례로 켜지는 PAS 공식">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,31.8%{stroke:#f59e0b}33.3%,100%{stroke:#475569}}.k1{animation:k1 4s linear infinite}@keyframes k2{0%,31.8%{fill:#f59e0b}33.3%,100%{fill:#e2e8f0}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,31.8%{stroke:#475569}33.3%,65.2%{stroke:#f59e0b}66.7%,100%{stroke:#475569}}.k3{animation:k3 4s linear infinite}@keyframes k4{0%,31.8%{fill:#e2e8f0}33.3%,65.2%{fill:#f59e0b}66.7%,100%{fill:#e2e8f0}}.k4{animation:k4 4s linear infinite}@keyframes k5{0%,65.2%{stroke:#475569}66.7%,98.5%{stroke:#f59e0b}100%{stroke:#475569}}.k5{animation:k5 4s linear infinite}@keyframes k6{0%,65.2%{fill:#e2e8f0}66.7%,98.5%{fill:#f59e0b}100%{fill:#e2e8f0}}.k6{animation:k6 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">PAS · 문제-키우기-해결</text>
<rect x="12" y="38" width="92" height="84" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" class="k1"/>
<text x="58" y="60" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k2">P 문제</text>
<text x="58" y="86" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">겨울만 되면</text>
<text x="58" y="104" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">손발이 시려요</text>
<path d="M106,76 l6,6 l-6,6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="114" y="38" width="92" height="84" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" class="k3"/>
<text x="160" y="60" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k4">A 키우기</text>
<text x="160" y="86" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">밤새 뒤척이고</text>
<text x="160" y="104" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">낮엔 피곤해요</text>
<path d="M208,76 l6,6 l-6,6" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="216" y="38" width="92" height="84" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" class="k5"/>
<text x="262" y="60" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k6">S 해결</text>
<text x="262" y="86" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">발열 양말</text>
<text x="262" y="104" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">한 켤레면 끝</text>
<rect x="20" y="140" width="280" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="160" y="159" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">문제를 먼저 건드리고,</text>
<text x="160" y="175" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">해결책으로 자연스럽게 데려가기</text>
</svg>
