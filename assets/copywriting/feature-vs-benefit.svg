<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="기능 사양에 그래서?를 물으면 고객에게 생기는 이점이 나오는 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}.k1{animation:k1 4s ease-in-out infinite}@keyframes k2{0%,58%{opacity:1}60%,62.0%{opacity:0}65.0%,100%{opacity:1}}.k2{animation:k2 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">기능과 이점 · Feature vs Benefit</text>
<rect x="40" y="34" width="240" height="42" rx="8" fill="#334155"/>
<text x="52" y="48" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">기능 (Feature)</text>
<text x="160" y="67" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">배터리 5000mAh</text>
<g class="k1">
<line x1="160" y1="80" x2="160" y2="104" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<polygon points="160.0,104.0 157.1,98.7 162.9,98.7" fill="#f59e0b"/>
</g>
<text x="176" y="96" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">그래서?</text>
<g class="k2">
<rect x="40" y="110" width="240" height="46" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="52" y="124" font-size="9" fill="#f59e0b" text-anchor="start" font-family="system-ui, sans-serif">이점 (Benefit)</text>
<text x="160" y="145" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">하루 종일 충전 걱정 없이 외출</text>
</g>
<text x="160" y="180" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">고객은 스펙이 아니라 '내게 생기는 변화'를 사요</text>
</svg>
