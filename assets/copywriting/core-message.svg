<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="여러 장점이 흩어진 칩들 중 한 문장만 골라 크게 남기는 핵심 메시지 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,35%{opacity:1}50%,88%{opacity:.3}100%{opacity:1}}.k1{animation:k1 4s ease-in-out infinite}@keyframes k2{0%,35%{transform:scale(.97)}55%,90%{transform:scale(1.03)}100%{transform:scale(.97)}}.k2{animation:k2 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
