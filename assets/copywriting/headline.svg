<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="약한 헤드라인과 구체적인 이득이 담긴 강한 헤드라인을 비교하는 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%{transform:scaleX(0)}35%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k1{animation:k1 4s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">헤드라인 · Headline</text>
<rect x="20" y="36" width="34" height="18" rx="6" fill="#334155"/>
<text x="37.0" y="48.15" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">약함</text>
<text x="64" y="49" font-size="11" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">저희 제품을 소개합니다</text>
<rect x="20" y="66" width="34" height="18" rx="6" fill="#f59e0b"/>
<text x="37.0" y="78.15" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">강함</text>
<text x="64" y="79" font-size="12" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">커피 얼룩, 10분 만에 지웁니다</text>
<rect x="64" y="86" width="190" height="3" rx="2" fill="#f59e0b" class="k1 tl"/>
<rect x="20" y="104" width="280" height="82" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="160" y="128" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">누구에게 · 무슨 이득 · 구체적 숫자</text>
<text x="160" y="150" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">한 줄에 약속은 하나만</text>
<text x="160" y="170" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">후보를 여러 개 뽑아 가장 또렷한 것 고르기</text>
</svg>
