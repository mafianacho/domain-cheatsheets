<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="상품 사진 옆에 이점 세 줄과 가격, 구매 버튼이 놓인 상품 상세 설명 화면">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,58%{opacity:1}60%,62.0%{opacity:0}65.0%,100%{opacity:1}}.k1{animation:k1 4s linear infinite}@keyframes k2{0%,58%{opacity:1}60%,72.7%{opacity:0}75.7%,100%{opacity:1}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,58%{opacity:1}60%,83.3%{opacity:0}86.3%,100%{opacity:1}}.k3{animation:k3 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
