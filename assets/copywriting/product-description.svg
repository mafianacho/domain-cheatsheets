<text x="136" y="134" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">12,900원</text>
<rect x="226" y="118" width="70" height="24" rx="6" fill="#f59e0b"/>
