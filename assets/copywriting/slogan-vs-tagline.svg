<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="브랜드에 늘 붙어 있는 태그라인과 캠페인마다 바뀌는 슬로건을 비교하는 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,31.8%{opacity:1}33.3%,100%{opacity:0}}.k1{animation:k1 4s linear infinite}@keyframes k2{0%,31.8%{opacity:0}33.3%,65.2%{opacity:1}66.7%,100%{opacity:0}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,65.2%{opacity:0}66.7%,98.5%{opacity:1}100%{opacity:0}}.k3{animation:k3 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">슬로건과 태그라인 · Slogan vs Tagline</text>
<rect x="16" y="34" width="136" height="104" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<circle cx="84" cy="62" r="14" fill="#f59e0b"/>
<text x="84" y="98" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">달콤빵집</text>
<text x="84" y="118" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">동네 빵집의 아침</text>
<rect x="168" y="34" width="136" height="104" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="236" y="90" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k1">여름 신메뉴 출시!</text>
<text x="236" y="90" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k2" opacity="0">겨울엔 따끈하게</text>
<text x="236" y="90" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" class="k3" opacity="0">케이크 예약 시작</text>
<text x="236" y="56" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">캠페인 배너</text>
<text x="84" y="160" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">태그라인 · 늘 같은 한 줄</text>
<text x="236" y="160" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">슬로건 · 캠페인마다 바뀜</text>
<text x="160" y="186" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">실무에서는 두 말을 섞어 쓰기도 해요</text>
</svg>
