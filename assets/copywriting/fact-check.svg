<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="글 속 가격·평점·주장을 돋보기로 하나씩 확인해 근거가 필요한 것을 표시하는 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,58%{opacity:1}60%,62.0%{opacity:0}65.0%,100%{opacity:1}}.k1{animation:k1 4s linear infinite}@keyframes k2{0%,58%{opacity:1}60%,72.7%{opacity:0}75.7%,100%{opacity:1}}.k2{animation:k2 4s linear infinite}@keyframes k3{0%,58%{opacity:1}60%,83.3%{opacity:0}86.3%,100%{opacity:1}}.k3{animation:k3 4s linear infinite}@keyframes k4{0%,25%{transform:translateY(0)}35%,55%{transform:translateY(30px)}65%,90%{transform:translateY(60px)}100%{transform:translateY(0)}}.k4{animation:k4 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
