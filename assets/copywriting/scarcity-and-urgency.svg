<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="남은 수량으로 희소성을, 마감 시계로 긴박감을 보여 주는 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}.k1{animation:k1 4s ease-in-out infinite}@keyframes k2{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}.k2{animation:k2 4s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">희소성과 긴박감 · Scarcity &amp; Urgency</text>
<rect x="16" y="32" width="142" height="106" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="87" y="50" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">희소성 · 수량</text>
<rect x="32" y="62" width="16" height="28" rx="4" fill="#f59e0b"/>
<rect x="54" y="62" width="16" height="28" rx="4" fill="#f59e0b"/>
<rect x="76" y="62" width="16" height="28" rx="4" fill="#f59e0b" class="k1 tb"/>
<rect x="98" y="62" width="16" height="28" rx="4" fill="#334155"/>
<rect x="120" y="62" width="16" height="28" rx="4" fill="#334155"/>
<text x="87" y="116" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">남은 수량 3개</text>
<rect x="162" y="32" width="142" height="106" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="233" y="50" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">긴박감 · 시간</text>
<circle cx="233" cy="82" r="20" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
<line x1="233" y1="82" x2="233" y2="68" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
<line x1="233" y1="82" x2="246" y2="82" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" class="k2"/>
<circle cx="233" cy="82" r="2.5" fill="#e2e8f0"/>
<text x="233" y="116" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">오늘 자정 마감</text>
<text x="160" y="164" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">사실일 때만! 가짜 재고·타이머는 신뢰를 잃어요</text>
</svg>
