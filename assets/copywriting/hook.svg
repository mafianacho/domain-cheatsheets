<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="게시글에서 더보기 전의 첫 줄이 읽을지 말지를 정하는 훅">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%{transform:scaleX(0)}30%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k1{animation:k1 4s ease-out infinite}@keyframes k2{0%,25%{opacity:1}45%,85%{opacity:.25}100%{opacity:1}}.k2{animation:k2 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">훅 · Hook</text>
<rect x="24" y="34" width="272" height="140" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<circle cx="42" cy="52" r="8" fill="#475569"/>
<rect x="56" y="48" width="56" height="6" rx="3" fill="#475569"/>
<text x="36" y="82" font-size="13" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">아직도 이 실수 하세요?</text>
<rect x="36" y="88" width="150" height="3" rx="2" fill="#f59e0b" class="k1 tl"/>
<text x="36" y="108" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">많은 분들이 놓치는 한 가지가…</text>
<rect x="222" y="97" width="60" height="16" rx="6" fill="#334155"/>
<text x="252.0" y="108.15" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">더보기</text>
<rect x="36" y="124" width="220" height="4" rx="2" fill="#475569" class="k2"/>
<rect x="36" y="134" width="220" height="4" rx="2" fill="#475569" class="k2"/>
<rect x="36" y="144" width="110.0" height="4" rx="2" fill="#475569" class="k2"/>
<text x="160" y="190" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">읽을지 말지는 첫 줄에서 정해져요</text>
</svg>
