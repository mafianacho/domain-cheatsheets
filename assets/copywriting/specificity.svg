<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="막연한 표현이 숫자와 기준이 있는 구체적 표현으로 바뀌는 그림">
<style>.tb{transform-box:fill-box;transform-origin:center}.tl{transform-box:fill-box;transform-origin:left center}@keyframes k1{0%{transform:scaleX(0)}30%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k1{animation:k1 4s ease-out infinite}@keyframes k2{0%{transform:scaleX(0)}30%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k2{animation:k2 4s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구체성 · Specificity</text>
<rect x="20" y="34" width="280" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="32" y="54" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">빠른 배송</text>
<rect x="30" y="50" width="47.0" height="2" rx="1" fill="#f59e0b" class="k1 tl"/>
<rect x="26" y="63" width="3" height="18" rx="1" fill="#f59e0b"/>
<text x="36" y="77" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">오후 2시 전 주문 시 당일 출발</text>
<rect x="20" y="96" width="280" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="32" y="116" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">많은 분들이 만족</text>
<rect x="30" y="112" width="80.0" height="2" rx="1" fill="#f59e0b" class="k2 tl"/>
<rect x="26" y="125" width="3" height="18" rx="1" fill="#f59e0b"/>
<text x="36" y="139" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">재구매 고객 412명 (예시)</text>
<text x="160" y="176" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">숫자·기간·이름을 넣으면 믿을 수 있어요</text>
</svg>
