<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="재방문율: 가입한 사람 중 시간이 지난 뒤에도 다시 쓰는 사람의 비율">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,6%{transform:scaleY(0)}26%,92%{transform:scaleY(1)}100%{transform:scaleY(0)}}.k1{animation:k1 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes k2{0%,26%{opacity:0}30%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,20%{transform:scaleY(0)}40%,92%{transform:scaleY(1)}100%{transform:scaleY(0)}}.k3{animation:k3 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes k4{0%,40%{opacity:0}44%,92%{opacity:1}100%{opacity:0}}.k4{animation:k4 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,34%{transform:scaleY(0)}54%,92%{transform:scaleY(1)}100%{transform:scaleY(0)}}.k5{animation:k5 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes k6{0%,54%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}.k6{animation:k6 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Retention · 재방문율</text>
<text x="304" y="28" font-size="9" fill="#94a3b8" text-anchor="end">숫자는 예시</text>
<line x1="24" y1="158" x2="296" y2="158" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<rect x="44" y="66" width="56" height="92" rx="4" fill="#38bdf8" class="k1"/>
<text x="72" y="58" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="k2">100%</text>
<text x="72" y="176" font-size="10" fill="#94a3b8" text-anchor="middle">가입한 날</text>
