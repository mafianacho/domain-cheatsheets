<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="사용자 이야기: 누가, 무엇을, 왜 원하는지 한 문장으로 적은 요구">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,14%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}.k1{animation:k1 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,34%{opacity:0}38%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,54%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}.k3{animation:k3 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">User Story · 사용자 이야기</text>
<rect x="16" y="44" width="288" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="24" y="50" width="54" height="20" rx="5" fill="#38bdf8"/>
<text x="51" y="64" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">누가</text>
<text x="88" y="65" font-size="11" fill="#e2e8f0" class="k1">쇼핑몰 손님으로서</text>
<rect x="16" y="84" width="288" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="24" y="90" width="54" height="20" rx="5" fill="#f59e0b"/>
<text x="51" y="104" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">무엇을</text>
<text x="88" y="105" font-size="11" fill="#e2e8f0" class="k2">주문 내역을 보고 싶다</text>
<rect x="16" y="124" width="288" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="24" y="130" width="54" height="20" rx="5" fill="#94a3b8"/>
<text x="51" y="144" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">왜</text>
<text x="88" y="145" font-size="11" fill="#e2e8f0" class="k3">배송이 어디쯤인지 알려고</text>
<text x="160" y="182" font-size="10" fill="#94a3b8" text-anchor="middle">한 문장 = 사용자가 얻는 가치 하나</text>
</svg>
