<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="MoSCoW: 꼭 필요, 중요, 있으면 좋음, 이번엔 제외로 기능을 나누는 우선순위 방법">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,10%{opacity:0;transform:translateY(-18px)}16%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,24%{opacity:0;transform:translateY(-18px)}30%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,38%{opacity:0;transform:translateY(-18px)}44%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,52%{opacity:0;transform:translateY(-18px)}58%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k4{animation:k4 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,66%{opacity:0;transform:translateY(-18px)}72%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k5{animation:k5 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">MoSCoW · 필수/중요/선택/제외</text>
<rect x="16" y="42" width="68" height="138" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="50" y="62" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">Must</text>
<text x="50" y="77" font-size="9" fill="#94a3b8" text-anchor="middle">꼭 필요</text>
<g class="k1"><rect x="22" y="90" width="56" height="24" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text x="50" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle">로그인</text></g>
<g class="k2"><rect x="22" y="122" width="56" height="24" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text x="50" y="138" font-size="10" fill="#e2e8f0" text-anchor="middle">결제</text></g>
<rect x="90" y="42" width="68" height="138" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="124" y="62" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">Should</text>
<text x="124" y="77" font-size="9" fill="#94a3b8" text-anchor="middle">중요</text>
<g class="k3"><rect x="96" y="90" width="56" height="24" rx="5" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<text x="124" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle">검색</text></g>
<rect x="164" y="42" width="68" height="138" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
<text x="198" y="62" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700">Could</text>
<text x="198" y="77" font-size="9" fill="#94a3b8" text-anchor="middle">있으면 좋음</text>
<g class="k4"><rect x="170" y="90" width="56" height="24" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
<text x="198" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle">다크모드</text></g>
<rect x="238" y="42" width="68" height="138" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="272" y="62" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700">Won't</text>
<text x="272" y="77" font-size="9" fill="#94a3b8" text-anchor="middle">이번엔 제외</text>
<g class="k5"><rect x="244" y="90" width="56" height="24" rx="5" fill="#334155"/>
<text x="272" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle">채팅</text></g>
</svg>
