<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="로드맵: 지금, 다음, 나중으로 나눠 방향과 순서를 보여주는 계획표">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,30%{transform:translate(0px,0px)}46%,92%{transform:translate(-98px,0px)}100%{transform:translate(0px,0px)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Roadmap · 로드맵</text>
