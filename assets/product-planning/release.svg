<text x="56" y="104" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="700">개발</text>
<path d="M100 87 L116 87 M110.8 90.0 L116 87 L110.8 84.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
