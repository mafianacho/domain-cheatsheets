<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="칸반: 할 일, 진행 중, 완료 칸 사이로 카드를 옮겨 일의 흐름을 보는 보드">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,14%{transform:translate(0px,0px)}28%{transform:translate(98px,0px)}52%{transform:translate(98px,0px)}66%,93%{transform:translate(196px,0px)}100%{transform:translate(0px,0px)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,44%{transform:translate(0px,0px)}58%,92%{transform:translate(98px,0px)}100%{transform:translate(0px,0px)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Kanban · 칸반 보드</text>
<rect x="16" y="40" width="92" height="142" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="62" y="59" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700">할 일</text>
<rect x="114" y="40" width="92" height="142" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="160" y="59" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">진행 중</text>
<rect x="212" y="40" width="92" height="142" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="258" y="59" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">완료</text>
<text x="160" y="176" font-size="9" fill="#94a3b8" text-anchor="middle">동시에 최대 2개</text>
<g class="k1"><rect x="22" y="70" width="80" height="26" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="62" y="87" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">카드 A</text></g>
<g class="k2"><rect x="22" y="102" width="80" height="26" rx="5" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text x="62" y="119" font-size="10" fill="#e2e8f0" text-anchor="middle">카드 B</text></g>
<rect x="22" y="134" width="80" height="26" rx="5" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text x="62" y="151" font-size="10" fill="#e2e8f0" text-anchor="middle">카드 C</text>
</svg>
