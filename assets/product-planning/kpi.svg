<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="KPI: 목표를 얼마나 이뤘는지 숫자 하나로 확인하는 핵심 성과 지표">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,8%{transform:scaleX(0)}60%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k1{animation:k1 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k2{0%,60%{opacity:0}64%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">KPI · 핵심 성과 지표</text>
<text x="24" y="66" font-size="11" fill="#e2e8f0" font-weight="700">월 신규 가입자 수</text>
<rect x="24" y="84" width="272" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="24" y="84" width="190" height="28" rx="6" fill="#38bdf8" class="k1"/>
<line x1="242" y1="74" x2="242" y2="122" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
<text x="242" y="138" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">목표</text>
<text x="24" y="138" font-size="11" fill="#38bdf8" font-weight="700" class="k2">현재</text>
<text x="160" y="176" font-size="10" fill="#94a3b8" text-anchor="middle">목표와 현재 숫자를 나란히 본다</text>
</svg>
