<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="인수 조건: 이 기능이 완료됐다고 말할 수 있는 확인 항목 체크리스트">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,14%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}.k1{animation:k1 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,36%{opacity:0}40%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,58%{opacity:0}62%,92%{opacity:1}100%{opacity:0}}.k3{animation:k3 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,100%{opacity:1}50%{opacity:0.5}}.k4{animation:k4 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Acceptance Criteria · 인수 조건</text>
<rect x="16" y="40" width="288" height="28" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text x="28" y="58" font-size="11" fill="#e2e8f0" font-weight="700">스토리: 주문 내역 보기</text>
<rect x="20" y="80" width="22" height="22" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="52" y="96" font-size="11" fill="#e2e8f0">목록이 최신 주문부터 보인다</text>
<path d="M25 92 L29.0 96.0 L36.0 87.0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="k1"/>
<rect x="20" y="110" width="22" height="22" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="52" y="126" font-size="11" fill="#e2e8f0">상품명·금액·상태가 나온다</text>
