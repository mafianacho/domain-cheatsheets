<rect x="20" y="140" width="22" height="22" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="52" y="156" font-size="11" fill="#e2e8f0">주문이 없으면 안내 문구가 나온다</text>
