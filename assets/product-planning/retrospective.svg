<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="회고: 한 주기가 끝난 뒤 잘한 점, 아쉬운 점, 다음에 시도할 것을 모아 되돌아보는 모임">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,12%{opacity:0;transform:translateY(-14px)}18%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,22%{opacity:0;transform:translateY(-14px)}28%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,36%{opacity:0;transform:translateY(-14px)}42%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,46%{opacity:0;transform:translateY(-14px)}52%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k4{animation:k4 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,60%{opacity:0;transform:translateY(-14px)}66%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k5{animation:k5 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k6{0%,70%{opacity:0;transform:translateY(-14px)}76%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k6{animation:k6 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Retrospective · 회고</text>
<rect x="16" y="42" width="92" height="138" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="62" y="62" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">잘한 점</text>
<g class="k1"><rect x="21" y="76" width="82" height="36" rx="5" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<text x="62" y="98" font-size="9" fill="#e2e8f0" text-anchor="middle">배포가 빨랐다</text></g>
<g class="k2"><rect x="21" y="120" width="82" height="36" rx="5" fill="#334155"/>
<text x="62" y="142" font-size="9" fill="#e2e8f0" text-anchor="middle">리뷰가 꼼꼼했다</text></g>
<rect x="114" y="42" width="92" height="138" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="160" y="62" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">아쉬운 점</text>
<g class="k3"><rect x="119" y="76" width="82" height="36" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text x="160" y="98" font-size="9" fill="#e2e8f0" text-anchor="middle">회의가 길었다</text></g>
<g class="k4"><rect x="119" y="120" width="82" height="36" rx="5" fill="#334155"/>
<text x="160" y="142" font-size="9" fill="#e2e8f0" text-anchor="middle">일정이 빠듯했다</text></g>
<rect x="212" y="42" width="92" height="138" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="258" y="62" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700">다음엔 시도</text>
<g class="k5"><rect x="217" y="76" width="82" height="36" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
<text x="258" y="98" font-size="9" fill="#e2e8f0" text-anchor="middle">회의 시간 제한</text></g>
<g class="k6"><rect x="217" y="120" width="82" height="36" rx="5" fill="#334155"/>
<text x="258" y="142" font-size="9" fill="#e2e8f0" text-anchor="middle">리뷰는 하루 안에</text></g>
</svg>
