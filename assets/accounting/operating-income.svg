<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="매출총이익 400에서 판관비 300을 빼면 영업이익 100이 남는다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">영업이익 = 매출총이익 − 판관비</text>
<rect x="30" y="38" width="260" height="30" rx="6" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="160" y="58" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">매출총이익 400</text>
<text x="160" y="90" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">여기서 운영비를 빼면</text>
<rect x="30" y="98" width="195" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="127" y="118" font-size="11" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">판관비 300</text>
<rect x="225" y="98" width="65" height="30" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="257" y="118" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">100</text>
<text x="127" y="145" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">월세·급여·광고비 등</text>
<text x="257" y="145" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">영업이익</text>
<text x="160" y="178" font-size="11" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">본업으로 번 순수한 이익</text>
</svg>
