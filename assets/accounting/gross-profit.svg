<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="매출액 1,000에서 매출원가 600을 빼면 매출총이익 400이 남는다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">매출총이익 = 매출액 − 매출원가</text>
<rect x="30" y="38" width="260" height="30" rx="6" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="160" y="58" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">매출액 1,000</text>
<text x="160" y="90" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">같은 1,000을 둘로 나누면</text>
<rect x="30" y="98" width="156" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="108" y="118" font-size="11" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">매출원가 600</text>
<rect x="186" y="98" width="104" height="30" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="238" y="118" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">총이익 400</text>
<text x="160" y="156" font-size="11" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">매출총이익률 = 400 ÷ 1,000 = 40%</text>
<text x="160" y="178" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">월세·인건비는 아직 빼기 전 단계</text>
</svg>
