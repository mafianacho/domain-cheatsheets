<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="원가 6,000원 상품을 10,000원에 팔면 이익 4,000원이다. 마진율은 이익을 판매가로 나눈 40%, 마크업은 이익을 원가로 나눈 약 67%">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">마진 vs 마크업: 분모가 다르다</text>
<text x="160" y="46" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">판매가 10,000</text>
<rect x="30" y="54" width="156" height="30" rx="5" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="108" y="74" font-size="11" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">원가 6,000</text>
<rect x="186" y="54" width="104" height="30" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<text x="238" y="74" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">이익 4,000</text>
<text x="160" y="114" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">마진율 = 이익 ÷ 판매가 = 4,000 ÷ 10,000 = 40%</text>
<text x="160" y="138" font-size="10" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">마크업 = 이익 ÷ 원가 = 4,000 ÷ 6,000 ≈ 67%</text>
<text x="160" y="174" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">같은 상품인데 기준(분모)이 달라 숫자가 다르다</text>
</svg>
