<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="현금 4,800만 원을 월 순 번레이트 600만 원으로 쓰면 8개월 버틴다. 막대는 달마다 줄어드는 현금">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">런웨이 = 현금 ÷ 월 순 번레이트</text>
<line x1="26" y1="108" x2="294" y2="108" stroke="#475569" stroke-width="2"/>
<rect x="30" y="52" width="28" height="56" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="44" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
<rect x="62" y="59" width="28" height="49" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="76" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">2</text>
<rect x="94" y="66" width="28" height="42" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="108" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">3</text>
<rect x="126" y="73" width="28" height="35" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="140" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">4</text>
<rect x="158" y="80" width="28" height="28" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="172" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">5</text>
<rect x="190" y="87" width="28" height="21" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="204" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">6</text>
<rect x="222" y="94" width="28" height="14" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="236" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">7</text>
<rect x="254" y="101" width="28" height="7" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text x="268" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">8</text>
<text x="160" y="140" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">개월</text>
<text x="160" y="162" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">현금 4,800만 ÷ 월 순 번 600만 = 8개월</text>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">막대 = 매달 초 남은 현금 (매달 600만 줄어든다)</text>
</svg>
