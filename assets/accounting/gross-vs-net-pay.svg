<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="세전 월급 3,000,000원에서 4대보험 270,000원과 소득세·지방소득세 60,000원을 빼면 실수령액은 2,670,000원이다 (예시)">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">세전 → 세후: 월급에서 빠지는 것 (예시)</text>
<text x="30" y="50" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">세전 월급</text>
<text x="290" y="50" font-size="11" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">3,000,000</text>
<text x="30" y="71" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">− 4대보험 (근로자 부담분)</text>
<text x="290" y="71" font-size="11" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">270,000</text>
<text x="30" y="92" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">− 소득세·지방소득세</text>
<text x="290" y="92" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">60,000</text>
<line x1="30" y1="100" x2="290" y2="100" stroke="#475569" stroke-width="1.5"/>
<text x="30" y="120" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">= 세후 (실수령액)</text>
<text x="290" y="120" font-size="12" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">2,670,000</text>
<rect x="30" y="138" width="231" height="16" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="261" y="138" width="29" height="16" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="30" y="174" font-size="9" fill="#f59e0b" text-anchor="start" font-family="system-ui, sans-serif">통장에 들어오는 돈</text>
<text x="290" y="174" font-size="9" fill="#38bdf8" text-anchor="end" font-family="system-ui, sans-serif">공제</text>
<text x="160" y="190" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">※ 공제액은 설명용 예시이며 실제와 다르다</text>
</svg>
