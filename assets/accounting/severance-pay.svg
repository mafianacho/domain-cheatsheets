<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="퇴직금은 1일 평균임금 100,000원 곱하기 30일 곱하기 근속 3년으로 9,000,000원이 되고, 퇴직일부터 14일 안에 지급한다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">퇴직금 ≈ 1일 평균임금 × 30일 × 근속연수</text>
<rect x="10" y="38" width="92" height="42" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="56.0" y="56" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">1일 평균임금</text>
<text x="56.0" y="71" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">100,000원</text>
<rect x="124" y="38" width="46" height="42" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="147.0" y="56" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">30일분</text>
<text x="147.0" y="71" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">1년당</text>
<rect x="182" y="38" width="46" height="42" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="205.0" y="56" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">3년</text>
<text x="205.0" y="71" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">근속</text>
<rect x="240" y="38" width="70" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<text x="275.0" y="56" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">퇴직금</text>
<text x="275.0" y="71" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">9,000,000원</text>
<text x="117" y="63" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">×</text>
<text x="175" y="63" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">×</text>
<text x="233" y="63" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">=</text>
<line x1="40" y1="118" x2="270" y2="118" stroke="#475569" stroke-width="3"/>
<circle cx="40" cy="118" r="6" fill="#e2e8f0"/>
<circle cx="270" cy="118" r="6" fill="#f59e0b"/>
<text x="40" y="142" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">퇴직일</text>
<text x="270" y="142" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">지급</text>
<text x="155" y="110" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">14일 이내</text>
<rect x="14" y="154" width="140" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="84" y="171" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">계속근로 1년 이상</text>
<rect x="166" y="154" width="140" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="236" y="171" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">주 평균 15시간 이상</text>
<text x="160" y="194" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">두 조건을 모두 채운 근로자</text>
</svg>
