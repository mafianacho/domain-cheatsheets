<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="감가상각: 구입한 설비의 장부가치가 해마다 같은 만큼 줄어들며 그 줄어든 만큼이 비용이 된다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="20" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">감가상각 · 산 값을 여러 해에 나눠 비용으로</text><line x1="20" y1="160" x2="304" y2="160" stroke="#475569" stroke-width="2"/><rect x="28" y="60" width="40" height="100" rx="3" fill="#38bdf8"/><text x="48" y="176" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">구입</text><rect x="84" y="80" width="40" height="80" rx="3" fill="#38bdf8"/><rect x="84" y="60" width="40" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/><text x="104" y="176" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">1년</text><rect x="140" y="100" width="40" height="60" rx="3" fill="#38bdf8"/><rect x="140" y="80" width="40" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/><text x="160" y="176" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">2년</text><rect x="196" y="120" width="40" height="40" rx="3" fill="#38bdf8"/><rect x="196" y="100" width="40" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/><text x="216" y="176" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">3년</text><rect x="252" y="140" width="40" height="20" rx="3" fill="#38bdf8"/><rect x="252" y="120" width="40" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/><text x="272" y="176" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">4년</text><text x="160" y="194" font-size="9" fill="#94a3b8" text-anchor="middle"  font-family="system-ui, sans-serif">파란 막대: 남은 장부가치 · 점선: 그 해 비용</text>
