<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="공급자가 공급가액 1,000,000원과 부가세 100,000원을 적은 세금계산서를 구매자에게 주고 국세청에도 전송한다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">세금계산서: 사업자끼리 주고받는 증빙</text>
<rect x="10" y="52" width="64" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="42" y="71" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">공급자</text>
<rect x="246" y="52" width="64" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="278" y="71" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">구매자</text>
<rect x="102" y="36" width="116" height="80" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="160" y="52" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">세금계산서</text>
<text x="160" y="68" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">공급가액 1,000,000</text>
<text x="160" y="82" font-size="9" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">부가세 100,000</text>
<line x1="112" y1="90" x2="208" y2="90" stroke="#475569" stroke-width="1"/>
<text x="160" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">합계 1,100,000</text>
<line x1="74" y1="67" x2="102" y2="67" stroke="#f59e0b" stroke-width="2"/>
<line x1="102" y1="67" x2="95.9" y2="70.4" stroke="#f59e0b" stroke-width="2"/>
<line x1="102" y1="67" x2="95.9" y2="63.6" stroke="#f59e0b" stroke-width="2"/>
<line x1="218" y1="67" x2="246" y2="67" stroke="#f59e0b" stroke-width="2"/>
<line x1="246" y1="67" x2="239.9" y2="70.4" stroke="#f59e0b" stroke-width="2"/>
<line x1="246" y1="67" x2="239.9" y2="63.6" stroke="#f59e0b" stroke-width="2"/>
<line x1="160" y1="116" x2="160" y2="138" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
<line x1="160" y1="138" x2="156.6" y2="131.9" stroke="#38bdf8" stroke-width="2"/>
<line x1="160" y1="138" x2="163.4" y2="131.9" stroke="#38bdf8" stroke-width="2"/>
<text x="170" y="132" font-size="9" fill="#38bdf8" text-anchor="start" font-family="system-ui, sans-serif">국세청에 전송</text>
<rect x="110" y="138" width="100" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="160" y="155" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">국세청</text>
<text x="160" y="188" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">받은 쪽: 부가세 100,000을 매입세액으로 공제</text>
</svg>
