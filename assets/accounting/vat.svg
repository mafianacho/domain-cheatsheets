<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="부가가치세: 소비자에게 받은 매출세액에서 공급업체에 낸 매입세액을 뺀 만큼을 나라에 낸다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">부가가치세 · 받은 세금 − 낸 세금</text><rect x="16" y="48" width="76" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="54" y="73" font-size="11" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">공급업체</text><rect x="122" y="48" width="76" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="160" y="73" font-size="11" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">나(사업자)</text><rect x="228" y="48" width="76" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="266" y="73" font-size="11" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">소비자</text><path d="M94 68 L120 68" stroke="#38bdf8" stroke-width="2.5"/><path d="M200 68 L226 68" stroke="#f59e0b" stroke-width="2.5"/><text x="56" y="110" font-size="9" fill="#94a3b8" text-anchor="middle"  font-family="system-ui, sans-serif">나에게 팔며</text><text x="56" y="124" font-size="9" fill="#38bdf8" text-anchor="middle"  font-family="system-ui, sans-serif">부가세 10 받음</text><text x="264" y="110" font-size="9" fill="#94a3b8" text-anchor="middle"  font-family="system-ui, sans-serif">나는 소비자에게</text><text x="264" y="124" font-size="9" fill="#f59e0b" text-anchor="middle"  font-family="system-ui, sans-serif">부가세 30 받음</text><text x="160" y="106" font-size="9" fill="#475569" text-anchor="middle"  font-family="system-ui, sans-serif">▶</text><rect x="30" y="140" width="260" height="42" rx="8" fill="#334155"/><text x="160" y="158" font-size="11" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">받은 30 (매출세액) − 낸 10 (매입세액)</text><text x="160" y="175" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">= 나라에 낼 20 (납부세액)</text>
</svg>
