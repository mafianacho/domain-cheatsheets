<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="발생주의는 일을 끝낸 1월에, 현금주의는 돈이 들어온 3월에 매출을 잡는다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">같은 거래, 매출이 잡히는 달이 다르다</text><line x1="24" y1="104" x2="296" y2="104" stroke="#475569" stroke-width="3"/><circle cx="64" cy="104" r="8" fill="#f59e0b"/><circle cx="256" cy="104" r="8" fill="#38bdf8"/><text x="64" y="126" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">1월</text><text x="256" y="126" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">3월</text><text x="64" y="66" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">일 끝내고 청구</text><text x="64" y="82" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">발생주의: 매출 1월</text><text x="256" y="150" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">대금이 통장에 들어옴</text><text x="256" y="166" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">현금주의: 매출 3월</text><path d="M80 92 C130 70 190 70 240 92" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="4 3"/><text x="160" y="66" font-size="10" fill="#94a3b8" text-anchor="middle"  font-family="system-ui, sans-serif">외상 기간</text>
</svg>
