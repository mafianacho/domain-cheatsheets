<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="현금흐름표: 영업·투자·재무 활동의 현금 흐름이 합쳐져 현금 증감이 된다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">현금흐름표 · 돈이 들어오고 나간 길</text><rect x="16" y="40" width="140" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="86" y="58" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">영업활동</text><text x="86" y="73" font-size="9" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">장사로 번 돈·쓴 돈</text><path d="M156 61 L190 100" stroke="#475569" stroke-width="2" fill="none"/><rect x="16" y="88" width="140" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="86" y="106" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">투자활동</text><text x="86" y="121" font-size="9" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">설비·기계 사고팔기</text><path d="M156 109 L190 100" stroke="#475569" stroke-width="2" fill="none"/><rect x="16" y="136" width="140" height="42" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/><text x="86" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">재무활동</text><text x="86" y="169" font-size="9" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">대출·투자금 들고나기</text><path d="M156 157 L190 100" stroke="#475569" stroke-width="2" fill="none"/><rect x="190" y="68" width="116" height="64" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/><text x="248" y="96" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">현금</text><text x="248" y="114" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">늘었나? 줄었나?</text>
</svg>
