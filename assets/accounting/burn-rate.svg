<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="한 달에 나가는 돈 1,000만 원이 총 번레이트이고 들어오는 돈 400만 원을 빼면 순 번레이트는 600만 원이다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">번레이트: 한 달에 태우는 현금 (만 원)</text>
<rect x="30" y="44" width="260" height="30" rx="5" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="160" y="64" font-size="11" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">나가는 돈 1,000 = 총 번</text>
<rect x="30" y="92" width="104" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="82" y="112" font-size="10" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">들어오는 돈 400</text>
<rect x="134" y="92" width="156" height="30" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="212" y="112" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">순 번 600</text>
<text x="160" y="156" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">순 번 = 1,000 − 400 = 600</text>
<text x="160" y="180" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">총 번 = 지출만 본 값 / 순 번 = 지출 − 입금</text>
</svg>
