<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="T자 계정: 차변 현금 100과 대변 매출 100이 같은 금액으로 짝을 이룬다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">한 거래를 왼쪽·오른쪽에 같은 금액으로</text><line x1="40" y1="60" x2="280" y2="60" stroke="#e2e8f0" stroke-width="3"/><line x1="160" y1="60" x2="160" y2="150" stroke="#e2e8f0" stroke-width="3"/><text x="100" y="50" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">차변 (왼쪽)</text><text x="220" y="50" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">대변 (오른쪽)</text><rect x="52" y="76" width="96" height="30" rx="6" fill="#1e293b" stroke="#f59e0b"/><text x="100" y="96" font-size="11" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">현금 100</text><rect x="172" y="76" width="96" height="30" rx="6" fill="#1e293b" stroke="#38bdf8"/><text x="220" y="96" font-size="11" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">매출 100</text><text x="100" y="128" font-size="9" fill="#94a3b8" text-anchor="middle"  font-family="system-ui, sans-serif">현금이 늘었다</text><text x="220" y="128" font-size="9" fill="#94a3b8" text-anchor="middle"  font-family="system-ui, sans-serif">매출이 생겼다</text><text x="160" y="180" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">왼쪽 합계 100 = 오른쪽 합계 100</text>
</svg>
