<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="매출원가는 기초재고 200에 매입 800을 더하고 기말재고 300을 뺀 700이다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">매출원가 = 기초재고 + 매입 − 기말재고</text>
<text x="30" y="50" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">기초재고</text>
<text x="290" y="50" font-size="11" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">200</text>
<text x="30" y="71" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">+ 이번 달 매입</text>
<text x="290" y="71" font-size="11" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">800</text>
<text x="30" y="92" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">− 기말재고 (안 팔린 것)</text>
<text x="290" y="92" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">300</text>
<line x1="30" y1="100" x2="290" y2="100" stroke="#475569" stroke-width="1.5"/>
<text x="30" y="118" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">= 매출원가</text>
<text x="290" y="118" font-size="12" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">700</text>
<text x="160" y="140" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">기초재고 + 매입 = 1,000 중에서</text>
<rect x="30" y="148" width="182" height="26" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="121" y="165" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">팔린 만큼 700</text>
<rect x="212" y="148" width="78" height="26" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="251" y="165" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">남은 재고 300</text>
</svg>
