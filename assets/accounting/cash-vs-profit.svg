<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="1월과 2월은 이익이 나지만 현금은 줄고, 3월에 외상 대금이 들어와 현금이 크게 늘어나는 막대 그림">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="20" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">이익이 나도 통장은 마이너스일 수 있다</text><line x1="24" y1="110" x2="304" y2="110" stroke="#475569" stroke-width="2"/><rect x="24" y="30" width="8" height="8" fill="#f59e0b"/><text x="36" y="38" font-size="9" fill="#e2e8f0" text-anchor="start"  font-family="system-ui, sans-serif">장부상 이익</text><rect x="108" y="30" width="8" height="8" fill="#38bdf8"/><text x="120" y="38" font-size="9" fill="#e2e8f0" text-anchor="start"  font-family="system-ui, sans-serif">통장 현금 변화</text><rect x="50" y="86.0" width="30" height="24.0" fill="#f59e0b"/><rect x="84" y="110" width="30" height="36.0" fill="#38bdf8"/><text x="82" y="172" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">1월</text><rect x="142" y="86.0" width="30" height="24.0" fill="#f59e0b"/><rect x="176" y="110" width="30" height="12.0" fill="#38bdf8"/><text x="174" y="172" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">2월</text><rect x="234" y="86.0" width="30" height="24.0" fill="#f59e0b"/><rect x="268" y="38.0" width="30" height="72.0" fill="#38bdf8"/><text x="266" y="172" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">3월</text><text x="160" y="190" font-size="9" fill="#94a3b8" text-anchor="middle"  font-family="system-ui, sans-serif">외상 판매 대금이 3월에 들어오는 경우</text>
</svg>
