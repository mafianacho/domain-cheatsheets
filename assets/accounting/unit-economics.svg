<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="고객 1명을 데려오는 데 3만 원(CAC)을 쓰고 그 고객이 9만 원(LTV)의 이익을 주면 LTV ÷ CAC는 3이다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">유닛 이코노믹스: 고객 1명 기준</text>
<text x="30" y="46" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">CAC</text>
<rect x="30" y="52" width="60" height="22" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="60" y="68" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">3만 원</text>
<text x="98" y="68" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">고객 1명 데려오는 데 쓴 돈</text>
<text x="30" y="100" font-size="11" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">LTV</text>
<rect x="30" y="106" width="180" height="22" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
<text x="120" y="122" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">9만 원</text>
<text x="30" y="146" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">그 고객이 평생 가져다주는 이익</text>
<text x="160" y="172" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">LTV ÷ CAC = 9 ÷ 3 = 3배</text>
<text x="160" y="190" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">비율이 클수록 고객 1명이 남기는 게 많다</text>
</svg>
