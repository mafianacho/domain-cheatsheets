<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="영업이익 100에 영업외수익 10을 더하고 영업외비용 20과 세금 18을 빼면 당기순이익 72가 된다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">영업이익에서 당기순이익까지</text>
<text x="30" y="50" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">영업이익</text>
<text x="290" y="50" font-size="11" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">100</text>
<text x="30" y="71" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">+ 영업외수익 (이자수익 등)</text>
<text x="290" y="71" font-size="11" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">10</text>
<text x="30" y="92" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">− 영업외비용 (이자비용 등)</text>
<text x="290" y="92" font-size="11" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">20</text>
<text x="30" y="113" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">− 법인세 등 세금</text>
<text x="290" y="113" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">18</text>
<line x1="30" y1="124" x2="290" y2="124" stroke="#475569" stroke-width="1.5"/>
<text x="30" y="144" font-size="12" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">= 당기순이익</text>
<text x="290" y="144" font-size="12" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">72</text>
<text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">손익계산서의 맨 아랫줄 (bottom line)</text>
</svg>
