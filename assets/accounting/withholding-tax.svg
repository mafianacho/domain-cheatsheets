<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="회사가 프리랜서에게 줄 대금 1,000,000원에서 3.3%인 33,000원을 떼어 나라에 내고 967,000원을 지급한다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">원천징수: 대금에서 3.3%를 먼저 뗀다</text>
<rect x="14" y="44" width="62" height="100" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
<text x="45" y="90" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">돈 주는 쪽</text>
<text x="45" y="106" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">(회사)</text>
<rect x="236" y="44" width="70" height="32" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<text x="271" y="65" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">나라</text>
<rect x="236" y="112" width="70" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="271" y="133" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">프리랜서</text>
<line x1="76" y1="60" x2="236" y2="60" stroke="#f59e0b" stroke-width="2"/>
<line x1="236" y1="60" x2="229.9" y2="63.4" stroke="#f59e0b" stroke-width="2"/>
<line x1="236" y1="60" x2="229.9" y2="56.6" stroke="#f59e0b" stroke-width="2"/>
<text x="156" y="52" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">세금 33,000 (3.3%)</text>
<line x1="76" y1="128" x2="236" y2="128" stroke="#38bdf8" stroke-width="2"/>
<line x1="236" y1="128" x2="229.9" y2="131.4" stroke="#38bdf8" stroke-width="2"/>
<line x1="236" y1="128" x2="229.9" y2="124.6" stroke="#38bdf8" stroke-width="2"/>
<text x="156" y="120" font-size="10" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">나머지 967,000 지급</text>
<text x="160" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">소득세 3% 30,000 + 지방소득세 0.3% 3,000</text>
<text x="160" y="186" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">1,000,000 − 33,000 = 967,000</text>
</svg>
