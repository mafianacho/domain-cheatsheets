<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="12월 결산 법인은 사업연도 종료일이 속하는 달의 말일부터 3개월 안인 3월 말까지 법인세를 신고한다. 성실신고확인서를 내는 법인은 4개월">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">법인세 신고: 결산일에서 3개월 안</text>
<line x1="36" y1="98" x2="228" y2="98" stroke="#475569" stroke-width="3"/>
<line x1="228" y1="98" x2="292" y2="98" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5 4"/>
<circle cx="36" cy="98" r="6" fill="#e2e8f0"/>
<circle cx="100" cy="98" r="6" fill="#334155" stroke="#475569" stroke-width="2"/>
<circle cx="164" cy="98" r="6" fill="#334155" stroke="#475569" stroke-width="2"/>
<circle cx="228" cy="98" r="6" fill="#f59e0b"/>
<circle cx="292" cy="98" r="6" fill="#38bdf8"/>
<text x="36" y="122" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">12/31</text>
<text x="100" y="122" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">1월 말</text>
<text x="164" y="122" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">2월 말</text>
<text x="228" y="122" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">3월 말</text>
<text x="292" y="122" font-size="10" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">4월 말</text>
<text x="36" y="76" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">결산일</text>
<text x="132" y="76" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">3개월 이내</text>
<text x="228" y="76" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">신고·납부 기한</text>
<line x1="36" y1="84" x2="228" y2="84" stroke="#94a3b8" stroke-width="1"/>
<text x="306" y="146" font-size="9" fill="#38bdf8" text-anchor="end" font-family="system-ui, sans-serif">성실신고확인서 제출 법인: 4개월</text>
<text x="160" y="176" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">12월 결산이면 사업연도 종료일이 속하는 달의 말일(12월 말)부터 계산</text>
</svg>
