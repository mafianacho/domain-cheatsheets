<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="외상으로 비품 500,000원을 산 한 거래를 차변 비품과 대변 미지급금 두 면으로 적고 합계가 같다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">복식부기: 한 거래를 두 면으로</text>
<rect x="50" y="34" width="220" height="28" rx="6" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="160" y="52" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">거래: 외상으로 비품 500,000원 구입</text>
<line x1="110" y1="62" x2="90" y2="90" stroke="#475569" stroke-width="2"/>
<line x1="90" y1="90" x2="90.8" y2="83.1" stroke="#475569" stroke-width="2"/>
<line x1="90" y1="90" x2="96.3" y2="87.0" stroke="#475569" stroke-width="2"/>
<line x1="210" y1="62" x2="230" y2="90" stroke="#475569" stroke-width="2"/>
<line x1="230" y1="90" x2="223.7" y2="87.0" stroke="#475569" stroke-width="2"/>
<line x1="230" y1="90" x2="229.2" y2="83.1" stroke="#475569" stroke-width="2"/>
<rect x="20" y="92" width="134" height="46" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<text x="87" y="108" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">차변 (왼쪽)</text>
<text x="87" y="128" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">비품 +500,000</text>
<rect x="166" y="92" width="134" height="46" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="233" y="108" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">대변 (오른쪽)</text>
<text x="233" y="128" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">미지급금 +500,000</text>
<text x="160" y="164" font-size="11" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">차변 500,000 = 대변 500,000  ✓</text>
<text x="160" y="184" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">비품(자산)과 미지급금(부채)이 같이 늘었다</text>
</svg>
