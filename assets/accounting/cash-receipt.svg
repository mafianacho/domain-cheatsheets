<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="의무발행업종은 건당 10만 원 이상 현금을 받으면 손님이 요청하지 않아도 현금영수증을 발급한다. 10만 원 미만은 요청 시 발급">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">의무발행업종: 건당 10만 원 이상 현금</text>
<rect x="30" y="56" width="120" height="34" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="77" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">요청하면 발급</text>
<rect x="150" y="56" width="120" height="34" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="210" y="77" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">요청 없어도 발급</text>
<line x1="30" y1="90" x2="30" y2="98" stroke="#94a3b8" stroke-width="1.5"/>
<text x="30" y="112" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">0</text>
<line x1="150" y1="90" x2="150" y2="98" stroke="#f59e0b" stroke-width="1.5"/>
<text x="150" y="112" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">10만 원</text>
<line x1="270" y1="90" x2="270" y2="98" stroke="#94a3b8" stroke-width="1.5"/>
<text x="270" y="112" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">20만 원</text>
<text x="160" y="132" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">건당 거래금액(부가세 포함) 기준</text>
<text x="160" y="156" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">예) 9만 원 현금 → 손님이 요청할 때</text>
<text x="160" y="176" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">예) 12만 원 현금 → 안 달라고 해도 자진 발급</text>
</svg>
