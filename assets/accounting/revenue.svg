<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="손님이 낸 11,000원 중 10,000원이 매출액이고 1,000원은 나라 대신 받아둔 부가세다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">매출액 = 부가세를 뺀 금액</text>
<text x="160" y="52" font-size="11" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">손님이 낸 돈 11,000원</text>
<rect x="30" y="62" width="236" height="40" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="148" y="87" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">공급가액 10,000 = 매출액</text>
<rect x="266" y="62" width="24" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<line x1="278" y1="102" x2="278" y2="112" stroke="#38bdf8" stroke-width="1.5"/>
<text x="290" y="125" font-size="10" fill="#38bdf8" text-anchor="end" font-family="system-ui, sans-serif">부가세 1,000</text>
<text x="160" y="158" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">부가세는 나라 대신 받아둔 돈이라 매출에서 뺀다</text>
<text x="160" y="180" font-size="11" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">내 몫 10,000 + 나라 몫 1,000 = 11,000</text>
</svg>
