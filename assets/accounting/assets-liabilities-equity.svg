<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="자산은 부채와 자본을 더한 것과 같다. 자산 100은 부채 40과 자본 60으로 나뉜다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">자산 = 부채 + 자본</text>
<rect x="30" y="52" width="84" height="120" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="72" y="108" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">자산</text>
<text x="72" y="126" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">100</text>
<text x="72" y="190" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">가진 것</text>
<text x="134" y="120" font-size="18" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">=</text>
<rect x="154" y="52" width="84" height="48" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="196" y="74" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">부채</text>
<text x="196" y="91" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">40</text>
<rect x="154" y="100" width="84" height="72" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="196" y="132" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">자본</text>
<text x="196" y="149" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">60</text>
<text x="246" y="80" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">갚을 돈</text>
<text x="246" y="134" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">내 몫</text>
<text x="246" y="148" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">(자산−부채)</text>
</svg>
