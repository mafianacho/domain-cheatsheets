<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="국민연금, 건강보험, 고용보험은 근로자와 회사가 나눠 내고, 산재보험은 사업주가 낸다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">4대보험</text>
<rect x="14" y="36" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="84" y="58" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">국민연금</text>
<text x="84" y="76" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">노후 대비</text>
<text x="84" y="94" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">근로자 + 회사 분담</text>
<rect x="166" y="36" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="236" y="58" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">건강보험</text>
<text x="236" y="76" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">병원비 · 장기요양 포함</text>
<text x="236" y="94" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">근로자 + 회사 분담</text>
<rect x="14" y="114" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="84" y="136" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">고용보험</text>
<text x="84" y="154" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">실업급여 등</text>
<text x="84" y="172" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">근로자 + 회사 분담</text>
<rect x="166" y="114" width="140" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<text x="236" y="136" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">산재보험</text>
<text x="236" y="154" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">업무상 재해</text>
<text x="236" y="172" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">회사(사업주) 부담</text>
</svg>
