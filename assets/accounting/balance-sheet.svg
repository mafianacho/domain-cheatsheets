<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="재무상태표: 자산은 부채와 자본을 더한 것과 같다">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="26" font-size="12" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">재무상태표 · 어느 한 날의 재산 상태</text><rect x="20" y="42" width="112" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="76" y="92" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">자산</text><text x="76" y="112" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">내가 가진 것</text><text x="160" y="102" font-size="22" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">=</text><rect x="188" y="42" width="112" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="244" y="64" font-size="14" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">부채</text><text x="244" y="82" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">갚아야 할 돈</text><rect x="188" y="100" width="112" height="52" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/><text x="244" y="122" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">자본</text><text x="244" y="140" font-size="10" fill="#e2e8f0" text-anchor="middle"  font-family="system-ui, sans-serif">내 몫 (순자산)</text><text x="160" y="184" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">자산 = 부채 + 자본</text>
</svg>
