<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>소액사건심판은 소송목적의 값이 3,000만 원 이하인 금전 청구를 간단히 처리하는 재판</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">소액사건심판 = 간단한 재판</text>
<rect x="24" y="36" width="156" height="18" rx="4" fill="#38bdf8"/>
<text x="102" y="49" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">소액사건</text>
<rect x="180" y="36" width="116" height="18" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="238" y="49" font-size="10" fill="#e2e8f0" text-anchor="middle">일반 민사</text>
<line x1="180" y1="32" x2="180" y2="58" stroke="#f59e0b" stroke-width="2"/>
<text x="180" y="72" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">3,000만 원 이하</text>
<rect x="10" y="88" width="88" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="54" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">소장 접수</text>
<text x="54" y="120" font-size="9" fill="#e2e8f0" text-anchor="middle">말로도 가능</text>
<rect x="114" y="88" width="88" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="158" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">이행권고</text>
<text x="158" y="120" font-size="9" fill="#e2e8f0" text-anchor="middle">결정 송달</text>
<rect x="218" y="88" width="88" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="262" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">송달 후</text>
<text x="262" y="120" font-size="9" fill="#f59e0b" text-anchor="middle">2주 안 이의?</text>
<line x1="98" y1="109" x2="112" y2="109" stroke="#94a3b8" stroke-width="2" marker-end="url(#mg)"/>
<line x1="202" y1="109" x2="216" y2="109" stroke="#94a3b8" stroke-width="2" marker-end="url(#mg)"/>
<line x1="262" y1="130" x2="262" y2="144" stroke="#f59e0b" stroke-width="2"/>
<text x="262" y="158" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">이의 없음 → 확정</text>
<text x="262" y="176" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">이의 있음 → 재판</text>
<rect x="10" y="146" width="190" height="40" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="105" y="163" font-size="10" fill="#e2e8f0" text-anchor="middle">일부러 청구를 쪼개</text>
<text x="105" y="178" font-size="10" fill="#e2e8f0" text-anchor="middle">소액으로 내면 각하</text></svg>
