<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>상표권은 특허청에 등록해야 생기고 같은 상표는 먼저 출원한 사람이 우선</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">상표권 = 등록해야 생김</text>
<rect x="10" y="32" width="84" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="51" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">① 출원</text>
<text x="52" y="66" font-size="9" fill="#94a3b8" text-anchor="middle">특허청에 신청</text>
<rect x="118" y="32" width="84" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="160" y="51" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">② 심사</text>
<text x="160" y="66" font-size="9" fill="#94a3b8" text-anchor="middle">비슷한 상표 확인</text>
<rect x="226" y="32" width="84" height="44" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="268" y="51" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">③ 등록</text>
<text x="268" y="66" font-size="9" fill="#94a3b8" text-anchor="middle">상표권 발생</text>
<line x1="94" y1="54" x2="116" y2="54" stroke="#94a3b8" stroke-width="2" marker-end="url(#mg)"/>
<line x1="202" y1="54" x2="224" y2="54" stroke="#94a3b8" stroke-width="2" marker-end="url(#mg)"/>
<text x="160" y="98" font-size="10" fill="#e2e8f0" text-anchor="middle">같은·비슷한 상표라면 먼저 출원한 사람 우선</text>
<line x1="24" y1="130" x2="296" y2="130" stroke="#475569" stroke-width="3" marker-end="url(#mg)"/>
<text x="292" y="118" font-size="9" fill="#e2e8f0" text-anchor="end">시간 →</text>
<circle cx="84" cy="130" r="6" fill="#f59e0b"/>
<circle cx="224" cy="130" r="6" fill="#94a3b8"/>
<text x="84" y="118" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">A 먼저 출원</text>
<text x="84" y="148" font-size="10" fill="#f59e0b" text-anchor="middle">등록 가능</text>
<text x="224" y="118" font-size="10" fill="#e2e8f0" text-anchor="middle">B 나중 출원</text>
<text x="224" y="148" font-size="10" fill="#e2e8f0" text-anchor="middle">등록 어려움</text>
<rect x="40" y="160" width="240" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>
<text x="160" y="178" font-size="9" fill="#e2e8f0" text-anchor="middle">같은 이름도 상품·서비스 종류(류)마다 따로 등록</text></svg>
