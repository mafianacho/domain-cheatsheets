<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>해제: 계약을 처음 시점으로 되돌리고 받은 것을 돌려줌</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">해제 = 처음으로 되돌림</text>
<line x1="22" y1="96" x2="298" y2="96" stroke="#475569" stroke-width="3" marker-end="url(#mg)"/>
<text x="298" y="84" font-size="9" fill="#94a3b8" text-anchor="end">시간 →</text>
<rect x="52" y="88" width="196" height="16" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="150" y="100" font-size="9" fill="#e2e8f0" text-anchor="middle">계약 효력: 없던 것으로</text>
<path d="M248 80 C 248 28, 52 28, 52 80" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#ma)"/>
<text x="150" y="62" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">소급: 계약 체결 시점으로</text>
<circle cx="52" cy="96" r="5" fill="#38bdf8"/>
<circle cx="248" cy="96" r="6" fill="#f59e0b"/>
<text x="52" y="120" font-size="10" fill="#e2e8f0" text-anchor="middle">계약 체결</text>
<text x="248" y="120" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">해제</text>
<text x="160" y="140" font-size="10" fill="#f59e0b" text-anchor="middle">원상회복: 받은 것을 서로 돌려줌</text>
<rect x="20" y="148" width="56" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="48" y="171" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">갑</text>
<rect x="244" y="148" width="56" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="272" y="171" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">을</text>
<line x1="244" y1="158" x2="78" y2="158" stroke="#f59e0b" stroke-width="2" marker-end="url(#ma)"/>
<text x="161" y="153" font-size="9" fill="#e2e8f0" text-anchor="middle">돈 반환</text>
<line x1="78" y1="177" x2="242" y2="177" stroke="#f59e0b" stroke-width="2" marker-end="url(#ma)"/>
<text x="161" y="191" font-size="9" fill="#e2e8f0" text-anchor="middle">물건 반환</text></svg>
