<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>소멸시효는 권리를 행사하지 않고 일정 기간이 지나면 권리가 사라지는 제도이며 중단되면 새로 시작</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">소멸시효 = 행사하지 않으면 사라짐</text>
<line x1="60" y1="32" x2="60" y2="108" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="54" y="44" font-size="9" fill="#94a3b8" text-anchor="end">권리 발생</text>
<rect x="60" y="58" width="48" height="14" rx="3" fill="#38bdf8"/>
<text x="56" y="69" font-size="9" fill="#e2e8f0" text-anchor="end">3년</text>
<text x="114" y="69" font-size="9" fill="#e2e8f0" text-anchor="start">일부 채권(공사대금 등)</text>
<rect x="60" y="76" width="80" height="14" rx="3" fill="#38bdf8"/>
<text x="56" y="87" font-size="9" fill="#e2e8f0" text-anchor="end">5년</text>
<text x="146" y="87" font-size="9" fill="#e2e8f0" text-anchor="start">상거래 채권</text>
<rect x="60" y="94" width="160" height="14" rx="3" fill="#f59e0b"/>
<text x="56" y="105" font-size="9" fill="#e2e8f0" text-anchor="end">10년</text>
<text x="226" y="105" font-size="9" fill="#e2e8f0" text-anchor="start">일반 민사채권</text>
<text x="160" y="128" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">청구·압류·승인으로 시효가 중단되면</text>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle">(중단 때까지 지난 기간은 계산하지 않음)</text>
<rect x="24" y="140" width="116" height="20" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="82" y="154" font-size="9" fill="#e2e8f0" text-anchor="middle">중단까지 지난 기간</text>
<circle cx="140" cy="150" r="5" fill="#f59e0b"/>
<rect x="140" y="140" width="156" height="20" rx="4" fill="#38bdf8"/>
<text x="218" y="154" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">여기서부터 새로 시작</text></svg>
