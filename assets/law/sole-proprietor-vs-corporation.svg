<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>개인사업자는 사람이 곧 사업 주체이고 법인은 사람과 별개로 회사가 주체가 되는 형태</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><rect x="8" y="10" width="148" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
<rect x="164" y="10" width="148" height="180" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
<text x="82" y="30" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">개인사업자</text>
<text x="238" y="30" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">법인</text>
<rect x="42" y="42" width="80" height="44" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<circle cx="66" cy="64" r="5" fill="#38bdf8"/>
<path d="M57 78 Q57 69 66 69 Q75 69 75 78 Z" fill="#38bdf8" stroke="None" stroke-width="0"/>
<text x="98" y="68" font-size="10" fill="#e2e8f0" text-anchor="middle">사업</text>
<text x="82" y="104" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">나와 사업은 한 몸</text>
<circle cx="198" cy="64" r="5" fill="#f59e0b"/>
<path d="M189 78 Q189 69 198 69 Q207 69 207 78 Z" fill="#f59e0b" stroke="None" stroke-width="0"/>
<line x1="220" y1="44" x2="220" y2="86" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="228" y="42" width="56" height="44" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text x="256" y="68" font-size="10" fill="#e2e8f0" text-anchor="middle">회사</text>
<text x="238" y="104" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">나와 회사는 별개</text>
<text x="82" y="130" font-size="10" fill="#e2e8f0" text-anchor="middle">빚 → 내 재산까지</text>
<text x="82" y="150" font-size="10" fill="#e2e8f0" text-anchor="middle">시작 → 사업자등록</text>
<text x="82" y="170" font-size="10" fill="#e2e8f0" text-anchor="middle">계약 주체는 나</text>
<text x="238" y="130" font-size="10" fill="#e2e8f0" text-anchor="middle">빚 → 회사와 주주 구분</text>
<text x="238" y="150" font-size="10" fill="#e2e8f0" text-anchor="middle">시작 → 설립등기</text>
<text x="238" y="170" font-size="10" fill="#e2e8f0" text-anchor="middle">(개인보증은 예외)</text></svg>
