<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>용역계약은 법률 용어가 아니며 내용에 따라 일의 완성이 핵심인 도급 또는 업무 처리가 핵심인 위임으로 봄</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">용역계약 = 도급 또는 위임</text>
<rect x="70" y="32" width="180" height="34" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
<text x="160" y="47" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">용역계약</text>
<text x="160" y="60" font-size="9" fill="#94a3b8" text-anchor="middle">(법률 용어 아님)</text>
<line x1="130" y1="66" x2="82" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#mg)"/>
<line x1="190" y1="66" x2="238" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#mg)"/>
<rect x="12" y="92" width="140" height="74" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="82" y="110" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">도급</text>
<text x="82" y="128" font-size="10" fill="#e2e8f0" text-anchor="middle">일의 "완성"이 핵심</text>
<text x="82" y="143" font-size="10" fill="#94a3b8" text-anchor="middle">예: 로고 · 앱 개발</text>
<text x="82" y="158" font-size="10" fill="#e2e8f0" text-anchor="middle">결과물 완성 → 대금</text>
<rect x="168" y="92" width="140" height="74" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="238" y="110" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">위임</text>
<text x="238" y="128" font-size="10" fill="#e2e8f0" text-anchor="middle">업무 "처리"가 핵심</text>
<text x="238" y="143" font-size="10" fill="#94a3b8" text-anchor="middle">예: 컨설팅 · 상담</text>
<text x="238" y="158" font-size="10" fill="#e2e8f0" text-anchor="middle">처리한 일에 대한 대가</text>
<text x="160" y="186" font-size="9" fill="#94a3b8" text-anchor="middle">이름이 용역이어도 실제가 근로면 근로자로 봄</text></svg>
