<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>해지: 지금부터 앞으로만 계약을 끝냄, 지나간 기간은 그대로 유효</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">해지 = 지금부터 끝냄</text>
<line x1="22" y1="100" x2="298" y2="100" stroke="#475569" stroke-width="3" marker-end="url(#mg)"/>
<text x="298" y="128" font-size="9" fill="#94a3b8" text-anchor="end">시간 →</text>
<rect x="40" y="90" width="160" height="20" rx="4" fill="#38bdf8"/>
<text x="120" y="104" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">지나간 기간: 그대로 유효</text>
<rect x="200" y="90" width="96" height="20" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="248" y="104" font-size="10" fill="#e2e8f0" text-anchor="middle">효력 없음</text>
<circle cx="40" cy="100" r="5" fill="#38bdf8"/>
<circle cx="200" cy="100" r="6" fill="#f59e0b"/>
<line x1="204" y1="78" x2="290" y2="78" stroke="#f59e0b" stroke-width="3" marker-end="url(#ma)"/>
<text x="248" y="62" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">앞으로만 끝남</text>
<text x="40" y="130" font-size="10" fill="#e2e8f0" text-anchor="middle">계약 시작</text>
<text x="200" y="130" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">해지 통지</text>
<rect x="30" y="148" width="260" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="160" y="165" font-size="10" fill="#e2e8f0" text-anchor="middle">지나간 기간은 되돌리지 않음</text>
<text x="160" y="180" font-size="10" fill="#94a3b8" text-anchor="middle">(해지 이후부터만 효력이 사라짐)</text></svg>
