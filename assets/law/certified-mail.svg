<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>내용증명은 언제 누가 누구에게 어떤 내용을 보냈는지 우체국이 증명해 주는 우편</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">내용증명 = 보낸 사실의 기록</text>
<rect x="10" y="36" width="84" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="56" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">나</text>
<text x="52" y="73" font-size="9" fill="#94a3b8" text-anchor="middle">(발송인)</text>
<rect x="118" y="36" width="84" height="48" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="160" y="56" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">우체국</text>
<text x="160" y="73" font-size="9" fill="#f59e0b" text-anchor="middle">내용·날짜 증명</text>
<rect x="226" y="36" width="84" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="268" y="56" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700">상대방</text>
<text x="268" y="73" font-size="9" fill="#94a3b8" text-anchor="middle">(받는 사람)</text>
<line x1="94" y1="60" x2="116" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#mg)"/>
<line x1="202" y1="60" x2="224" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#mg)"/>
<rect x="12" y="98" width="296" height="40" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.2"/>
<text x="160" y="115" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">증명되는 것</text>
<text x="160" y="130" font-size="10" fill="#e2e8f0" text-anchor="middle">언제 · 누가 · 누구에게 · 어떤 내용을</text>
<rect x="12" y="150" width="296" height="38" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="160" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">돈을 받아낼 강제력은 없음</text>
<text x="160" y="180" font-size="10" fill="#94a3b8" text-anchor="middle">나중에 소송에서 증거가 됨</text></svg>
