<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>저작권 양도는 저작재산권을 넘기는 것이며 2차적저작물작성권은 특약이 있어야 넘어가고 인격권은 넘길 수 없음</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><rect x="8" y="30" width="62" height="156" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="39" y="112" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">저작자</text>
<rect x="250" y="30" width="62" height="156" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="281" y="112" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">양수인</text>
<text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">저작권 양도 = 권리를 넘김</text>
<rect x="80" y="40" width="160" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="160" y="57" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">재산권</text>
<text x="160" y="72" font-size="9" fill="#f59e0b" text-anchor="middle">복제 · 배포 등</text>
<line x1="70" y1="60" x2="80" y2="60" stroke="#f59e0b" stroke-width="2"/>
<line x1="240" y1="60" x2="246" y2="60" stroke="#f59e0b" stroke-width="2" marker-end="url(#ma)"/>
<rect x="80" y="88" width="160" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
