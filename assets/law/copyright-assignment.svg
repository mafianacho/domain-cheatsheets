<line x1="240" y1="108" x2="246" y2="108" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#ma)"/>
<rect x="80" y="136" width="160" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="160" y="153" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">저작인격권</text>
