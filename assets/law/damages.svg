<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>손해배상은 손해, 상대 잘못, 금액을 보여 주고 돈으로 물어 달라고 하는 것</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">손해배상 = 입은 손해를 돈으로</text>
<rect x="12" y="36" width="96" height="62" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="60" y="56" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">①</text>
<text x="60" y="74" font-size="10" fill="#e2e8f0" text-anchor="middle">손해가</text>
<text x="60" y="88" font-size="10" fill="#e2e8f0" text-anchor="middle">있었다</text>
<rect x="112" y="36" width="96" height="62" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="160" y="56" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">②</text>
<text x="160" y="74" font-size="10" fill="#e2e8f0" text-anchor="middle">상대의 잘못</text>
<text x="160" y="88" font-size="10" fill="#e2e8f0" text-anchor="middle">때문이다</text>
<rect x="212" y="36" width="96" height="62" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="260" y="56" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">③</text>
<text x="260" y="74" font-size="10" fill="#e2e8f0" text-anchor="middle">금액이</text>
<text x="260" y="88" font-size="10" fill="#e2e8f0" text-anchor="middle">얼마인지</text>
<line x1="60" y1="98" x2="60" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#mg)"/>
<line x1="160" y1="98" x2="160" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#mg)"/>
<line x1="260" y1="98" x2="260" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#mg)"/>
<rect x="12" y="118" width="296" height="30" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text x="160" y="138" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">금전으로 배상 청구</text>
<text x="160" y="168" font-size="10" fill="#e2e8f0" text-anchor="middle">보통 청구하는 쪽이 보여줘야 함</text>
<text x="160" y="184" font-size="10" fill="#94a3b8" text-anchor="middle">계약서 · 영수증 · 대화 기록</text></svg>
