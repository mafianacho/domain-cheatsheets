<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img">
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="85" y="26" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">근로자에 가까움</text>
<text x="235" y="26" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">독립 사업자에 가까움</text>
<rect x="10" y="38" width="145" height="116" rx="10" fill="#1e293b"/><rect x="165" y="38" width="145" height="116" rx="10" fill="#1e293b"/>
<text x="20" y="62" font-size="10" fill="#e2e8f0">· 업무 지시를 받음</text>
<text x="20" y="82" font-size="10" fill="#e2e8f0">· 근무 시간·장소 고정</text>
<text x="20" y="102" font-size="10" fill="#e2e8f0">· 대신 일할 수 없음</text>
<text x="20" y="122" font-size="10" fill="#e2e8f0">· 고정 보수</text>
<text x="20" y="142" font-size="10" fill="#e2e8f0">· 한 곳에 묶여 일함</text>
<text x="175" y="62" font-size="10" fill="#e2e8f0">· 방식을 스스로 정함</text>
<text x="175" y="82" font-size="10" fill="#e2e8f0">· 시간·장소 자유</text>
<text x="175" y="102" font-size="10" fill="#e2e8f0">· 대신 시킬 수 있음</text>
<text x="175" y="122" font-size="10" fill="#e2e8f0">· 결과물에 대가</text>
<text x="175" y="142" font-size="10" fill="#e2e8f0">· 여러 곳과 계약</text>
<rect x="30" y="164" width="260" height="26" rx="8" fill="#334155" stroke="#f59e0b"/>
<text x="160" y="182" font-size="11" fill="#e2e8f0" text-anchor="middle">계약서 이름보다 실제 일하는 모습이 기준</text>
</svg>
