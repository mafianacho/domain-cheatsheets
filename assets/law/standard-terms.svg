<line x1="22" y1="95" x2="80" y2="95" stroke="#475569" stroke-width="2"/>
<text x="51" y="126" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">사업자</text>
<circle cx="262" cy="48" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="262" y="52" font-size="9" fill="#e2e8f0" text-anchor="middle">고객A</text>
<line x1="92" y1="75" x2="244" y2="48" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#ms)"/>
