<text x="160" y="166" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">따로 합의한 내용이 약관보다 우선</text>
<text x="160" y="180" font-size="10" fill="#e2e8f0" text-anchor="middle">불공정한 조항은 무효가 될 수 있음</text></svg>
