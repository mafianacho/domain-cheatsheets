<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>라이선스는 권리자가 조건을 붙여 사용을 허락하는 것이며 권리는 그대로 권리자가 가짐</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">라이선스 = 조건부 사용 허락</text>
<rect x="12" y="34" width="88" height="56" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="56" y="56" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">권리자</text>
<text x="56" y="74" font-size="9" fill="#e2e8f0" text-anchor="middle">권리는 그대로</text>
<rect x="220" y="34" width="88" height="56" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="264" y="56" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">이용자</text>
<text x="264" y="74" font-size="9" fill="#e2e8f0" text-anchor="middle">조건 안에서 사용</text>
<line x1="100" y1="62" x2="218" y2="62" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ma)"/>
<text x="160" y="54" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">사용 허락</text>
<text x="160" y="82" font-size="9" fill="#94a3b8" text-anchor="middle">범위 · 기간 · 지역</text>
<text x="160" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">쓰기 전에 확인할 것</text>
<rect x="12" y="120" width="96" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="60" y="139" font-size="10" fill="#e2e8f0" text-anchor="middle">상업적 이용?</text>
<rect x="112" y="120" width="96" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="160" y="139" font-size="10" fill="#e2e8f0" text-anchor="middle">수정·재배포?</text>
<rect x="212" y="120" width="96" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="260" y="139" font-size="10" fill="#e2e8f0" text-anchor="middle">출처 표시?</text>
<rect x="12" y="160" width="296" height="28" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="1.2"/>
<text x="160" y="178" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">넘기는 것이 아니라 쓰게 해 주는 것</text></svg>
