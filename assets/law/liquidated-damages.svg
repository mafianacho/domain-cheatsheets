<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>위약금은 계약 위반 시 물어줄 금액을 미리 정한 것이며 부당히 과다하면 법원이 줄일 수 있음</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">위약금 = 미리 정한 배상액</text>
<rect x="14" y="36" width="112" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="70" y="61" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">계약 위반</text>
<line x1="126" y1="56" x2="156" y2="56" stroke="#f59e0b" stroke-width="2" marker-end="url(#ma)"/>
<rect x="158" y="36" width="148" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="232" y="53" font-size="10" fill="#e2e8f0" text-anchor="middle">약정한 금액을</text>
<text x="232" y="67" font-size="9" fill="#f59e0b" text-anchor="middle">지급 (손해액 증명 불필요)</text>
<text x="160" y="96" font-size="10" fill="#94a3b8" text-anchor="middle">약정액이 부당히 과다하다면</text>
<rect x="24" y="104" width="176" height="24" rx="4" fill="#f59e0b"/>
<text x="112" y="120" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">적당한 부분</text>
<rect x="200" y="104" width="96" height="24" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="248" y="120" font-size="10" fill="#e2e8f0" text-anchor="middle">과다한 부분</text>
<line x1="296" y1="144" x2="206" y2="144" stroke="#38bdf8" stroke-width="2" marker-end="url(#ms)"/>
<text x="251" y="162" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">법원이 줄일 수 있음</text>
<text x="251" y="176" font-size="9" fill="#94a3b8" text-anchor="middle">(민법 제398조)</text>
<text x="110" y="160" font-size="10" fill="#e2e8f0" text-anchor="middle">위약금 약정은</text>
<text x="110" y="174" font-size="10" fill="#e2e8f0" text-anchor="middle">보통 배상액 예정으로 봄</text></svg>
