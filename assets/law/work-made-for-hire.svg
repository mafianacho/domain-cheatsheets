<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>업무상저작물은 직원이 회사 업무로 만든 저작물을 조건이 맞으면 회사가 저작자가 되는 제도</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">업무상저작물 = 회사가 저작자</text>
<rect x="12" y="34" width="190" height="108" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<text x="107" y="52" font-size="10" fill="#94a3b8" text-anchor="middle">조건을 모두 만족하면</text>
<text x="26" y="74" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700">✓</text>
<text x="42" y="74" font-size="10" fill="#e2e8f0" text-anchor="start">회사의 기획 아래</text>
<text x="26" y="94" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700">✓</text>
<text x="42" y="94" font-size="10" fill="#e2e8f0" text-anchor="start">직원이 회사 업무로 작성</text>
<text x="26" y="114" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700">✓</text>
<text x="42" y="114" font-size="10" fill="#e2e8f0" text-anchor="start">회사 이름으로 공표</text>
<text x="26" y="134" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700">✓</text>
<text x="42" y="134" font-size="10" fill="#e2e8f0" text-anchor="start">계약·규정에 다른 정함 없음</text>
<line x1="202" y1="91" x2="222" y2="91" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ma)"/>
<rect x="224" y="50" width="86" height="82" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text x="267" y="72" font-size="10" fill="#e2e8f0" text-anchor="middle">저작자</text>
<text x="267" y="92" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700">= 회사</text>
<text x="267" y="111" font-size="9" fill="#e2e8f0" text-anchor="middle">프로그램은</text>
<text x="267" y="123" font-size="9" fill="#e2e8f0" text-anchor="middle">공표 불요</text>
<rect x="12" y="154" width="296" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="160" y="169" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">외주(프리랜서) 결과물은 해당 없음</text>
<text x="160" y="182" font-size="9" fill="#38bdf8" text-anchor="middle">계약서에 양도 문구가 없으면 만든 사람 소유</text></svg>
