<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>제3자 제공은 고객 정보를 다른 회사에 넘겨 그쪽이 자기 목적으로 쓰게 하는 것으로 원칙적으로 별도 동의가 필요</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">제3자 제공 = 별도 동의 후 넘김</text>
<rect x="8" y="44" width="50" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="33" y="72" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700">고객</text>
<rect x="110" y="44" width="66" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="143" y="64" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">우리</text>
<text x="143" y="79" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">회사</text>
<rect x="238" y="44" width="72" height="46" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="274" y="64" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">제3자</text>
<text x="274" y="79" font-size="9" fill="#e2e8f0" text-anchor="middle">받는 회사</text>
<line x1="58" y1="67" x2="108" y2="67" stroke="#38bdf8" stroke-width="2" marker-end="url(#ms)"/>
<text x="83" y="58" font-size="9" fill="#38bdf8" text-anchor="middle" font-weight="700">별도 동의</text>
<line x1="176" y1="67" x2="236" y2="67" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ma)"/>
<text x="206" y="58" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="700">정보 넘김</text>
<text x="274" y="106" font-size="9" fill="#f59e0b" text-anchor="middle">자기 목적으로 사용</text>
<rect x="12" y="120" width="296" height="68" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<text x="160" y="137" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">동의를 받을 때 알려야 할 것</text>
<text x="160" y="153" font-size="10" fill="#e2e8f0" text-anchor="middle">받는 자 · 이용 목적 · 제공 항목</text>
<text x="160" y="167" font-size="10" fill="#e2e8f0" text-anchor="middle">보유·이용 기간</text>
<text x="160" y="181" font-size="10" fill="#e2e8f0" text-anchor="middle">거부할 권리와 거부 시 불이익</text></svg>
