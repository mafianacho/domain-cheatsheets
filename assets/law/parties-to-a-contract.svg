<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui, sans-serif" role="img"><title>계약서의 갑과 을은 계약 당사자를 부르는 이름표일 뿐 법적 우열이 아님</title><defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f59e0b"/></marker><marker id="ms" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker><marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs><rect width="320" height="200" rx="12" fill="#0f172a"/><text x="160" y="22" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700">갑·을 = 계약서의 이름표</text>
<rect x="12" y="38" width="96" height="62" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="60" y="62" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="700">갑</text>
<text x="60" y="80" font-size="10" fill="#e2e8f0" text-anchor="middle">돈을 내고</text>
<text x="60" y="93" font-size="10" fill="#e2e8f0" text-anchor="middle">일을 맡기는 쪽</text>
<rect x="212" y="38" width="96" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="260" y="62" font-size="16" fill="#38bdf8" text-anchor="middle" font-weight="700">을</text>
<text x="260" y="80" font-size="10" fill="#e2e8f0" text-anchor="middle">일을 하고</text>
<text x="260" y="93" font-size="10" fill="#e2e8f0" text-anchor="middle">대가를 받는 쪽</text>
<rect x="132" y="42" width="56" height="54" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
<text x="160" y="60" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">계약서</text>
<line x1="142" y1="68" x2="178" y2="68" stroke="#475569" stroke-width="2"/>
<line x1="142" y1="76" x2="178" y2="76" stroke="#475569" stroke-width="2"/>
<line x1="142" y1="84" x2="178" y2="84" stroke="#475569" stroke-width="2"/>
<line x1="108" y1="69" x2="130" y2="69" stroke="#f59e0b" stroke-width="2" marker-end="url(#ma)"/>
<line x1="212" y1="69" x2="190" y2="69" stroke="#38bdf8" stroke-width="2" marker-end="url(#ms)"/>
<rect x="12" y="118" width="296" height="68" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>
<text x="160" y="138" font-size="10" fill="#e2e8f0" text-anchor="middle">이름표일 뿐, 법적으로 갑이 더 세다는 뜻은 아님</text>
<text x="160" y="156" font-size="10" fill="#f59e0b" text-anchor="middle">반드시 실제 이름·사업자등록번호와 연결해 확인</text>
<text x="160" y="174" font-size="10" fill="#94a3b8" text-anchor="middle">같은 사람도 계약마다 갑 또는 을</text></svg>
