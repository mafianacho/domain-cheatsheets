<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="보유 시가총액 막대가 50억원 선을 넘으면 대주주 표시등이 켜지는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.ac{fill:#f59e0b}.sk{fill:#38bdf8}.mu{fill:#94a3b8}.b{font-weight:700}.fb{transform-box:fill-box}.ob{transform-box:fill-box;transform-origin:bottom}.ol{transform-box:fill-box;transform-origin:left}.oc{transform-box:fill-box;transform-origin:center}@keyframes pul{0%,100%{opacity:.3}50%{opacity:1}}@keyframes slx{0%,10%{transform:translateX(0)}55%,80%{transform:translateX(var(--d))}100%{transform:translateX(0)}}@keyframes sly{0%,10%{transform:translateY(0)}55%,80%{transform:translateY(var(--d))}100%{transform:translateY(0)}}@keyframes grw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}@keyframes grx{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}@keyframes blk{0%,49%{opacity:1}50%,100%{opacity:.15}}@keyframes tilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}.pul{animation:pul 3s ease-in-out infinite}.slx{animation:slx 3s ease-in-out infinite}.sly{animation:sly 3s ease-in-out infinite}.grw{animation:grw 3s ease-in-out infinite}.grx{animation:grx 3s ease-in-out infinite}.blk{animation:blk 1.5s steps(1) infinite}.d1{animation-delay:-.5s}.d2{animation-delay:-1s}.d3{animation-delay:-1.5s}.d4{animation-delay:-2s}.d5{animation-delay:-2.5s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="26">대주주 양도세</text>
<text class="s" x="16" y="188">큰손만 주식 양도차익에 세금</text>
<rect x="50" y="44" width="36" height="116" rx="4" fill="#334155" />
<rect class="ob grw" x="50" y="44" width="36" height="116" rx="4" fill="#f59e0b" />
<line x1="40" y1="80" x2="96" y2="80" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 3" />
<text class="m b" x="104" y="84">종목당 50억원</text>
<circle class="blk" cx="236" cy="52" r="8" fill="#38bdf8" />
<text class="m b sk" x="250" y="56">대주주</text>
<text class="s" x="104" y="112">한 종목 보유 시가총액</text>
<text class="s" x="104" y="126">(직전 사업연도 말 기준)</text>
<text class="s" x="104" y="146">지분율 기준도 따로 있다</text>
</svg>
