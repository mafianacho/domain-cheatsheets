<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="생각 말하기: 참가자가 화면을 쓰며 떠오르는 생각을 소리 내어 말하게 하는 방법">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,8%{opacity:0}12%,92%{opacity:1}100%{opacity:0}}.k1{animation:k1 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,32%{opacity:0}36%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,56%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}.k3{animation:k3 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Think-aloud · 생각 말하기</text>
<g><circle cx="44" cy="80" r="11" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<path d="M25.3 113.0 Q44 89.9 62.7 113.0 Z" fill="#334155" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="44" y="134" font-size="9" fill="#94a3b8" text-anchor="middle">참가자</text>
<rect x="92" y="44" width="204" height="30" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" class="k1"/>
<text x="194.0" y="63.0" font-size="11" fill="#e2e8f0" text-anchor="middle" class="k1">음… 어디를 눌러야 하지?</text>
<rect x="92" y="82" width="204" height="30" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" class="k2"/>
<text x="194.0" y="101.0" font-size="11" fill="#e2e8f0" text-anchor="middle" class="k2">이 아이콘은 뭐지?</text>
<rect x="92" y="120" width="204" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" class="k3"/>
<text x="194.0" y="139.0" font-size="11" fill="#e2e8f0" text-anchor="middle" class="k3">아, 여기 있었네요</text>
<text x="160" y="180" font-size="10" fill="#94a3b8" text-anchor="middle">머릿속 생각을 말로 꺼내게 한다</text>
</svg>
