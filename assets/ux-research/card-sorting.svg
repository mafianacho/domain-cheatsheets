<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="카드 소팅: 참가자가 카드를 자기 생각대로 묶게 해서 메뉴 이름과 구조를 찾는 조사">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,8%{transform:translate(0px,0px)}34%,92%{transform:translate(3px,90px)}100%{transform:translate(0px,0px)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,14%{transform:translate(0px,0px)}40%,92%{transform:translate(47px,90px)}100%{transform:translate(0px,0px)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,20%{transform:translate(0px,0px)}46%,92%{transform:translate(91px,90px)}100%{transform:translate(0px,0px)}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,26%{transform:translate(0px,0px)}52%,92%{transform:translate(-103px,90px)}100%{transform:translate(0px,0px)}}.k4{animation:k4 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,32%{transform:translate(0px,0px)}58%,92%{transform:translate(-59px,90px)}100%{transform:translate(0px,0px)}}.k5{animation:k5 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k6{0%,38%{transform:translate(0px,0px)}64%,92%{transform:translate(-15px,90px)}100%{transform:translate(0px,0px)}}.k6{animation:k6 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
