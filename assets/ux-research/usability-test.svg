<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="사용성 테스트: 참가자가 과제를 해보는 동안 관찰자가 어디서 막히는지 기록하는 평가">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,14%{transform:translate(0px,0px)}40%,60%{transform:translate(58px,28px)}100%{transform:translate(0px,0px)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,30%{transform:scaleX(0)}42%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k3{0%,48%{transform:scaleX(0)}60%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k4{0%,66%{transform:scaleX(0)}78%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k4{animation:k4 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
