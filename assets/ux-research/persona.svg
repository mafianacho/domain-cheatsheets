<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="페르소나: 조사로 모은 사용자의 특징을 한 명의 가상 인물로 정리한 카드">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,12%{opacity:0}16%,92%{opacity:1}100%{opacity:0}}.k1{animation:k1 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,34%{opacity:0}38%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,56%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}.k3{animation:k3 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Persona · 페르소나</text>
<rect x="16" y="42" width="288" height="138" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<circle cx="56" cy="82" r="24" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
<g><circle cx="56" cy="76" r="8" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<path d="M42.4 100.0 Q56 83.2 69.6 100.0 Z" fill="#334155" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="56" y="124" font-size="9" fill="#94a3b8" text-anchor="middle">가상 인물</text>
<text x="96" y="68" font-size="13" fill="#e2e8f0" font-weight="700">민지, 29세 직장인</text>
<rect x="96" y="80" width="38" height="18" rx="5" fill="#38bdf8" class="k1"/>
<text x="115" y="93" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" class="k1">목표</text>
<text x="142" y="94" font-size="10" fill="#e2e8f0" class="k1">퇴근길에 빠르게 주문하기</text>
<rect x="96" y="106" width="38" height="18" rx="5" fill="#f59e0b" class="k2"/>
<text x="115" y="119" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" class="k2">불편</text>
<text x="142" y="120" font-size="10" fill="#e2e8f0" class="k2">화면이 복잡하고 느리다</text>
<rect x="96" y="132" width="38" height="18" rx="5" fill="#94a3b8" class="k3"/>
<text x="115" y="145" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" class="k3">습관</text>
<text x="142" y="146" font-size="10" fill="#e2e8f0" class="k3">지하철에서 한 손으로 쓴다</text>
<text x="160" y="172" font-size="9" fill="#94a3b8" text-anchor="middle">조사 결과로 만든 대표 사용자</text>
