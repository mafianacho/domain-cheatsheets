<g class="k3"><line x1="108" y1="128" x2="188" y2="128" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><line x1="108" y1="140" x2="152" y2="140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/></g>
