<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="와이어프레임: 색과 꾸밈 없이 화면에 무엇이 어디 놓이는지만 그린 설계도">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,6%{opacity:0;transform:translateY(-10px)}12%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k1{animation:k1 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,22%{opacity:0;transform:translateY(-10px)}28%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k2{animation:k2 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,38%{opacity:0;transform:translateY(-10px)}44%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k3{animation:k3 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,54%{opacity:0;transform:translateY(-10px)}60%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}.k4{animation:k4 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
