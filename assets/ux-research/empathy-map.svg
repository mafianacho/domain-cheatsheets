<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="공감 지도: 사용자가 말하고, 생각하고, 행동하고, 느끼는 것을 네 칸으로 정리한 표">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,10%{opacity:0}14%,92%{opacity:1}100%{opacity:0}}.k1{animation:k1 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,30%{opacity:0}34%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,50%{opacity:0}54%,92%{opacity:1}100%{opacity:0}}.k3{animation:k3 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,70%{opacity:0}74%,92%{opacity:1}100%{opacity:0}}.k4{animation:k4 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Empathy Map · 공감 지도</text>
<rect x="16" y="40" width="124" height="62" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="78" y="60" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">말한다</text>
<text x="78" y="84" font-size="10" fill="#e2e8f0" text-anchor="middle" class="k1">너무 복잡해요</text>
<rect x="180" y="40" width="124" height="62" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
<text x="242" y="60" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700">생각한다</text>
<text x="242" y="84" font-size="10" fill="#e2e8f0" text-anchor="middle" class="k2">내가 틀렸나?</text>
<rect x="16" y="122" width="124" height="62" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
<text x="78" y="142" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700">행동한다</text>
<text x="78" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" class="k3">뒤로 가기를 누른다</text>
<rect x="180" y="122" width="124" height="62" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="242" y="142" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">느낀다</text>
<text x="242" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" class="k4">답답하다</text>
<circle cx="160" cy="112" r="17" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<circle cx="155" cy="108" r="2" fill="#e2e8f0"/>
<circle cx="165" cy="108" r="2" fill="#e2e8f0"/>
<path d="M153 117 Q160 122 167 117" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
