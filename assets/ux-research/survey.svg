<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="설문조사: 많은 사람에게 같은 질문을 해서 선택 비율을 숫자로 모으는 조사">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,10%{transform:scaleX(0)}34%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k1{animation:k1 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k2{0%,34%{opacity:0}38%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,26%{transform:scaleX(0)}50%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k3{animation:k3 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k4{0%,50%{opacity:0}54%,92%{opacity:1}100%{opacity:0}}.k4{animation:k4 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,42%{transform:scaleX(0)}66%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.k5{animation:k5 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k6{0%,66%{opacity:0}70%,92%{opacity:1}100%{opacity:0}}.k6{animation:k6 4.5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">Survey · 설문조사</text>
<text x="304" y="28" font-size="9" fill="#94a3b8" text-anchor="end">숫자는 예시</text>
<text x="16" y="56" font-size="11" fill="#e2e8f0" font-weight="700">Q. 앱을 얼마나 자주 쓰나요?</text>
<text x="16" y="89" font-size="10" fill="#e2e8f0">매일</text>
<rect x="86" y="74" width="160" height="22" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="86" y="74" width="88" height="22" rx="5" fill="#38bdf8" class="k1"/>
<text x="254" y="89" font-size="11" fill="#e2e8f0" font-weight="700" class="k2">55%</text>
<text x="16" y="119" font-size="10" fill="#e2e8f0">주 1~2회</text>
<rect x="86" y="104" width="160" height="22" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="86" y="104" width="48" height="22" rx="5" fill="#38bdf8" class="k3"/>
<text x="254" y="119" font-size="11" fill="#e2e8f0" font-weight="700" class="k4">30%</text>
<text x="16" y="149" font-size="10" fill="#e2e8f0">거의 안 씀</text>
<rect x="86" y="134" width="160" height="22" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="86" y="134" width="24" height="22" rx="5" fill="#f59e0b" class="k5"/>
<text x="254" y="149" font-size="11" fill="#e2e8f0" font-weight="700" class="k6">15%</text>
<text x="160" y="184" font-size="10" fill="#94a3b8" text-anchor="middle">많은 사람 → 같은 질문 → 비율</text>
