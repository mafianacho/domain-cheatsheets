<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="근접효과: 입이 마이크에 다가갈수록 저음 막대가 커지는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes mo{0,100%{transform:translateX(0)}50%{transform:translateX(56px)}}@keyframes lo{0,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}.mo{animation:mo 4s ease-in-out infinite}.lo{transform-box:fill-box;transform-origin:bottom;transform:scaleY(.3);animation:lo 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">근접효과: 마이크에 가까울수록 저음이 커짐</text><g class="mo"><circle cx="44" cy="86" r="16" fill="#cbd5e1"/><rect x="36" y="96" width="16" height="6" rx="2" fill="#94a3b8"/><path d="M52 84 Q58 86 52 90" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="130" class="s c">목소리</text></g><g transform="translate(172 86) rotate(-90) scale(1.3)"><rect x="-8" y="-32" width="16" height="26" rx="8" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><rect x="-5" y="-6" width="10" height="26" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/></g><text x="172" y="130" class="s c">마이크</text><rect x="230" y="56" width="14" height="80" rx="2" fill="#334155"/><rect x="250" y="56" width="14" height="80" rx="2" fill="#334155"/><rect x="270" y="56" width="14" height="80" rx="2" fill="#334155"/><rect x="230" y="56" width="14" height="80" rx="2" fill="#f59e0b" class="lo"/><rect x="250" y="86" width="14" height="50" rx="2" fill="#38bdf8"/><rect x="270" y="96" width="14" height="40" rx="2" fill="#38bdf8"/><text x="237" y="150" class="s c">저음</text><text x="257" y="150" class="s c">중음</text><text x="277" y="150" class="s c">고음</text><text x="160" y="190" class="s c">멀리 있을 때는 얇고, 입을 대면 먹먹하게 두꺼워짐</text>
</svg>
