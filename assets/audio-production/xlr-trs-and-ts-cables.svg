<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="XLR, TRS, TS 단자 세 가지를 순서대로 강조해 어디에 쓰는지 보여주는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes h0{0,0%{stroke:#475569}3%{stroke:#f59e0b}30%{stroke:#f59e0b}33,100%{stroke:#475569}}.h0{animation:h0 6s steps(1,end) infinite}@keyframes h1{0,33%{stroke:#475569}36%{stroke:#f59e0b}63%{stroke:#f59e0b}66,100%{stroke:#475569}}.h1{animation:h1 6s steps(1,end) infinite}@keyframes h2{0,66%{stroke:#475569}69%{stroke:#f59e0b}96%{stroke:#f59e0b}99,100%{stroke:#475569}}.h2{animation:h2 6s steps(1,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">케이블 단자 세 가지</text><circle cx="44" cy="52" r="18" fill="#1e293b" stroke="#475569" stroke-width="2" class="h0"/><circle cx="37" cy="48" r="2.5" fill="#94a3b8"/><circle cx="51" cy="48" r="2.5" fill="#94a3b8"/><circle cx="44" cy="58" r="2.5" fill="#94a3b8"/><rect x="22" y="90" width="30" height="16" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2" class="h1"/><rect x="52" y="93" width="22" height="10" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5"/><line x1="60" y1="93" x2="60" y2="103" stroke="#f59e0b" stroke-width="2.5"/><line x1="67" y1="93" x2="67" y2="103" stroke="#f59e0b" stroke-width="2.5"/><rect x="22" y="136" width="30" height="16" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2" class="h2"/><rect x="52" y="139" width="22" height="10" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5"/><line x1="62" y1="139" x2="62" y2="149" stroke="#f59e0b" stroke-width="2.5"/><text x="100" y="44" class="m b am">XLR</text><text x="100" y="57" class="s">마이크 · 믹서 연결 (밸런스)</text><text x="100" y="69" class="s sk">핀 구멍 3개</text><text x="100" y="90" class="m b am">TRS</text><text x="100" y="103" class="s">모니터 · 키보드 등 (밸런스)</text><text x="100" y="115" class="s sk">줄무늬 2개</text><text x="100" y="136" class="m b am">TS</text><text x="100" y="149" class="s">기타 · 베이스 (언밸런스)</text><text x="100" y="161" class="s sk">줄무늬 1개</text><text x="160" y="190" class="s c">밸런스 = 노이즈에 강함 · 언밸런스 = 짧게 쓰기</text>
