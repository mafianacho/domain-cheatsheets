<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="모니터 믹스: 객석용 메인 믹스와 보컬이 자기 소리를 크게 받는 별도의 모니터 믹스를 막대로 비교하는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes m1{0,100%{transform:scaleY(1)}25%{transform:scaleY(.55)}50%{transform:scaleY(.8)}75%{transform:scaleY(.4)}}@keyframes m2{0,100%{transform:scaleY(1)}30%{transform:scaleY(1.4)}60%{transform:scaleY(.7)}}.m1{transform-box:fill-box;transform-origin:bottom;animation:m1 4s ease-in-out infinite}.m2{transform-box:fill-box;transform-origin:bottom;animation:m2 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">모니터 믹스: 연주자용으로 따로 섞은 소리</text><rect x="16" y="34" width="142" height="132" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="162" y="34" width="142" height="132" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="24" y="52" class="s b sk">메인 믹스(객석)</text><text x="170" y="52" class="s b am">보컬 모니터 믹스</text><rect x="36" y="88" width="20" height="50" rx="3" fill="#38bdf8" opacity="0.85"/><text x="46" y="154" class="s c">보컬</text><rect x="74" y="84" width="20" height="54" rx="3" fill="#38bdf8" opacity="0.85"/><text x="84" y="154" class="s c">기타</text><rect x="112" y="92" width="20" height="46" rx="3" fill="#38bdf8" opacity="0.85"/><text x="122" y="154" class="s c">드럼</text><rect x="182" y="72" width="20" height="66" rx="3" fill="#f59e0b"/><text x="192" y="154" class="s c">보컬</text><rect x="220" y="108" width="20" height="30" rx="3" fill="#f59e0b" class="m2"/><text x="230" y="154" class="s c">기타</text><rect x="258" y="98" width="20" height="40" rx="3" fill="#f59e0b" class="m1"/><text x="268" y="154" class="s c">드럼</text><text x="160" y="190" class="s c">같은 연주도 사람마다 필요한 소리가 달라서 따로 섞음</text>
</svg>
