<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="인이어 모니터: 믹서에서 송신기를 거쳐 전파가 벨트 수신기로 가고 연주자 귀의 이어폰으로 들어가는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}.fl{stroke-dasharray:4 5;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-27}}@keyframes ar{0%{transform:scale(.6);opacity:1}70,100%{transform:scale(1.4);opacity:0}}.ar{transform-box:fill-box;transform-origin:left center;animation:ar 3s ease-out infinite}.a2{animation-delay:-1.5s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">인이어 모니터: 내 귀에 꽂는 개인 모니터</text><rect x="16" y="64" width="52" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="42" y="88" class="s c b">믹서</text><text x="42" y="120" class="s c">AUX로 내보냄</text><line x1="68" y1="84" x2="92" y2="84" stroke="#38bdf8" stroke-width="2.5" class="fl"/><rect x="92" y="64" width="52" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="118" y="88" class="s c b">송신기</text><path d="M154 74 Q164 84 154 94" stroke="#f59e0b" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" class="ar"/><path d="M154 74 Q164 84 154 94" stroke="#f59e0b" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" class="ar a2"/><rect x="176" y="70" width="36" height="28" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="194" y="88" class="s c b">수신기</text><text x="194" y="112" class="s c">벨트에 찬다</text><line x1="212" y1="84" x2="246" y2="84" stroke="#38bdf8" stroke-width="2.5" class="fl"/><circle cx="268" cy="90" r="20" fill="#cbd5e1"/><circle cx="250" cy="90" r="5" fill="#f59e0b"/><rect x="256" y="76" width="10" height="8" rx="2" fill="#0f172a" opacity="0.0"/><text x="268" y="128" class="s c">내 귀에만</text><text x="160" y="190" class="s c">스피커 없이 귀로 직접 들어서 무대 소리가 작아지고 하울링 위험도 줄어듦</text>
</svg>
