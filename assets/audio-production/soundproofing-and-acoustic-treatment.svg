<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="차음은 두꺼운 벽이 소리를 막아 밖으로 새지 않게 하고, 흡음은 벽의 흡음재가 반사를 줄이는 비교 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes go{0%{transform:translateX(0);opacity:0}10%{opacity:1}55%{transform:translateX(52px);opacity:1}62,100%{transform:translateX(56px);opacity:0}}@keyframes bk{0,55%{transform:translateX(0);opacity:0}58%{transform:translateX(0);opacity:.7}100%{transform:translateX(-30px);opacity:0}}.go{animation:go 3s ease-out infinite}.bk{animation:bk 3s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">차음 vs 흡음</text><rect x="16" y="34" width="142" height="140" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="162" y="34" width="142" height="140" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="24" y="52" class="s b am">차음: 새는 소리 막기</text><text x="170" y="52" class="s b sk">흡음: 방 안 울림 줄이기</text><rect x="126" y="62" width="24" height="90" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/><line x1="130" y1="70" x2="146" y2="62" stroke="#94a3b8" stroke-width="1"/><line x1="130" y1="82" x2="146" y2="74" stroke="#94a3b8" stroke-width="1"/><line x1="130" y1="94" x2="146" y2="86" stroke="#94a3b8" stroke-width="1"/><line x1="130" y1="106" x2="146" y2="98" stroke="#94a3b8" stroke-width="1"/><line x1="130" y1="118" x2="146" y2="110" stroke="#94a3b8" stroke-width="1"/><line x1="130" y1="130" x2="146" y2="122" stroke="#94a3b8" stroke-width="1"/><line x1="130" y1="142" x2="146" y2="134" stroke="#94a3b8" stroke-width="1"/><circle cx="40" cy="106" r="7" fill="#f59e0b"/><g class="go"><line x1="52" y1="106" x2="74" y2="106" stroke="#f59e0b" stroke-width="2.5"/><polygon points="74,101 82,106 74,111" fill="#f59e0b"/></g><text x="76" y="166" class="s c">밖으로 안 새어나감</text><rect x="278" y="62" width="14" height="90" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/><path d="M278 66 L270 70 L278 76 L270 82 L278 88 L270 94 L278 100 L270 106 L278 112 L270 118 L278 124 L270 130 L278 136 L270 142 L278 148" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="186" cy="106" r="7" fill="#38bdf8"/><g class="go"><line x1="198" y1="106" x2="220" y2="106" stroke="#38bdf8" stroke-width="2.5"/><polygon points="220,101 228,106 220,111" fill="#38bdf8"/></g><g class="bk"><line x1="262" y1="106" x2="240" y2="106" stroke="#94a3b8" stroke-width="2"/><polygon points="240,101 232,106 240,111" fill="#94a3b8"/></g><text x="224" y="166" class="s c">반사가 줄어 또렷함</text><text x="160" y="190" class="s c">차음은 벽·문 구조, 흡음은 패널·스펀지 같은 마감재</text>
</svg>
