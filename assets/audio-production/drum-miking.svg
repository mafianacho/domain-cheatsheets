<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="드럼 마이킹: 위에서 본 드럼 세트에서 킥, 스네어, 탐, 오버헤드 위치에 마이크 점이 차례로 깜빡이는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes pk{0,25%{transform:scale(1);opacity:.0}32.5%{transform:scale(2.4);opacity:.9}40,100%{transform:scale(3.2);opacity:0}}.pk{transform-box:fill-box;transform-origin:center;opacity:0;animation:pk 4s ease-out infinite}@keyframes psn{0,45%{transform:scale(1);opacity:.0}52.5%{transform:scale(2.4);opacity:.9}60,100%{transform:scale(3.2);opacity:0}}.psn{transform-box:fill-box;transform-origin:center;opacity:0;animation:psn 4s ease-out infinite}@keyframes ptm{0,65%{transform:scale(1);opacity:.0}72.5%{transform:scale(2.4);opacity:.9}80,100%{transform:scale(3.2);opacity:0}}.ptm{transform-box:fill-box;transform-origin:center;opacity:0;animation:ptm 4s ease-out infinite}@keyframes poh{0,85%{transform:scale(1);opacity:.0}92.5%{transform:scale(2.4);opacity:.9}100,100%{transform:scale(3.2);opacity:0}}.poh{transform-box:fill-box;transform-origin:center;opacity:0;animation:poh 4s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">드럼 마이킹: 부위마다 마이크를 따로 세움</text><circle cx="160" cy="142" r="20" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="116" cy="112" r="13" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="84" cy="112" r="10" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="140" cy="84" r="11" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="170" cy="84" r="11" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="212" cy="118" r="15" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="84" cy="66" r="14" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/><circle cx="236" cy="66" r="14" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/><circle cx="160" cy="128" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5" class="pk"/><circle cx="160" cy="128" r="4" fill="#f59e0b"/><circle cx="116" cy="98" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5" class="psn"/><circle cx="116" cy="98" r="4" fill="#f59e0b"/><circle cx="155" cy="68" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5" class="ptm"/><circle cx="155" cy="68" r="4" fill="#f59e0b"/><circle cx="84" cy="62" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5" class="poh"/><circle cx="84" cy="62" r="4" fill="#f59e0b"/><circle cx="236" cy="62" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5" class="poh"/><circle cx="236" cy="62" r="4" fill="#f59e0b"/><text x="160" y="176" class="s c">킥(베이스 드럼)</text><text x="100" y="140" class="s c">스네어</text><text x="188" y="72" class="s">탐</text><text x="84" y="44" class="s c">오버헤드</text><text x="236" y="44" class="s c">오버헤드</text><text x="160" y="190" class="s c">앰버 점 = 마이크 위치 · 위에서 내려다본 모습</text>
</svg>
