<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="패닝: 팬 노브를 돌리면 기타 소리 점이 왼쪽 스피커에서 오른쪽 스피커로 움직이는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes kn{0,100%{transform:rotate(-55deg)}50%{transform:rotate(55deg)}}@keyframes dt{0,100%{transform:translateX(0)}50%{transform:translateX(168px)}}.kn{animation:kn 4s ease-in-out infinite}.dt{animation:dt 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
