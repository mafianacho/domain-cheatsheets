<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="레이턴시: 연주하는 순간과 내 귀에 소리가 들리는 순간 사이의 간격을 시간 축에서 보여주는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes ph{0%{transform:translateX(0)}100%{transform:translateX(190px)}}.ph{animation:ph 4s linear infinite}@keyframes f1{0,10%{opacity:0}12%{opacity:1}90%{opacity:1}100%{opacity:0}}@keyframes f2{0,38%{opacity:0}40%{opacity:1}90%{opacity:1}100%{opacity:0}}.f1{animation:f1 4s steps(1,end) infinite}.f2{animation:f2 4s steps(1,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">레이턴시: 소리가 들리기까지의 지연</text><text x="304" y="66" class="s b am e">치는 순간</text><text x="304" y="128" class="s b sk e">들리는 때</text><line x1="24" y1="80" x2="296" y2="80" stroke="#475569" stroke-width="1.2"/><line x1="24" y1="142" x2="296" y2="142" stroke="#475569" stroke-width="1.2"/><circle cx="80" cy="80" r="9" fill="#f59e0b" class="f1"/><circle cx="172" cy="142" r="9" fill="#38bdf8" class="f2"/><line x1="80" y1="90" x2="80" y2="156" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/><line x1="172" y1="152" x2="172" y2="156" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/><line x1="80" y1="158" x2="172" y2="158" stroke="#f59e0b" stroke-width="2"/><line x1="80" y1="154" x2="80" y2="162" stroke="#f59e0b" stroke-width="2"/><line x1="172" y1="154" x2="172" y2="162" stroke="#f59e0b" stroke-width="2"/><text x="126" y="174" class="s c">이만큼 늦게 들림</text><g class="ph"><line x1="40" y1="56" x2="40" y2="150" stroke="#e2e8f0" stroke-width="1.5"/></g><text x="160" y="190" class="s c">짧을수록 좋음 · 버퍼(처리 단위)를 줄이면 짧아지지만 부담이 커짐</text>
</svg>
