<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="팬텀 파워: 믹서의 48V 버튼에서 XLR 케이블을 따라 전기가 콘덴서 마이크로 흐르는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes bt{0,45%{opacity:1}50,100%{opacity:.35}}.fl{stroke-dasharray:4 5;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-27}}.bt{animation:bt 3s steps(1,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">팬텀 파워: 믹서가 케이블로 보내는 마이크 전원</text><rect x="16" y="56" width="100" height="72" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="28" y="70" width="38" height="22" rx="5" fill="#f59e0b" class="bt"/><text x="47" y="85" class="k">48V</text><text x="66" y="118" class="s c">믹서 · 인터페이스</text><path d="M116 92 L246 92" stroke="#475569" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="116" y1="92" x2="246" y2="92" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 5" class="fl"/><g transform="translate(252 96) scale(1.4)"><rect x="-8" y="-32" width="16" height="26" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/><line x1="-5" y1="-26" x2="5" y2="-26" stroke="#94a3b8" stroke-width="1"/><line x1="-5" y1="-21" x2="5" y2="-21" stroke="#94a3b8" stroke-width="1"/><line x1="-5" y1="-16" x2="5" y2="-16" stroke="#94a3b8" stroke-width="1"/><line x1="-5" y1="-11" x2="5" y2="-11" stroke="#94a3b8" stroke-width="1"/><rect x="-5" y="-6" width="10" height="26" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/></g><text x="252" y="38" class="s c">콘덴서 마이크</text><text x="180" y="112" class="s c">XLR 케이블</text><text x="252" y="148" class="s c">전기가 와야 작동</text><text x="160" y="190" class="s c">다이내믹 마이크는 필요 없음 · 연결 전에 끄는 것이 안전</text>
</svg>
