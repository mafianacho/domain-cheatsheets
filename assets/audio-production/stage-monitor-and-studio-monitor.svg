<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="무대 모니터는 연주자를 향해 비스듬히 놓여 소리를 보내고, 스튜디오 모니터는 두 스피커가 듣는 사람과 삼각형을 이루는 비교 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}.fl{stroke-dasharray:4 5;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-27}}@keyframes ar{0%{transform:scale(.6);opacity:.9}80,100%{transform:scale(1.5);opacity:0}}.ar{transform-box:fill-box;transform-origin:left center;animation:ar 3s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">모니터 스피커 두 가지</text><rect x="16" y="34" width="142" height="140" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="162" y="34" width="142" height="140" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="24" y="52" class="s b am">무대 모니터(웨지)</text><text x="170" y="52" class="s b sk">스튜디오 모니터</text><polygon points="26,134 72,134 72,108 26,122" fill="#334155" stroke="#f59e0b" stroke-width="2"/><circle cx="36" cy="128" r="3" fill="#0f172a"/><path d="M80 98 Q92 112 80 126" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" class="ar"/><path d="M88 90 Q104 112 88 134" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><circle cx="130" cy="100" r="9" fill="#cbd5e1"/><rect x="122" y="110" width="16" height="26" rx="5" fill="#38bdf8"/><text x="130" y="152" class="s c">연주자</text><rect x="176" y="70" width="24" height="36" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><rect x="262" y="70" width="24" height="36" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><circle cx="188" cy="94" r="7" fill="#334155" stroke="#475569" stroke-width="1.2"/><circle cx="274" cy="94" r="7" fill="#334155" stroke="#475569" stroke-width="1.2"/><circle cx="188" cy="78" r="3" fill="#334155"/><circle cx="274" cy="78" r="3" fill="#334155"/><circle cx="231" cy="138" r="9" fill="#cbd5e1"/><line x1="190" y1="108" x2="228" y2="130" stroke="#38bdf8" stroke-width="2" class="fl"/><line x1="274" y1="108" x2="234" y2="130" stroke="#38bdf8" stroke-width="2" class="fl"/><text x="231" y="160" class="s c">듣는 사람</text><text x="160" y="190" class="s c">무대: 연주자 확인용 · 스튜디오: 믹스를 정확히 듣는 용</text>
</svg>
