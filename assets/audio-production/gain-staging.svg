<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="게인 스테이징: 마이크, 프리앰프, 믹서, 앰프 네 단계의 레벨 미터가 모두 깨짐 선 아래에서 움직이는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes m1{0,100%{transform:scaleY(.72)}40%{transform:scaleY(.6)}70%{transform:scaleY(.78)}}.mt{transform-box:fill-box;transform-origin:bottom;animation:m1 4s ease-in-out infinite}.d2{animation-delay:-.7s}.d3{animation-delay:-1.4s}.d4{animation-delay:-2.1s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">게인 스테이징: 각 단계 레벨을 알맞게 맞추기</text><rect x="18" y="44" width="32" height="86" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/><rect x="24" y="62" width="20" height="62" rx="3" fill="#38bdf8" class="mt"/><rect x="24" y="50" width="20" height="8" rx="2" fill="#f87171"/><text x="34" y="146" class="s c">마이크</text><line x1="54" y1="87" x2="92" y2="87" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="96" y="44" width="32" height="86" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/><rect x="102" y="62" width="20" height="62" rx="3" fill="#f59e0b" class="mt d2"/><rect x="102" y="50" width="20" height="8" rx="2" fill="#f87171"/><text x="112" y="146" class="s c">프리앰프</text><line x1="132" y1="87" x2="170" y2="87" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="174" y="44" width="32" height="86" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/><rect x="180" y="62" width="20" height="62" rx="3" fill="#38bdf8" class="mt d3"/><rect x="180" y="50" width="20" height="8" rx="2" fill="#f87171"/><text x="190" y="146" class="s c">믹서</text><line x1="210" y1="87" x2="248" y2="87" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="252" y="44" width="32" height="86" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/><rect x="258" y="62" width="20" height="62" rx="3" fill="#38bdf8" class="mt d4"/><rect x="258" y="50" width="20" height="8" rx="2" fill="#f87171"/><text x="268" y="146" class="s c">앰프</text><text x="16" y="40" class="s">빨간 칸에 닿으면 깨짐</text><text x="304" y="40" class="s e">남겨둔 여유 = 헤드룸</text><text x="160" y="190" class="s c">마이크부터 앰프까지 모든 단계가 빨간 칸 아래</text>
</svg>
