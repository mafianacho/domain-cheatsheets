<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="다이내믹 마이크는 튼튼하고 전원이 필요 없고, 콘덴서 마이크는 섬세하고 팬텀 파워가 필요하다는 비교 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes rg{0%{transform:scale(.8);opacity:.9}80,100%{transform:scale(1.7);opacity:0}}.rg{transform-box:fill-box;transform-origin:center;animation:rg 3s ease-out infinite}.r2{animation-delay:-1.5s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">마이크 두 종류</text><rect x="16" y="36" width="138" height="130" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="166" y="36" width="138" height="130" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><g transform="translate(85 102) scale(1.3)"><rect x="-8" y="-32" width="16" height="26" rx="8" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><line x1="-5" y1="-26" x2="5" y2="-26" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-21" x2="5" y2="-21" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-16" x2="5" y2="-16" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-11" x2="5" y2="-11" stroke="#475569" stroke-width="1"/><rect x="-5" y="-6" width="10" height="26" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/></g><g transform="translate(235 102) scale(1.3)"><rect x="-8" y="-32" width="16" height="26" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/><line x1="-5" y1="-26" x2="5" y2="-26" stroke="#94a3b8" stroke-width="1"/><line x1="-5" y1="-21" x2="5" y2="-21" stroke="#94a3b8" stroke-width="1"/><line x1="-5" y1="-16" x2="5" y2="-16" stroke="#94a3b8" stroke-width="1"/><line x1="-5" y1="-11" x2="5" y2="-11" stroke="#94a3b8" stroke-width="1"/><rect x="-5" y="-6" width="10" height="26" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/></g><circle cx="85" cy="77" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" class="rg"/><circle cx="85" cy="77" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" class="rg r2"/><circle cx="235" cy="77" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5" class="rg"/><circle cx="235" cy="77" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5" class="rg r2"/><text x="85" y="54" class="m b c">다이내믹</text><text x="235" y="54" class="m b c">콘덴서</text><text x="85" y="148" class="s c">튼튼 · 전원 불필요</text><text x="235" y="148" class="s c">섬세 · 팬텀 파워 필요</text><text x="85" y="160" class="s c">합주실 보컬에 흔함</text><text x="235" y="160" class="s c">녹음실·유튜브 녹음</text><text x="160" y="190" class="s c">소리를 받아 전기 신호로 바꾸는 방식이 다름</text>
