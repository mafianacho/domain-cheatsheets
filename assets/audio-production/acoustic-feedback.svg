<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="하울링: 마이크에서 앰프, 스피커로 나간 소리가 다시 마이크로 되돌아와 빨간 선을 따라 계속 도는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes od{100%{offset-distance:100%}}.dt{offset-path:path('M70 84 L232 84 L232 150 L50 150 L50 118');offset-distance:0%;animation:od 4s linear infinite}@keyframes rg{0%{transform:scale(.6);opacity:.9}70,100%{transform:scale(2.2);opacity:0}}.rg{transform-box:fill-box;transform-origin:center;animation:rg 2s ease-out infinite}.r2{animation-delay:-1s}.fl{stroke-dasharray:4 5;animation:fl 4s linear infinite}@keyframes fl{to{stroke-dashoffset:-36}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">하울링(피드백): 소리가 돌고 돌며 계속 커짐</text><g transform="translate(50 114) scale(1.0)"><rect x="-8" y="-32" width="16" height="26" rx="8" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><line x1="-5" y1="-26" x2="5" y2="-26" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-21" x2="5" y2="-21" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-16" x2="5" y2="-16" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-11" x2="5" y2="-11" stroke="#475569" stroke-width="1"/><rect x="-5" y="-6" width="10" height="26" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/></g><line x1="70" y1="84" x2="112" y2="84" stroke="#38bdf8" stroke-width="2.5" class="fl"/><rect x="112" y="64" width="60" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="142" y="88" class="s c b">앰프</text><line x1="172" y1="84" x2="214" y2="84" stroke="#38bdf8" stroke-width="2.5" class="fl"/><rect x="214" y="56" width="36" height="56" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><circle cx="232" cy="90" r="11" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="232" cy="70" r="4" fill="#334155" stroke="#475569" stroke-width="1.2"/><circle cx="232" cy="90" r="12" fill="none" stroke="#f87171" stroke-width="2" class="rg"/><circle cx="232" cy="90" r="12" fill="none" stroke="#f87171" stroke-width="2" class="rg r2"/><path d="M232 112 L232 150 L50 150 L50 120" stroke="#f87171" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" class="fl" stroke-dasharray="4 5"/><text x="142" y="168" class="s c">스피커 소리가 마이크로 다시 들어옴</text><circle class="dt" cx="0" cy="0" r="5" fill="#e2e8f0"/><text x="160" y="190" class="s c">대처: 마이크는 스피커 뒤로 · 게인 낮추기 · 안 쓰는 마이크 끄기</text>
</svg>
