<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="데시벨: 0 dB가 맨 위이고 마이너스 숫자가 커질수록 조용해지는 소리 크기 미터가 오르내리는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes lv{0,100%{transform:scaleY(.52)}30%{transform:scaleY(.9)}55%{transform:scaleY(.28)}80%{transform:scaleY(.7)}}.lv{transform-box:fill-box;transform-origin:bottom;transform:scaleY(.52);animation:lv 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">데시벨(dB): 소리 크기를 재는 단위</text><rect x="130" y="36" width="30" height="120" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="130" y="36" width="30" height="120" rx="4" fill="#f59e0b" class="lv"/><rect x="130" y="36" width="30" height="12" rx="4" fill="#f87171"/><line x1="160" y1="36" x2="168" y2="36" stroke="#94a3b8" stroke-width="1.2"/><text x="172" y="39" class="s">0 dB</text><line x1="160" y1="51" x2="168" y2="51" stroke="#94a3b8" stroke-width="1.2"/><text x="172" y="54" class="s">-6 dB</text><line x1="160" y1="66" x2="168" y2="66" stroke="#94a3b8" stroke-width="1.2"/><text x="172" y="69" class="s">-12 dB</text><line x1="160" y1="96" x2="168" y2="96" stroke="#94a3b8" stroke-width="1.2"/><text x="172" y="99" class="s">-24 dB</text><line x1="160" y1="156" x2="168" y2="156" stroke="#94a3b8" stroke-width="1.2"/><text x="172" y="159" class="s">-48 dB</text><text x="16" y="60" class="s">위로 갈수록 큼</text><text x="16" y="150" class="s">아래로 갈수록 작음</text><polygon points="30,70 24,80 36,80" fill="#38bdf8"/><polygon points="30,134 24,124 36,124" fill="#38bdf8"/><line x1="30" y1="80" x2="30" y2="124" stroke="#38bdf8" stroke-width="1.5"/><text x="222" y="40" class="s">맨 위 = 한계</text><text x="222" y="100" class="s">마이너스가</text><text x="222" y="112" class="s">클수록 조용</text><text x="160" y="190" class="s c">0 dB가 맨 위 · 숫자가 작아질수록 조용한 소리</text>
</svg>
