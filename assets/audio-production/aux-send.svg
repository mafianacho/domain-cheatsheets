<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="AUX 센드: 보컬과 기타 채널의 메인 출력은 그대로 두고 일부만 갈라져 이펙트와 모니터로 가는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}.fl{stroke-dasharray:4 5;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-27}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">AUX 센드: 소리 일부만 다른 곳으로 갈라 보냄</text><rect x="16" y="46" width="54" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="43" y="65" class="s c">보컬</text><rect x="16" y="88" width="54" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="43" y="107" class="s c">기타</text><line x1="70" y1="61" x2="236" y2="61" stroke="#38bdf8" stroke-width="2.5" class="fl"/><line x1="70" y1="103" x2="236" y2="103" stroke="#38bdf8" stroke-width="2.5" class="fl"/><rect x="236" y="46" width="68" height="72" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="270" y="78" class="s c b">메인</text><text x="270" y="90" class="s c b">출력</text><circle cx="128" cy="61" r="4" fill="#f59e0b"/><circle cx="168" cy="103" r="4" fill="#f59e0b"/><line x1="128" y1="65" x2="128" y2="140" stroke="#f59e0b" stroke-width="2" class="fl"/><line x1="168" y1="107" x2="168" y2="140" stroke="#f59e0b" stroke-width="2" class="fl"/><line x1="128" y1="140" x2="210" y2="140" stroke="#f59e0b" stroke-width="2" class="fl"/><rect x="210" y="126" width="94" height="30" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="257" y="145" class="s c">이펙트 · 모니터</text><text x="16" y="158" class="s">앰버 선 = AUX로</text><text x="16" y="170" class="s">보내는 양만큼만</text><text x="160" y="190" class="s c">메인 소리는 그대로 두고, 일부만 따로 보냄</text>
</svg>
