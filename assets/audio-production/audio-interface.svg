<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="오디오 인터페이스: 마이크와 악기에서 인터페이스를 거쳐 컴퓨터로 소리가 들어가고 모니터로 나오는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}.fl{stroke-dasharray:4 5;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-27}}.fr{stroke-dasharray:4 5;animation:flr 3s linear infinite}@keyframes flr{to{stroke-dashoffset:27}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">오디오 인터페이스: 컴퓨터와 소리 장비를 이어줌</text><rect x="112" y="60" width="96" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><circle cx="130" cy="82" r="7" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="154" cy="82" r="7" fill="#334155" stroke="#475569" stroke-width="1.5"/><circle cx="130" cy="82" r="0.1" fill="#0f172a"/><line x1="130" y1="82" x2="130" y2="77" stroke="#f59e0b" stroke-width="2"/><line x1="154" y1="82" x2="156" y2="77" stroke="#f59e0b" stroke-width="2"/><rect x="176" y="76" width="22" height="12" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="160" y="110" class="s c b">오디오 인터페이스</text><g transform="translate(46 92) scale(1.0)"><rect x="-8" y="-32" width="16" height="26" rx="8" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><line x1="-5" y1="-26" x2="5" y2="-26" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-21" x2="5" y2="-21" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-16" x2="5" y2="-16" stroke="#475569" stroke-width="1"/><line x1="-5" y1="-11" x2="5" y2="-11" stroke="#475569" stroke-width="1"/><rect x="-5" y="-6" width="10" height="26" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/></g><text x="46" y="122" class="s c">마이크 · 악기</text><line x1="70" y1="82" x2="112" y2="82" stroke="#38bdf8" stroke-width="2.5" class="fl"/><rect x="244" y="56" width="56" height="38" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="238" y="94" width="68" height="6" rx="2" fill="#334155"/><text x="272" y="78" class="s c b">DAW</text><line x1="208" y1="74" x2="244" y2="74" stroke="#f59e0b" stroke-width="2.5" class="fl"/><text x="226" y="66" class="s c">USB</text><line x1="160" y1="124" x2="160" y2="146" stroke="#38bdf8" stroke-width="2.5" class="fl"/><rect x="130" y="146" width="60" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="160" y="162" class="s c">모니터·헤드폰</text><text x="272" y="118" class="s c">녹음·재생</text><text x="160" y="190" class="s c">소리를 컴퓨터로 넣고(녹음), 다시 꺼내 듣는(재생) 통로</text>
</svg>
