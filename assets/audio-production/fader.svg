<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="페이더: 슬라이더 손잡이가 위아래로 움직이면 나가는 소리 막대가 함께 커지고 작아지는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes cp{0,100%{transform:translateY(0)}50%{transform:translateY(78px)}}@keyframes lv{0,100%{transform:scaleY(1)}50%{transform:scaleY(.12)}}.cp{animation:cp 4s ease-in-out infinite}.lv{transform-box:fill-box;transform-origin:bottom;animation:lv 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">페이더: 채널 소리 크기를 올리고 내리는 슬라이더</text><rect x="156" y="40" width="8" height="124" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><line x1="146" y1="44" x2="152" y2="44" stroke="#475569" stroke-width="1"/><line x1="146" y1="56" x2="152" y2="56" stroke="#475569" stroke-width="1"/><line x1="146" y1="68" x2="152" y2="68" stroke="#475569" stroke-width="1"/><line x1="146" y1="80" x2="152" y2="80" stroke="#475569" stroke-width="1"/><line x1="146" y1="92" x2="152" y2="92" stroke="#475569" stroke-width="1"/><line x1="146" y1="104" x2="152" y2="104" stroke="#475569" stroke-width="1"/><line x1="146" y1="116" x2="152" y2="116" stroke="#475569" stroke-width="1"/><line x1="146" y1="128" x2="152" y2="128" stroke="#475569" stroke-width="1"/><line x1="146" y1="140" x2="152" y2="140" stroke="#475569" stroke-width="1"/><line x1="146" y1="152" x2="152" y2="152" stroke="#475569" stroke-width="1"/><line x1="142" y1="70" x2="152" y2="70" stroke="#f59e0b" stroke-width="2"/><text x="132" y="73" class="s e">0 = 기본 위치</text><text x="132" y="160" class="s e">맨 아래 = 소리 끔</text><text x="188" y="52" class="s">크게</text><text x="188" y="162" class="s">작게</text><rect x="230" y="44" width="20" height="116" rx="3" fill="#334155"/><rect x="230" y="44" width="20" height="116" rx="3" fill="#38bdf8" class="lv"/><text x="240" y="176" class="s c">나가는 소리</text><rect x="142" y="46" width="36" height="14" rx="3" fill="#f59e0b" class="cp"/><line x1="148" y1="53" x2="172" y2="53" stroke="#0f172a" stroke-width="1.5" class="cp"/><text x="160" y="190" class="s c">손으로 밀면서 채널별 크기를 맞춤</text>
</svg>
