<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="앰프: 기타 케이블이 연결된 콤보 앰프와, 헤드와 캐비닛이 분리된 앰프의 스피커 콘이 진동하는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}.fl{stroke-dasharray:4 5;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-27}}@keyframes cn{0,100%{transform:scale(1)}25%{transform:scale(1.14)}50%{transform:scale(.96)}75%{transform:scale(1.1)}}.spk{transform-box:fill-box;transform-origin:center;animation:cn 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
