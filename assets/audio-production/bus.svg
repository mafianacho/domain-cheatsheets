<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="버스: 킥, 스네어, 탐 세 채널이 드럼 버스로 모였다가 마스터로 흐르는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}.fl{stroke-dasharray:4 5;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-27}}@keyframes f{0,100%{transform:translateY(0)}50%{transform:translateY(14px)}}.f{animation:f 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">버스: 여러 채널을 묶어 한 번에 조절</text><rect x="16" y="44" width="56" height="26" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="44" y="61" class="s c">킥</text><line x1="72" y1="57" x2="130" y2="90" stroke="#38bdf8" stroke-width="2" class="fl"/><rect x="16" y="80" width="56" height="26" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="44" y="97" class="s c">스네어</text><line x1="72" y1="93" x2="130" y2="90" stroke="#38bdf8" stroke-width="2" class="fl"/><rect x="16" y="116" width="56" height="26" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="44" y="133" class="s c">탐</text><line x1="72" y1="129" x2="130" y2="90" stroke="#38bdf8" stroke-width="2" class="fl"/><rect x="130" y="56" width="76" height="68" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="168" y="76" class="s c b">드럼 버스</text><rect x="164" y="84" width="8" height="34" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/><rect x="158" y="92" width="20" height="8" rx="2" fill="#f59e0b" class="f"/><line x1="206" y1="90" x2="240" y2="90" stroke="#38bdf8" stroke-width="2.5" class="fl"/><rect x="240" y="66" width="64" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="272" y="94" class="s c b">마스터</text><text x="160" y="190" class="s c">드럼 3개를 묶으면 페이더 하나로 한꺼번에 조절</text>
</svg>
