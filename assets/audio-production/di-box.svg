<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="DI 박스: 베이스 기타의 짧은 TS 신호가 DI 박스를 거쳐 긴 XLR 케이블로 믹서까지 흐르는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}.fl{stroke-dasharray:4 5;animation:fl 3s linear infinite}@keyframes fl{to{stroke-dashoffset:-27}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">DI 박스: 악기 신호를 긴 케이블용으로 바꿔줌</text><rect x="16" y="80" width="44" height="22" rx="11" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><rect x="58" y="88" width="36" height="6" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><circle cx="34" cy="91" r="3" fill="#38bdf8"/><text x="40" y="122" class="s c">베이스 기타</text><line x1="94" y1="91" x2="114" y2="91" stroke="#94a3b8" stroke-width="2" class="fl"/><text x="100" y="66" class="s c">TS 짧게</text><rect x="114" y="70" width="52" height="44" rx="6" fill="#f59e0b"/><text x="140" y="98" class="k" style="font-size:13px">DI</text><line x1="166" y1="91" x2="232" y2="91" stroke="#38bdf8" stroke-width="2.5" class="fl"/><text x="198" y="66" class="s c">XLR 길게</text><rect x="232" y="60" width="72" height="62" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="240" y="70" width="9" height="36" rx="2" fill="#334155"/><rect x="240" y="82" width="9" height="6" rx="2" fill="#f59e0b"/><rect x="255" y="70" width="9" height="36" rx="2" fill="#334155"/><rect x="255" y="87" width="9" height="6" rx="2" fill="#f59e0b"/><rect x="270" y="70" width="9" height="36" rx="2" fill="#334155"/><rect x="270" y="92" width="9" height="6" rx="2" fill="#f59e0b"/><rect x="285" y="70" width="9" height="36" rx="2" fill="#334155"/><rect x="285" y="82" width="9" height="6" rx="2" fill="#f59e0b"/><text x="268" y="138" class="s c">믹서</text><text x="160" y="190" class="s c">긴 거리도 잡음 적게 · 짧은 TS 선과 긴 XLR 선을 이어줌</text>
</svg>
