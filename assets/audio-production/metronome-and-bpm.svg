<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="메트로놈과 BPM: 막대(추)가 좌우로 흔들리며 네 개의 박 점이 차례로 켜지는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes sw{0,100%{transform:rotate(-24deg)}25%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}75%{transform:rotate(24deg)}}.sw{animation:sw 2s ease-in-out infinite}@keyframes d0{0%{fill:#f59e0b}24%{fill:#f59e0b}25,100%{fill:#334155}}.d0{animation:d0 2s steps(1,end) infinite}@keyframes d1{0,25%{fill:#334155}26%{fill:#f59e0b}49%{fill:#f59e0b}50,100%{fill:#334155}}.d1{animation:d1 2s steps(1,end) infinite}@keyframes d2{0,50%{fill:#334155}51%{fill:#f59e0b}74%{fill:#f59e0b}75,100%{fill:#334155}}.d2{animation:d2 2s steps(1,end) infinite}@keyframes d3{0,75%{fill:#334155}76%{fill:#f59e0b}99%{fill:#f59e0b}100,100%{fill:#334155}}.d3{animation:d3 2s steps(1,end) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">메트로놈과 BPM: 일정한 박자 소리</text><polygon points="116,164 204,164 176,52 144,52" fill="#1e293b" stroke="#475569" stroke-width="2"/><g class="sw" style="transform-origin:160px 160px"><line x1="160" y1="160" x2="160" y2="58" stroke="#94a3b8" stroke-width="3"/><rect x="152" y="78" width="16" height="14" rx="3" fill="#f59e0b"/></g><circle cx="160" cy="160" r="5" fill="#334155" stroke="#475569" stroke-width="1.5"/><text x="16" y="66" class="m b">BPM =</text><text x="16" y="80" class="s">1분에 치는 박 수</text><text x="16" y="112" class="m b am">예: 120 BPM</text><text x="16" y="126" class="s">= 1분에 120박</text><circle cx="232" cy="100" r="8" fill="#334155" stroke="#475569" stroke-width="1.5" class="d0"/><text x="232" y="126" class="s c">1</text><circle cx="254" cy="100" r="8" fill="#334155" stroke="#475569" stroke-width="1.5" class="d1"/><text x="254" y="126" class="s c">2</text><circle cx="276" cy="100" r="8" fill="#334155" stroke="#475569" stroke-width="1.5" class="d2"/><text x="276" y="126" class="s c">3</text><circle cx="298" cy="100" r="8" fill="#334155" stroke="#475569" stroke-width="1.5" class="d3"/><text x="298" y="126" class="s c">4</text><text x="254" y="78" class="s c">4/4박자 한 마디</text><text x="160" y="190" class="s c">숫자가 클수록 빠름 · 합주 전에 BPM부터 맞추기</text>
</svg>
