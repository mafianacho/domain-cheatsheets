<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="하이패스 필터: 왼쪽 낮은 음역의 빨간 막대가 필터 선 아래에서 잘려 작아지는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700;fill:#f59e0b}.s{font-size:9px;fill:#94a3b8}.m{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.k{font-size:9px;font-weight:700;fill:#0f172a;text-anchor:middle}.am{fill:#f59e0b}.sk{fill:#38bdf8}.rd{fill:#f87171}@keyframes cut{0,100%{transform:scaleY(1)}35%{transform:scaleY(.08)}80%{transform:scaleY(.08)}}.cut{transform-box:fill-box;transform-origin:bottom;animation:cut 4s ease-in-out infinite}@keyframes ln{0,100%{opacity:.4}35,80%{opacity:1}}.ln{animation:ln 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="24" class="m b">하이패스 필터(로우컷): 낮은 잡음을 잘라냄</text><rect x="28" y="62" width="22" height="78" rx="2" fill="#f87171" class="cut"/><rect x="62" y="78" width="22" height="62" rx="2" fill="#f87171" class="cut"/><rect x="96" y="96" width="22" height="44" rx="2" fill="#38bdf8"/><rect x="130" y="90" width="22" height="50" rx="2" fill="#38bdf8"/><rect x="164" y="86" width="22" height="54" rx="2" fill="#38bdf8"/><rect x="198" y="98" width="22" height="42" rx="2" fill="#38bdf8"/><rect x="232" y="104" width="22" height="36" rx="2" fill="#38bdf8"/><rect x="266" y="112" width="22" height="28" rx="2" fill="#38bdf8"/><rect x="20" y="56" width="76" height="84" rx="3" fill="#f59e0b" opacity="0.12"/><line x1="98" y1="52" x2="98" y2="142" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" class="ln"/><line x1="16" y1="140" x2="304" y2="140" stroke="#475569" stroke-width="1.2"/><text x="58" y="154" class="s c">저음</text><text x="260" y="154" class="s c">고음</text><text x="110" y="62" class="s">이 선 아래는 자름</text><text x="160" y="190" class="s c">보컬·기타에 걸어 쿵 하는 잡소리와 먹먹함을 덜어냄</text>
</svg>
