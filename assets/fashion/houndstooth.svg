<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="하운드투스: 사냥개 이빨처럼 뾰족한 모서리가 이어지는 깨진 체크">
<defs>
<clipPath id="tr"><rect x="16" y="0" width="16" height="16"/></clipPath>
<clipPath id="bl"><rect x="0" y="16" width="16" height="16"/></clipPath>
<g id="tile">
<rect width="32" height="32" fill="#e2e8f0"/>
<rect width="16" height="16" fill="#f59e0b"/>
<g clip-path="url(#tr)" fill="#f59e0b"><polygon points="16,0 24,0 -40,64 -48,64"/><polygon points="32,0 40,0 -24,64 -32,64"/></g>
<g clip-path="url(#bl)" fill="#f59e0b"><polygon points="16,0 24,0 -40,64 -48,64"/><polygon points="32,0 40,0 -24,64 -32,64"/></g>
</g>
<pattern id="hp" width="32" height="32" patternUnits="userSpaceOnUse" x="40" y="30"><use href="#tile"/></pattern>
</defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<rect x="40" y="30" width="160" height="140" fill="url(#hp)"/>
<rect x="40" y="30" width="160" height="140" rx="6" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="222" y="40" width="72" height="72" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<g transform="translate(226 44) scale(2)"><use href="#tile"/></g>
<text x="258" y="130" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">반복 단위 1칸</text>
<text x="258" y="146" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, sans-serif">뾰족한 이빨 모양</text>
</svg>
