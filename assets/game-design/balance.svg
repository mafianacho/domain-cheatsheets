<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="밸런스: 조정 전에는 전사만 너무 강하고, 조정 후에는 세 직업 승률이 비슷해진다">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,18%{transform:scaleY(1.4)}46%,92%{transform:scaleY(1)}100%{transform:scaleY(1.4)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes k2{0%,18%{transform:scaleY(0.55)}46%,92%{transform:scaleY(1)}100%{transform:scaleY(0.55)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes k3{0%,38%{opacity:1}41%{opacity:0}100%{opacity:0}}.k3{animation:k3 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0.0%{opacity:0}51.99%{opacity:0}53.5%{opacity:1}94.0%{opacity:1}95.5%{opacity:0}100.0%{opacity:0}}.k4{animation:k4 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Balance · 밸런스</text>
<line x1="30" y1="160" x2="290" y2="160" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="30" y1="100" x2="262" y2="100" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="292" y="104" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="end">기준선</text>
<rect x="50" y="100" width="44" height="60" rx="4" fill="#f59e0b" class="k1"/>
<rect x="130" y="100" width="44" height="60" rx="4" fill="#38bdf8"/>
<rect x="210" y="100" width="44" height="60" rx="4" fill="#94a3b8" class="k2"/>
<text x="72" y="178" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">전사</text>
<text x="152" y="178" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">마법사</text>
