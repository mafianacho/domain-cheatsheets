<text x="160" y="56" font-family="system-ui, sans-serif" font-size="10.5" fill="#f59e0b" text-anchor="middle" font-weight="700" class="k3">조정 전: 전사만 너무 강함</text>
<text x="160" y="56" font-family="system-ui, sans-serif" font-size="10.5" fill="#38bdf8" text-anchor="middle" font-weight="700" opacity="0" class="k4">조정 후: 셋 다 비슷함</text>
