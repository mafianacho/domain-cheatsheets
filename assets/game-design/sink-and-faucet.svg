<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,100%{transform:scaleY(0.75)}50%{transform:scaleY(1.15)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes k2{0%,4%{opacity:0;transform:translateY(0px)}7%{opacity:1;transform:translateY(0px)}24%{opacity:1;transform:translateY(22px)}28%{opacity:0;transform:translateY(22px)}100%{opacity:0;transform:translateY(0px)}}.k2{animation:k2 5s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,34%{opacity:0;transform:translateY(0px)}37%{opacity:1;transform:translateY(0px)}54%{opacity:1;transform:translateY(22px)}58%{opacity:0;transform:translateY(22px)}100%{opacity:0;transform:translateY(0px)}}.k3{animation:k3 5s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,64%{opacity:0;transform:translateY(0px)}67%{opacity:1;transform:translateY(0px)}84%{opacity:1;transform:translateY(22px)}88%{opacity:0;transform:translateY(22px)}100%{opacity:0;transform:translateY(0px)}}.k4{animation:k4 5s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,6%{opacity:0;transform:translateX(0px)}9%{opacity:1;transform:translateX(0px)}28%{opacity:1;transform:translateX(76px)}32%{opacity:0;transform:translateX(76px)}100%{opacity:0;transform:translateX(0px)}}.k5{animation:k5 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k6{0%,34%{opacity:0;transform:translateX(0px)}37%{opacity:1;transform:translateX(0px)}56%{opacity:1;transform:translateX(76px)}60%{opacity:0;transform:translateX(76px)}100%{opacity:0;transform:translateX(0px)}}.k6{animation:k6 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k7{0%,62%{opacity:0;transform:translateX(0px)}65%{opacity:1;transform:translateX(0px)}84%{opacity:1;transform:translateX(76px)}88%{opacity:0;transform:translateX(76px)}100%{opacity:0;transform:translateX(0px)}}.k7{animation:k7 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
