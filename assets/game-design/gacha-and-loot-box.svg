<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,22%{opacity:0;transform:translateY(22px)}40%,80%{opacity:1;transform:translateY(0px)}92%{opacity:0;transform:translateY(0px)}100%{opacity:0;transform:translateY(22px)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,15%{transform:translateY(0px) rotate(0deg)}32%,78%{transform:translateY(-10px) rotate(-6deg)}92%{transform:translateY(0px) rotate(0deg)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}@keyframes k3{0.0%{opacity:0}45.99%{opacity:0}47.5%{opacity:1}90.0%{opacity:1}91.5%{opacity:0}100.0%{opacity:0}}.k3{animation:k3 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
