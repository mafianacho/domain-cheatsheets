<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="충돌: 두 물체가 겹쳤는지 확인하고, 겹치면 튕김·멈춤·피해 같은 반응을 준다">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,6%{transform:translateY(0px) scale(1,1)}34%{transform:translateY(64px) scale(1,1)}36%{transform:translateY(64px) scale(1.15,.8)}40%{transform:translateY(64px) scale(1,1)}56%{transform:translateY(24px) scale(1,1)}72%{transform:translateY(64px) scale(1,1)}75%{transform:translateY(64px) scale(1.12,.85)}80%{transform:translateY(64px) scale(1,1)}100%{transform:translateY(64px) scale(1,1)}}.k1{animation:k1 5s ease-in infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes k2{0.0%{opacity:0}33.99%{opacity:0}35.5%{opacity:1}44.0%{opacity:1}45.5%{opacity:0}71.99%{opacity:0}73.5%{opacity:1}82.0%{opacity:1}83.5%{opacity:0}100.0%{opacity:0}}.k2{animation:k2 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0.0%{opacity:0}29.99%{opacity:0}31.5%{opacity:1}44.0%{opacity:1}45.5%{opacity:0}69.99%{opacity:0}71.5%{opacity:1}82.0%{opacity:1}83.5%{opacity:0}100.0%{opacity:0}}.k3{animation:k3 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0.0%{opacity:0}43.99%{opacity:0}45.5%{opacity:1}60.0%{opacity:1}61.5%{opacity:0}81.99%{opacity:0}83.5%{opacity:1}96.0%{opacity:1}97.5%{opacity:0}100.0%{opacity:0}}.k4{animation:k4 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
