<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="몰입: 도전이 실력과 비슷하게 올라갈 때 지루하지도 불안하지도 않은 구간">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,6%{opacity:0;transform:translate(0px,0px)}8%{opacity:1;transform:translate(0px,0px)}88%{opacity:1;transform:translate(160px,-110px)}90%{opacity:0;transform:translate(160px,-110px)}100%{opacity:0;transform:translate(0px,0px)}}.k1{animation:k1 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Flow · 몰입</text>
<line x1="40" y1="44" x2="40" y2="172" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="172" x2="210" y2="172" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<polygon points="40,157 200,47 200,73 56,172 40,172" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<text x="16" y="56" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">도전</text>
<text x="210" y="188" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="end">실력</text>
<text x="96" y="68" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">불안 (너무 어려움)</text>
<text x="160" y="152" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">지루함 (너무 쉬움)</text>
<text x="118" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">몰입</text>
<text x="226" y="88" font-family="system-ui, sans-serif" font-size="9.5" fill="#e2e8f0">실력이 늘면</text>
<text x="226" y="104" font-family="system-ui, sans-serif" font-size="9.5" fill="#e2e8f0">도전도 같이</text>
<text x="226" y="120" font-family="system-ui, sans-serif" font-size="9.5" fill="#e2e8f0">올려 준다</text>
<circle cx="40" cy="170" r="6" fill="#f59e0b" opacity="0" class="k1"/>
</svg>
