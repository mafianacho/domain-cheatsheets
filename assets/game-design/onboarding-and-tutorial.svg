<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="온보딩과 튜토리얼: 처음 플레이할 때 조작을 한 번에 하나씩 알려 주는 안내">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,30%{opacity:1}33%{opacity:0}100%{opacity:0}}.k1{animation:k1 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,30%{opacity:1}33%{opacity:0}100%{opacity:0}}.k2{animation:k2 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0.0%{opacity:0}33.99%{opacity:0}35.5%{opacity:1}64.0%{opacity:1}65.5%{opacity:0}100.0%{opacity:0}}.k3{animation:k3 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0.0%{opacity:0}33.99%{opacity:0}35.5%{opacity:1}64.0%{opacity:1}65.5%{opacity:0}100.0%{opacity:0}}.k4{animation:k4 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0.0%{opacity:0}67.99%{opacity:0}69.5%{opacity:1}96.0%{opacity:1}97.5%{opacity:0}100.0%{opacity:0}}.k5{animation:k5 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k6{0.0%{opacity:0}67.99%{opacity:0}69.5%{opacity:1}96.0%{opacity:1}97.5%{opacity:0}100.0%{opacity:0}}.k6{animation:k6 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Onboarding · 온보딩·튜토리얼</text>
<rect x="60" y="38" width="200" height="134" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="148" y="104" width="24" height="30" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
