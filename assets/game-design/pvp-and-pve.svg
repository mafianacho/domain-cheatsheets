<text x="234" y="79" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">다른 사람과 대결</text>
<circle cx="48" cy="112" r="14" fill="#38bdf8"/>
<rect x="106" y="98" width="28" height="28" rx="6" fill="#94a3b8"/>
<circle cx="200" cy="112" r="14" fill="#38bdf8"/>
<circle cx="268" cy="112" r="14" fill="#f59e0b"/>
<text x="48" y="144" font-family="system-ui, sans-serif" font-size="9.5" fill="#e2e8f0" text-anchor="middle">나</text>
<text x="120" y="144" font-family="system-ui, sans-serif" font-size="9.5" fill="#e2e8f0" text-anchor="middle">몬스터</text>
<text x="200" y="144" font-family="system-ui, sans-serif" font-size="9.5" fill="#e2e8f0" text-anchor="middle">나</text>
<text x="268" y="144" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">다른 플레이어</text>
