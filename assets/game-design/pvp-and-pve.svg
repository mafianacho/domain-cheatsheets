<circle cx="250" cy="118" r="3.5" fill="#f59e0b" opacity="0" class="k4"/>
<text x="160" y="186" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Player vs Environment / Player vs Player</text>
