<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="PvP와 PvE: 컴퓨터가 조종하는 적과 싸우는 것과 다른 사람과 싸우는 것의 차이">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,9%{opacity:0;transform:translate(0px,0px)}10%{opacity:1;transform:translate(0px,0px)}40%{opacity:1;transform:translate(38px,0px)}41%{opacity:0;transform:translate(38px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.k1{animation:k1 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,49%{opacity:0;transform:translate(0px,0px)}50%{opacity:1;transform:translate(0px,0px)}80%{opacity:1;transform:translate(-38px,0px)}81%{opacity:0;transform:translate(-38px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.k2{animation:k2 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,9%{opacity:0;transform:translate(0px,0px)}10%{opacity:1;transform:translate(0px,0px)}40%{opacity:1;transform:translate(32px,0px)}41%{opacity:0;transform:translate(32px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.k3{animation:k3 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,49%{opacity:0;transform:translate(0px,0px)}50%{opacity:1;transform:translate(0px,0px)}80%{opacity:1;transform:translate(-32px,0px)}81%{opacity:0;transform:translate(-32px,0px)}100%{opacity:0;transform:translate(0px,0px)}}.k4{animation:k4 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">PvP / PvE · 대전과 협동</text>
<rect x="16" y="40" width="140" height="126" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="164" y="40" width="140" height="126" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="86" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle" font-weight="700">PvE</text>
