<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="무료 게임과 인앱 결제: 무료로 시작해 일부 플레이어만 게임 안에서 결제한다">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,34%{opacity:0}38%,92%{opacity:1}100%{opacity:0}}.k1{animation:k1 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,56%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
