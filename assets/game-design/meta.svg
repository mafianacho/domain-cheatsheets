<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="메타: 패치로 인기 있는 최강 전략이 불꽃 덱에서 얼음 덱으로 바뀐다">
<style>text{font-family:system-ui,sans-serif}@keyframes k1{0%,25%{transform:scaleX(1)}40%,75%{transform:scaleX(0.39)}100%{transform:scaleX(1)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k2{0%,25%{transform:scaleX(1)}40%,75%{transform:scaleX(1.9)}100%{transform:scaleX(1)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k3{0%,25%{transform:scaleX(1)}40%,75%{transform:scaleX(1.5)}100%{transform:scaleX(1)}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k4{0%,36%{opacity:1}39%{opacity:0}100%{opacity:0}}.k4{animation:k4 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0.0%{opacity:0}47.99%{opacity:0}49.5%{opacity:1}94.0%{opacity:1}95.5%{opacity:0}100.0%{opacity:0}}.k5{animation:k5 5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k6{0.0%{opacity:0}31.99%{opacity:0}33.5%{opacity:1}46.0%{opacity:1}47.5%{opacity:0}100.0%{opacity:0}}.k6{animation:k6 5s linear infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
