<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="피사계 심도: 조리개를 열면 선명한 범위가 좁아지고 닫으면 넓어진다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.bd{animation:bd 5s ease-in-out infinite;transform-origin:175px 105px;}@keyframes bd{0%{transform:scaleX(.2)}40%{transform:scaleX(.2)}55%{transform:scaleX(1)}92%{transform:scaleX(1)}100%{transform:scaleX(.2)}}.ir{animation:ir 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}@keyframes ir{0%{transform:scale(1)}40%{transform:scale(1)}55%{transform:scale(.4)}92%{transform:scale(.4)}100%{transform:scale(1)}}.sh{animation:sh 5s linear infinite;}@keyframes sh{0%{opacity:0}51%{opacity:0}55%{opacity:1}92%{opacity:1}96%{opacity:0}100%{opacity:0}}.bl{animation:bl 5s linear infinite;}@keyframes bl{0%{opacity:1}40%{opacity:1}44%{opacity:0}96%{opacity:0}100%{opacity:1}}.la{animation:la 5s linear infinite;}@keyframes la{0%{opacity:1}40%{opacity:1}44%{opacity:0}96%{opacity:0}100%{opacity:1}}.lb{animation:lb 5s linear infinite;}@keyframes lb{0%{opacity:0}51%{opacity:0}55%{opacity:1}92%{opacity:1}96%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
