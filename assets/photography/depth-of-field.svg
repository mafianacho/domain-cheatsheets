<text class="t" x="14" y="24" >피사계 심도 = 초점이 맞아 보이는 깊이</text><line x1="48" y1="105" x2="306" y2="105" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/><rect x="14" y="97" width="30" height="16" rx="3" fill="#e2e8f0"/><circle cx="46" cy="105" r="5" fill="#334155"/><rect class="bd" x="80" y="68" width="190" height="74" rx="4" fill="#38bdf8" fill-opacity=".16" stroke="#38bdf8" stroke-width="2"/><text class="s c" x="175" y="62" >선명한 범위</text><g class="bl"><circle cx="100" cy="105" r="12" fill="#94a3b8" fill-opacity=".16"/><circle cx="100" cy="105" r="17" fill="#94a3b8" fill-opacity=".16"/><circle cx="100" cy="105" r="22" fill="#94a3b8" fill-opacity=".16"/></g><g class="sh" opacity="0"><circle cx="100" cy="105" r="12" fill="#94a3b8"/></g><g class="bl"><circle cx="250" cy="105" r="12" fill="#94a3b8" fill-opacity=".16"/><circle cx="250" cy="105" r="17" fill="#94a3b8" fill-opacity=".16"/><circle cx="250" cy="105" r="22" fill="#94a3b8" fill-opacity=".16"/></g><g class="sh" opacity="0"><circle cx="250" cy="105" r="12" fill="#94a3b8"/></g><circle cx="175" cy="105" r="12" fill="#f59e0b"/><text class="s c" x="100" y="152" >앞</text><text class="s c" x="175" y="152" >초점</text><text class="s c" x="250" y="152" >뒤</text><polygon class="ir" points="303.0,46.0 297.5,55.5 286.5,55.5 281.0,46.0 286.5,36.5 297.5,36.5" fill="#f59e0b"/><text class="s c" x="292" y="72" >조리개</text><g class="la"><text class="b c am" x="160" y="172" >f/1.8: 얕은 심도</text><text class="s c" x="160" y="188" >초점 앞뒤가 흐려져요</text></g><g class="lb" opacity="0"><text class="b c sk" x="160" y="172" >f/11: 깊은 심도</text><text class="s c" x="160" y="188" >앞뒤까지 모두 선명해요</text></g>
