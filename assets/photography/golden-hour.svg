<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="골든아워: 해가 호를 따라 움직이며 낮을 때만 따뜻한 빛이 되는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.sn{animation:sn 6s linear infinite;}@keyframes sn{0%{transform:translate(0.0px,0.0px)}10%{transform:translate(6.4px,-27.8px)}20%{transform:translate(24.8px,-52.9px)}30%{transform:translate(53.6px,-72.8px)}40%{transform:translate(89.8px,-85.6px)}50%{transform:translate(130.0px,-90.0px)}60%{transform:translate(170.2px,-85.6px)}70%{transform:translate(206.4px,-72.8px)}80%{transform:translate(235.2px,-52.9px)}90%{transform:translate(253.6px,-27.8px)}100%{transform:translate(260.0px,0.0px)}}.ga{animation:ga 6s linear infinite;}@keyframes ga{0%{opacity:1}24%{opacity:1}26%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 6s linear infinite;}@keyframes gb{0%{opacity:0}28%{opacity:0}30%{opacity:1}70%{opacity:1}72%{opacity:0}100%{opacity:0}}.gc{animation:gc 6s linear infinite;}@keyframes gc{0%{opacity:0}74%{opacity:0}76%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
