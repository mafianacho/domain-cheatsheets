<text class="t" x="14" y="24" >골든아워 = 해 뜬 직후·해지기 직전</text><rect x="14" y="36" width="292" height="106" rx="8" fill="#1e293b"/><rect x="14" y="88" width="76" height="54" fill="#f59e0b" fill-opacity=".22"/><rect x="230" y="88" width="76" height="54" fill="#f59e0b" fill-opacity=".22"/><text class="s c" x="52" y="74" style="fill:#f59e0b">골든아워</text><text class="s c" x="268" y="74" style="fill:#f59e0b">골든아워</text><path d="M30 142 A130 90 0 0 1 290 142" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/><rect x="14" y="142" width="292" height="6" fill="#475569"/><circle class="sn" cx="30" cy="142" r="11" fill="#f59e0b"/><g class="ga"><text class="b c am" x="160" y="170" >해 뜬 직후: 낮고 따뜻한 빛</text></g><g class="gb" opacity="0"><text class="b c sk" x="160" y="170" >한낮: 강하고 딱딱한 빛, 짙은 그림자</text></g><g class="gc" opacity="0"><text class="b c am" x="160" y="170" >해지기 직전: 낮고 따뜻한 빛</text></g><text class="s c" x="160" y="188" >해가 낮을수록 빛이 부드럽고 노란빛이 돌아요</text>
