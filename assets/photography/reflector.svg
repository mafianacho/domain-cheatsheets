<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="반사판: 빛을 얼굴의 그림자 쪽으로 되튕겨 어두운 쪽이 밝아지는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.dsh{animation:dsh 1.5s linear infinite;}@keyframes dsh{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-14}}.on{animation:on 5s linear infinite;}@keyframes on{0%{opacity:0}49%{opacity:0}52%{opacity:1}100%{opacity:1}}.off{animation:off 5s linear infinite;}@keyframes off{0%{opacity:1}46%{opacity:1}49%{opacity:0}97%{opacity:0}100%{opacity:1}}.loff{animation:loff 5s linear infinite;}@keyframes loff{0%{opacity:1}46%{opacity:1}49%{opacity:0}97%{opacity:0}100%{opacity:1}}.lon{animation:lon 5s linear infinite;}@keyframes lon{0%{opacity:0}49%{opacity:0}52%{opacity:1}100%{opacity:1}}.shd{animation:shd 5s ease-in-out infinite;}@keyframes shd{0%{opacity:.75}46%{opacity:.75}52%{opacity:.12}96%{opacity:.12}100%{opacity:.75}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >반사판 = 빛을 되튕겨 그림자를 채운다</text><g class="on" opacity="1"><rect x="55" y="30" width="9" height="46" rx="3" fill="#e2e8f0" transform="rotate(25 59 53)"/><line class="dsh" x1="292" y1="62" x2="72" y2="52" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8"/><line class="dsh" x1="64" y1="58" x2="148" y2="104" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 8"/><text class="s c" x="42" y="94" >반사판</text></g><line class="dsh" x1="292" y1="66" x2="184" y2="98" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 8"/><circle cx="294" cy="62" r="10" fill="#f59e0b"/><text class="s c" x="294" y="90" >빛</text><circle cx="170" cy="112" r="17" fill="#cbd5e1"/><path class="shd" d="M170 95 A17 17 0 0 0 170 129 Z" fill="#0f172a" opacity=".75"/><text class="s c" x="170" y="150" >얼굴(위에서 본 모습)</text><g class="loff" opacity="0"><text class="b c" x="160" y="178" >반사판 없음: 반대쪽 얼굴이 어두워요</text></g><g class="lon"><text class="b c am" x="160" y="178" >반사판 있음: 그림자 쪽이 밝아져요</text></g>
</svg>
