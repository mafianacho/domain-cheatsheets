<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="여백: 작은 새 주인공 옆의 넓은 빈 공간에 제목 문구 자리가 생기는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.dd{animation:dd 2s linear infinite;}@keyframes dd{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-18}}.tx{animation:tx 3s ease-in-out infinite;}@keyframes tx{0%{opacity:.2}50%{opacity:.9}100%{opacity:.2}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >여백 = 일부러 비워 둔 공간</text><rect x="14" y="34" width="292" height="122" rx="8" fill="#1e293b"/><rect class="dd" x="26" y="44" width="196" height="102" rx="6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/><g class="tx"><rect x="44" y="70" width="140" height="10" rx="3" fill="#e2e8f0"/><rect x="44" y="92" width="110" height="7" rx="3" fill="#94a3b8"/><rect x="44" y="108" width="124" height="7" rx="3" fill="#94a3b8"/></g><text class="s c" x="124" y="138" >여기에 제목·문구</text><ellipse cx="262" cy="118" rx="16" ry="11" fill="#f59e0b"/><circle cx="276" cy="108" r="7" fill="#f59e0b"/><polygon points="282,107 292,110 282,112" fill="#e2e8f0"/><text class="b c" x="160" y="176" >주인공이 작아도 돋보이고, 글 쓸 자리가 생겨요</text><text class="s c" x="160" y="190" >빈 곳이 ‘공백’이 아니라 구도의 일부</text>
</svg>
