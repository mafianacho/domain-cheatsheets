<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="단렌즈는 50mm 고정이고 줌렌즈는 통이 늘어나며 24~70mm로 바뀐다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.ex{animation:ex 5s ease-in-out infinite;}@keyframes ex{0%{transform:translateX(-30px)}20%{transform:translateX(-30px)}50%{transform:translateX(0)}80%{transform:translateX(0)}100%{transform:translateX(-30px)}}.me{animation:me 5s ease-in-out infinite;}@keyframes me{0%{transform:translateX(-14px)}50%{transform:translateX(14px)}100%{transform:translateX(-14px)}}.n0{animation:n0 5s linear infinite;}@keyframes n0{0%{opacity:1}30%{opacity:1}32%{opacity:0}98%{opacity:0}100%{opacity:1}}.n1{animation:n1 5s linear infinite;}@keyframes n1{0%{opacity:0}30%{opacity:0}32%{opacity:1}62%{opacity:1}64%{opacity:0}100%{opacity:0}}.n2{animation:n2 5s linear infinite;}@keyframes n2{0%{opacity:0}62%{opacity:0}64%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >단렌즈 vs 줌렌즈</text><rect x="20" y="62" width="110" height="54" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/><rect x="130" y="70" width="12" height="38" rx="3" fill="#475569"/><text class="b c" x="72" y="94" >50mm</text><rect x="168" y="62" width="76" height="54" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/><rect class="ex" x="244" y="70" width="44" height="38" rx="5" fill="#475569" stroke="#94a3b8" stroke-width="2"/><line x1="196" y1="62" x2="196" y2="116" stroke="#94a3b8" stroke-width="2"/><line x1="206" y1="62" x2="206" y2="116" stroke="#94a3b8" stroke-width="2"/><text class="b c n0 am" x="226" y="145">24mm</text><text class="b c n1 am" opacity="0" x="226" y="145">50mm</text><text class="b c n2 am" opacity="0" x="226" y="145">70mm</text><text class="s c" x="72" y="150" >발로 앞뒤 이동</text><circle class="me" cx="72" cy="164" r="5" fill="#38bdf8"/><text class="s c" x="72" y="186" >단렌즈: 화각 고정, 밝고 가벼움</text><text class="s c" x="226" y="186" >줌렌즈: 링으로 화각 변경</text>
</svg>
