<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="광각에서 망원으로 바꾸면 같은 자리에서 사람이 크게 보이는 장면">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.zm{animation:zm 5s ease-in-out infinite;transform-origin:100px 110px;}@keyframes zm{0%{transform:scale(1)}30%{transform:scale(1)}48%{transform:scale(2.6)}80%{transform:scale(2.6)}95%{transform:scale(1)}100%{transform:scale(1)}}.ga{animation:ga 5s linear infinite;}@keyframes ga{0%{opacity:1}36%{opacity:1}38%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 5s linear infinite;}@keyframes gb{0%{opacity:0}44%{opacity:0}46%{opacity:1}84%{opacity:1}86%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >광각 vs 망원 = 넓게 vs 멀리 크게</text><clipPath id="cp"><rect x="14" y="38" width="172" height="124" rx="8"/></clipPath><g clip-path="url(#cp)"><rect x="14" y="38" width="172" height="124" fill="#334155"/><g class="zm"><polygon points="14,120 50,80 80,108 120,70 160,106 186,86 186,162 14,162" fill="#475569"/><circle cx="30" cy="62" r="8" fill="#f59e0b"/><rect x="26" y="124" width="14" height="22" fill="#94a3b8"/><rect x="156" y="120" width="14" height="26" fill="#94a3b8"/><circle cx="100" cy="100" r="6" fill="#e2e8f0"/><rect x="95" y="106" width="10" height="20" rx="3" fill="#38bdf8"/></g></g><rect x="14" y="38" width="172" height="124" rx="8" fill="none" stroke="#475569" stroke-width="2"/><g class="ga"><text class="m am" x="198" y="80" style="font-weight:700">광각 (24mm)</text><text class="s" x="198" y="98" >한 번에 넓게</text><text class="s" x="198" y="112" >방·풍경에 좋음</text></g><g class="gb" opacity="0"><text class="m am" x="198" y="80" style="font-weight:700">망원 (135mm)</text><text class="s" x="198" y="98" >멀리를 크게</text><text class="s" x="198" y="112" >인물·먼 피사체</text></g><text class="s" x="198" y="140" >서 있는 자리는</text><text class="s" x="198" y="152" >그대로인 경우</text><text class="m sk" x="14" y="184" >숫자 작음 = 광각, 숫자 큼 = 망원</text>
</svg>
