<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="역광: 해가 사람 뒤에 있어 얼굴이 어둡다가 보정으로 얼굴이 밝아지는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.rot{animation:rot 4s linear infinite;transform-origin:104px 90px;}@keyframes rot{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}.fc{animation:fc 5s ease-in-out infinite;}@keyframes fc{0%{fill:#111827}40%{fill:#111827}52%{fill:#94a3b8}90%{fill:#94a3b8}100%{fill:#111827}}.ga{animation:ga 5s linear infinite;}@keyframes ga{0%{opacity:1}44%{opacity:1}46%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 5s linear infinite;}@keyframes gb{0%{opacity:0}52%{opacity:0}54%{opacity:1}94%{opacity:1}96%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >역광 = 빛이 피사체 뒤에서 온다</text><rect x="14" y="38" width="178" height="126" rx="8" fill="#334155"/><g class="rot"><line x1="128.0" y1="90.0" x2="140.0" y2="90.0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="121.0" y1="107.0" x2="129.5" y2="115.5" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="104.0" y1="114.0" x2="104.0" y2="126.0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="87.0" y1="107.0" x2="78.5" y2="115.5" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="80.0" y1="90.0" x2="68.0" y2="90.0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="87.0" y1="73.0" x2="78.5" y2="64.5" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="104.0" y1="66.0" x2="104.0" y2="54.0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="121.0" y1="73.0" x2="129.5" y2="64.5" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/></g><circle cx="104" cy="90" r="18" fill="#f59e0b"/><path d="M60 164 C60 124 80 118 104 118 C128 118 148 124 148 164 Z" fill="#111827" stroke="#f59e0b" stroke-width="2"/><circle class="fc" cx="104" cy="104" r="19" fill="#94a3b8" stroke="#f59e0b" stroke-width="2.5"/><g class="ga" opacity="1"><text class="b am" x="204" y="82" >역광 그대로</text><text class="s" x="204" y="100" >해가 사람 뒤에</text><text class="s" x="204" y="114" >얼굴이 어둡게 나와요</text></g><g class="gb" opacity="0"><text class="b sk" x="204" y="82" >얼굴을 살리기</text><text class="s" x="204" y="100" >노출 +1, 반사판,</text><text class="s" x="204" y="114" >플래시 중 하나로</text><text class="s" x="204" y="128" >앞쪽 빛을 더해요</text></g><text class="m sk" x="14" y="184" >머리카락 둘레의 밝은 테두리 = 림 라이트</text>
</svg>
