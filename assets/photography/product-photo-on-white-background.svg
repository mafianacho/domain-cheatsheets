<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="흰 배경 제품 사진: 배경이 회색에서 순백으로 바뀌는 촬영 결과">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.bgc{animation:bgc 5s ease-in-out infinite;}@keyframes bgc{0%{fill:#94a3b8}45%{fill:#94a3b8}58%{fill:#f8fafc}92%{fill:#f8fafc}100%{fill:#94a3b8}}.dsh{animation:dsh 1.5s linear infinite;}@keyframes dsh{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-14}}.ga{animation:ga 5s linear infinite;}@keyframes ga{0%{opacity:1}45%{opacity:1}47%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 5s linear infinite;}@keyframes gb{0%{opacity:0}56%{opacity:0}58%{opacity:1}92%{opacity:1}94%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >흰 배경 제품 사진 (위에서 본 배치)</text><rect x="34" y="36" width="114" height="78" rx="6" fill="#f1f5f9"/><circle cx="91" cy="76" r="12" fill="#f59e0b"/><rect x="14" y="54" width="10" height="38" rx="3" fill="#38bdf8"/><rect x="158" y="54" width="10" height="38" rx="3" fill="#38bdf8"/><line class="dsh" x1="26" y1="73" x2="76" y2="76" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5"/><line class="dsh" x1="156" y1="73" x2="106" y2="76" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5"/><rect x="79" y="126" width="24" height="14" rx="3" fill="#e2e8f0"/><circle cx="91" cy="126" r="5" fill="#334155"/><text class="s c" x="91" y="156" >카메라</text><text class="s c" x="19" y="108" >조명</text><text class="s c" x="163" y="108" >조명</text><text class="s c" x="248" y="52" >찍힌 사진</text><rect class="bgc" x="190" y="60" width="116" height="80" rx="6" fill="#94a3b8"/><ellipse cx="248" cy="118" rx="22" ry="5" fill="#475569" fill-opacity=".45"/><circle cx="248" cy="96" r="20" fill="#f59e0b"/><g class="ga"><text class="b c" x="160" y="172" >배경이 회색빛: 배경까지 빛이 부족해요</text></g><g class="gb" opacity="0"><text class="b c am" x="160" y="172" >배경이 순백: 배경에 빛을 더 줬어요</text></g><text class="s c" x="160" y="188" >제품과 배경에 각각 빛을 주면 하얗게 나와요</text>
</svg>
