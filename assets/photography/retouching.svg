<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="리터칭: 브러시가 컵 위의 먼지 점을 하나씩 지워 깨끗해지는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.br{animation:br 6s ease-in-out infinite;}@keyframes br{0%{transform:translate(0,0)}8%{transform:translate(0,0)}18%{transform:translate(32px,28px)}28%{transform:translate(32px,28px)}38%{transform:translate(46px,-6px)}48%{transform:translate(46px,-6px)}58%{transform:translate(18px,38px)}68%{transform:translate(18px,38px)}78%{transform:translate(18px,38px)}90%{transform:translate(0,0)}100%{transform:translate(0,0)}}.s0{animation:s0 6s linear infinite;}@keyframes s0{0%{opacity:1}10%{opacity:1}12%{opacity:0}90%{opacity:0}100%{opacity:1}}.s1{animation:s1 6s linear infinite;}@keyframes s1{0%{opacity:1}20%{opacity:1}22%{opacity:0}90%{opacity:0}100%{opacity:1}}.s2{animation:s2 6s linear infinite;}@keyframes s2{0%{opacity:1}30%{opacity:1}32%{opacity:0}90%{opacity:0}100%{opacity:1}}.s3{animation:s3 6s linear infinite;}@keyframes s3{0%{opacity:1}60%{opacity:1}62%{opacity:0}90%{opacity:0}100%{opacity:1}}.ga{animation:ga 6s linear infinite;}@keyframes ga{0%{opacity:1}55%{opacity:1}57%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 6s linear infinite;}@keyframes gb{0%{opacity:0}64%{opacity:0}66%{opacity:1}92%{opacity:1}94%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >리터칭 = 사진의 흠을 지우고 다듬기</text><rect x="14" y="36" width="182" height="124" rx="8" fill="#334155"/><rect x="60" y="72" width="84" height="70" rx="10" fill="#e2e8f0"/><circle cx="150" cy="104" r="16" fill="none" stroke="#e2e8f0" stroke-width="8"/><circle class="s0" cx="80" cy="90" r="3.5" fill="#475569"/><circle class="s1" cx="112" cy="118" r="3.5" fill="#475569"/><circle class="s2" cx="126" cy="84" r="3.5" fill="#475569"/><circle class="s3" cx="98" cy="128" r="3.5" fill="#475569"/><circle class="br" cx="80" cy="90" r="9" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/><g class="ga"><text class="m c am" x="105" y="154" >보정 전: 먼지·흠집</text></g><g class="gb" opacity="0"><text class="m c sk" x="105" y="154" >보정 후: 깨끗함</text></g><text class="m am" x="206" y="70" style="font-weight:700">리터칭 할 일</text><text class="s" x="206" y="90" >· 먼지·잡티 지우기</text><text class="s" x="206" y="106" >· 밝기·색 맞추기</text><text class="s" x="206" y="122" >· 배경 정리</text><text class="s" x="206" y="138" >· 윤곽 선명하게</text><text class="b c" x="160" y="184" >원본은 따로 두고 사본에서 작업해요</text>
