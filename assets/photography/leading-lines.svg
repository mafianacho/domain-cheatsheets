<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="유도선: 길의 선들이 한곳으로 모여 시선이 끝의 집까지 이동하는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.eye{animation:eye 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}@keyframes eye{0%{transform:translateY(0) scale(1.2);opacity:1}70%{transform:translateY(-76px) scale(.5);opacity:1}90%{transform:translateY(-76px) scale(.5);opacity:1}100%{transform:translateY(-76px) scale(.5);opacity:0}}.dsh{animation:dsh 1.5s linear infinite;}@keyframes dsh{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-28}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >유도선 = 시선을 안내하는 선</text><rect x="14" y="34" width="292" height="126" rx="8" fill="#1e293b"/><rect x="14" y="34" width="292" height="44" rx="8" fill="#334155"/><polygon points="62,160 258,160 166,80 154,80" fill="#334155"/><line x1="62" y1="160" x2="154" y2="80" stroke="#e2e8f0" stroke-width="3"/><line x1="258" y1="160" x2="166" y2="80" stroke="#e2e8f0" stroke-width="3"/><line class="dsh" x1="160" y1="160" x2="160" y2="82" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/><rect x="154" y="66" width="12" height="14" fill="#f59e0b"/><polygon points="152,66 160,56 168,66" fill="#f59e0b"/><circle class="eye" cx="160" cy="146" r="7" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/><text class="b c" x="160" y="176" >눈(●)이 선을 따라 끝의 집으로 가요</text><text class="s c" x="160" y="190" >길·난간·강·건물 모서리가 유도선이 돼요</text>
</svg>
