<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="촬영 각도: 카메라가 사람 둘레를 돌며 눈높이, 로우앵글, 하이앵글로 바뀌는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.cm{animation:cm 6s ease-in-out infinite;transform-origin:222px 112px;}@keyframes cm{0%{transform:rotate(0deg)}14%{transform:rotate(0deg)}26%{transform:rotate(-24deg)}46%{transform:rotate(-24deg)}56%{transform:rotate(0deg)}64%{transform:rotate(0deg)}74%{transform:rotate(24deg)}92%{transform:rotate(24deg)}100%{transform:rotate(0deg)}}.ga{animation:ga 6s linear infinite;}@keyframes ga{0%{opacity:1}16%{opacity:1}18%{opacity:0}52%{opacity:0}54%{opacity:1}64%{opacity:1}66%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 6s linear infinite;}@keyframes gb{0%{opacity:0}24%{opacity:0}26%{opacity:1}46%{opacity:1}48%{opacity:0}100%{opacity:0}}.gc{animation:gc 6s linear infinite;}@keyframes gc{0%{opacity:0}72%{opacity:0}74%{opacity:1}92%{opacity:1}94%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >촬영 각도: 카메라 높이가 인상을 바꾼다</text><line x1="14" y1="146" x2="306" y2="146" stroke="#475569" stroke-width="2"/><circle cx="222" cy="92" r="11" fill="#e2e8f0"/><rect x="212" y="104" width="20" height="42" rx="5" fill="#38bdf8"/><g class="cm"><line x1="132" y1="112" x2="204" y2="112" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="96" y="102" width="30" height="20" rx="4" fill="#e2e8f0"/><rect x="126" y="107" width="8" height="10" rx="2" fill="#94a3b8"/><rect x="104" y="98" width="10" height="5" fill="#94a3b8"/></g><g class="ga"><text class="b c" x="160" y="176" >눈높이: 자연스러운 인상</text></g><g class="gb" opacity="0"><text class="b c am" x="160" y="176" >로우앵글: 올려다봄, 크고 당당해 보임</text></g><g class="gc" opacity="0"><text class="b c sk" x="160" y="176" >하이앵글: 내려다봄, 작고 귀여워 보임</text></g>
</svg>
