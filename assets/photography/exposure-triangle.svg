<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="노출 삼각형: 조리개를 열면 셔터를 빠르게 해 밝기를 같게 맞춘다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.k1{animation:k1 4s ease-in-out infinite;}@keyframes k1{0%{transform:translateX(0)}15%{transform:translateX(0)}60%{transform:translateX(100px)}100%{transform:translateX(100px)}}.k2{animation:k2 4s ease-in-out infinite;}@keyframes k2{0%{transform:translateX(0)}15%{transform:translateX(0)}60%{transform:translateX(-100px)}100%{transform:translateX(-100px)}}.v1{animation:v1 4s linear infinite;}@keyframes v1{0%{opacity:1}40%{opacity:1}42%{opacity:0}98%{opacity:0}100%{opacity:1}}.v2{animation:v2 4s linear infinite;}@keyframes v2{0%{opacity:0}53%{opacity:0}55%{opacity:1}100%{opacity:1}}.w1{animation:w1 4s linear infinite;}@keyframes w1{0%{opacity:1}40%{opacity:1}42%{opacity:0}98%{opacity:0}100%{opacity:1}}.w2{animation:w2 4s linear infinite;}@keyframes w2{0%{opacity:0}53%{opacity:0}55%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >노출 삼각형: 하나 올리면 하나 내린다</text><text class="s" x="90" y="46" >빛 적게</text><text class="s" x="250" y="46" text-anchor="end">빛 많이</text><text class="m" x="14" y="74" >조리개</text><rect x="90" y="67" width="160" height="6" rx="3" fill="#334155"/><text class="m" x="14" y="110" >셔터 속도</text><rect x="90" y="103" width="160" height="6" rx="3" fill="#334155"/><text class="m" x="14" y="146" >ISO</text><rect x="90" y="139" width="160" height="6" rx="3" fill="#334155"/><circle class="k1" cx="120" cy="70" r="8" fill="#f59e0b"/><circle class="k2" cx="220" cy="106" r="8" fill="#38bdf8"/><circle cx="170" cy="142" r="8" fill="#94a3b8"/><text class="m am v1" x="262" y="74">f/8</text><text class="m am v2" x="262" y="74" opacity="0">f/2.8</text><text class="m sk w1" x="262" y="110">1/60</text><text class="m sk w2" x="262" y="110" opacity="0">1/500</text><text class="m" x="262" y="146" >100</text><rect x="14" y="164" width="296" height="26" rx="6" fill="#1e293b"/><text class="m" x="24" y="181" >결과 밝기</text><rect x="100" y="171" width="120" height="10" rx="5" fill="#f59e0b"/><text class="m am" x="232" y="181" >항상 같음</text>
</svg>
