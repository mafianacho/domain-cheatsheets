<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="보케: 배경 불빛이 점에서 큰 동그라미로 번졌다가 다시 또렷해지는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.lt{animation:lt 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}@keyframes lt{0%{transform:scale(1);opacity:.55}35%{transform:scale(1);opacity:.55}50%{transform:scale(.23);opacity:.95}85%{transform:scale(.23);opacity:.95}100%{transform:scale(1);opacity:.55}}.ga{animation:ga 5s linear infinite;}@keyframes ga{0%{opacity:1}38%{opacity:1}40%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 5s linear infinite;}@keyframes gb{0%{opacity:0}46%{opacity:0}48%{opacity:1}88%{opacity:1}90%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
