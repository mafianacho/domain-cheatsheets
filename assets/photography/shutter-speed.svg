<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="셔터 속도: 빠르면 움직이는 공이 선명하고 느리면 번진다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.mv{animation:mv 3s ease-in-out infinite;}@keyframes mv{0%{transform:translateX(0)}75%{transform:translateX(70px)}100%{transform:translateX(70px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
