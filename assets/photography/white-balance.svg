<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="화이트 밸런스: 빛의 색 온도에 따라 흰 종이가 노랗거나 푸르게 보이는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.mk{animation:mk 6s ease-in-out infinite;}@keyframes mk{0%{transform:translateX(0px)}20%{transform:translateX(0px)}32%{transform:translateX(-90px)}52%{transform:translateX(-90px)}64%{transform:translateX(90px)}84%{transform:translateX(90px)}96%{transform:translateX(0px)}100%{transform:translateX(0px)}}.pp{animation:pp 6s ease-in-out infinite;}@keyframes pp{0%{fill:#f1f5f9}20%{fill:#f1f5f9}32%{fill:#fdba74}52%{fill:#fdba74}64%{fill:#93c5fd}84%{fill:#93c5fd}96%{fill:#f1f5f9}100%{fill:#f1f5f9}}.ga{animation:ga 6s linear infinite;}@keyframes ga{0%{opacity:1}22%{opacity:1}24%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 6s linear infinite;}@keyframes gb{0%{opacity:0}28%{opacity:0}30%{opacity:1}54%{opacity:1}56%{opacity:0}100%{opacity:0}}.gc{animation:gc 6s linear infinite;}@keyframes gc{0%{opacity:0}60%{opacity:0}62%{opacity:1}86%{opacity:1}88%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >화이트 밸런스 = 흰색을 흰색으로 보정</text><rect x="14" y="40" width="58" height="14" fill="#fb923c"/><rect x="72" y="40" width="58" height="14" fill="#fdba74"/><rect x="130" y="40" width="58" height="14" fill="#f1f5f9"/><rect x="189" y="40" width="58" height="14" fill="#bae6fd"/><rect x="247" y="40" width="58" height="14" fill="#7dd3fc"/><text class="s" x="14" y="72" >2700K 전구색</text><text class="s c" x="160" y="72" >5500K 한낮</text><text class="s" x="306" y="72" text-anchor="end">6500K 흐린 날</text><polygon class="mk" points="160,60 154,52 166,52" fill="#f59e0b"/><text class="m" x="14" y="112" >흰 종이를</text><text class="m" x="14" y="126" >찍으면</text><rect class="pp" x="84" y="88" width="150" height="56" rx="8" fill="#f1f5f9"/><text class="b c" x="159" y="122" style="fill:#334155">흰 종이</text><g class="ga"><text class="b c am" x="160" y="172" >맞춘 상태: 흰색이 흰색으로</text></g><g class="gb" opacity="0"><text class="b c am" x="160" y="172" >전구 빛 그대로: 노랗게 변색</text></g><g class="gc" opacity="0"><text class="b c sk" x="160" y="172" >그늘 빛 그대로: 푸르게 변색</text></g><text class="s c" x="160" y="188" >K(켈빈)는 빛의 색 온도, 낮을수록 노랗다</text>
</svg>
