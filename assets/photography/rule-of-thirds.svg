<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="삼분할 구도: 가운데에 있던 주인공이 3x3 격자선 교차점으로 옮겨지는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.sj{animation:sj 5s ease-in-out infinite;}@keyframes sj{0%{transform:translate(-40px,-21px)}25%{transform:translate(-40px,-21px)}40%{transform:translate(0,0)}85%{transform:translate(0,0)}100%{transform:translate(-40px,-21px)}}.ga{animation:ga 5s linear infinite;}@keyframes ga{0%{opacity:1}36%{opacity:1}38%{opacity:0}98%{opacity:0}100%{opacity:1}}.gb{animation:gb 5s linear infinite;}@keyframes gb{0%{opacity:0}42%{opacity:0}44%{opacity:1}88%{opacity:1}90%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >삼분할 구도: 교차점에 주인공을</text><rect x="40" y="34" width="240" height="124" rx="6" fill="#1e293b"/><line x1="120" y1="34" x2="120" y2="158" stroke="#475569" stroke-width="1.5"/><line x1="200" y1="34" x2="200" y2="158" stroke="#475569" stroke-width="1.5"/><line x1="40" y1="75" x2="280" y2="75" stroke="#475569" stroke-width="1.5"/><line x1="40" y1="117" x2="280" y2="117" stroke="#475569" stroke-width="1.5"/><circle cx="120" cy="75" r="3" fill="#f59e0b"/><circle cx="120" cy="117" r="3" fill="#f59e0b"/><circle cx="200" cy="75" r="3" fill="#f59e0b"/><circle cx="200" cy="117" r="3" fill="#f59e0b"/><g class="sj"><line x1="40" y1="117" x2="280" y2="117" stroke="#e2e8f0" stroke-width="2.5"/><circle cx="200" cy="105" r="12" fill="#38bdf8"/><rect x="194" y="111" width="12" height="6" fill="#38bdf8"/></g><g class="ga" opacity="0"><text class="b c" x="160" y="180" >가운데 놓음: 안정적이지만 밋밋해요</text></g><g class="gb"><text class="b c am" x="160" y="180" >교차점에 놓음: 시선이 편하고 자연스러워요</text></g>
</svg>
