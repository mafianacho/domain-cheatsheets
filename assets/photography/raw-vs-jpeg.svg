<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="RAW와 JPEG: 밝게 날아간 하늘을 어둡게 보정하면 RAW만 구름이 되살아나는 비교">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.skf{animation:skf 5s ease-in-out infinite;}@keyframes skf{0%{fill:#f1f5f9}30%{fill:#f1f5f9}45%{fill:#475569}85%{fill:#475569}100%{fill:#f1f5f9}}.cl{animation:cl 5s ease-in-out infinite;}@keyframes cl{0%{opacity:0}30%{opacity:0}45%{opacity:1}85%{opacity:1}100%{opacity:0}}.ed{animation:ed 5s linear infinite;}@keyframes ed{0%{opacity:0}34%{opacity:0}36%{opacity:1}90%{opacity:1}92%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >RAW와 JPEG: 같은 사진, 다른 파일</text><rect x="10" y="34" width="146" height="124" rx="8" fill="#1e293b"/><rect x="18" y="42" width="44" height="16" rx="8" fill="#f59e0b"/><text class="s c" x="40" y="54" style="fill:#0f172a;font-weight:700">RAW</text><rect class="skf" x="18" y="64" width="130" height="50" rx="4" fill="#475569"/><rect x="164" y="34" width="146" height="124" rx="8" fill="#1e293b"/><rect x="172" y="42" width="44" height="16" rx="8" fill="#38bdf8"/><text class="s c" x="194" y="54" style="fill:#0f172a;font-weight:700">JPEG</text><rect class="skf" x="172" y="64" width="130" height="50" rx="4" fill="#475569"/><g class="cl" opacity="1"><path d="M30 100 C30 88 46 86 50 94 C56 84 76 88 74 100 Z" fill="none" stroke="#e2e8f0" stroke-width="2.5"/><path d="M98 84 C98 74 112 72 116 80 C122 72 138 76 136 86 Z" fill="none" stroke="#e2e8f0" stroke-width="2.5"/></g><rect x="18" y="64" width="0" height="0"/><text class="s c" x="83" y="130" >원본 데이터, 용량 큼</text><text class="s c am" x="83" y="144" >하늘 구름이 되살아남</text><text class="s c" x="237" y="130" >압축본, 용량 작음</text><text class="s c sk" x="237" y="144" >하얗게 날아간 곳은 그대로</text><g class="ed" opacity="0"><text class="b c" x="160" y="175" >‘노출 낮추기’ 보정을 해 보면</text></g><text class="s c" x="160" y="189" >RAW: 보정 여유 큼 · JPEG: 바로 쓰기 편함</text>
</svg>
