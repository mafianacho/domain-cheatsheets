<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="초점 모드: AF-S는 한 번 고정, AF-C는 움직이는 대상을 따라가고, MF는 링을 직접 돌린다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.lk{animation:lk 3s ease-out infinite;transform-box:fill-box;transform-origin:center;}@keyframes lk{0%{transform:scale(1.5);opacity:.4}25%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}.fl{animation:fl 3s ease-in-out infinite;}@keyframes fl{0%{transform:translateX(-24px)}50%{transform:translateX(24px)}100%{transform:translateX(-24px)}}.rg{animation:rg 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}@keyframes rg{0%{transform:rotate(-40deg)}50%{transform:rotate(40deg)}100%{transform:rotate(-40deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >초점 모드 3가지</text><rect x="10" y="36" width="96" height="100" rx="8" fill="#1e293b"/><text class="b c am" x="58" y="158" >AF-S</text><text class="s c" x="58" y="172" >정지한 대상용</text><text class="s c" x="58" y="186" >한 번 맞추면 고정</text><rect x="112" y="36" width="96" height="100" rx="8" fill="#1e293b"/><text class="b c am" x="160" y="158" >AF-C</text><text class="s c" x="160" y="172" >움직이는 대상용</text><text class="s c" x="160" y="186" >계속 따라가며 맞춤</text><rect x="214" y="36" width="96" height="100" rx="8" fill="#1e293b"/><text class="b c am" x="262" y="158" >MF</text><text class="s c" x="262" y="172" >내가 직접</text><text class="s c" x="262" y="186" >링을 돌려 맞춤</text><circle cx="58" cy="86" r="13" fill="#38bdf8"/><rect class="lk" x="38" y="66" width="40" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5"/><g class="fl"><circle cx="160" cy="86" r="13" fill="#38bdf8"/><rect x="140" y="66" width="40" height="40" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><circle cx="262" cy="86" r="13" fill="#38bdf8"/><circle class="rg" cx="262" cy="86" r="30" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="4 6"/>
</svg>
