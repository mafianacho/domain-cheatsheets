<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="사진 크롭: 가장자리의 쓰레기통을 잘라 내고 주인공만 크게 남기는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.dt{animation:dt 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center top;}@keyframes dt{0%{transform:scaleY(0)}10%{transform:scaleY(0)}35%{transform:scaleY(1)}92%{transform:scaleY(1)}100%{transform:scaleY(0)}}.db{animation:db 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;}@keyframes db{0%{transform:scaleY(0)}10%{transform:scaleY(0)}35%{transform:scaleY(1)}92%{transform:scaleY(1)}100%{transform:scaleY(0)}}.dl{animation:dl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left center;}@keyframes dl{0%{transform:scaleX(0)}10%{transform:scaleX(0)}35%{transform:scaleX(1)}92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.dr{animation:dr 5s ease-in-out infinite;transform-box:fill-box;transform-origin:right center;}@keyframes dr{0%{transform:scaleX(0)}10%{transform:scaleX(0)}35%{transform:scaleX(1)}92%{transform:scaleX(1)}100%{transform:scaleX(0)}}.rs{animation:rs 5s linear infinite;}@keyframes rs{0%{opacity:0}38%{opacity:0}48%{opacity:1}92%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >크롭 = 필요한 부분만 남기고 자르기</text><rect x="14" y="36" width="190" height="128" rx="6" fill="#334155"/><polygon points="14,164 14,120 60,96 110,122 160,100 204,124 204,164" fill="#475569"/><circle cx="124" cy="92" r="9" fill="#e2e8f0"/><rect x="118" y="100" width="12" height="26" rx="4" fill="#38bdf8"/><rect x="26" y="116" width="22" height="30" rx="3" fill="#94a3b8"/><rect x="180" y="52" width="6" height="90" fill="#94a3b8"/><rect class="dt" x="14" y="36" width="190" height="16" fill="#020617" fill-opacity=".7"/><rect class="db" x="14" y="138" width="190" height="26" fill="#020617" fill-opacity=".7"/><rect class="dl" x="14" y="52" width="70" height="86" fill="#020617" fill-opacity=".7"/><rect class="dr" x="188" y="52" width="16" height="86" fill="#020617" fill-opacity=".7"/><rect x="84" y="52" width="104" height="86" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text class="s c" x="262" y="62" >자른 결과</text><g class="rs"><rect x="220" y="70" width="84" height="70" rx="4" fill="#334155"/><polygon points="220,140 220,118 244,104 270,120 304,108 304,140" fill="#475569"/><circle cx="262" cy="94" r="11" fill="#e2e8f0"/><rect x="254" y="104" width="16" height="34" rx="4" fill="#38bdf8"/></g><text class="b c" x="160" y="184" >엉뚱한 물건은 빼고 주인공을 더 크게</text>
</svg>
