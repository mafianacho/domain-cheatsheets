<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="플래시: 어두운 실내에서 카메라가 번쩍하면 병이 밝게 찍히는 장면">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.st{animation:st 4s ease-out infinite;transform-box:fill-box;transform-origin:center;}@keyframes st{0%{opacity:0;transform:scale(.3)}15%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.2)}32%{opacity:0;transform:scale(1.4)}100%{opacity:0;transform:scale(1.4)}}.sb{animation:sb 4s linear infinite;}@keyframes sb{0%{fill:#334155}18%{fill:#334155}20%{fill:#e2e8f0}30%{fill:#e2e8f0}38%{fill:#334155}100%{fill:#334155}}.rs{animation:rs 4s linear infinite;}@keyframes rs{0%{fill:#1e293b}18%{fill:#1e293b}22%{fill:#cbd5e1}88%{fill:#cbd5e1}96%{fill:#1e293b}100%{fill:#1e293b}}.ray{animation:ray 4s linear infinite;}@keyframes ray{0%{opacity:0}17%{opacity:0}20%{opacity:1}32%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >플래시 = 순간적으로 보태는 빛</text><rect x="14" y="38" width="176" height="112" rx="8" fill="#0b1220" stroke="#475569"/><text class="s" x="22" y="54" >어두운 실내</text><rect x="26" y="96" width="26" height="18" rx="3" fill="#e2e8f0"/><circle cx="52" cy="105" r="6" fill="#334155"/><polygon class="st" points="78.0,105.0 68.2,109.2 64.0,119.0 59.8,109.2 50.0,105.0 59.8,100.8 64.0,91.0 68.2,100.8" fill="#f59e0b"/><line class="ray" x1="70" y1="105" x2="136" y2="105" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 5" opacity="0"/><rect class="sb" x="140" y="76" width="30" height="58" rx="8" fill="#e2e8f0"/><rect x="148" y="66" width="14" height="12" rx="2" fill="#94a3b8"/><text class="s c" x="240" y="54" >찍힌 사진</text><rect class="rs" x="204" y="62" width="72" height="72" rx="8" fill="#cbd5e1" stroke="#475569"/><rect x="228" y="80" width="24" height="44" rx="6" fill="#64748b"/><text class="m c" x="160" y="172" >어두운 곳에서 피사체를 밝히고 움직임을 멈춰요</text><text class="s c" x="160" y="188" >천장·벽에 튕기는 바운스는 더 부드러워요</text>
</svg>
