<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="초점거리: 24mm에서 200mm로 갈수록 담기는 범위가 좁아진다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.wd{animation:wd 6s ease-in-out infinite;transform-origin:160px 178px;}@keyframes wd{0%{transform:scaleX(1)}20%{transform:scaleX(1)}27%{transform:scaleX(0.48)}45%{transform:scaleX(0.48)}52%{transform:scaleX(0.28)}70%{transform:scaleX(0.28)}77%{transform:scaleX(0.12)}95%{transform:scaleX(0.12)}100%{transform:scaleX(1)}}.l0{animation:l0 6s linear infinite;}@keyframes l0{0%{opacity:1}18%{opacity:1}20%{opacity:0}98%{opacity:0}100%{opacity:1}}.l1{animation:l1 6s linear infinite;}@keyframes l1{0%{opacity:0}25%{opacity:0}27%{opacity:1}44%{opacity:1}46%{opacity:0}100%{opacity:0}}.l2{animation:l2 6s linear infinite;}@keyframes l2{0%{opacity:0}50%{opacity:0}52%{opacity:1}69%{opacity:1}71%{opacity:0}100%{opacity:0}}.l3{animation:l3 6s linear infinite;}@keyframes l3{0%{opacity:0}75%{opacity:0}77%{opacity:1}94%{opacity:1}96%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >초점거리 = 렌즈가 담는 범위(화각)</text><line x1="14" y1="54" x2="306" y2="54" stroke="#475569" stroke-width="2"/><circle cx="98" cy="68" r="9" fill="#38bdf8"/><circle cx="160" cy="68" r="9" fill="#f59e0b"/><circle cx="222" cy="68" r="9" fill="#38bdf8"/><polygon class="wd" points="160,172 50,54 270,54" fill="#f59e0b" fill-opacity=".22" stroke="#f59e0b" stroke-width="2"/><rect x="148" y="170" width="24" height="14" rx="3" fill="#e2e8f0"/><circle cx="160" cy="170" r="5" fill="#334155"/><g class="l0"><text class="t am" x="14" y="152" style="font-size:15px">24mm</text><text class="s" x="14" y="170" >넓게 보임 (광각)</text></g><g class="l1" opacity="0"><text class="t am" x="14" y="152" style="font-size:15px">50mm</text><text class="s" x="14" y="170" >사람 눈과 비슷</text></g><g class="l2" opacity="0"><text class="t am" x="14" y="152" style="font-size:15px">85mm</text><text class="s" x="14" y="170" >좁게, 크게 (망원)</text></g><g class="l3" opacity="0"><text class="t am" x="14" y="152" style="font-size:15px">200mm</text><text class="s" x="14" y="170" >아주 좁게 (망원)</text></g>
</svg>
