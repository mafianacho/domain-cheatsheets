<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="하드 라이트는 또렷한 그림자, 소프트 라이트는 부드럽게 번지는 그림자를 만든다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.b{font-size:12px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.am{fill:#f59e0b}.sk{fill:#38bdf8}.fb{transform-box:fill-box;transform-origin:center}.lm{animation:lm 3s ease-in-out infinite;}@keyframes lm{0%{transform:translateX(-8px)}50%{transform:translateX(8px)}100%{transform:translateX(-8px)}}.sd{animation:sd 3s ease-in-out infinite;}@keyframes sd{0%{transform:translateX(7px)}50%{transform:translateX(-7px)}100%{transform:translateX(7px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="14" y="24" >하드 라이트 vs 소프트 라이트</text><rect x="10" y="36" width="146" height="112" rx="8" fill="#1e293b"/><line x1="16" y1="124" x2="150" y2="124" stroke="#475569" stroke-width="2"/><rect x="164" y="36" width="146" height="112" rx="8" fill="#1e293b"/><line x1="170" y1="124" x2="304" y2="124" stroke="#475569" stroke-width="2"/><g class="sd"><ellipse cx="108" cy="124" rx="34" ry="5" fill="#020617" opacity=".95"/></g><g class="lm"><circle cx="60" cy="56" r="5" fill="#f59e0b"/><line x1="68.0" y1="56.0" x2="74.0" y2="56.0" stroke="#f59e0b" stroke-width="1.5"/><line x1="65.7" y1="61.7" x2="69.9" y2="65.9" stroke="#f59e0b" stroke-width="1.5"/><line x1="60.0" y1="64.0" x2="60.0" y2="70.0" stroke="#f59e0b" stroke-width="1.5"/><line x1="54.3" y1="61.7" x2="50.1" y2="65.9" stroke="#f59e0b" stroke-width="1.5"/><line x1="52.0" y1="56.0" x2="46.0" y2="56.0" stroke="#f59e0b" stroke-width="1.5"/><line x1="54.3" y1="50.3" x2="50.1" y2="46.1" stroke="#f59e0b" stroke-width="1.5"/><line x1="60.0" y1="48.0" x2="60.0" y2="42.0" stroke="#f59e0b" stroke-width="1.5"/><line x1="65.7" y1="50.3" x2="69.9" y2="46.1" stroke="#f59e0b" stroke-width="1.5"/></g><circle cx="76" cy="108" r="16" fill="#94a3b8"/><g class="sd"><ellipse cx="262" cy="124" rx="48" ry="8" fill="#020617" opacity=".16"/><ellipse cx="262" cy="124" rx="42" ry="7" fill="#020617" opacity=".16"/><ellipse cx="262" cy="124" rx="36" ry="6" fill="#020617" opacity=".16"/><ellipse cx="262" cy="124" rx="30" ry="5" fill="#020617" opacity=".16"/><ellipse cx="262" cy="124" rx="24" ry="4" fill="#020617" opacity=".16"/></g><g class="lm"><rect x="190" y="46" width="44" height="20" rx="4" fill="#f59e0b"/></g><circle cx="230" cy="108" r="16" fill="#94a3b8"/><text class="b c am" x="83" y="166" >하드 라이트</text><text class="s c" x="83" y="182" >작은 광원 · 또렷한 그림자</text><text class="b c sk" x="237" y="166" >소프트 라이트</text><text class="s c" x="237" y="182" >큰 광원 · 번지는 그림자</text>
