<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="단축법: 앞으로 뻗은 팔은 길이가 짧게 겹쳐 보이고 가까운 손은 크게 그려진다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,22%{transform:scale(1,1)}52%,78%{transform:scale(.3,1.35)}100%{transform:scale(1,1)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}@keyframes k2{0%,22%{transform:translate(0px,0px) scale(1)}52%,78%{transform:translate(-70px,0px) scale(1.7)}100%{transform:translate(0px,0px) scale(1)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,32%{opacity:1}35%{opacity:0}100%{opacity:0}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,44%{opacity:0}46%,80%{opacity:1}83%{opacity:0}100%{opacity:0}}.k4{animation:k4 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">단축법 · 포쇼트닝</text>
<text x="304" y="28" font-size="9" fill="#94a3b8" text-anchor="end">가까운 쪽은 크게, 길이는 짧게</text>
<rect x="16" y="40" width="288" height="116" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="70" y="92" width="100" height="16" rx="4" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="70" y="92" width="100" height="16" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2" class="k1"/>
<circle cx="180" cy="100" r="11" fill="#f59e0b" class="k2"/>
<circle cx="70" cy="100" r="13" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
<text x="160" y="66" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" opacity="0" class="k3">옆에서 본 팔 · 길이 그대로</text>
<text x="160" y="66" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" opacity="0" class="k4">앞으로 뻗은 팔 · 짧게 + 손은 크게</text>
<text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle">단축법 = 가까운 쪽 크게, 길이는 짧게</text>
<text x="40" y="134" font-size="9" fill="#94a3b8" text-anchor="middle">어깨</text>
</svg>
