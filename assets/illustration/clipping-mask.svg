<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="클리핑 마스크: 위 레이어를 아래 레이어의 모양 안에서만 보이게 하는 기능. 칠이 밖으로 번지지 않는다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,44%{opacity:1}48%,100%{opacity:0}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,46%{opacity:0}52%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,44%{opacity:1}47%{opacity:0}100%{opacity:0}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,46%{opacity:0}52%,92%{opacity:1}100%{opacity:0}}.k4{animation:k4 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">클리핑 마스크</text>
<text x="304" y="28" font-size="9" fill="#94a3b8" text-anchor="end">아래 레이어 모양 안에서만</text>
<rect x="16" y="40" width="288" height="144" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<defs><clipPath id="cm"><circle cx="100" cy="106" r="40"/></clipPath></defs>
<circle cx="100" cy="106" r="40" fill="#f59e0b"/>
<g class="k1"><rect x="40" y="102" width="150" height="26" fill="#38bdf8" opacity=".9" transform="rotate(-18 100 106)"/></g>
<g clip-path="url(#cm)" opacity="0" class="k2"><rect x="40" y="102" width="150" height="26" fill="#38bdf8" opacity=".9" transform="rotate(-18 100 106)"/></g>
<g><rect x="214" y="56" width="90" height="32" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
<text x="259" y="76" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">칠하는 층 (위)</text></g>
<path d="M259 94 L259 106 M257.0 102.5 L259 106 L261.0 102.5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g><rect x="214" y="110" width="90" height="32" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text x="259" y="130" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">모양 층 (아래)</text></g>
<text x="160" y="176" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700" class="k3">클리핑 OFF · 밖으로 번짐</text>
<text x="160" y="176" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" opacity="0" class="k4">클리핑 ON · 모양 안에만</text>
</svg>
