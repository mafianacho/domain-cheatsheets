<text x="72" y="179" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">1 밑색</text></g>
<rect x="122" y="164" width="88" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="166" y="179" font-size="10" fill="#94a3b8" text-anchor="middle">2 그림자</text>
