<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="명암 넣기: 밑색 위에 빛 방향에 따라 그림자 면과 밝은 점을 쌓아 입체감을 만드는 작업">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,26%{opacity:0}30%,92%{opacity:1}100%{opacity:0}}.k1{animation:k1 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,52%{opacity:0}56%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,2%{opacity:0}4%,28%{opacity:1}31%{opacity:0}100%{opacity:0}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,30%{opacity:0}32%,56%{opacity:1}59%{opacity:0}100%{opacity:0}}.k4{animation:k4 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,58%{opacity:0}60%,92%{opacity:1}95%{opacity:0}100%{opacity:0}}.k5{animation:k5 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">명암 넣기 · Shading</text>
<text x="304" y="28" font-size="9" fill="#94a3b8" text-anchor="end">밑색 → 그림자 → 하이라이트</text>
<defs><clipPath id="sc"><circle cx="160" cy="100" r="46"/></clipPath></defs>
<circle cx="160" cy="100" r="46" fill="#94a3b8"/>
<g class="k1"><g clip-path="url(#sc)"><path d="M0 0 H320 V200 H0 Z M98 84 a46 46 0 1 0 92 0 a46 46 0 1 0 -92 0 Z" fill-rule="evenodd" fill="#475569"/></g></g>
<g class="k2"><ellipse cx="142" cy="80" rx="9" ry="6" fill="#e2e8f0" transform="rotate(-35 142 80)"/></g>
<path d="M52 54 L92 76 M86.0 76.1 L92 76 L88.9 70.9" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
