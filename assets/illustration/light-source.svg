<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="광원: 그림 속 빛이 오는 방향. 광원이 정해지면 밝은 면과 그림자 방향이 한꺼번에 정해진다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,0%{transform:translateX(0px)}25%{transform:translateX(-26px)}50%{transform:translateX(-52px)}75%{transform:translateX(-26px)}100%{transform:translateX(0px)}}.k1{animation:k1 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,0%{transform:translate(0px,0px)}25%{transform:translate(14px,-6px)}50%{transform:translate(28px,0px)}75%{transform:translate(14px,-6px)}100%{transform:translate(0px,0px)}}.k2{animation:k2 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,0%{transform:translate(0px,0px)}25%{transform:translate(100px,-16px)}50%{transform:translate(200px,0px)}75%{transform:translate(100px,-16px)}100%{transform:translate(0px,0px)}}.k3{animation:k3 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">광원 · Light Source</text>
<text x="304" y="28" font-size="9" fill="#94a3b8" text-anchor="end">빛이 오는 방향 하나</text>
<rect x="16" y="40" width="288" height="144" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<line x1="30" y1="160" x2="290" y2="160" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<ellipse cx="186" cy="162" rx="40" ry="7" fill="#0f172a" opacity=".75" class="k1"/>
<defs><clipPath id="sc"><circle cx="160" cy="114" r="38"/></clipPath></defs>
<circle cx="160" cy="114" r="38" fill="#475569"/>
<g clip-path="url(#sc)"><circle cx="146" cy="104" r="36.1" fill="#cbd5e1" class="k2"/></g>
<g class="k3"><circle cx="60" cy="74" r="10" fill="#f59e0b"/>
<line x1="75.0" y1="74.0" x2="81.0" y2="74.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="70.6" y1="84.6" x2="74.8" y2="88.8" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="60.0" y1="89.0" x2="60.0" y2="95.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="49.4" y1="84.6" x2="45.2" y2="88.8" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="45.0" y1="74.0" x2="39.0" y2="74.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="49.4" y1="63.4" x2="45.2" y2="59.2" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="60.0" y1="59.0" x2="60.0" y2="53.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="70.6" y1="63.4" x2="74.8" y2="59.2" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/></g>
<text x="160" y="180" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700">광원이 움직이면 밝은 면 · 그림자도 같이 움직임</text>
</svg>
