<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="하이라이트와 림 라이트: 빛이 가장 세게 맺힌 밝은 점과, 뒤에서 오는 빛이 윤곽을 따라 만드는 가는 밝은 선">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,40%{opacity:0}44%,92%{opacity:1}100%{opacity:0}}.k1{animation:k1 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,12%{opacity:0}16%,92%{opacity:1}100%{opacity:0}}.k2{animation:k2 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,16%{opacity:0}20%,92%{opacity:1}100%{opacity:0}}.k3{animation:k3 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,44%{opacity:0}48%,92%{opacity:1}100%{opacity:0}}.k4{animation:k4 5s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">하이라이트 · 림 라이트</text>
<text x="304" y="28" font-size="9" fill="#94a3b8" text-anchor="end">밝은 점 vs 윤곽의 빛</text>
<defs><clipPath id="sc"><circle cx="100" cy="108" r="46"/></clipPath></defs>
<rect x="16" y="40" width="288" height="144" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<circle cx="100" cy="108" r="46" fill="#334155"/>
