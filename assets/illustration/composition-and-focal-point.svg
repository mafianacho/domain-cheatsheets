<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="구도와 초점: 그림 안에서 시선이 가장 먼저 머무는 곳(초점)을 선과 위치로 정한다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}@keyframes k1{0%,6%{stroke-dashoffset:1;opacity:0}7%,7%{stroke-dashoffset:1;opacity:1}30%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:1;opacity:0}}.k1{animation:k1 4.5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,10%{stroke-dashoffset:1;opacity:0}11%,11%{stroke-dashoffset:1;opacity:1}34%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:1;opacity:0}}.k2{animation:k2 4.5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,36%{transform:scale(1);opacity:.9}70%{transform:scale(2.6);opacity:0}100%{transform:scale(2.6);opacity:0}}.k3{animation:k3 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="16" y="28" font-size="13" fill="#e2e8f0" font-weight="700">구도 · 초점</text>
<text x="304" y="28" font-size="9" fill="#94a3b8" text-anchor="end">시선이 머무는 곳</text>
<rect x="16" y="40" width="204" height="144" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<line x1="84" y1="40" x2="84" y2="184" stroke="#475569" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="152" y1="40" x2="152" y2="184" stroke="#475569" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="16" y1="88" x2="220" y2="88" stroke="#475569" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="16" y1="136" x2="220" y2="136" stroke="#475569" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<path d="M30 176 Q104 156 148 96" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="k1"/>
<path d="M208 176 Q176 146 158 98" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="k2"/>
<circle cx="48" cy="66" r="5" fill="#475569"/>
<circle cx="196" cy="62" r="5" fill="#475569"/>
<circle cx="180" cy="150" r="5" fill="#475569"/>
<circle cx="152" cy="88" r="12" fill="#f59e0b"/>
<circle cx="152" cy="88" r="12" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0" class="k3"/>
<text x="266" y="66" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700">초점</text>
<text x="266" y="90" font-size="10" fill="#e2e8f0" text-anchor="middle">가장 먼저</text>
<text x="266" y="105" font-size="10" fill="#e2e8f0" text-anchor="middle">눈이 가는 곳</text>
<text x="266" y="134" font-size="10" fill="#94a3b8" text-anchor="middle">크기 · 대비</text>
<text x="266" y="149" font-size="10" fill="#94a3b8" text-anchor="middle">위치로 만듦</text>
</svg>
