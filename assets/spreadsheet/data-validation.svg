<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">유효성 검사: 정해진 값만 입력</text>
<text x="14" y="50" class="m mu">상태</text>
<rect x="50" y="36" width="130" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/><text x="176" y="53" class="m k e">▼</text>
