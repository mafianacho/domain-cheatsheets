<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="SUMIFS와 COUNTIFS: 조건에 맞는 줄만 골라 합계를 내거나 개수를 센다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,24.9%{opacity:0}25%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,39.9%{opacity:0}40%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,64.9%{opacity:0}65%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">조건에 맞는 줄만 합계·개수</text>
<rect x="14" y="32" width="50" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="39.0" y="45.5" class="m c b">지역</text><rect x="64" y="32" width="60" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="94.0" y="45.5" class="m c b">상품</text><rect x="124" y="32" width="50" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="149.0" y="45.5" class="m c b">금액</text>
<rect x="14" y="52" width="50" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="39.0" y="66.5" class="m c">서울</text><rect x="64" y="52" width="60" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="94.0" y="66.5" class="m c">커피</text><rect x="124" y="52" width="50" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="149.0" y="66.5" class="m c">100</text>
<rect x="14" y="74" width="50" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="39.0" y="88.5" class="m c">부산</text><rect x="64" y="74" width="60" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="94.0" y="88.5" class="m c">커피</text><rect x="124" y="74" width="50" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="149.0" y="88.5" class="m c">80</text>
<rect x="14" y="96" width="50" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="39.0" y="110.5" class="m c">서울</text><rect x="64" y="96" width="60" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="94.0" y="110.5" class="m c">케이크</text><rect x="124" y="96" width="50" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="149.0" y="110.5" class="m c">60</text>
<rect x="14" y="118" width="50" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="39.0" y="132.5" class="m c">서울</text><rect x="64" y="118" width="60" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="94.0" y="132.5" class="m c">커피</text><rect x="124" y="118" width="50" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="149.0" y="132.5" class="m c">40</text>
<g class="e1"><rect x="14" y="52" width="160" height="22" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" fill-opacity=".25"/></g>
<g class="e2"><rect x="14" y="118" width="160" height="22" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" fill-opacity=".25"/></g>
<rect x="190" y="32" width="116" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="248" y="49" class="m c">조건 ① 지역 = 서울</text><text x="248" y="64" class="m c">조건 ② 상품 = 커피</text><text x="248" y="80" class="s c mu">둘 다 맞는 줄만</text>
<g class="e3"><rect x="190" y="100" width="116" height="56" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="248" y="120" class="l c b a">SUMIFS → 140</text><text x="248" y="142" class="l c b k">COUNTIFS → 2건</text></g>
<text x="14" y="160" class="s mu">=SUMIFS(C:C, A:A,"서울", B:B,"커피")</text>
<text x="160" y="190" class="s c mu">100 + 40 = 140, 맞는 줄은 2개</text>
</svg>
