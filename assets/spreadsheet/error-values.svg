<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="오류 값: 수식이 잘못되면 # 로 시작하는 오류 코드가 나오며 각각 원인이 다르다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,5.9%{opacity:0}6%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,21.9%{opacity:0}22%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,37.9%{opacity:0}38%,96%{opacity:1}98%,100%{opacity:0}}.e4{animation:e4 4s linear infinite}@keyframes e4{0%,53.9%{opacity:0}54%,96%{opacity:1}98%,100%{opacity:0}}.e5{animation:e5 4s linear infinite}@keyframes e5{0%,69.9%{opacity:0}70%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">오류 값: 수식이 보내는 신호</text>
<g class="e1"><rect x="14" y="32" width="84" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/><text x="56.0" y="47.5" class="m c b a">#N/A</text><rect x="98" y="32" width="208" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="202.0" y="47.5" class="m c">찾는 값이 목록에 없음</text></g>
<g class="e2"><rect x="14" y="60" width="84" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/><text x="56.0" y="75.5" class="m c b a">#REF!</text><rect x="98" y="60" width="208" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="202.0" y="75.5" class="m c">참조한 칸이 지워짐</text></g>
<g class="e3"><rect x="14" y="88" width="84" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/><text x="56.0" y="103.5" class="m c b a">#DIV/0!</text><rect x="98" y="88" width="208" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="202.0" y="103.5" class="m c">0으로 나눔</text></g>
<g class="e4"><rect x="14" y="116" width="84" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/><text x="56.0" y="131.5" class="m c b a">#VALUE!</text><rect x="98" y="116" width="208" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="202.0" y="131.5" class="m c">값의 종류가 안 맞음</text></g>
<g class="e5"><rect x="14" y="144" width="84" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/><text x="56.0" y="159.5" class="m c b a">#NAME?</text><rect x="98" y="144" width="208" height="24" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="202.0" y="159.5" class="m c">함수·이름을 못 알아봄</text></g>
<text x="160" y="190" class="s c mu">코드를 보면 어디가 잘못됐는지 짐작할 수 있음</text>
</svg>
