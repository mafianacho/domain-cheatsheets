<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="텍스트 함수: LEFT, MID, RIGHT로 글자를 잘라 내고 TEXT로 숫자의 보이는 모양을 바꾼다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,14.9%{opacity:0}15%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,34.9%{opacity:0}35%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,54.9%{opacity:0}55%,96%{opacity:1}98%,100%{opacity:0}}.e4{animation:e4 4s linear infinite}@keyframes e4{0%,74.9%{opacity:0}75%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">텍스트 함수: 글자 자르기</text>
<rect x="40" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="50.0" y="50.5" class="l c b">K</text>
<rect x="60" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="70.0" y="50.5" class="l c b">R</text>
<rect x="80" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="90.0" y="50.5" class="l c b">-</text>
<rect x="100" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="110.0" y="50.5" class="l c b">2</text>
<rect x="120" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="130.0" y="50.5" class="l c b">0</text>
<rect x="140" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="150.0" y="50.5" class="l c b">2</text>
<rect x="160" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="170.0" y="50.5" class="l c b">6</text>
<rect x="180" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="190.0" y="50.5" class="l c b">-</text>
<rect x="200" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="210.0" y="50.5" class="l c b">0</text>
<rect x="220" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="230.0" y="50.5" class="l c b">0</text>
<rect x="240" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="250.0" y="50.5" class="l c b">4</text>
<rect x="260" y="34" width="20" height="26" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="270.0" y="50.5" class="l c b">2</text>
<text x="14" y="51" class="m mu">A1</text>
<g class="e1"><rect x="40" y="34" width="40" height="26" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="2" fill-opacity=".25"/><line x1="40" y1="68" x2="80" y2="68" stroke="#38bdf8" stroke-width="2.5"/><text x="40" y="85" class="m b k">LEFT(A1,2)</text><text x="116" y="85" class="m b">→ KR</text></g>
<g class="e2"><rect x="100" y="34" width="80" height="26" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" fill-opacity=".25"/><line x1="100" y1="68" x2="180" y2="68" stroke="#f59e0b" stroke-width="2.5"/><text x="40" y="103" class="m b a">MID(A1,4,4)</text><text x="116" y="103" class="m b">→ 2026</text></g>
<g class="e3"><rect x="200" y="34" width="80" height="26" rx="2" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="2" fill-opacity=".2"/><line x1="200" y1="68" x2="280" y2="68" stroke="#e2e8f0" stroke-width="2.5"/><text x="40" y="121" class="m b">RIGHT(A1,4)</text><text x="116" y="121" class="m b">→ 0042</text></g>
<g class="e4"><rect x="14" y="134" width="292" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/><text x="24" y="150" class="m b a">=TEXT(0.256, "0.0%")</text><text x="190" y="150" class="m b">→  25.6%</text><text x="24" y="164" class="s mu">숫자는 그대로, 보이는 모양만 바꿈</text></g>
<text x="160" y="190" class="s c mu">몇 번째 글자부터 몇 글자를 가져올지 정함</text>
</svg>
