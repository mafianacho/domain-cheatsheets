<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="중복 제거: 같은 값이 여러 번 나오면 첫 줄만 남기고 나머지 줄을 지운다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite;}@keyframes e1{0%,45%{opacity:1}55%,92%{opacity:0}98%,100%{opacity:1}}.e2{animation:e2 4s linear infinite;}@keyframes e2{0%,45%{transform:translateY(0)}60%,92%{transform:translateY(-22px)}98%,100%{transform:translateY(0)}}.e3{animation:e3 4s linear infinite;}@keyframes e3{0%,45%{opacity:1}55%,92%{opacity:0}98%,100%{opacity:1}}.e4{opacity:0;animation:e4 4s linear infinite}@keyframes e4{0%,14.9%{opacity:0}15%,50%{opacity:1}51%,100%{opacity:0}}.e5{opacity:0;animation:e5 4s linear infinite}@keyframes e5{0%,14.9%{opacity:0}15%,50%{opacity:1}51%,100%{opacity:0}}.e6{animation:e6 4s linear infinite}@keyframes e6{0%,61.9%{opacity:0}62%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">중복 제거: 같은 줄은 하나만</text>
<rect x="14" y="32" width="110" height="22" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="69.0" y="46.5" class="m c b">이름</text>
<rect x="14" y="56" width="110" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="69.0" y="70.5" class="m c">김민수</text>
<rect x="14" y="78" width="110" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="69.0" y="92.5" class="m c">이서연</text>
<g class="e1"><rect x="14" y="100" width="110" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="69.0" y="114.5" class="m c">김민수</text></g>
<g class="e2"><rect x="14" y="122" width="110" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="69.0" y="136.5" class="m c">박지훈</text></g>
<g class="e3"><rect x="14" y="144" width="110" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="69.0" y="158.5" class="m c">이서연</text></g>
<g class="e4"><rect x="14" y="100" width="110" height="22" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" fill-opacity=".35"/></g>
<g class="e5"><rect x="14" y="144" width="110" height="22" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" fill-opacity=".35"/></g>
<rect x="150" y="32" width="156" height="56" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="228" y="52" class="m c b a">같은 값 = 중복</text><text x="228" y="68" class="m c">첫 번째 줄만 남김</text><text x="228" y="81" class="s c mu">나머지는 삭제</text>
<g class="e6"><text x="228" y="128" class="t c a">5줄 → 3줄</text><text x="228" y="146" class="s c mu">지워진 줄은 되돌리기 어려움</text></g>
<text x="160" y="190" class="s c mu">원본은 복사해 두고 작업하면 안전</text>
