<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="채우기 핸들: 셀 오른쪽 아래 작은 네모를 끌면 수식이 아래 칸으로 복사된다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,39.9%{opacity:0}40%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,54.9%{opacity:0}55%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,69.9%{opacity:0}70%,96%{opacity:1}98%,100%{opacity:0}}.e4{animation:e4 4s linear infinite;}@keyframes e4{0%,15%{transform:translateY(0)}60%,100%{transform:translateY(60px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
