<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="VLOOKUP: 표의 맨 왼쪽 열에서 값을 찾아 같은 줄의 n번째 열 값을 가져온다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{opacity:0;animation:e1 4s linear infinite}@keyframes e1{0%,7.9%{opacity:0}8%,24%{opacity:1}25%,100%{opacity:0}}.e2{opacity:0;animation:e2 4s linear infinite}@keyframes e2{0%,23.9%{opacity:0}24%,40%{opacity:1}41%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,39.9%{opacity:0}40%,96%{opacity:1}98%,100%{opacity:0}}.e4{animation:e4 4s linear infinite}@keyframes e4{0%,51.9%{opacity:0}52%,96%{opacity:1}98%,100%{opacity:0}}.e5{animation:e5 4s linear infinite}@keyframes e5{0%,63.9%{opacity:0}64%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">VLOOKUP: 왼쪽 열에서 찾고 오른쪽 값 가져오기</text>
<text x="37.0" y="42" class="s c mu">1번째</text>
<text x="91.0" y="42" class="s c mu">2번째</text>
<text x="148.0" y="42" class="s c mu">3번째</text>
<rect x="14" y="46" width="46" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="37.0" y="59.5" class="m c b">코드</text><rect x="60" y="46" width="62" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="91.0" y="59.5" class="m c b">품명</text><rect x="122" y="46" width="52" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="148.0" y="59.5" class="m c b">가격</text>
<rect x="14" y="66" width="46" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="37.0" y="80.5" class="m c">P01</text><rect x="60" y="66" width="62" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="91.0" y="80.5" class="m c">커피</text><rect x="122" y="66" width="52" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="148.0" y="80.5" class="m c">4,500</text>
<rect x="14" y="88" width="46" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="37.0" y="102.5" class="m c">P02</text><rect x="60" y="88" width="62" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="91.0" y="102.5" class="m c">케이크</text><rect x="122" y="88" width="52" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="148.0" y="102.5" class="m c">6,000</text>
<rect x="14" y="110" width="46" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="37.0" y="124.5" class="m c">P03</text><rect x="60" y="110" width="62" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="91.0" y="124.5" class="m c">쿠키</text><rect x="122" y="110" width="52" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="148.0" y="124.5" class="m c">2,000</text>
<rect x="14" y="132" width="46" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="37.0" y="146.5" class="m c">P04</text><rect x="60" y="132" width="62" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="91.0" y="146.5" class="m c">라떼</text><rect x="122" y="132" width="52" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="148.0" y="146.5" class="m c">5,000</text>
<g class="e1"><rect x="14" y="66" width="46" height="22" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity=".35"/></g>
<g class="e2"><rect x="14" y="88" width="46" height="22" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity=".35"/></g>
<g class="e3"><rect x="14" y="110" width="160" height="22" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity=".2"/><rect x="14" y="110" width="46" height="22" rx="2" fill="None" stroke="#f59e0b" stroke-width="2"/><rect x="122" y="110" width="52" height="22" rx="2" fill="None" stroke="#38bdf8" stroke-width="2"/></g>
<g class="e4"><line x1="62" y1="121" x2="120" y2="121" stroke="#38bdf8" stroke-width="2"/></g>
<text x="190" y="54" class="s mu">찾을 값</text><rect x="190" y="58" width="116" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/><text x="248.0" y="73.5" class="l c b a">P03</text>
<g class="e5"><text x="190" y="104" class="s mu">가져온 값</text><rect x="190" y="108" width="116" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/><text x="248.0" y="123.5" class="l c b k">2,000</text></g>
<text x="14" y="165" class="m b a">=VLOOKUP("P03", A2:C5, 3, FALSE)</text>
<text x="14" y="177" class="s mu">FALSE = 정확히 일치하는 값만</text>
<text x="160" y="190" class="s c mu">찾는 열은 맨 왼쪽 열 기준이라 왼쪽 값은 못 가져옴</text>
</svg>
