<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,7.9%{opacity:0}8%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,17.9%{opacity:0}18%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,27.9%{opacity:0}28%,96%{opacity:1}98%,100%{opacity:0}}.e4{transform-box:fill-box;transform-origin:50% 100%;animation:e4 4s linear infinite;}@keyframes e4{0%,35%{transform:scaleY(.05)}55%,100%{transform:scaleY(1)}}.e5{transform-box:fill-box;transform-origin:50% 100%;animation:e5 4s linear infinite;}@keyframes e5{0%,35%{transform:scaleY(.05)}61%,100%{transform:scaleY(1)}}.e6{transform-box:fill-box;transform-origin:50% 100%;animation:e6 4s linear infinite;}@keyframes e6{0%,35%{transform:scaleY(.05)}67%,100%{transform:scaleY(1)}}.e7{transform-box:fill-box;transform-origin:50% 100%;animation:e7 4s linear infinite;}@keyframes e7{0%,35%{transform:scaleY(.05)}73%,100%{transform:scaleY(1)}}.e8{animation:e8 4s linear infinite;}@keyframes e8{0%,40%{stroke-dashoffset:130}80%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
