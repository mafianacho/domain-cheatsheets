<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="INDEX-MATCH: MATCH로 몇 번째인지 찾고 INDEX로 그 번째 값을 꺼낸다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,21.9%{opacity:0}22%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,21.9%{opacity:0}22%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,51.9%{opacity:0}52%,96%{opacity:1}98%,100%{opacity:0}}.e4{animation:e4 4s linear infinite}@keyframes e4{0%,51.9%{opacity:0}52%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">INDEX + MATCH: 2단계로 찾기</text>
<rect x="24" y="32" width="62" height="18" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="55.0" y="44.5" class="s c mu">코드 열</text><rect x="136" y="32" width="70" height="18" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="171.0" y="44.5" class="s c mu">품명 열</text>
<rect x="24" y="52" width="62" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="55.0" y="65.5" class="m c">P01</text><rect x="136" y="52" width="70" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="171.0" y="65.5" class="m c">커피</text>
<rect x="24" y="72" width="62" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="55.0" y="85.5" class="m c">P02</text><rect x="136" y="72" width="70" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="171.0" y="85.5" class="m c">케이크</text>
<rect x="24" y="92" width="62" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="55.0" y="105.5" class="m c">P03</text><rect x="136" y="92" width="70" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="171.0" y="105.5" class="m c">쿠키</text>
<rect x="24" y="112" width="62" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="55.0" y="125.5" class="m c">P04</text><rect x="136" y="112" width="70" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="171.0" y="125.5" class="m c">라떼</text>
<g class="e1"><rect x="24" y="92" width="62" height="20" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" fill-opacity=".3"/><text x="92" y="106" class="l b a">①</text></g>
<g class="e2"><line x1="110" y1="102" x2="126" y2="102" stroke="#f59e0b" stroke-width="2"/><rect x="24" y="138" width="182" height="26" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/><text x="115" y="155" class="m c b a">MATCH → 3번째 줄 (몇 번째?)</text></g>
<g class="e3"><rect x="136" y="92" width="70" height="20" rx="2" fill="#38bdf8" stroke="#38bdf8" stroke-width="2" fill-opacity=".3"/><text x="212" y="106" class="l b k">②</text></g>
<g class="e4"><rect x="218" y="54" width="88" height="48" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/><text x="262" y="72" class="m c b k">INDEX</text><text x="262" y="86" class="s c">3번째 값 꺼내기</text><text x="262" y="98" class="m c b a">→ 쿠키</text></g>
<text x="14" y="176" class="m b a">=INDEX(B2:B5, MATCH("P03", A2:A5, 0))</text>
<text x="160" y="190" class="s c mu">VLOOKUP과 달리 찾는 열이 어느 쪽이든 가능</text>
</svg>
