<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="날짜 함수: 날짜는 숫자로 저장돼서 EDATE로 달을 더하고 빼기로 일수를 구할 수 있다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,25.9%{opacity:0}26%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,41.9%{opacity:0}42%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,57.9%{opacity:0}58%,96%{opacity:1}98%,100%{opacity:0}}.e4{animation:e4 4s linear infinite}@keyframes e4{0%,73.9%{opacity:0}74%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">날짜 함수: 날짜도 계산한다</text>
<rect x="14" y="34" width="150" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="89.0" y="48.5" class="m c b">A2  시작일</text><rect x="164" y="34" width="80" height="22" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="204.0" y="48.5" class="m c b">2026-11-02</text><text x="250" y="49" class="s mu">날짜 = 숫자</text>
<g class="e1"><rect x="14" y="60" width="150" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="89.0" y="74.5" class="m c b a">=EDATE(A2, 1)</text><rect x="164" y="60" width="80" height="22" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1"/><text x="204.0" y="74.5" class="m c b">2026-12-02</text><text x="250" y="75" class="s mu">한 달 뒤</text></g>
<g class="e2"><rect x="14" y="86" width="150" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="89.0" y="100.5" class="m c b a">=B2-A2</text><rect x="164" y="86" width="80" height="22" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1"/><text x="204.0" y="100.5" class="m c b">30</text><text x="250" y="101" class="s mu">일수 차이</text></g>
<g class="e3"><rect x="14" y="112" width="150" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="89.0" y="126.5" class="m c b a">=WEEKDAY(A2, 2)</text><rect x="164" y="112" width="80" height="22" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1"/><text x="204.0" y="126.5" class="m c b">1</text><text x="250" y="127" class="s mu">월요일 = 1</text></g>
<g class="e4"><rect x="14" y="138" width="150" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="89.0" y="152.5" class="m c b a">=TODAY()</text><rect x="164" y="138" width="80" height="22" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1"/><text x="204.0" y="152.5" class="m c b">오늘 날짜</text><text x="250" y="153" class="s mu">매번 바뀜</text></g>
<text x="160" y="190" class="s c mu">EDATE는 월을 더하고, 빼기는 날짜 사이 일수를 줌</text>
