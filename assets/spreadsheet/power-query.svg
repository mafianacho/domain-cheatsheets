<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="파워 쿼리: 여러 파일을 불러와 정리하는 단계를 기록해 두고 새로고침으로 다시 실행한다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite;}@keyframes e1{0%{transform:translateX(0);opacity:1}18%{transform:translateX(26px);opacity:1}22%,100%{transform:translateX(26px);opacity:0}}.e2{animation:e2 4s linear infinite;}@keyframes e2{0%,45%{transform:translateX(0);opacity:0}50%{transform:translateX(0);opacity:1}68%{transform:translateX(26px);opacity:1}72%,100%{transform:translateX(26px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
