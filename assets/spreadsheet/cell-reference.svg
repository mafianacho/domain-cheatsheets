<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="셀 참조: 상대 참조는 복사하면 따라 움직이고 절대 참조($)는 고정된다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,33.9%{opacity:0}34%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,33.9%{opacity:0}34%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,53.9%{opacity:0}54%,96%{opacity:1}98%,100%{opacity:0}}.e4{animation:e4 4s linear infinite}@keyframes e4{0%,53.9%{opacity:0}54%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">셀 참조: 아래로 복사하면?</text>
<rect x="14" y="34" width="140" height="112" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<rect x="166" y="34" width="140" height="112" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="84" y="52" class="l b k c">상대 참조  B2</text>
<text x="236" y="52" class="l b a c">절대 참조  $B$2</text>
<rect x="24" y="64" width="120" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="84.0" y="77.5" class="m c k b">=B2*C2</text>
<rect x="176" y="64" width="120" height="20" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1"/><text x="236.0" y="77.5" class="m c a b">=B2*$F$1</text>
<g class="e1"><rect x="24" y="88" width="120" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="84.0" y="101.5" class="m c k b">=B3*C3</text></g>
<g class="e2"><rect x="176" y="88" width="120" height="20" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1"/><text x="236.0" y="101.5" class="m c a b">=B3*$F$1</text></g>
<g class="e3"><rect x="24" y="112" width="120" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="84.0" y="125.5" class="m c k b">=B4*C4</text></g>
<g class="e4"><rect x="176" y="112" width="120" height="20" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1"/><text x="236.0" y="125.5" class="m c a b">=B4*$F$1</text></g>
<text x="84" y="140" class="s c mu">번호가 한 칸씩 따라 움직임</text>
<text x="236" y="140" class="s c mu">$ 붙은 칸은 그대로 고정</text>
<rect x="166" y="154" width="140" height="22" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="236" y="169" class="m c a b">$F$1 = 세율 칸 (고정)</text>
<text x="160" y="190" class="s c mu">수식을 아래로 끌어 복사했을 때 달라지는 것</text>
</svg>
