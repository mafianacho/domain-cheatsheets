<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="조건부 서식: 값이 조건에 맞으면 칸 색이나 글자 모양이 자동으로 바뀐다">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:10px}.t{font-size:13px;font-weight:700}.s{font-size:9px}.m{font-size:10px}.l{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}.e{text-anchor:end}.a{fill:#f59e0b}.k{fill:#38bdf8}.mu{fill:#94a3b8}.d{fill:#0f172a}.e1{animation:e1 4s linear infinite}@keyframes e1{0%,21.9%{opacity:0}22%,96%{opacity:1}98%,100%{opacity:0}}.e2{animation:e2 4s linear infinite}@keyframes e2{0%,35.9%{opacity:0}36%,96%{opacity:1}98%,100%{opacity:0}}.e3{animation:e3 4s linear infinite}@keyframes e3{0%,49.9%{opacity:0}50%,96%{opacity:1}98%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" class="t">조건부 서식: 조건이면 자동 색칠</text>
<rect x="14" y="32" width="90" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="59.0" y="45.5" class="m c b">품목</text><rect x="104" y="32" width="60" height="20" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/><text x="134.0" y="45.5" class="m c b">재고</text>
<rect x="14" y="52" width="90" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="59.0" y="65.5" class="m c">커피콩</text><rect x="104" y="52" width="60" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="134.0" y="65.5" class="m c">12</text>
<rect x="14" y="72" width="90" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="59.0" y="85.5" class="m c">우유</text><rect x="104" y="72" width="60" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="134.0" y="85.5" class="m c">3</text>
<g class="e1"><rect x="14" y="72" width="150" height="20" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity=".38"/></g>
<rect x="14" y="92" width="90" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="59.0" y="105.5" class="m c">컵</text><rect x="104" y="92" width="60" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="134.0" y="105.5" class="m c">25</text>
<rect x="14" y="112" width="90" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="59.0" y="125.5" class="m c">시럽</text><rect x="104" y="112" width="60" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="134.0" y="125.5" class="m c">4</text>
<g class="e2"><rect x="14" y="112" width="150" height="20" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity=".38"/></g>
<rect x="14" y="132" width="90" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="59.0" y="145.5" class="m c">얼음</text><rect x="104" y="132" width="60" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="134.0" y="145.5" class="m c">18</text>
<rect x="14" y="152" width="90" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="59.0" y="165.5" class="m c">빨대</text><rect x="104" y="152" width="60" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="134.0" y="165.5" class="m c">2</text>
<g class="e3"><rect x="14" y="152" width="150" height="20" rx="2" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity=".38"/></g>
<rect x="180" y="32" width="126" height="74" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="243" y="50" class="m c b a">규칙</text><text x="243" y="68" class="l c b">재고 &lt; 5</text><text x="243" y="84" class="m c">→ 주황 배경</text><text x="243" y="99" class="s c mu">값이 바뀌면 색도 따라 바뀜</text>
<text x="180" y="128" class="s mu">서식 &gt; 조건부 서식 (Excel: 홈 탭)</text>
<text x="160" y="190" class="s c mu">재고 부족 같은 이상 값을 한눈에</text>
</svg>
