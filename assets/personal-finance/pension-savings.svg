<text class="c s" x="242" y="90">은퇴 후 나눠서</text>
<polygon points="148,80 168,80 168,74 178,83 168,92 168,86 148,86" fill="#475569"/>
<circle class="slx" cx="40" cy="104" r="6" fill="#f59e0b" style="--d:60px"/>
<text class="m ac" x="16" y="140">연 600만원까지 세액공제 대상</text>
<text class="m" x="16" y="160">받을 때는 연금소득으로 과세</text>
</svg>
