<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="비과세 분리과세 종합과세 세 칸에 동전이 차례로 떨어지는 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.ac{fill:#f59e0b}.sk{fill:#38bdf8}.mu{fill:#94a3b8}.b{font-weight:700}.fb{transform-box:fill-box}.ob{transform-box:fill-box;transform-origin:bottom}.ol{transform-box:fill-box;transform-origin:left}.oc{transform-box:fill-box;transform-origin:center}@keyframes pul{0%,100%{opacity:.3}50%{opacity:1}}@keyframes slx{0%,10%{transform:translateX(0)}55%,80%{transform:translateX(var(--d))}100%{transform:translateX(0)}}@keyframes sly{0%,10%{transform:translateY(0)}55%,80%{transform:translateY(var(--d))}100%{transform:translateY(0)}}@keyframes grw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}@keyframes grx{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}@keyframes blk{0%,49%{opacity:1}50%,100%{opacity:.15}}@keyframes tilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}.pul{animation:pul 3s ease-in-out infinite}.slx{animation:slx 3s ease-in-out infinite}.sly{animation:sly 3s ease-in-out infinite}.grw{animation:grw 3s ease-in-out infinite}.grx{animation:grx 3s ease-in-out infinite}.blk{animation:blk 1.5s steps(1) infinite}.d1{animation-delay:-.5s}.d2{animation-delay:-1s}.d3{animation-delay:-1.5s}.d4{animation-delay:-2s}.d5{animation-delay:-2.5s}@keyframes mv{0%,10%{transform:translate(0,0)}60%,80%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}.mv{animation:mv 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="26">비과세 · 분리과세</text>
<text class="s" x="16" y="188">같은 이자·배당도 세금 방식이 다르다</text>
<rect x="16" y="44" width="92" height="112" rx="8" fill="#1e293b" />
<rect x="16" y="44" width="92" height="112" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" />
<text class="c b" x="62" y="66" style="font-size:12px">비과세</text>
<text class="c s" x="62" y="130">세금 없음</text>
<circle class="sly d1" cx="62" cy="86" r="7" fill="#38bdf8" style="--d:24px"/>
<rect x="116" y="44" width="92" height="112" rx="8" fill="#1e293b" />
<rect x="116" y="44" width="92" height="112" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5" />
<text class="c b" x="162" y="66" style="font-size:12px">분리과세</text>
<text class="c s" x="162" y="130">정해진 세율로</text>
<text class="c s" x="162" y="142">세금 끝</text>
<circle class="sly d3" cx="162" cy="86" r="7" fill="#f59e0b" style="--d:24px"/>
<rect x="216" y="44" width="92" height="112" rx="8" fill="#1e293b" />
<rect x="216" y="44" width="92" height="112" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" />
<text class="c b" x="262" y="66" style="font-size:12px">종합과세</text>
<text class="c s" x="262" y="130">다른 소득과</text>
<text class="c s" x="262" y="142">합쳐서 계산</text>
<circle class="sly d5" cx="262" cy="86" r="7" fill="#94a3b8" style="--d:24px"/>
</svg>
