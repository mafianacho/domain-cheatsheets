<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="바늘이 낮음에서 높음 사이를 움직이는 신용점수 반원 계기판 그림">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:14px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.ac{fill:#f59e0b}.sk{fill:#38bdf8}.mu{fill:#94a3b8}.b{font-weight:700}.fb{transform-box:fill-box}.ob{transform-box:fill-box;transform-origin:bottom}.ol{transform-box:fill-box;transform-origin:left}.oc{transform-box:fill-box;transform-origin:center}@keyframes pul{0%,100%{opacity:.3}50%{opacity:1}}@keyframes slx{0%,10%{transform:translateX(0)}55%,80%{transform:translateX(var(--d))}100%{transform:translateX(0)}}@keyframes sly{0%,10%{transform:translateY(0)}55%,80%{transform:translateY(var(--d))}100%{transform:translateY(0)}}@keyframes grw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}@keyframes grx{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}@keyframes blk{0%,49%{opacity:1}50%,100%{opacity:.15}}@keyframes tilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}.pul{animation:pul 3s ease-in-out infinite}.slx{animation:slx 3s ease-in-out infinite}.sly{animation:sly 3s ease-in-out infinite}.grw{animation:grw 3s ease-in-out infinite}.grx{animation:grx 3s ease-in-out infinite}.blk{animation:blk 1.5s steps(1) infinite}.d1{animation-delay:-.5s}.d2{animation-delay:-1s}.d3{animation-delay:-1.5s}.d4{animation-delay:-2s}.d5{animation-delay:-2.5s}@keyframes mv{0%,10%{transform:translate(0,0)}60%,80%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}.mv{animation:mv 3s ease-in-out infinite}@keyframes nd{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(55deg)}}.nd{animation:nd 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="26">신용점수 · Credit Score</text>
<text class="s" x="16" y="188">빌린 돈을 잘 갚을 사람인지 점수로 매긴 것</text>
<path d="M70 150 A90 90 0 0 1 250 150" fill="none" stroke="#334155" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
<path d="M160 60 A90 90 0 0 1 250 150" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
<line class="nd" x1="160" y1="150" x2="160" y2="82" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" style="transform-origin:160px 150px"/>
<circle cx="160" cy="150" r="7" fill="#e2e8f0" />
