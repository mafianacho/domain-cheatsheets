<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="여기를 클릭 같은 링크 글자와 성수동 케이크 주문 방법처럼 목적지를 설명하는 링크 글자를 비교하는 앵커 텍스트 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes an0k{0%,49.99%{opacity:1}50.00%,100%{opacity:0}}.an0{opacity:0;animation:an0k 4.4s infinite}@keyframes an1k{0%,49.99%{opacity:0}50.00%,100%{opacity:1}}.an1{opacity:1;animation:an1k 4.4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
