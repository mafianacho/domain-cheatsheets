<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="광고 협찬 링크에는 sponsored, 댓글과 게시판 링크에는 ugc, 그 밖에는 nofollow를 붙이는 링크 속성 구분 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes lk0k{0%,33.32%{opacity:1}33.33%,100%{opacity:0}}.lk0{opacity:0;animation:lk0k 4.5s infinite}@keyframes lk1k{0%,33.32%{opacity:0}33.33%,66.66%{opacity:1}66.67%,100%{opacity:0}}.lk1{opacity:0;animation:lk1k 4.5s infinite}@keyframes lk2k{0%,66.66%{opacity:0}66.67%,100%{opacity:1}}.lk2{opacity:1;animation:lk2k 4.5s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">링크 속성 · rel nofollow sponsored ugc</text>
<rect x="16" y="38" width="288" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="58" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">rel="sponsored"</text><text x="138" y="58" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">광고·협찬·유료 링크</text><g class="lk0"><rect x="13" y="35" width="294" height="38" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><rect x="16" y="78" width="288" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="98" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">rel="ugc"</text><text x="138" y="98" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">댓글·게시판 등 이용자가 쓴 링크</text><g class="lk1"><rect x="13" y="75" width="294" height="38" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><rect x="16" y="118" width="288" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="138" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">rel="nofollow"</text><text x="138" y="138" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">그 밖에 "보증하지 않음" 링크</text><g class="lk2"><rect x="13" y="115" width="294" height="38" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><text x="160" y="170" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">보통의 외부 링크는 아무것도 안 붙여도 돼요</text><text x="160" y="186" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">&lt;a rel="…"&gt; 처럼 링크 태그에 붙여요</text>
</svg>
