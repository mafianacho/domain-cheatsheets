<style>.f{transform-box:fill-box;transform-origin:center}@keyframes sb0k{0%,9.99%{opacity:0}10.00%,93%{opacity:1}98%,100%{opacity:0}}.sb0{opacity:1;animation:sb0k 4.6s infinite}@keyframes sb1k{0%,23.74%{opacity:0}23.75%,93%{opacity:1}98%,100%{opacity:0}}.sb1{opacity:1;animation:sb1k 4.6s infinite}@keyframes sb2k{0%,37.49%{opacity:0}37.50%,93%{opacity:1}98%,100%{opacity:0}}.sb2{opacity:1;animation:sb2k 4.6s infinite}@keyframes sb3k{0%,51.24%{opacity:0}51.25%,93%{opacity:1}98%,100%{opacity:0}}.sb3{opacity:1;animation:sb3k 4.6s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
