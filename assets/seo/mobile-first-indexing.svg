<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="구글 봇이 데스크톱이 아니라 폰 화면 버전을 읽기 때문에 폰에 없는 후기 칸은 반영되지 않을 수 있는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes mbk{0%,100%{transform:translate(128px,90px)}50%{transform:translate(122px,90px)}}.mb{transform:translate(128px,90px);animation:mbk 3.2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
