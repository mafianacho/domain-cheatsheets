<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">모바일 우선 색인 · Mobile-first Indexing</text>
<rect x="24" y="38" width="62" height="104" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/><rect x="34" y="50" width="42" height="10" rx="3" fill="#f59e0b"/><rect x="34" y="66" width="42" height="28" rx="3" fill="#334155"/><text x="55" y="156" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">폰 버전</text><text x="55" y="170" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">(후기 없음)</text><g class="mb"><rect x="-11" y="-7" width="22" height="15" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><circle cx="-4" cy="0" r="2" fill="#38bdf8"/><circle cx="4" cy="0" r="2" fill="#38bdf8"/><line x1="0" y1="-7" x2="0" y2="-12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/><circle cx="0" cy="-13" r="1.8" fill="#38bdf8"/></g><line x1="114" y1="90" x2="94.0" y2="90.0" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><polygon points="92,90 97.3,87.1 97.3,92.9" fill="#38bdf8"/><rect x="160" y="48" width="144" height="92" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="170" y="58" width="124" height="10" rx="3" fill="#f59e0b"/><rect x="170" y="74" width="124" height="24" rx="3" fill="#334155"/><g class="dk"><rect x="170" y="106" width="124" height="24" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/><text x="232" y="122" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">후기 (폰엔 없음)</text></g><text x="232" y="156" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">데스크톱 버전</text><text x="160" y="182" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구글은 폰 화면 버전을 기준으로 읽어요</text>
