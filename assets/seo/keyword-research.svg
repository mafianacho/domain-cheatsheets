<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="검색어 후보마다 검색하는 사람 수를 막대로 비교해 구체적인 검색어를 고르는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}.gb{transform-box:fill-box;transform-origin:left center}@keyframes gk{0%,8%{transform:scaleX(0)}45%,100%{transform:scaleX(1)}}.gb{animation:gk 4s ease-out infinite}@keyframes hk{0%,55%{opacity:0}70%,92%{opacity:1}100%{opacity:0}}.k0{opacity:1;animation:hk 4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">키워드 조사 · Keyword Research</text>
<text x="16" y="44" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">검색어 후보</text><text x="296" y="44" font-size="9" fill="#94a3b8" text-anchor="end" font-family="system-ui, sans-serif">검색하는 사람 수(상대)</text><text x="16" y="67" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">케이크</text><rect x="156" y="57" width="140" height="14" rx="4" fill="#1e293b"/><rect x="156" y="57" width="140" height="14" rx="4" fill="#38bdf8" class="gb"/><text x="16" y="101" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">성수동 케이크</text><rect x="156" y="91" width="140" height="14" rx="4" fill="#1e293b"/><rect x="156" y="91" width="84" height="14" rx="4" fill="#38bdf8" class="gb"/><text x="16" y="135" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">성수동 딸기 케이크 주문</text><rect x="156" y="125" width="140" height="14" rx="4" fill="#1e293b"/><rect x="156" y="125" width="30" height="14" rx="4" fill="#f59e0b" class="gb"/><g class="k0"><rect x="10" y="114" width="300" height="30" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/></g><text x="160" y="166" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">검색량이 큰 말은 경쟁도 커요</text><text x="160" y="182" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">손님이 실제로 쓰는 구체적인 말을 모아 고르세요</text>
</svg>
