<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="같은 없는 페이지 안내 화면인데 상태 코드가 404면 정상이고 200이면 소프트 404 문제라는 비교 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes cc0k{0%,9.99%{opacity:0}10.00%,93%{opacity:1}98%,100%{opacity:0}}.cc0{opacity:1;animation:cc0k 4.4s infinite}@keyframes cc1k{0%,26.66%{opacity:0}26.67%,93%{opacity:1}98%,100%{opacity:0}}.cc1{opacity:1;animation:cc1k 4.4s infinite}@keyframes cc2k{0%,43.32%{opacity:0}43.33%,93%{opacity:1}98%,100%{opacity:0}}.cc2{opacity:1;animation:cc2k 4.4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">404와 소프트 404</text>
<rect x="14" y="36" width="140" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><rect x="166" y="36" width="140" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="84" y="56" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">정상 404</text><text x="236" y="56" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">소프트 404</text><text x="84" y="80" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">없는 페이지예요</text><text x="236" y="80" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">없는 페이지예요</text><g class="cc0"><rect x="58" y="92" width="52" height="22" rx="5" fill="#38bdf8"/><text x="84.0" y="107.2" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">404</text></g><g class="cc1"><rect x="210" y="92" width="52" height="22" rx="5" fill="#f59e0b"/><text x="236.0" y="107.2" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">200</text></g><g class="cc0"><text x="84" y="146" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">없다고 정직하게 알림</text><path d="M145 142 L149 146 L156 137" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="cc2"><text x="236" y="146" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">코드는 "성공" 이라 문제</text></g><text x="160" y="172" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">내용이 없으면 404, 이사했으면 301</text><text x="160" y="188" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">상태 코드(숫자)가 페이지 내용과 같아야 해요</text>
</svg>
