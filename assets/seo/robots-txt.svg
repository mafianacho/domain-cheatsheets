<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="robots.txt 안내문에 따라 봇이 허용된 /blog/ 문으로는 들어가고 막힌 /admin/ 문 앞에서는 돌아서는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes r1k{0%,4%{transform:translate(164px,60px);opacity:1}28%{transform:translate(196px,60px);opacity:1}34%,100%{transform:translate(204px,60px);opacity:0}}.rb1{transform:translate(164px,60px);animation:r1k 5s ease-in-out infinite}@keyframes r2k{0%,44%{transform:translate(164px,112px);opacity:1}62%{transform:translate(190px,112px);opacity:1}72%{transform:translate(176px,112px)}86%,100%{transform:translate(164px,112px);opacity:1}}.rb2{transform:translate(164px,112px);animation:r2k 5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
