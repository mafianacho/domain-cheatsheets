334155" stroke="#38bdf8" stroke-width="1.5"/><circle cx="-4" cy="0" r="2" fill="#38bdf8"/><circle cx="4" cy="0" r="2" fill="#38bdf8"/><line x1="0" y1="-7" x2="0" y2="-12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/><circle cx="0" cy="-13" r="1.8" fill="#38bdf8"/></g><text x="160" y="158" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">※ 막아도 주소가 검색에 보일 수 있어요</text><text x="160" y="172" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">숨기려면 비밀번호나 noindex를 쓰세요</text><text x="160" y="189" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">봇에게 가도 되는 길 · 안 되는 길을 알려요</text>
