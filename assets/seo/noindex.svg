<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="noindex 표시가 있는 감사 페이지가 검색 결과 목록에서 사라지고 점선 빈칸만 남는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes n0{0%,30%{opacity:1}42%,100%{opacity:0}}@keyframes n1{0%,30%{opacity:0}42%,100%{opacity:1}}.ni0{opacity:0;animation:n0 4.2s infinite}.ni1{opacity:1;animation:n1 4.2s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">noindex · 검색 결과에서 빼기</text>
<rect x="16" y="34" width="288" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="160" y="51" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">&lt;meta name="robots" content="noindex"&gt;</text><text x="160" y="76" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">검색 결과 목록</text><rect x="24" y="84" width="272" height="22" rx="5" fill="#334155"/><text x="34" y="99" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">공개 페이지 (메뉴)</text><g class="ni0"><rect x="24" y="110" width="272" height="22" rx="5" fill="#334155"/><text x="34" y="125" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">감사 페이지 (noindex)</text></g><g class="ni1"><rect x="24" y="110" width="272" height="22" rx="5" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/><text x="160" y="125" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">(검색 결과에서 빠짐)</text></g><rect x="24" y="136" width="272" height="22" rx="5" fill="#334155"/><text x="34" y="151" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">공개 페이지 (후기)</text><text x="160" y="176" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">※ robots.txt로 막으면 봇이 이 줄을 못 읽어요</text><text x="160" y="190" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">검색에서 빼려면 막지 말고 noindex를 읽게 두세요</text>
</svg>
