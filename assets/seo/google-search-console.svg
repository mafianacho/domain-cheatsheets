<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Search Console 화면에서 실적, URL 검사, 페이지, 사이트맵 메뉴를 차례로 짚고 클릭 그래프가 올라가는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes mn0k{0%,24.99%{opacity:1}25.00%,100%{opacity:0}}.mn0{opacity:0;animation:mn0k 5s infinite}@keyframes mn1k{0%,24.99%{opacity:0}25.00%,49.99%{opacity:1}50.00%,100%{opacity:0}}.mn1{opacity:0;animation:mn1k 5s infinite}@keyframes mn2k{0%,49.99%{opacity:0}50.00%,74.99%{opacity:1}75.00%,100%{opacity:0}}.mn2{opacity:0;animation:mn2k 5s infinite}@keyframes mn3k{0%,74.99%{opacity:0}75.00%,100%{opacity:1}}.mn3{opacity:1;animation:mn3k 5s infinite}@keyframes lck{0%{stroke-dashoffset:260}60%,100%{stroke-dashoffset:0}}.lc{stroke-dasharray:260;stroke-dashoffset:0;animation:lck 5s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구글 서치 콘솔 · Search Console</text>
<rect x="14" y="32" width="292" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="14" y="32" width="76" height="150" rx="8" fill="#334155"/><text x="24" y="59" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">실적</text><g class="mn0"><rect x="18" y="46" width="68" height="20" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/></g><text x="24" y="85" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">URL 검사</text><g class="mn1"><rect x="18" y="72" width="68" height="20" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/></g><text x="24" y="111" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">페이지</text><g class="mn2"><rect x="18" y="98" width="68" height="20" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/></g><text x="24" y="137" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">사이트맵</text><g class="mn3"><rect x="18" y="124" width="68" height="20" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/></g><text x="102" y="52" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">클릭 · 노출</text><line x1="102" y1="150" x2="296" y2="150" stroke="#475569" stroke-width="1" stroke-linecap="round"/><line x1="102" y1="70" x2="102" y2="150" stroke="#475569" stroke-width="1" stroke-linecap="round"/><path d="M104 140 L132 128 L160 132 L190 110 L220 100 L250 84 L294 76" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lc" stroke-dasharray="260" stroke-dashoffset="0"/><path d="M104 144 L132 140 L160 140 L190 130 L220 126 L250 118 L294 112" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lc"/><text x="102" y="166" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">많이 검색된 말 · 문제 있는 페이지</text>
