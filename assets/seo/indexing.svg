<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="봇이 읽은 글 A와 글 B는 색인 보관함으로 들어가고 품질이 낮은 글 C는 들어가지 못하는 색인 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes p0{0%,8%{transform:translateX(0);opacity:1}30%{transform:translateX(150px);opacity:1}36%,100%{transform:translateX(150px);opacity:0}}@keyframes p1{0%,28%{transform:translateX(0);opacity:1}50%{transform:translateX(150px);opacity:1}56%,100%{transform:translateX(150px);opacity:0}}.pg0{animation:p0 5s ease-in-out infinite}.pg1{animation:p1 5s ease-in-out infinite}@keyframes ix0k{0%,30%{opacity:0}34%,92%{opacity:1}100%{opacity:0}}.ix0{opacity:1;animation:ix0k 5s infinite}@keyframes ix1k{0%,50%{opacity:0}54%,92%{opacity:1}100%{opacity:0}}.ix1{opacity:1;animation:ix1k 5s infinite}@keyframes nxk{0%,66%{opacity:0}72%,92%{opacity:1}100%{opacity:0}}.nx{opacity:1;animation:nxk 5s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">색인 · Indexing</text>
<rect x="190" y="40" width="114" height="124" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="247" y="130" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">색인(보관함)</text><rect x="204" y="50" width="86" height="16" rx="4" fill="#334155" class="ix0"/><rect x="204" y="74" width="86" height="16" rx="4" fill="#334155" class="ix1"/><text x="247" y="148" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">여기 있어야 검색돼요</text><g class="pg0"><rect x="24" y="40" width="28" height="36" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><line x1="30" y1="49" x2="46" y2="49" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><line x1="30" y1="56" x2="40" y2="56" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="60" y="62" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">글 A</text></g><g class="pg1"><rect x="24" y="86" width="28" height="36" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><line x1="30" y1="95" x2="46" y2="95" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><line x1="30" y1="102" x2="40" y2="102" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="60" y="108" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">글 B</text></g><g class="pg2"><rect x="24" y="132" width="28" height="36" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/><line x1="30" y1="141" x2="46" y2="141" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><line x1="30" y1="148" x2="40" y2="148" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text x="60" y="154" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">글 C</text></g><g class="nx"><g><line x1="30" y1="142" x2="46" y2="158" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="158" x2="46" y2="142" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/></g><text x="96" y="148" font-size="9" fill="#f59e0b" text-anchor="start" font-family="system-ui, sans-serif">품질이 낮거나</text><text x="96" y="160" font-size="9" fill="#f59e0b" text-anchor="start" font-family="system-ui, sans-serif">noindex면 제외</text></g><text x="160" y="190" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">읽은 내용을 분석해 보관함에 넣는 단계</text>
</svg>
