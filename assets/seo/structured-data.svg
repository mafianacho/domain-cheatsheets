<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="페이지 내용을 JSON-LD 코드로 적으면 검색엔진이 종류, 이름, 가격, 별점으로 읽어 가는 구조화된 데이터 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes sd0k{0%,9.99%{opacity:0}10.00%,93%{opacity:1}98%,100%{opacity:0}}.sd0{opacity:1;animation:sd0k 4.4s infinite}@keyframes sd1k{0%,23.74%{opacity:0}23.75%,93%{opacity:1}98%,100%{opacity:0}}.sd1{opacity:1;animation:sd1k 4.4s infinite}@keyframes sd2k{0%,37.49%{opacity:0}37.50%,93%{opacity:1}98%,100%{opacity:0}}.sd2{opacity:1;animation:sd2k 4.4s infinite}@keyframes sd3k{0%,51.24%{opacity:0}51.25%,93%{opacity:1}98%,100%{opacity:0}}.sd3{opacity:1;animation:sd3k 4.4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구조화된 데이터 · Structured Data</text>
<rect x="14" y="34" width="150" height="124" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="22" y="48" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">JSON-LD</text><text x="22" y="66" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">{</text><text x="34" y="80" font-size="9" fill="#f59e0b" text-anchor="start" font-family="system-ui, sans-serif">"@type": "Product",</text><text x="34" y="94" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">"name": "딸기 케이크",</text><text x="34" y="108" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">"price": "32000",</text><text x="34" y="122" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">"ratingValue": "4.8"</text><text x="22" y="136" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">}</text><line x1="166" y1="96" x2="180.0" y2="96.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><polygon points="182,96 176.7,98.9 176.7,93.1" fill="#f59e0b"/><rect x="184" y="34" width="122" height="124" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="245" y="48" font-size="9" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">검색엔진이 읽은 것</text><g class="sd0"><rect x="192" y="62" width="106" height="18" rx="4" fill="#334155"/><text x="198" y="75" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">종류</text><text x="292" y="75" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">상품</text></g><g class="sd1"><rect x="192" y="84" width="106" height="18" rx="4" fill="#334155"/><text x="198" y="97" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">이름</text><text x="292" y="97" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">딸기 케이크</text></g><g class="sd2"><rect x="192" y="106" width="106" height="18" rx="4" fill="#334155"/><text x="198" y="119" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">가격</text><text x="292" y="119" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">32,000원</text></g><g class="sd3"><rect x="192" y="128" width="106" height="18" rx="4" fill="#334155"/><text x="198" y="141" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">별점</text><text x="292" y="141" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">4.8</text></g><text x="160" y="176" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">페이지 내용을 "이름표"로 정리해 알려줘요</text><text x="160" y="190" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">화면에 보이는 내용과 같아야 해요</text>
</svg>
