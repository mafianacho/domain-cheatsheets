<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="서버가 내용을 채워 보내는 SSR과 브라우저가 JS로 나중에 채우는 CSR에서 봇이 처음 받는 페이지를 비교하는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes ct0k{0%,49.99%{opacity:1}50.00%,100%{opacity:0}}.ct0{opacity:0;animation:ct0k 4.6s infinite}@keyframes ct1k{0%,49.99%{opacity:0}50.00%,100%{opacity:1}}.ct1{opacity:1;animation:ct1k 4.6s infinite}@keyframes flk{0%,50%{opacity:0}56%,100%{opacity:1}}.fl{opacity:1;animation:flk 4.6s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
