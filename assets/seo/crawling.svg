" width="28" height="36" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/><line x1="246" y1="103" x2="262" y2="103" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><line x1="246" y1="110" x2="256" y2="110" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><g class="lit2"><rect x="238" y="92" width="32" height="40" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><text x="254" y="143" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">글 C</text><g class="bt"><rect x="-11" y="-7" width="22" height="15" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><circle cx="-4" cy="0" r="2" fill="#38bdf8"/><circle cx="4" cy="0" r="2" fill="#38bdf8"/><line x1="0" y1="-7" x2="0" y2="-12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/><circle cx="0" cy="-13" r="1.8" fill="#38bdf8"/></g><text x="160" y="190" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">봇이 링크를 따라 새 페이지를 발견해요</text>
