<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="봇이 홈에서 출발해 링크를 따라 글 A, 글 C, 글 B로 이동하며 페이지를 발견하는 크롤링 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes btk{0%,6%{transform:translate(44px,76px)}26%,34%{transform:translate(140px,46px)}56%,64%{transform:translate(254px,76px)}86%,94%{transform:translate(140px,110px)}100%{transform:translate(44px,76px)}}.bt{transform:translate(44px,76px);animation:btk 5s ease-in-out infinite}@keyframes lit1k{0%,25%{opacity:0}26%,98%{opacity:1}100%{opacity:0}}.lit1{opacity:1;animation:lit1k 5s infinite}@keyframes lit2k{0%,55%{opacity:0}56%,98%{opacity:1}100%{opacity:0}}.lit2{opacity:1;animation:lit2k 5s infinite}@keyframes lit3k{0%,85%{opacity:0}86%,98%{opacity:1}100%{opacity:0}}.lit3{opacity:1;animation:lit3k 5s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
