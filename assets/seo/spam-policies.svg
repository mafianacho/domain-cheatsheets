<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="키워드 도배, 숨은 글자, 링크 매매, 자동 대량 생산 네 가지 꼼수에 차례로 엑스 표시가 붙는 스팸 정책 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes sp0k{0%,7.99%{opacity:0}8.00%,93%{opacity:1}98%,100%{opacity:0}}.sp0{opacity:1;animation:sp0k 4.4s infinite}@keyframes sp1k{0%,20.99%{opacity:0}21.00%,93%{opacity:1}98%,100%{opacity:0}}.sp1{opacity:1;animation:sp1k 4.4s infinite}@keyframes sp2k{0%,33.99%{opacity:0}34.00%,93%{opacity:1}98%,100%{opacity:0}}.sp2{opacity:1;animation:sp2k 4.4s infinite}@keyframes sp3k{0%,46.99%{opacity:0}47.00%,93%{opacity:1}98%,100%{opacity:0}}.sp3{opacity:1;animation:sp3k 4.4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">스팸 정책 · Spam Policies</text>
<rect x="16" y="36" width="288" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="51" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">같은 키워드를 억지로 도배</text><g class="sp0"><line x1="279" y1="42" x2="289" y2="52" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="279" y1="52" x2="289" y2="42" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/></g><rect x="16" y="64" width="288" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="79" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">사람 눈엔 안 보이는 숨은 글자·링크</text><g class="sp1"><line x1="279" y1="70" x2="289" y2="80" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="279" y1="80" x2="289" y2="70" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/></g><rect x="16" y="92" width="288" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="107" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">링크를 돈 주고 사고팔기</text><g class="sp2"><line x1="279" y1="98" x2="289" y2="108" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="279" y1="108" x2="289" y2="98" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/></g><rect x="16" y="120" width="288" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="135" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">저품질 글을 자동으로 대량 생산</text><g class="sp3"><line x1="279" y1="126" x2="289" y2="136" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><line x1="279" y1="136" x2="289" y2="126" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/></g><text x="160" y="158" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">순위가 내려가거나 검색에서 빠질 수 있어요</text><text x="160" y="175" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">검색엔진을 속이려는 꼼수는 오래 못 가요</text><text x="160" y="190" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">네이버도 도배·숨은 글자를 스팸으로 봐요</text>
</svg>
