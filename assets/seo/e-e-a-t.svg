<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="경험, 전문성, 권위, 신뢰성 네 칸이 차례로 켜지는 E-E-A-T 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes ee0k{0%,7.99%{opacity:0}8.00%,93%{opacity:1}98%,100%{opacity:0}}.ee0{opacity:1;animation:ee0k 4.6s infinite}@keyframes ee1k{0%,23.49%{opacity:0}23.50%,93%{opacity:1}98%,100%{opacity:0}}.ee1{opacity:1;animation:ee1k 4.6s infinite}@keyframes ee2k{0%,38.99%{opacity:0}39.00%,93%{opacity:1}98%,100%{opacity:0}}.ee2{opacity:1;animation:ee2k 4.6s infinite}@keyframes ee3k{0%,54.49%{opacity:0}54.50%,93%{opacity:1}98%,100%{opacity:0}}.ee3{opacity:1;animation:ee3k 4.6s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">E-E-A-T · 믿을 만한 글인가</text>
<rect x="18" y="34" width="134" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="85" y="50" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">Experience</text><text x="85" y="66" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">경험</text><text x="85" y="80" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">직접 써 본 이야기</text><g class="ee0"><rect x="16" y="32" width="138" height="56" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><rect x="168" y="34" width="134" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="235" y="50" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">Expertise</text><text x="235" y="66" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">전문성</text><text x="235" y="80" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">아는 사람이 썼나</text><g class="ee1"><rect x="166" y="32" width="138" height="56" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><rect x="18" y="96" width="134" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="85" y="112" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">Authoritativeness</text><text x="85" y="128" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">권위</text><text x="85" y="142" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">다른 곳이 인정하나</text><g class="ee2"><rect x="16" y="94" width="138" height="56" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><rect x="168" y="96" width="134" height="52" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="235" y="112" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">Trustworthiness</text><text x="235" y="128" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">신뢰성</text><text x="235" y="142" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">정확하고 투명한가</text><g class="ee3"><rect x="166" y="94" width="138" height="56" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><text x="160" y="166" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">글쓴이·출처·사이트 정보로 "믿을 만한 글인가"를 보는 관점</text><text x="160" y="181" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">(구글 검색 품질 평가 가이드라인에서 쓰는 말)</text>
