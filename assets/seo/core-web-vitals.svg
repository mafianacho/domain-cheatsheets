<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="로딩 속도 LCP, 반응 속도 INP, 화면 흔들림 CLS 세 가지 지표의 좋은 기준 구간으로 표시가 들어오는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes mk0k{0%,10%{transform:translate(228px,48px)}55%,100%{transform:translate(180px,48px)}}.mk0{transform:translate(180px,48px);animation:mk0k 4s ease-in-out infinite}@keyframes mk1k{0%,10%{transform:translate(228px,96px)}55%,100%{transform:translate(180px,96px)}}.mk1{transform:translate(180px,96px);animation:mk1k 4s ease-in-out infinite}@keyframes mk2k{0%,10%{transform:translate(228px,144px)}55%,100%{transform:translate(180px,144px)}}.mk2{transform:translate(180px,144px);animation:mk2k 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">핵심 웹 지표 · Core Web Vitals</text>
<text x="16" y="52" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">LCP · 로딩</text><text x="16" y="65" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">가장 큰 내용이 뜨는 시간</text><rect x="168" y="42" width="70" height="12" rx="6" fill="#334155"/><rect x="168" y="42" width="24" height="12" rx="6" fill="#38bdf8"/><text x="246" y="52" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">2.5초 이하</text><g class="mk0"><circle cx="0" cy="0" r="5" fill="#f59e0b"/></g><text x="16" y="100" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">INP · 반응</text><text x="16" y="113" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">누른 뒤 반응하는 시간</text><rect x="168" y="90" width="70" height="12" rx="6" fill="#334155"/><rect x="168" y="90" width="24" height="12" rx="6" fill="#38bdf8"/><text x="246" y="100" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">200ms 이하</text><g class="mk1"><circle cx="0" cy="0" r="5" fill="#f59e0b"/></g><text x="16" y="148" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">CLS · 안정</text><text x="16" y="161" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">화면이 덜컥 밀리는 정도</text><rect x="168" y="138" width="70" height="12" rx="6" fill="#334155"/><rect x="168" y="138" width="24" height="12" rx="6" fill="#38bdf8"/><text x="246" y="148" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">0.1 이하</text><g class="mk2"><circle cx="0" cy="0" r="5" fill="#f59e0b"/></g><text x="160" y="184" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">방문의 75%가 이 기준을 넘어야 "좋음"</text>
</svg>
