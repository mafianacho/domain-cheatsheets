<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="자유로운 문장이 이름, 나이, 도시 항목을 가진 정해진 틀로 바뀌는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">구조화 출력 = 정해진 틀로 답하게</text>
<rect class="" x="12" y="60" width="104" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="m" x="22" y="84">김민, 20살,</text>
<text class="m" x="22" y="102">서울에 삽니다</text>
<text class="s" x="22" y="120">(자유로운 문장)</text>
<line x1="116" y1="95" x2="139.0" y2="95.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><polygon points="146,95 139.0,99.0 139.0,91.0" fill="#f59e0b"/>
<rect class="" x="150" y="44" width="158" height="104" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
<rect class="hl" x="156" y="76" width="146" height="18" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" style="animation-delay:0s"/>
<rect class="hl" x="156" y="96" width="146" height="18" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" style="animation-delay:-1s"/>
<rect class="hl" x="156" y="116" width="146" height="18" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" style="animation-delay:-2s"/>
<text class="m" x="162" y="66">{</text>
<text class="m sb" x="172" y="89">"name": "김민",</text>
<text class="m sb" x="172" y="109">"age": 20,</text>
<text class="m sb" x="172" y="129">"city": "서울"</text>
<text class="m" x="162" y="144">}</text>
<text class="s c" x="160" y="176">프로그램이 바로 읽을 수 있는 모양(JSON 등)으로 받는다</text>
</svg>
