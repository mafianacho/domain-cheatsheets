<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="대화 맨 위에 항상 고정된 시스템 지시와 그 아래 오가는 사용자와 AI의 말풍선">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.sp{animation:sp 2.4s ease-in-out infinite}@keyframes sp{0%,100%{stroke-width:2}50%{stroke-width:4}}.b1{animation:bl 2.4s infinite}.b2{animation:bl 2.4s infinite -1.2s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">시스템 프롬프트 = 대화 전체의 바탕 지시</text>
<rect class="sp" x="24" y="40" width="272" height="52" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text class="m a" x="36" y="60">시스템: 너는 고객센터 상담원이야</text>
<text class="m" x="36" y="78">항상 존댓말, 환불 규정만 안내해</text>
<rect class="b1" x="150" y="104" width="146" height="26" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c m" x="223" y="121">환불 되나요?</text>
<rect class="b2" x="24" y="138" width="146" height="26" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="97" y="155">네, 안내드릴게요</text>
<text class="s e" x="284" y="54">고정</text>
<text class="s c" x="160" y="184">사용자의 말이 오가도 이 지시는 계속 깔려 있다</text>
</svg>
