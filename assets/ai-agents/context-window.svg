<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="창 안에 쌓인 대화 블록이 새 블록이 들어오면 위쪽 오래된 것부터 밀려나는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.g{animation:sc 4s ease-in-out infinite}@keyframes sc{0%,25%{transform:translateY(0)}45%,90%{transform:translateY(-30px)}100%{transform:translateY(-30px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">컨텍스트 윈도우 = 한 번에 볼 수 있는 양</text>
<defs><clipPath id="w"><rect x="60" y="40" width="200" height="120"/></clipPath></defs>
<g clip-path="url(#w)"><g class="g">
<rect class="" x="66" y="44" width="188" height="26" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="160" y="61">오래된 대화</text>
<rect class="" x="66" y="74" width="188" height="26" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="160" y="91">최근 대화</text>
<rect class="" x="66" y="104" width="188" height="26" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="160" y="121">붙여넣은 문서</text>
<rect class="" x="66" y="134" width="188" height="26" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c m sb" x="160" y="151">내 새 질문</text>
<rect class="" x="66" y="164" width="188" height="26" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c m a" x="160" y="181">AI의 답변도 창을 차지</text>
</g></g>
<rect class="" x="60" y="40" width="200" height="120" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
<text class="s c" x="160" y="180">넘치면 오래된 내용부터 잊힌다</text>
</svg>
