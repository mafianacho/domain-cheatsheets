<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="입력과 답이 짝지어진 예시 두 개와 같은 규칙으로 답해야 하는 세 번째 질문">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.q{animation:bl 2.4s steps(1) infinite}.q2{animation:bl 2.4s steps(1) infinite -1.2s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">퓨샷 = 예시를 보여주고 따라 하게</text>
<rect class="" x="24" y="44" width="272" height="30" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<rect class="" x="32" y="51" width="36" height="16" rx="4" fill="#475569" stroke="#475569" stroke-width="0"/>
<text class="c s k" x="50" y="63">예시</text>
<text class="" x="82" y="64">맛있어요</text>
<text class="sb" x="180" y="64">→ 긍정</text>
<rect class="" x="24" y="82" width="272" height="30" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<rect class="" x="32" y="89" width="36" height="16" rx="4" fill="#475569" stroke="#475569" stroke-width="0"/>
<text class="c s k" x="50" y="101">예시</text>
<text class="" x="82" y="102">별로예요</text>
<text class="sb" x="180" y="102">→ 부정</text>
<rect class="" x="24" y="120" width="272" height="30" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<rect class="" x="32" y="127" width="36" height="16" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/>
<text class="c s k" x="50" y="139">질문</text>
<text class="" x="82" y="140">최고예요</text>
<text class="a b q" x="180" y="140">→ ?</text>
<text class="a b q2" x="180" y="140">→ 긍정</text>
<text class="s c" x="160" y="176">규칙을 말로 길게 설명하는 대신 예시로 보여준다</text>
</svg>
