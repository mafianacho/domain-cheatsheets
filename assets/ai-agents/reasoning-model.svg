<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="질문 뒤에 단계별로 생각하는 과정이 있고 그 다음 답이 나오는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">추론 모델 = 답하기 전에 먼저 생각</text>
<rect class="" x="12" y="70" width="54" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="c" x="39" y="94">질문</text>
<line x1="66" y1="90" x2="75.0" y2="90.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><polygon points="82,90 75.0,94.0 75.0,86.0" fill="#94a3b8"/>
<rect class="" x="84" y="44" width="140" height="94" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c m a" x="154" y="62">생각 중…</text>
<rect class="hl" x="94" y="70" width="120" height="16" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" style="animation-delay:0s"/>
<rect class="hl" x="94" y="90" width="120" height="16" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" style="animation-delay:-1s"/>
<rect class="hl" x="94" y="110" width="120" height="16" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" style="animation-delay:-2s"/>
<text class="c m" x="154" y="82">1 조건 정리</text>
<text class="c m" x="154" y="102">2 후보 비교</text>
<text class="c m" x="154" y="122">3 검산</text>
<line x1="224" y1="90" x2="233.0" y2="90.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><polygon points="240,90 233.0,94.0 233.0,86.0" fill="#94a3b8"/>
<rect class="" x="242" y="70" width="66" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c sb" x="275" y="94">최종 답</text>
<text class="s c" x="160" y="166">어려운 문제일수록 느려지고 사용량이 늘 수 있다</text>
</svg>
