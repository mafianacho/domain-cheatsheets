<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="글, 그림, 소리 세 가지 입력이 하나의 AI 모델로 들어가는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.d0{--x:50px;--y:30px}.d1{--x:50px;--y:0px}.d2{--x:50px;--y:-30px}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">멀티모달 = 글·그림·소리를 함께 다룸</text>
<rect class="" x="12" y="44" width="58" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="c" x="41" y="66">글</text>
<rect class="" x="12" y="92" width="58" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="c" x="41" y="114">그림</text>
<rect class="" x="12" y="140" width="58" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="c" x="41" y="162">소리</text>
<line x1="72" y1="62" x2="113.95354769371096" y2="86.4729028213314" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><polygon points="120,90 111.9,89.9 116.0,83.0" fill="#475569"/>
<line x1="72" y1="110" x2="113.02417969228584" y2="106.58131835897618" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><polygon points="120,106 113.4,110.6 112.7,102.6" fill="#475569"/>
<line x1="72" y1="158" x2="114.4" y2="126.2" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><polygon points="120,122 116.8,129.4 112.0,123.0" fill="#475569"/>
<rect class="" x="122" y="74" width="76" height="52" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c b a" x="160" y="104">AI 모델</text>
<line x1="198" y1="100" x2="235.0" y2="100.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><polygon points="242,100 235.0,104.0 235.0,96.0" fill="#94a3b8"/>
<rect class="" x="244" y="78" width="64" height="44" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c sb" x="276" y="104">답변</text>
<circle class="dt d0" cx="76" cy="62" r="4" fill="#38bdf8"/>
<circle class="dt d1" cx="76" cy="110" r="4" fill="#38bdf8" style="animation-delay:-.5s"/>
<circle class="dt d2" cx="76" cy="158" r="4" fill="#38bdf8" style="animation-delay:-1s"/>
<text class="s c" x="160" y="190">한 번에 여러 종류를 보여주고 물어볼 수 있다</text>
</svg>
