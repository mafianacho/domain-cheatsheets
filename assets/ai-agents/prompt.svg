<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="역할, 할 일, 자료, 형식이 한 줄씩 들어 있는 프롬프트 카드">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">프롬프트 = AI에게 주는 입력 전체</text>
<rect class="hl" x="24" y="44" width="272" height="24" rx="5" fill="#334155" stroke="#475569" stroke-width="2" style="animation-delay:0.0s"/>
<rect class="" x="32" y="48" width="40" height="16" rx="4" fill="#38bdf8" stroke="#38bdf8" stroke-width="0"/>
<text class="c m k b" x="52" y="60">역할</text>
<text class="m" x="82" y="60">번역가처럼 자연스럽게</text>
<rect class="hl" x="24" y="74" width="272" height="24" rx="5" fill="#334155" stroke="#475569" stroke-width="2" style="animation-delay:-0.75s"/>
<rect class="" x="32" y="78" width="40" height="16" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/>
<text class="c m k b" x="52" y="90">할 일</text>
<text class="m" x="82" y="90">아래 글을 영어로 옮겨줘</text>
<rect class="hl" x="24" y="104" width="272" height="24" rx="5" fill="#334155" stroke="#475569" stroke-width="2" style="animation-delay:-1.5s"/>
<rect class="" x="32" y="108" width="40" height="16" rx="4" fill="#38bdf8" stroke="#38bdf8" stroke-width="0"/>
<text class="c m k b" x="52" y="120">자료</text>
<text class="m" x="82" y="120">「 붙여넣은 글 」</text>
<rect class="hl" x="24" y="134" width="272" height="24" rx="5" fill="#334155" stroke="#475569" stroke-width="2" style="animation-delay:-2.25s"/>
<rect class="" x="32" y="138" width="40" height="16" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/>
<text class="c m k b" x="52" y="150">형식</text>
<text class="m" x="82" y="150">표로, 세 줄 이내</text>
<text class="s c" x="160" y="178">역할·할 일·자료·형식을 갖출수록 정확해진다</text>
</svg>
