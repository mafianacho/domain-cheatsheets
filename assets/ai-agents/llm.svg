<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="입력 글을 읽고 다음에 올 말의 후보를 확률로 고르는 LLM">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.v1{transform-origin:left center;transform-box:fill-box;animation:v1 3s ease-in-out infinite}.v2{transform-origin:left center;transform-box:fill-box;animation:v2 3s ease-in-out infinite}@keyframes v1{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}@keyframes v2{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.5)}}.cur{animation:bl 1s steps(1) infinite}.chip{animation:bl 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">LLM = 다음에 올 말을 맞히는 모델</text>
<rect class="" x="12" y="56" width="96" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="" x="22" y="80">오늘 날씨는</text>
<rect class="cur" x="86" y="68" width="2" height="16" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<line x1="108" y1="76" x2="119.0" y2="76.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><polygon points="126,76 119.0,80.0 119.0,72.0" fill="#94a3b8"/>
<rect class="" x="128" y="56" width="52" height="40" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c b a" x="154" y="80">LLM</text>
<line x1="180" y1="76" x2="191.0" y2="76.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><polygon points="198,76 191.0,80.0 191.0,72.0" fill="#94a3b8"/>
<text class="" x="202" y="66">맑아요</text>
<rect class="v1" x="240" y="58" width="64" height="10" rx="3" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/>
<text class="" x="202" y="86">흐려요</text>
<rect class="v2" x="240" y="78" width="34" height="10" rx="3" fill="#475569" stroke="#475569" stroke-width="1.5"/>
<text class="" x="202" y="106">추워요</text>
<rect class="" x="240" y="98" width="16" height="10" rx="3" fill="#475569" stroke="#475569" stroke-width="1.5"/>
<rect class="" x="12" y="124" width="296" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="" x="24" y="146">오늘 날씨는</text>
<rect class="chip" x="90" y="130" width="46" height="22" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c a" x="113" y="146">맑아요</text>
<text class="s c" x="160" y="180">가장 그럴듯한 말을 하나씩 이어 붙여 문장을 만든다</text>
</svg>
