<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="질문이 검색 단계에서 내 문서를 찾아 오고, 찾은 글과 함께 AI에게 가서 답이 되는 흐름">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.d{--x:190px;--y:0px;animation-duration:3.6s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">RAG = 찾아서 붙여 주고 답하게 하기</text>
<rect class="" x="12" y="66" width="54" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="c" x="39" y="92">질문</text>
<line x1="66" y1="88" x2="83.0" y2="88.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><polygon points="90,88 83.0,92.0 83.0,84.0" fill="#94a3b8"/>
<rect class="" x="92" y="66" width="54" height="44" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c sb" x="119" y="92">검색</text>
<line x1="146" y1="88" x2="165.0" y2="88.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><polygon points="172,88 165.0,92.0 165.0,84.0" fill="#94a3b8"/>
<rect class="" x="174" y="66" width="54" height="44" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c a b" x="201" y="92">AI</text>
<line x1="228" y1="88" x2="247.0" y2="88.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><polygon points="254,88 247.0,92.0 247.0,84.0" fill="#94a3b8"/>
<rect class="" x="256" y="66" width="52" height="44" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c" x="282" y="92">답변</text>
<rect class="" x="92" y="136" width="54" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="119" y="154">내 문서</text>
<line x1="119" y1="136" x2="119.0" y2="119.0" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/><polygon points="119,112 123.0,119.0 115.0,119.0" fill="#38bdf8"/>
<text class="c s" x="201" y="128">질문 + 찾은 글</text>
<circle class="dt d" cx="70" cy="88" r="5" fill="#f59e0b"/>
<text class="s c" x="160" y="186">AI가 외우지 못한 내 자료도 근거로 쓸 수 있다</text>
</svg>
