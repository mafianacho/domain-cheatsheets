<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="긴 문서 한 줄을 점선 위치에서 세 조각으로 자르는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.k1{animation:k1 3.4s ease-in-out infinite}.k2{animation:k2 3.4s ease-in-out infinite}.k3{animation:k3 3.4s ease-in-out infinite}@keyframes k1{0%,15%{transform:translate(0,0)}40%,80%{transform:translate(-6px,10px)}100%{transform:translate(0,0)}}@keyframes k2{0%,15%{transform:translate(0,0)}40%,80%{transform:translate(0,10px)}100%{transform:translate(0,0)}}@keyframes k3{0%,15%{transform:translate(0,0)}40%,80%{transform:translate(6px,10px)}100%{transform:translate(0,0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">청킹 = 긴 문서를 검색용 조각으로 자르기</text>
<rect class="" x="24" y="44" width="272" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="160" y="63">긴 문서 (매뉴얼 전체)</text>
<line x1="110" y1="38" x2="110" y2="78" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="210" y1="38" x2="210" y2="78" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
<g class="k1">
<rect class="" x="24" y="96" width="84" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c m" x="66" y="120">조각 1</text>
</g>
<g class="k2">
<rect class="" x="112" y="96" width="96" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c m" x="160" y="120">조각 2</text>
</g>
<g class="k3">
<rect class="" x="212" y="96" width="84" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c m" x="254" y="120">조각 3</text>
</g>
<text class="s c" x="160" y="176">너무 크면 엉뚱한 내용이 섞이고, 너무 작으면 문맥이 끊긴다</text>
</svg>
