<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="생각, 행동, 결과 확인 세 단계를 점이 돌며 목표를 이룰 때까지 되풀이하는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.orb{transform-box:view-box;transform-origin:160px 108px;animation:ro 4.5s linear infinite}@keyframes ro{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">에이전트 루프 = 생각 → 행동 → 확인 반복</text>
<circle cx="160" cy="108" r="56" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/>
<rect class="" x="128" y="40" width="64" height="24" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c b a" x="160" y="56">생각</text>
<rect class="" x="172" y="124" width="84" height="24" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c sb" x="214" y="140">행동(도구)</text>
<rect class="" x="64" y="124" width="84" height="24" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c" x="106" y="140">결과 확인</text>
<text class="c s" x="160" y="106">목표 달성하면</text>
<text class="c s" x="160" y="118">여기서 종료</text>
<g class="orb">
<circle class="" cx="208" cy="80" r="5" fill="#f59e0b"/>
</g>
<text class="s c" x="160" y="176">목표를 이룰 때까지 이 바퀴를 몇 번이고 돈다</text>
</svg>
