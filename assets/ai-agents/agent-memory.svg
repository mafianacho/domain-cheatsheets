<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="닫으면 사라지는 대화창의 중요한 내용을 메모 저장소로 옮겨 다음에도 쓰는 모습">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.mc{animation:mc 3.6s ease-in-out infinite}@keyframes mc{0%,12%{transform:translateX(0);opacity:1}45%,85%{transform:translateX(168px);opacity:1}100%{transform:translateX(168px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">에이전트 메모리 = 대화가 끝나도 남는 기억</text>
<rect class="" x="12" y="40" width="132" height="112" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="78" y="58">지금 대화 (단기)</text>
<rect class="" x="20" y="70" width="116" height="22" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="78" y="85">오늘 잡담</text>
<rect class="" x="20" y="98" width="116" height="22" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<text class="c m" x="78" y="113">존댓말로 써줘</text>
<rect class="" x="20" y="126" width="116" height="20" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="78" y="140">임시 계산</text>
<rect class="" x="176" y="40" width="132" height="112" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c m a" x="242" y="58">메모 저장소 (장기)</text>
<rect class="" x="188" y="70" width="116" height="22" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="246" y="85">프로젝트 규칙</text>
<rect class="" x="188" y="98" width="116" height="22" rx="5" fill="none" stroke="#475569" stroke-width="1.5" style="stroke-dasharray:4 3"/>
<rect class="" x="188" y="126" width="116" height="20" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c m" x="246" y="140">다음 일정 메모</text>
<g class="mc">
<rect class="" x="20" y="98" width="116" height="22" rx="5" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
<text class="c m a" x="78" y="113">존댓말로 써줘</text>
</g>
<line x1="148" y1="96" x2="165.0" y2="96.0" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><polygon points="172,96 165.0,100.0 165.0,92.0" fill="#f59e0b"/>
<text class="s c" x="160" y="178">중요한 것만 적어 두고, 다음 대화에서 다시 불러온다</text>
</svg>
