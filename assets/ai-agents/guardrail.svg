<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="안전 필터를 통과하는 요청과 첫 필터에서 막혀 되돌아가는 요청">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:9px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.e{text-anchor:end}.b{font-weight:700}.a{fill:#f59e0b}.sb{fill:#38bdf8}.k{fill:#0f172a}.f{transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes mv{0%,8%{transform:translate(0,0);opacity:1}80%{transform:translate(var(--x),var(--y));opacity:1}92%,100%{transform:translate(var(--x),var(--y));opacity:0}}@keyframes hl{0%,30%{stroke:#f59e0b}38%,100%{stroke:#475569}}.bl{animation:bl 1.2s infinite}.pu{animation:pu 1.6s ease-in-out infinite}.dt{animation:mv 3s ease-in-out infinite}.hl{animation:hl 3s infinite}.pass{--x:196px;--y:0px;animation-duration:3.2s}.blk{animation:blk 3.2s ease-in-out infinite}@keyframes blk{0%,8%{transform:translateX(0)}30%{transform:translateX(22px)}45%{transform:translateX(10px)}60%,100%{transform:translateX(0)}}.no{animation:bl 3.2s steps(1) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t c" x="160" y="26">가드레일 = 입력·출력을 걸러 주는 안전장치</text>
<line x1="64" y1="84" x2="256" y2="84" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="64" y1="130" x2="96" y2="130" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
<rect class="" x="12" y="56" width="52" height="98" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c" x="38" y="108">입력</text>
<rect class="" x="96" y="48" width="8" height="114" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c s" x="100" y="172">필터</text>
<rect class="" x="130" y="68" width="60" height="32" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text class="c b a" x="160" y="88">AI</text>
<rect class="" x="216" y="48" width="8" height="114" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/>
<rect class="" x="256" y="68" width="52" height="32" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text class="c" x="282" y="88">출력</text>
<text class="c s" x="220" y="172">필터</text>
<circle class="dt pass" cx="72" cy="84" r="5" fill="#38bdf8"/>
<circle class="blk" cx="72" cy="130" r="5" fill="#f59e0b"/>
<text class="m a no" x="112" y="134">차단</text>
<text class="s sb" x="110" y="100">통과</text>
<text class="s c" x="160" y="190">위험한 요청과 답변은 중간에서 막는다</text>
</svg>
