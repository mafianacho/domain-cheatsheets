<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="임대차계약서에 확정일자 도장을 찍어 그 날짜에 계약서가 있었음을 증명하고 받을 수 있는 곳을 보여 주는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,8%{transform:translate(0px,-30px);opacity:0}22%{transform:translate(0px,0px);opacity:1}30%,92%{transform:translate(0px,0px);opacity:1}98%{transform:translate(0px,-30px);opacity:0}100%{transform:translate(0px,-30px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">확정일자: 계약서의 날짜를 증명</text>
<rect x="30" y="42" width="92" height="92" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<text x="76" y="58" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">임대차계약서</text>
<line x1="40" y1="70" x2="112" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
<line x1="40" y1="80" x2="112" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
<line x1="40" y1="90" x2="112" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
<g class="a1"><circle cx="84" cy="106" r="22" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text x="84" y="105" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">확정</text><text x="84" y="117" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">일자</text></g>
<text x="150" y="58" font-size="11" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">받는 곳</text>
<circle cx="156" cy="77" r="3" fill="#38bdf8"/>
<text x="166" y="81" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">동 주민센터·읍·면사무소</text>
<circle cx="156" cy="97" r="3" fill="#38bdf8"/>
<text x="166" y="101" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">법원 · 등기소</text>
<circle cx="156" cy="117" r="3" fill="#38bdf8"/>
<text x="166" y="121" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">공증인</text>
<text x="160" y="156" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">전입신고 + 확정일자를 갖추면 우선변제권</text>
<text x="160" y="174" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">(임대차 신고를 하면 확정일자로 간주되는 경우도 있음)</text>
</svg>
