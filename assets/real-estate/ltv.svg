<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="집값 중에서 담보로 빌릴 수 있는 비율 LTV가 높아지면 대출 가능액이 커지는 막대 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes k1{0%,8%{transform:scaleY(0.55)}50%{transform:scaleY(1)}84%,94%{transform:scaleY(1)}100%{transform:scaleY(0.55)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">LTV: 집값 대비 빌릴 수 있는 비율</text>
<rect x="60" y="48" width="60" height="92" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<g class="a1"><rect x="60" y="82" width="60" height="58" rx="4" fill="#f59e0b"/></g>
<text x="90" y="114" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">대출</text>
<text x="90" y="70" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">집값</text>
<line x1="52" y1="82" x2="128" y2="82" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="90" y="158" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">집값(감정가·시세)</text>
<text x="214" y="62" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">대출 가능액</text>
<text x="214" y="82" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">≤ 집값 × LTV</text>
<text x="214" y="112" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">LTV는 지역·주택 유형·</text>
<text x="214" y="128" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">정책에 따라 달라짐</text>
<text x="214" y="154" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">소득 기준 한도(DSR)는 별도</text>
</svg>
