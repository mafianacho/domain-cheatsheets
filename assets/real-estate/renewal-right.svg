<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="계약 만료 6개월 전부터 2개월 전 사이에 세입자가 갱신을 요구할 수 있는 기간을 보여 주는 시간선">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,10%{opacity:.45}25%{opacity:1}40%,100%{opacity:.75}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,6%{transform:translate(0px,0px);opacity:1}34%{transform:translate(104px,0px);opacity:1}46%,90%{transform:translate(104px,0px);opacity:1}96%{transform:translate(104px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}.a3{animation:k3 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,36%{opacity:0}44%,92%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">계약갱신요구권: 만료 6~2개월 전</text>
<line x1="24" y1="100" x2="296" y2="100" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<g class="a1"><rect x="66" y="91" width="124" height="18" rx="4" fill="#f59e0b" opacity="0.8"/></g>
<text x="128" y="82" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">요구할 수 있는 기간</text>
<circle cx="66" cy="100" r="5" fill="#e2e8f0"/>
<text x="66" y="126" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">6개월 전</text>
<circle cx="190" cy="100" r="5" fill="#e2e8f0"/>
<text x="190" y="126" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">2개월 전</text>
<circle cx="264" cy="100" r="5" fill="#38bdf8"/>
<text x="264" y="126" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">계약 만료일</text>
<g class="a2"><rect x="42" y="50" width="26" height="18" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/><path d="M43 52 L55 61 L67 52" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="a3"><text x="160" y="56" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">갱신 요구!</text></g>
<text x="160" y="152" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">갱신은 1회 · 2년 연장</text>
<text x="160" y="172" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">증액은 5% 이내 (지역 조례로 달라질 수 있음)</text>
</svg>
