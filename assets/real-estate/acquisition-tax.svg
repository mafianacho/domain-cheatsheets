<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="집값 구간에 따라 6억 이하 1퍼센트, 6억 초과 9억 이하 1에서 3퍼센트 사이, 9억 초과 3퍼센트로 정해지는 취득세 세율 표">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,6%{transform:translate(0px,0px)}46%{transform:translate(236px,0px)}56%,90%{transform:translate(236px,0px)}100%{transform:translate(0px,0px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">취득세: 집을 살 때 한 번 내는 세금</text>
<rect x="24" y="62" width="96" height="24" rx="3" fill="#38bdf8"/>
<text x="72" y="79" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">6억 이하</text>
<text x="72" y="108" font-size="13" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">1%</text>
<rect x="120" y="62" width="96" height="24" rx="3" fill="#fcd34d"/>
<text x="168" y="79" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">6~9억</text>
<text x="168" y="108" font-size="13" fill="#fcd34d" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">1~3%</text>
<rect x="216" y="62" width="80" height="24" rx="3" fill="#f59e0b"/>
<text x="256" y="79" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">9억 초과</text>
<text x="256" y="108" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">3%</text>
<g class="a1"><path d="M36 46 L44 46 L40 56 Z" stroke="#e2e8f0" stroke-width="1" fill="#e2e8f0" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="160" y="42" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">집값(취득가액)</text>
<text x="160" y="138" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">유상 취득 주택 기준 · 신고·납부 취득일부터 60일</text>
<text x="160" y="156" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">다주택·법인·조정대상지역은 더 높게 중과</text>
<text x="160" y="176" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">6~9억 구간은 가격에 따라 1%에서 3%까지 점점 오름</text>
</svg>
