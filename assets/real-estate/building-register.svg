<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="건축물대장에서 건물의 용도, 면적, 층수와 위반건축물 표시를 확인하는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,20%{opacity:1}36%{opacity:0.3}70%,100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">건축물대장: 건물의 공식 신상 카드</text>
<rect x="36" y="36" width="248" height="106" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="50" y="58" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">용도</text>
<text x="128" y="58" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">주거용인지 확인</text>
<text x="50" y="82" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">면적</text>
<text x="128" y="82" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">전용 · 공용 면적</text>
<text x="50" y="106" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">층수·구조</text>
<text x="128" y="106" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">층수와 구조 표시</text>
<text x="50" y="130" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">위반건축물</text>
<text x="128" y="130" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">표시가 있는지 확인</text>
<g class="a1"><rect x="40" y="117" width="240" height="20" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/><rect x="232" y="118" width="44" height="18" rx="4" fill="#f59e0b"/><text x="254" y="130.4" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">주의</text></g>
<text x="160" y="164" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">등기부등본 = 권리(누가 주인, 어떤 빚)</text>
<text x="160" y="182" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">건축물대장 = 건물 자체(용도·면적·불법 여부)</text>
</svg>
