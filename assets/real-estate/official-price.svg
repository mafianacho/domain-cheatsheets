<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="정부가 공시하는 공시가격은 시세와 다를 수 있고 재산세와 종합부동산세 계산의 기준으로 쓰인다는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,6%{transform:translate(0px,0px);opacity:1}40%{transform:translate(44px,0px);opacity:1}46%{transform:translate(44px,0px);opacity:0}50%{transform:translate(0px,0px);opacity:0}96%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">공시가격: 정부가 알리는 기준 가격</text>
<line x1="24" y1="126" x2="160" y2="126" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<rect x="40" y="56" width="38" height="70" rx="3" fill="#38bdf8"/>
<rect x="100" y="76" width="38" height="50" rx="3" fill="#f59e0b"/>
<text x="59" y="142" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">시세</text>
<text x="119" y="142" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">공시가격</text>
<text x="59" y="96" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">실거래</text>
<text x="119" y="106" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">정부가</text>
<line x1="142" y1="92" x2="186" y2="92" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<line x1="186" y1="92" x2="179.9" y2="95.4" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<line x1="186" y1="92" x2="179.9" y2="88.6" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<g class="a1"><circle cx="150" cy="92" r="6" fill="#fde68a"/><circle cx="150" cy="92" r="3.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<rect x="190" y="62" width="108" height="62" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="244" y="82" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">세금 계산의 기준</text>
<text x="244" y="100" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">재산세</text>
<text x="244" y="116" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">종합부동산세</text>
<text x="160" y="168" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">시세·실거래가와 다를 수 있음</text>
<text x="160" y="184" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">아파트 등은 해마다 공시</text>
</svg>
