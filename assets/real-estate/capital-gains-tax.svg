<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="판 값에서 산 값을 뺀 차익에 세금을 매기고 주택은 보유 기간에 따라 1년 미만 70퍼센트, 2년 미만 60퍼센트, 2년 이상 기본세율이 적용되는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes k1{0%,8%{transform:scaleY(0)}36%{transform:scaleY(1)}84%,94%{transform:scaleY(1)}100%{transform:scaleY(0)}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,10%{opacity:1}18%{opacity:.45}26%,100%{opacity:1}}.a3{animation:k3 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,28%{opacity:1}36%{opacity:.45}44%,100%{opacity:1}}.a4{animation:k4 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,46%{opacity:1}54%{opacity:.45}62%,100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">양도소득세: 판 값 − 산 값 = 차익 과세</text>
<line x1="24" y1="124" x2="160" y2="124" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<rect x="36" y="84" width="42" height="40" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<text x="57" y="140" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">산 값</text>
<rect x="96" y="52" width="42" height="72" rx="3" fill="#38bdf8"/>
<g class="a1"><rect x="96" y="52" width="42" height="32" rx="3" fill="#f59e0b"/></g>
<text x="117" y="140" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">판 값</text>
<text x="117" y="72" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">차익</text>
<text x="172" y="50" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">주택 보유 기간별 세율</text>
<g class="a2"><rect x="172" y="61" width="124" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="180" y="74" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">1년 미만</text><text x="288" y="74" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">70%</text></g>
<g class="a3"><rect x="172" y="83" width="124" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="180" y="96" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">2년 미만</text><text x="288" y="96" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">60%</text></g>
<g class="a4"><rect x="172" y="105" width="124" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="180" y="118" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">2년 이상</text><text x="288" y="118" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">6~45%</text></g>
<text x="160" y="160" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">양도일이 속한 달 말일부터 2개월 안에 예정신고</text>
<text x="160" y="178" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">비과세·중과·공제에 따라 실제 세금은 달라짐</text>
</svg>
