<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="6월 1일 소유자를 기준으로 주택 재산세를 7월과 9월에 반씩 나누어 내는 연간 달력">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,6%{opacity:1}26%{opacity:.35}36%{opacity:1}60%{opacity:.35}70%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">재산세: 6월 1일 기준, 7월·9월에 납부</text>
<line x1="24" y1="86" x2="296" y2="86" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<text x="24" y="106" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">1월</text>
<text x="296" y="106" font-size="10" fill="#94a3b8" text-anchor="end" font-family="system-ui, sans-serif">12월</text>
<circle cx="137.333" cy="86" r="6" fill="#e2e8f0"/>
<text x="137.333" y="58" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">6월 1일 기준</text>
<text x="137.333" y="72" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">소유자 확정</text>
<rect x="163.333" y="78" width="16" height="16" rx="3" fill="#f59e0b"/>
<text x="171.333" y="116" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">7월 16~31일</text>
<text x="171.333" y="130" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">절반</text>
<rect x="208.667" y="78" width="16" height="16" rx="3" fill="#38bdf8"/>
<text x="230.667" y="58" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">9월 16~30일</text>
<text x="230.667" y="72" font-size="10" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">나머지 절반</text>
<g class="a1"><circle cx="137.333" cy="86" r="10" fill="none" stroke="#e2e8f0" stroke-width="1.2"/></g>
<text x="160" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">주택은 세액을 7월·9월에 반씩</text>
<text x="160" y="184" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">세액이 적으면 7월에 한 번에 낼 수 있음</text>
</svg>
