<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="보증금은 한 번 맡기고 월세는 매달 집주인에게 내는 월세 계약 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,4%{transform:translate(0px,0px)}24%,76%{transform:translate(150px,0px)}96%,100%{transform:translate(0px,0px)}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,8%{transform:translate(0px,0px);opacity:1}24%{transform:translate(170px,0px);opacity:1}27%{transform:translate(170px,0px);opacity:0}28%{transform:translate(0px,0px);opacity:0}29%,100%{transform:translate(0px,0px);opacity:0}}.a3{animation:k3 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,36%{transform:translate(0px,0px);opacity:1}52%{transform:translate(170px,0px);opacity:1}55%{transform:translate(170px,0px);opacity:0}56%{transform:translate(0px,0px);opacity:0}57%,100%{transform:translate(0px,0px);opacity:0}}.a4{animation:k4 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,64%{transform:translate(0px,0px);opacity:1}80%{transform:translate(170px,0px);opacity:1}83%{transform:translate(170px,0px);opacity:0}84%{transform:translate(0px,0px);opacity:0}85%,100%{transform:translate(0px,0px);opacity:0}}.a5{animation:k5 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,8%{opacity:.5}24%{opacity:1}36%{opacity:.5}100%{opacity:.5}}.a6{animation:k6 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k6{0%,36%{opacity:.5}52%{opacity:1}64%{opacity:.5}100%{opacity:.5}}.a7{animation:k7 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k7{0%,64%{opacity:.5}80%{opacity:1}92%{opacity:.5}100%{opacity:.5}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">월세: 보증금은 한 번, 월세는 매달</text>
<circle cx="32" cy="92" r="6" fill="#38bdf8"/>
<path d="M22 112 Q22 101 32 101 Q42 101 42 112 Z" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="288" cy="92" r="6" fill="#f59e0b"/>
<path d="M278 112 Q278 101 288 101 Q298 101 298 112 Z" stroke="#f59e0b" stroke-width="1" fill="#f59e0b" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="132" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">세입자</text>
<text x="288" y="132" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">집주인</text>
<text x="160" y="52" font-size="10" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">보증금: 맡겼다가 끝나면 돌려받음</text>
<line x1="62" y1="70" x2="258" y2="70" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
<g class="a1"><rect x="70" y="63" width="26" height="14" rx="2" fill="#38bdf8"/><circle cx="83" cy="70" r="3.5" fill="#0f172a"/></g>
<text x="160" y="104" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">월세: 매달 내는 사용료 (안 돌아옴)</text>
<line x1="62" y1="122" x2="258" y2="122" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
<g class="a2"><circle cx="78" cy="122" r="7" fill="#f59e0b"/><circle cx="78" cy="122" r="4.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<g class="a3"><circle cx="78" cy="122" r="7" fill="#f59e0b"/><circle cx="78" cy="122" r="4.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<g class="a4"><circle cx="78" cy="122" r="7" fill="#f59e0b"/><circle cx="78" cy="122" r="4.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<g class="a5"><text x="110" y="150" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">1월</text></g>
<g class="a6"><text x="160" y="150" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">2월</text></g>
<g class="a7"><text x="210" y="150" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">3월</text></g>
<text x="160" y="180" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">보증금은 작게, 월세는 매달 — 둘의 비율을 협의</text>
</svg>
