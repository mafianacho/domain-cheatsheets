<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="전세 보증금의 일부를 줄이고 그만큼을 월세로 바꾸면 월세는 줄인 금액에 전환율을 곱해 12로 나눈 값이라는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,10%{opacity:1}30%{opacity:0.4}60%,100%{opacity:1}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,8%{transform:translate(0px,0px);opacity:1}26%{transform:translate(190px,24px);opacity:1}29%{transform:translate(190px,24px);opacity:0}30%{transform:translate(0px,0px);opacity:0}31%,100%{transform:translate(0px,0px);opacity:0}}.a3{animation:k3 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,34%{transform:translate(0px,0px);opacity:1}52%{transform:translate(190px,24px);opacity:1}55%{transform:translate(190px,24px);opacity:0}56%{transform:translate(0px,0px);opacity:0}57%,100%{transform:translate(0px,0px);opacity:0}}.a4{animation:k4 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,60%{transform:translate(0px,0px);opacity:1}78%{transform:translate(190px,24px);opacity:1}81%{transform:translate(190px,24px);opacity:0}82%{transform:translate(0px,0px);opacity:0}83%,100%{transform:translate(0px,0px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">전월세 전환: 보증금 ↔ 월세 맞바꾸기</text>
<rect x="34" y="90" width="52" height="40" rx="3" fill="#38bdf8"/>
<g class="a1"><rect x="34" y="46" width="52" height="44" rx="3" fill="#f59e0b"/></g>
<text x="60" y="80" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">줄일 몫</text>
<text x="60" y="150" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">전세 보증금</text>
<line x1="96" y1="90" x2="134" y2="90" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="134" y1="90" x2="127.9" y2="93.4" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="134" y1="90" x2="127.9" y2="86.6" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<rect x="146" y="90" width="52" height="40" rx="3" fill="#38bdf8"/>
<text x="172" y="150" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">남은 보증금</text>
<rect x="228" y="70" width="68" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="262" y="94" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">월세</text>
<text x="262" y="150" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">매달 내는 몫</text>
<g class="a2"><circle cx="60" cy="57" r="6" fill="#fde68a"/><circle cx="60" cy="57" r="3.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<g class="a3"><circle cx="60" cy="57" r="6" fill="#fde68a"/><circle cx="60" cy="57" r="3.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<g class="a4"><circle cx="60" cy="57" r="6" fill="#fde68a"/><circle cx="60" cy="57" r="3.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<text x="160" y="174" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">월세 = 줄인 보증금 × 전환율 ÷ 12</text>
<text x="160" y="190" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">전환율 상한은 법령이 정함</text>
</svg>
