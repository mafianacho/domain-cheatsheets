<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="집값이 선순위 대출과 보증금을 합친 금액보다 낮아져 보증금을 돌려받기 어려워지는 깡통전세 막대그래프">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes k1{0%,8%{transform:scaleY(1.5)}46%{transform:scaleY(1)}84%,94%{transform:scaleY(1)}100%{transform:scaleY(1.5)}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,46%{opacity:0}56%,92%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">깡통전세: 집값이 보증금 + 앞선 대출 이하</text>
<line x1="24" y1="138" x2="296" y2="138" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="30" y1="62" x2="290" y2="62" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
<text x="292" y="56" font-size="10" fill="#f59e0b" text-anchor="end" font-family="system-ui, sans-serif">합계</text>
<rect x="196" y="100" width="56" height="38" rx="3" fill="#38bdf8"/>
<text x="224" y="123" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">앞선 대출</text>
<rect x="196" y="62" width="56" height="38" rx="3" fill="#f59e0b"/>
<text x="224" y="85" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">내 보증금</text>
<g class="a1"><rect x="72" y="80" width="56" height="58" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="2"/></g>
<text x="100" y="112" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">집값</text>
<g class="a2"><text x="100" y="76" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">부족!</text></g>
<text x="100" y="154" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">집값</text>
<text x="224" y="154" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">앞선 대출 + 보증금</text>
<text x="160" y="174" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">보증금이 시세의 80%를 넘으면 피하라고 안내(HUG)</text>
</svg>
