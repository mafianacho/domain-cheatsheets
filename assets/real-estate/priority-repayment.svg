<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="집이 경매에 넘어갔을 때 경매 대금이 선순위 근저당, 임차인, 후순위 채권자 순서로 나누어지는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,6%{transform:scaleX(0)}24%{transform:scaleX(1)}24%,100%{transform:scaleX(1)}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes k2{0%,30%{transform:scaleX(0)}48%{transform:scaleX(1)}48%,100%{transform:scaleX(1)}}.a3{animation:k3 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes k3{0%,54%{transform:scaleX(0)}68%{transform:scaleX(1)}68%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">우선변제권: 경매 대금을 받는 순서</text>
<rect x="24" y="56" width="52" height="56" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
<circle cx="38" cy="96" r="9" fill="#f59e0b"/>
<circle cx="38" cy="96" r="6.5" fill="none" stroke="#0f172a" stroke-width="1"/>
<circle cx="62" cy="96" r="9" fill="#f59e0b"/>
<circle cx="62" cy="96" r="6.5" fill="none" stroke="#0f172a" stroke-width="1"/>
<circle cx="50" cy="80" r="9" fill="#f59e0b"/>
<circle cx="50" cy="80" r="6.5" fill="none" stroke="#0f172a" stroke-width="1"/>
<text x="50" y="130" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">경매 대금</text>
<text x="96" y="66" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">① 앞선 근저당</text>
<rect x="190" y="54" width="110" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<g class="a1"><rect x="190" y="54" width="110" height="16" rx="4" fill="#38bdf8"/></g>
<text x="96" y="96" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">② 나(임차인)</text>
<rect x="190" y="84" width="110" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<g class="a2"><rect x="190" y="84" width="110" height="16" rx="4" fill="#f59e0b"/></g>
<text x="96" y="126" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">③ 뒤 채권자</text>
<rect x="190" y="114" width="110" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<g class="a3"><rect x="190" y="114" width="41.8" height="16" rx="4" fill="#94a3b8"/></g>
<text x="160" y="156" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">대항요건 + 확정일자를 갖춘 순서로 배당</text>
<text x="160" y="174" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">돈이 모자라면 뒤 순서는 못 받을 수 있음</text>
</svg>
