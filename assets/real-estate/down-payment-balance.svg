<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="계약금을 내고 중도금을 거쳐 잔금을 치르면 열쇠와 소유권이전등기가 이루어지는 매매 대금 지급 순서">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,4%{transform:scaleX(0)}80%{transform:scaleX(1)}92%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">계약금 → 중도금 → 잔금</text>
<rect x="20" y="42" width="84" height="34" rx="6" fill="#f59e0b"/>
<text x="62" y="64" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">계약금</text>
<text x="62" y="94" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">계약일</text>
<rect x="112" y="42" width="84" height="34" rx="6" fill="#334155"/>
<text x="154" y="64" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">중도금</text>
<text x="154" y="94" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">있는 경우</text>
<rect x="216" y="42" width="84" height="34" rx="6" fill="#38bdf8"/>
<text x="258" y="64" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">잔금</text>
<text x="258" y="94" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">열쇠·등기</text>
<rect x="20" y="108" width="280" height="8" rx="4" fill="#334155"/>
<g class="a1"><rect x="20" y="108" width="280" height="8" rx="4" fill="#f59e0b"/></g>
<text x="160" y="140" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">이행 착수 전에는 계약금으로 해제 가능:</text>
<text x="160" y="156" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">사는 쪽은 포기, 파는 쪽은 두 배 상환</text>
<text x="160" y="176" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">※ 다른 약정(특약)이 있으면 달라짐</text>
</svg>
