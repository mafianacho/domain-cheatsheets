<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="중개보수는 거래금액에 시도 조례의 요율 한도 이내에서 협의한 요율을 곱해 정하고 월세는 월세에 100을 곱해 보증금과 더한다는 계산 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,10%{transform:scale(1)}20%{transform:scale(1.08)}34%,100%{transform:scale(1)}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,32%{transform:scale(1)}42%{transform:scale(1.08)}56%,100%{transform:scale(1)}}.a3{animation:k3 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,54%{transform:scale(1)}64%{transform:scale(1.08)}78%,100%{transform:scale(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">중개보수: 상한은 조례, 금액은 협의</text>
<g class="a1"><rect x="14" y="40" width="76" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="52" y="60" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">거래금액</text><text x="52" y="76" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">매매가·보증금</text></g>
<g class="a2"><rect x="122" y="40" width="76" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="160" y="60" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">요율</text><text x="160" y="76" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">조례 한도 이내</text></g>
<g class="a3"><rect x="230" y="40" width="76" height="46" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="268" y="60" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">중개보수</text><text x="268" y="76" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">협의로 결정</text></g>
<text x="103" y="68" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">×</text>
<text x="211" y="68" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">=</text>
<text x="160" y="108" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">월세 계약의 거래금액</text>
<text x="160" y="126" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">= 보증금 + 월세 × 100</text>
<text x="160" y="144" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">(합계가 5천만 원 미만이면 × 70)</text>
<text x="160" y="170" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">요율표는 지역(시·도 조례)마다 다름</text>
</svg>
