<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="등기부등본이 건물 정보 표제부, 소유권 갑구, 소유권 외 권리 을구 세 부분으로 되어 있고 위에서부터 차례로 확인하는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,6%{transform:translate(0px,0px)}18%,30%{transform:translate(0px,36px)}42%,56%{transform:translate(0px,72px)}70%,88%{transform:translate(0px,72px)}100%{transform:translate(0px,0px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">등기부등본: 표제부 · 갑구 · 을구</text>
<rect x="30" y="40" width="260" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<rect x="36" y="45" width="46" height="20" rx="4" fill="#38bdf8"/>
<text x="59" y="59" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">표제부</text>
<text x="92" y="59" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">건물 표시: 주소·면적·구조</text>
<rect x="30" y="76" width="260" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<rect x="36" y="81" width="46" height="20" rx="4" fill="#f59e0b"/>
<text x="59" y="95" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">갑구</text>
<text x="92" y="95" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">소유권: 소유자·압류·가압류</text>
<rect x="30" y="112" width="260" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
<rect x="36" y="117" width="46" height="20" rx="4" fill="#38bdf8"/>
<text x="59" y="131" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">을구</text>
<text x="92" y="131" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">소유권 외 권리: 근저당 등</text>
<g class="a1"><rect x="27" y="37" width="266" height="36" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g>
<text x="160" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">계약 전과 잔금 날, 두 번 새로 떼어 확인</text>
<text x="160" y="184" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">정식 이름: 등기사항증명서</text>
</svg>
