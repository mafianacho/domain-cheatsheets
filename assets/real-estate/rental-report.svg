<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="임대차 계약서가 계약 후 30일 이내에 신고관청을 거쳐 신고필증이 되는 흐름">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,4%{transform:translate(0px,0px);opacity:1}32%{transform:translate(102px,0px);opacity:1}36%,48%{transform:translate(102px,0px);opacity:1}68%{transform:translate(204px,0px);opacity:1}76%,92%{transform:translate(204px,0px);opacity:1}97%{transform:translate(204px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes k2{0%,4%{transform:scaleX(0)}80%{transform:scaleX(1)}92%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">임대차 신고: 계약 후 30일 이내</text>
<rect x="20" y="54" width="76" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="58" y="74" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">계약 체결</text>
<text x="58" y="90" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">임대인·임차인</text>
<rect x="122" y="54" width="76" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="160" y="74" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">공동 신고</text>
<text x="160" y="90" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">시·군·구청</text>
<rect x="224" y="54" width="76" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="262" y="74" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">신고필증</text>
<text x="262" y="90" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">발급</text>
<line x1="98" y1="77" x2="120" y2="77" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="120" y1="77" x2="113.9" y2="80.4" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="120" y1="77" x2="113.9" y2="73.6" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="200" y1="77" x2="222" y2="77" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="222" y1="77" x2="215.9" y2="80.4" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="222" y1="77" x2="215.9" y2="73.6" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<g class="a1"><rect x="50" y="30" width="16" height="22" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.2"/><line x1="56" y1="39" x2="60" y2="39" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/><line x1="56" y1="47" x2="54" y2="47" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/></g>
<text x="24" y="118" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">계약일</text>
<text x="296" y="118" font-size="10" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">30일</text>
<rect x="24" y="126" width="272" height="10" rx="5" fill="#334155"/>
<g class="a2"><rect x="24" y="126" width="272" height="10" rx="5" fill="#f59e0b"/></g>
<text x="160" y="158" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">보증금 6천만 원 초과 또는 월세 30만 원 초과</text>
<text x="160" y="176" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">금액 변동 없이 기간만 늘린 갱신은 제외</text>
</svg>
