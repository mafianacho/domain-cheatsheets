<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="1세대가 1주택만 갖고 보유 기간과 거주 요건을 채우고 고가주택이 아니면 양도소득세가 비과세되는 체크리스트">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,6%{opacity:0}16%,92%{opacity:1}100%{opacity:0}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,22%{opacity:0}32%,92%{opacity:1}100%{opacity:0}}.a3{animation:k3 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,38%{opacity:0}48%,92%{opacity:1}100%{opacity:0}}.a4{animation:k4 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,54%{opacity:0}64%,92%{opacity:1}100%{opacity:0}}.a5{animation:k5 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k5{0%,74%{opacity:0}84%,92%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">1세대 1주택 비과세: 조건을 모두 갖추면</text>
<g class="a1"><path d="M22 54 L26 58 L33 49" stroke="#38bdf8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="59" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">1세대가 주택 1채만 보유</text></g>
<g class="a2"><path d="M22 78 L26 82 L33 73" stroke="#38bdf8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="83" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">보유 기간 2년 이상</text></g>
<g class="a3"><path d="M22 102 L26 106 L33 97" stroke="#38bdf8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="107" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">조정대상지역 취득이면 거주 2년도</text></g>
<g class="a4"><path d="M22 126 L26 130 L33 121" stroke="#38bdf8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="131" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">양도가액 12억 원 이하(고가주택 아님)</text></g>
<g class="a5"><path d="M254 58 L300 58 L300 86.6 Q300 102.2 277 110 Q254 102.2 254 86.6 Z" stroke="#f59e0b" stroke-width="1" fill="#f59e0b" stroke-linecap="round" stroke-linejoin="round"/><text x="277" y="88" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">비과세</text></g>
<text x="160" y="160" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">요건 하나라도 빠지면 과세될 수 있음</text>
<text x="160" y="178" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">일시적 2주택·상속 등 예외는 세무사와 확인</text>
</svg>
