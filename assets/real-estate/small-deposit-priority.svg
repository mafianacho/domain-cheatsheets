<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="보증금 중 일정액은 선순위 근저당보다도 먼저 돌려받는 최우선변제의 순서 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,6%{transform:translate(0px,-48px)}28%{transform:translate(0px,0px)}40%,90%{transform:translate(0px,0px)}100%{transform:translate(0px,-48px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">최우선변제: 소액 보증금 일부는 맨 먼저</text>
<text x="30" y="46" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">내 보증금</text>
<rect x="30" y="52" width="260" height="16" rx="4" fill="#334155"/>
<rect x="30" y="52" width="60" height="16" rx="4" fill="#f59e0b"/>
<text x="60" y="64" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">일정액</text>
<text x="30" y="94" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">돌려받는 순서</text>
<rect x="30" y="100" width="260" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<rect x="90" y="100" width="130" height="16" rx="4" fill="#38bdf8"/>
<text x="155" y="112" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">선순위 근저당</text>
<rect x="220" y="100" width="70" height="16" rx="4" fill="#334155"/>
<text x="255" y="112" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">나머지</text>
<g class="a1"><rect x="30" y="100" width="60" height="16" rx="4" fill="#f59e0b"/><text x="60" y="112" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">일정액</text></g>
<text x="160" y="142" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">보증금 중 일정액은 근저당보다 먼저 받음</text>
<text x="160" y="160" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">한도: 지역별 기준 · 주택가액의 1/2 이내</text>
<text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">경매 신청 등기 전에 대항요건을 갖춰야 함</text>
</svg>
