<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="임차권등기명령으로 등기부에 기록해 두면 세입자가 이사를 가도 대항력과 우선변제권이 유지되는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,20%{transform:translate(0px,0px);opacity:1}60%{transform:translate(104px,0px);opacity:1}70%{transform:translate(104px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">임차권등기명령: 이사 가도 권리는 그대로</text>
<path d="M106 58 L138 44 L170 58 Z" stroke="#f59e0b" stroke-width="1.5" fill="#f59e0b" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="110" y="58" width="56" height="36" rx="3" fill="#334155"/>
<rect x="133" y="79" width="10" height="15" rx="2" fill="#1e293b"/>
<path d="M128 62 L148 62 L148 75.2 Q148 82.4 138 86 Q128 82.4 128 75.2 Z" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="138" y="112" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">등기부에 기록</text>
<rect x="26" y="50" width="38" height="48" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
<line x1="32" y1="59" x2="58" y2="59" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
<line x1="32" y1="67" x2="58" y2="67" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
<line x1="32" y1="75" x2="52" y2="75" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
<text x="45" y="112" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">법원 명령</text>
<line x1="68" y1="74" x2="106" y2="74" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="106" y1="74" x2="99.9" y2="77.4" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="106" y1="74" x2="99.9" y2="70.6" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<g class="a1"><circle cx="204" cy="74" r="5.4" fill="#f59e0b"/><path d="M195 92 Q195 82.1 204 82.1 Q213 82.1 213 92 Z" stroke="#f59e0b" stroke-width="1" fill="#f59e0b" stroke-linecap="round" stroke-linejoin="round"/><rect x="192" y="100" width="24" height="14" rx="2" fill="#334155" stroke="#f59e0b" stroke-width="1.2"/><line x1="192" y1="106" x2="216" y2="106" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/><text x="204" y="126" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이사</text></g>
<text x="160" y="148" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">임대차가 끝났는데 보증금을 못 받았을 때</text>
<text x="160" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">법원 명령 → 등기 → 대항력·우선변제권 유지</text>
<text x="160" y="184" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">새 세입자는 소액 우선변제를 못 받음</text>
</svg>
