<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="입주와 전입신고를 한 다음 날 0시부터 새 집주인에게도 임대차를 주장할 수 있는 대항력이 생기는 시간 순서">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,30%{transform:scale(1)}45%{transform:scale(1.15)}70%,100%{transform:scale(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">전입신고: 다음 날 0시부터 대항력</text>
<rect x="18" y="40" width="124" height="62" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect x="178" y="40" width="124" height="62" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<path d="M26 70 L37 56 L48 70 Z" stroke="#f59e0b" stroke-width="1.5" fill="#f59e0b" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="70" width="14" height="10" rx="3" fill="#334155"/>
<rect x="32" y="65" width="10" height="15" rx="2" fill="#1e293b"/>
<text x="90" y="60" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">D일</text>
<text x="96" y="82" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">입주 + 전입신고</text>
<line x1="144" y1="71" x2="176" y2="71" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="176" y1="71" x2="169.9" y2="74.4" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="176" y1="71" x2="169.9" y2="67.6" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<g class="a1"><path d="M188 56 L206 56 L206 68.1 Q206 74.7 197 78 Q188 74.7 188 68.1 Z" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="256" y="60" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">D+1일 0시</text>
<text x="258" y="82" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">대항력 생김</text>
<text x="160" y="128" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">집이 팔려도 새 주인에게</text>
<text x="160" y="144" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">임대차를 주장할 수 있는 힘</text>
<text x="160" y="170" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">전출·이사로 주민등록을 옮기면 사라질 수 있음</text>
</svg>
