<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="세입자가 맡긴 보증금이 계약 기간 동안 집주인의 금고에 있다가 끝나면 돌려받는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,4%{transform:translate(0px,0px);opacity:1}26%{transform:translate(70px,0px);opacity:1}30%{transform:translate(70px,0px);opacity:0}31%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}.a2{animation:k2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,56%{transform:translate(0px,0px);opacity:0}60%{transform:translate(0px,0px);opacity:1}86%{transform:translate(-70px,0px);opacity:1}92%{transform:translate(-70px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}.a3{animation:k3 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,40%{opacity:1}46%,94%{opacity:.4}100%{opacity:1}}.a4{animation:k4 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,48%{opacity:.4}54%,94%{opacity:1}100%{opacity:.4}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">보증금: 맡겨 두었다 돌려받는 돈</text>
<circle cx="40" cy="80" r="6" fill="#38bdf8"/>
<path d="M30 100 Q30 89 40 89 Q50 89 50 100 Z" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="120" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">세입자</text>
<circle cx="280" cy="80" r="6" fill="#f59e0b"/>
<path d="M270 100 Q270 89 280 89 Q290 89 290 100 Z" stroke="#f59e0b" stroke-width="1" fill="#f59e0b" stroke-linecap="round" stroke-linejoin="round"/>
<text x="280" y="120" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">집주인</text>
<rect x="128" y="60" width="64" height="54" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
<circle cx="160" cy="84" r="11" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<rect x="155" y="80" width="10" height="9" rx="2" fill="#f59e0b"/>
<path d="M156 80 L156 76 Q160 71 164 76 L164 80" stroke="#f59e0b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="136" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">집주인이 보관</text>
<g class="a1"><circle cx="74" cy="88" r="8" fill="#f59e0b"/><circle cx="74" cy="88" r="5.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<g class="a2"><circle cx="146" cy="88" r="8" fill="#38bdf8"/><circle cx="146" cy="88" r="5.5" fill="none" stroke="#0f172a" stroke-width="1"/></g>
<g class="a3"><text x="160" y="158" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">① 계약 때 맡긴다 → 계약 기간 동안 보관</text></g>
<g class="a4"><text x="160" y="178" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">② 계약이 끝나면 돌려받는다 (반환 청구권)</text></g>
</svg>
