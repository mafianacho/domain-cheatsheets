<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="대출을 받고 집에 근저당이 설정되면 빌린 돈이 채권최고액 한도 안에서 집을 담보로 잡힌다는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes k1{0%,8%{transform:scaleX(0.35)}50%{transform:scaleX(1)}84%,94%{transform:scaleX(1)}100%{transform:scaleX(0.35)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">근저당: 집을 담보로 잡는 대출 권리</text>
<path d="M24 68 L54 54 L84 68 Z" stroke="#f59e0b" stroke-width="1.5" fill="#f59e0b" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="28" y="68" width="52" height="38" rx="3" fill="#334155"/>
<rect x="49" y="91" width="10" height="15" rx="2" fill="#1e293b"/>
<rect x="46" y="92" width="16" height="14" rx="2" fill="#f59e0b"/>
<path d="M50 92 L50 86 Q54 80 58 86 L58 92" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="126" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">내 집</text>
<line x1="96" y1="80" x2="120" y2="80" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="120" y1="80" x2="113.9" y2="83.4" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<line x1="120" y1="80" x2="113.9" y2="76.6" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<text x="208" y="60" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">채권최고액 (담보 한도)</text>
<rect x="124" y="68" width="172" height="24" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
<g class="a1"><rect x="124" y="68" width="118" height="24" rx="5" fill="#38bdf8"/></g>
<text x="183" y="84" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">실제 빌린 돈</text>
<text x="208" y="110" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이자도 최고액 안에 포함</text>
<text x="160" y="146" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">갚지 못하면 경매 → 은행이 먼저 받음</text>
<text x="160" y="164" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">등기부 을구에서 확인</text>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">내 보증금 순서가 밀릴 수 있다</text>
</svg>
