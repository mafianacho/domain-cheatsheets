<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="파는 사람이 부르는 값 호가가 협상을 거쳐 실제로 거래된 실거래가가 되고 신고 후 실거래가 공개시스템에 올라오는 그림">
<defs><style>.a1{animation:k1 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes k1{0%,10%{transform:translate(0px,0px)}36%{transform:translate(0px,18px)}44%,88%{transform:translate(0px,18px)}100%{transform:translate(0px,0px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">호가 vs 실거래가</text>
<g class="a1"><rect x="24" y="44" width="124" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="86" y="63" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">호가 (부르는 값)</text></g>
<rect x="24" y="100" width="124" height="28" rx="6" fill="#f59e0b"/>
<text x="86" y="119" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">실거래가 (거래된 값)</text>
<text x="86" y="90" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">↓ 협상</text>
<line x1="152" y1="114" x2="176" y2="114" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<line x1="176" y1="114" x2="169.9" y2="117.4" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<line x1="176" y1="114" x2="169.9" y2="110.6" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<rect x="180" y="84" width="120" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="240" y="108" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">실거래가</text>
<text x="240" y="124" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">공개시스템</text>
<text x="240" y="138" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">(국토교통부)</text>
<text x="160" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">계약 후 30일 이내 신고 → 가격 공개</text>
<text x="160" y="184" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">호가는 협상용이라 실제 거래가와 다름</text>
</svg>
