<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="법정 주 40시간에 연장 한도 12시간이 더해져 최대 52시간이 되는 막대 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes b0k{0%,4.0%{transform:scaleY(0)}18.0%,100%{transform:scaleY(1)}}.b0{transform-box:fill-box;transform-origin:50% 100%;animation:b0k 3.8s infinite}@keyframes v0k{0%,12.0%{opacity:0}22.0%,100%{opacity:1}}.v0{animation:v0k 3.8s infinite}@keyframes b1k{0%,24.0%{transform:scaleY(0)}38.0%,100%{transform:scaleY(1)}}.b1{transform-box:fill-box;transform-origin:50% 100%;animation:b1k 3.8s infinite}@keyframes v1k{0%,32.0%{opacity:0}42.0%,100%{opacity:1}}.v1{animation:v1k 3.8s infinite}@keyframes b2k{0%,44.0%{transform:scaleY(0)}58.0%,100%{transform:scaleY(1)}}.b2{transform-box:fill-box;transform-origin:50% 100%;animation:b2k 3.8s infinite}@keyframes v2k{0%,52.0%{opacity:0}62.0%,100%{opacity:1}}.v2{animation:v2k 3.8s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
