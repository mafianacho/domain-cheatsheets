<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="10명 이상 사업장이 취업규칙을 작성하고 근로자 의견을 듣고 노동관서에 신고하는 순서 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes h0k{0%,24.99%{opacity:1}25.00%,100%{opacity:0}}.h0{opacity:0;animation:h0k 4.5s infinite}@keyframes h1k{0%,24.99%{opacity:0}25.00%,49.99%{opacity:1}50.00%,100%{opacity:0}}.h1{opacity:0;animation:h1k 4.5s infinite}@keyframes h2k{0%,49.99%{opacity:0}50.00%,74.99%{opacity:1}75.00%,100%{opacity:0}}.h2{opacity:0;animation:h2k 4.5s infinite}@keyframes h3k{0%,74.99%{opacity:0}75.00%,100%{opacity:1}}.h3{opacity:1;animation:h3k 4.5s infinite}.pk{transform:translateX(228.0px);animation:pkk 4.5s linear infinite}@keyframes pkk{0%{transform:translateX(0)}100%{transform:translateX(228.0px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
