<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="채용 과정에서 하면 안 되는 일 네 가지를 하나씩 체크하는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes k1k{0%,33.99%{opacity:0}34.00%,94%{opacity:1}97%,100%{opacity:0}}.k1{animation:k1k 4.0s infinite}@keyframes k2k{0%,59.99%{opacity:0}60.00%,94%{opacity:1}97%,100%{opacity:0}}.k2{animation:k2k 4.0s infinite}@keyframes k3k{0%,85.99%{opacity:0}86.00%,94%{opacity:1}97%,100%{opacity:0}}.k3{animation:k3k 4.0s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
