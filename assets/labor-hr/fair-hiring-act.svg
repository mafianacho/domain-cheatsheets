<text x="160.0" y="42.0" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">상시 30명 이상 사업장이 대상</text><rect x="16.0" y="50.0" width="288.0" height="24.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="24.0" y="54.0" width="16.0" height="16.0" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="50.0" y="66.5" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">거짓 채용광고</text><g class="k0"><path d="M27 62 L32 67 L38 57" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="16.0" y="80.0" width="288.0" height="24.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="24.0" y="84.0" width="16.0" height="16.0" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="50.0" y="96.5" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">직무와 무관한 키·몸무게 요구</text><g class="k1"><path d="M27 92 L32 97 L38 87" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="16.0" y="110.0" width="288.0" height="24.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="24.0" y="114.0" width="16.0" height="16.0" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="50.0" y="126.5" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">출신지역·혼인여부·재산 요구</text><g class="k2"><path d="M27 122 L32 127 L38 117" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="16.0" y="140.0" width="288.0" height="24.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="24.0" y="144.0" width="16.0" height="16.0" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="50.0" y="156.5" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">채용심사비용 떠넘기기</text><g class="k3"><path d="M27 152 L32 157 L38 147" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="160.0" y="180.0" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">30명 미만은 이 법 적용 대상 아님</text>
