<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="출산전후휴가 90일 중 출산 후 45일 이상, 최초 60일 유급을 보여주는 타임라인">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes e1k{0%,45.99%{opacity:0}46.00%,94%{opacity:1}97%,100%{opacity:0}}.e1{animation:e1k 4.5s infinite}@keyframes e2k{0%,59.35%{opacity:0}59.36%,94%{opacity:1}97%,100%{opacity:0}}.e2{animation:e2k 4.5s infinite}@keyframes e3k{0%,85.99%{opacity:0}86.00%,94%{opacity:1}97%,100%{opacity:0}}.e3{animation:e3k 4.5s infinite}.mk{transform:translateX(260px);animation:mkk 4.5s linear infinite}@keyframes mkk{0%{transform:translateX(0)}86%,100%{transform:translateX(260px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
