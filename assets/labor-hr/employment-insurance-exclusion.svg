<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="월 60시간 미만, 주 15시간 미만은 제외지만 3개월 이상 계속 근로나 일용근로자는 적용되는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes r1k{0%,33.99%{opacity:0}34.00%,94%{opacity:1}97%,100%{opacity:0}}.r1{animation:r1k 4.0s infinite}@keyframes r2k{0%,59.99%{opacity:0}60.00%,94%{opacity:1}97%,100%{opacity:0}}.r2{animation:r2k 4.0s infinite}@keyframes r3k{0%,85.99%{opacity:0}86.00%,94%{opacity:1}97%,100%{opacity:0}}.r3{animation:r3k 4.0s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160.0" y="22.0" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">고용보험 적용 제외 기준</text>
<g class="r0"><rect x="16.0" y="36.0" width="288.0" height="27.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="26.0" y="53.5" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">월 소정근로 60시간 미만</text><text x="294.0" y="54.0" font-size="11" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">제외</text></g><g class="r1"><rect x="16.0" y="67.0" width="288.0" height="27.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="26.0" y="84.5" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">주 소정근로 15시간 미만</text><text x="294.0" y="85.0" font-size="11" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">제외</text></g><g class="r2"><rect x="16.0" y="98.0" width="288.0" height="27.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="26.0" y="115.5" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">단, 3개월 이상 계속 근로</text><text x="294.0" y="116.0" font-size="11" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">적용</text></g><g class="r3"><rect x="16.0" y="129.0" width="288.0" height="27.0" rx="6" fill="#f59e0b"/><text x="26.0" y="146.5" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">일용근로자</text><text x="294.0" y="147.0" font-size="12" fill="#0f172a" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">적용</text></g><text x="160.0" y="166.0" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">소정근로시간은 계약으로 정한 시간 기준</text>
