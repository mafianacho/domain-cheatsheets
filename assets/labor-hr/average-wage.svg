<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="최근 3개월 임금 900만원을 92일로 나눠 1일 평균임금을 구하는 계산">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes r1k{0%,46.99%{opacity:0}47.00%,94%{opacity:1}97%,100%{opacity:0}}.r1{animation:r1k 4.0s infinite}@keyframes r2k{0%,85.99%{opacity:0}86.00%,94%{opacity:1}97%,100%{opacity:0}}.r2{animation:r2k 4.0s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160.0" y="22.0" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">1일 평균임금 계산</text>
<g class="r0"><rect x="16.0" y="36.0" width="288.0" height="27.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="26.0" y="53.5" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">최근 3개월 임금 총액</text><text x="294.0" y="54.0" font-size="11" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">9,000,000원</text></g><g class="r1"><rect x="16.0" y="67.0" width="288.0" height="27.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="26.0" y="84.5" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">÷ 그 기간 총일수</text><text x="294.0" y="85.0" font-size="11" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">92일</text></g><g class="r2"><rect x="16.0" y="98.0" width="288.0" height="27.0" rx="6" fill="#f59e0b"/><text x="26.0" y="115.5" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">1일 평균임금</text><text x="294.0" y="116.0" font-size="12" fill="#0f172a" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">약 97,826원</text></g><text x="160.0" y="135.0" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">통상임금보다 적으면 통상임금으로 본다</text>
