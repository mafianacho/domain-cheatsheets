<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="입사 후 3개월 수습 기간과 최저임금 90% 감액, 계약 1년 이상 조건을 보여주는 타임라인">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes e1k{0%,25.99%{opacity:0}26.00%,94%{opacity:1}97%,100%{opacity:0}}.e1{animation:e1k 4.5s infinite}@keyframes e2k{0%,85.99%{opacity:0}86.00%,94%{opacity:1}97%,100%{opacity:0}}.e2{animation:e2k 4.5s infinite}.mk{transform:translateX(260px);animation:mkk 4.5s linear infinite}@keyframes mkk{0%{transform:translateX(0)}86%,100%{transform:translateX(260px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160.0" y="22.0" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">수습 3개월과 최저임금</text>
<line x1="30.0" y1="108.0" x2="290.0" y2="108.0" stroke="#475569" stroke-width="4" stroke-linecap="round"/><g class="e0"><line x1="30.0" y1="102.0" x2="30.0" y2="86.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><text x="30.0" y="68.0" font-size="9.5" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">입사</text><text x="30.0" y="80.0" font-size="9.5" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">수습 시작</text><circle cx="30.0" cy="108.0" r="5" fill="#f59e0b"/></g><g class="e1"><line x1="95.0" y1="114.0" x2="95.0" y2="130.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><text x="95.0" y="142.0" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">3개월 지나면</text><text x="95.0" y="154.0" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">전액 지급</text><circle cx="95.0" cy="108.0" r="5" fill="#38bdf8"/></g><g class="e2"><line x1="290.0" y1="102.0" x2="290.0" y2="86.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><text x="279.2" y="68.0" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">계약기간</text><text x="279.2" y="80.0" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">1년 이상이어야</text><circle cx="290.0" cy="108.0" r="5" fill="#38bdf8"/></g><circle cx="30.0" cy="108.0" r="7" fill="#f59e0b" stroke="#0f172a" stroke-width="2" class="mk"/><text x="160.0" y="176.0" font-size="10.5" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">수습 3개월 이내: 최저임금의 90%까지</text><text x="160.0" y="190.0" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">계약 1년 미만이면 감액할 수 없음</text>
</svg>
