<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="해고 통지서에 해고사유와 해고시기를 서면으로 적는 항목 체크 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes k1k{0%,46.99%{opacity:0}47.00%,94%{opacity:1}97%,100%{opacity:0}}.k1{animation:k1k 4.0s infinite}@keyframes k2k{0%,85.99%{opacity:0}86.00%,94%{opacity:1}97%,100%{opacity:0}}.k2{animation:k2k 4.0s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160.0" y="22.0" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">해고 통지서에 필요한 것</text>
<text x="160.0" y="42.0" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">서면이 아니면 해고는 효력이 없음</text><rect x="16.0" y="50.0" width="288.0" height="24.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="24.0" y="54.0" width="16.0" height="16.0" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="50.0" y="66.5" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">해고사유 (구체적으로)</text><g class="k0"><path d="M27 62 L32 67 L38 57" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="16.0" y="80.0" width="288.0" height="24.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="24.0" y="84.0" width="16.0" height="16.0" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="50.0" y="96.5" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">해고시기 (날짜)</text><g class="k1"><path d="M27 92 L32 97 L38 87" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="16.0" y="110.0" width="288.0" height="24.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="24.0" y="114.0" width="16.0" height="16.0" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="50.0" y="126.5" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">서면(문서)으로 통지</text><g class="k2"><path d="M27 122 L32 127 L38 117" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="160.0" y="150.0" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">4명 이하 사업장은 이 조문 비적용</text>
</svg>
