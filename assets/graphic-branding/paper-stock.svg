<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="종이 종류: 얇은 종이부터 두꺼운 종이까지 쓰임이 다름">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes lf{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.lf{animation:lf 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="28">종이: 두께와 표면</text><rect x="16" y="46" width="96" height="108" rx="10" fill="#1e293b" stroke="#475569"/><g class="lf" style="animation-delay:0s"><rect x="30" y="102" width="68" height="10" rx="2" fill="#e2e8f0"/><rect x="30" y="102" width="68" height="3" fill="#f59e0b"/></g><rect x="30" y="112" width="68" height="3" fill="#475569"/><text class="c m b" x="64" y="132">얇은 종이</text><text class="c s" x="64" y="146">전단지·인쇄물</text><rect x="112" y="46" width="96" height="108" rx="10" fill="#1e293b" stroke="#475569"/><g class="lf" style="animation-delay:0.6s"><rect x="126" y="90" width="68" height="22" rx="2" fill="#cbd5e1"/><rect x="126" y="90" width="68" height="3" fill="#f59e0b"/></g><rect x="126" y="112" width="68" height="3" fill="#475569"/><text class="c m b" x="160" y="132">중간 종이</text><text class="c s" x="160" y="146">리플렛·포스터</text><rect x="208" y="46" width="96" height="108" rx="10" fill="#1e293b" stroke="#475569"/><g class="lf" style="animation-delay:1.2s"><rect x="222" y="74" width="68" height="38" rx="2" fill="#94a3b8"/><rect x="222" y="74" width="68" height="3" fill="#f59e0b"/></g><rect x="222" y="112" width="68" height="3" fill="#475569"/><text class="c m b" x="256" y="132">두꺼운 종이</text><text class="c s" x="256" y="146">명함·카드</text><text class="s c" x="160" y="180">두께(평량)와 표면(광택·무광)을 같이 정해요</text>
</svg>
