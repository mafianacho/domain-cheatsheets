<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="팬톤: 색 견본 책에서 번호로 같은 색 잉크를 고르는 방식">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}.wob{animation:wob 3s ease-in-out infinite;transform-origin:88px 158px}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="28">팬톤: 번호로 정하는 색</text><g class="wob"><rect x="75" y="62" width="26" height="96" rx="3" fill="#334155" stroke="#0f172a" stroke-width="1.5" transform="rotate(-45 88 158)"/><rect x="75" y="62" width="26" height="96" rx="3" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" transform="rotate(-30 88 158)"/><rect x="75" y="62" width="26" height="96" rx="3" fill="#22c55e" stroke="#0f172a" stroke-width="1.5" transform="rotate(-15 88 158)"/><rect x="75" y="62" width="26" height="96" rx="3" fill="#f59e0b" stroke="#0f172a" stroke-width="1.5" transform="rotate(0 88 158)"/><rect x="75" y="62" width="26" height="96" rx="3" fill="#ef4444" stroke="#0f172a" stroke-width="1.5" transform="rotate(15 88 158)"/><rect x="75" y="62" width="26" height="96" rx="3" fill="#a855f7" stroke="#0f172a" stroke-width="1.5" transform="rotate(30 88 158)"/><rect x="75" y="62" width="26" height="96" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5" transform="rotate(45 88 158)"/></g><circle cx="88" cy="158" r="6" fill="#94a3b8"/><rect x="178" y="48" width="126" height="94" rx="8" fill="#e2e8f0"/><rect x="178" y="48" width="126" height="56" rx="8" fill="#f59e0b"/><rect x="178" y="92" width="126" height="12" fill="#f59e0b"/><text class="m b d" x="188" y="122">고유 색 번호</text><rect x="188" y="130" width="64" height="4" rx="2" fill="#94a3b8"/><text class="s c" x="160" y="184">같은 번호 = 같은 색 잉크 (별도 혼합)</text>
