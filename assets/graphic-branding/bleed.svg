<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="도련: 배경색을 재단선 바깥까지 여분으로 칠해 두면 칼이 조금 어긋나도 흰 줄이 안 생김">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes cw{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,3px)}75%{transform:translate(-4px,-3px)}}.cw{animation:cw 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="28">도련: 잘려도 안 비게</text><rect x="60" y="40" width="200" height="104" rx="2" fill="#f59e0b"/><g class="cw"><rect x="74" y="54" width="172" height="76" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="74" y="54" width="172" height="76" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6 4" stroke-dashoffset="5"/></g><circle cx="160" cy="92" r="16" fill="#0f172a"/><text class="c b a" x="160" y="97" style="font-size:14px">N</text><rect x="60" y="158" width="10" height="10" fill="#f59e0b"/><text class="m" x="76" y="167">바깥 띠 = 도련 (잘려 나가는 여분)</text><path d="M60 177 h10" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="4 2"/><text class="m" x="76" y="184">점선 = 재단선 (칼이 지나가는 곳)</text>
</svg>
