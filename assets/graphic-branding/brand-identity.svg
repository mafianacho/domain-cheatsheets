<text class="t" x="16" y="28">브랜드 아이덴티티: 한결같은 얼굴</text><line x1="160" y1="108" x2="90" y2="72" stroke="#475569" stroke-width="2"/><line x1="160" y1="108" x2="230" y2="72" stroke="#475569" stroke-width="2"/><line x1="160" y1="108" x2="90" y2="136" stroke="#475569" stroke-width="2"/><line x1="160" y1="108" x2="230" y2="136" stroke="#475569" stroke-width="2"/><circle cx="160" cy="108" r="34" fill="#f59e0b"/><text class="c b d" x="160" y="112" style="font-size:11px">우리 브랜드</text><rect x="20" y="56" width="70" height="32" rx="8" fill="#1e293b" stroke="#475569"/><text class="c m" x="55" y="76">로고</text><rect class="h h0" x="20" y="56" width="70" height="32" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/><rect x="230" y="56" width="70" height="32" rx="8" fill="#1e293b" stroke="#475569"/><text class="c m" x="265" y="76">색</text><rect class="h h1" x="230" y="56" width="70" height="32" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/><rect x="20" y="120" width="70" height="32" rx="8" fill="#1e293b" stroke="#475569"/><text class="c m" x="55" y="140">글자</text><rect class="h h2" x="20" y="120" width="70" height="32" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/><rect x="230" y="120" width="70" height="32" rx="8" fill="#1e293b" stroke="#475569"/><text class="c m" x="265" y="140">말투</text><rect class="h h3" x="230" y="120" width="70" height="32" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text class="s c" x="160" y="184">어디서 봐도 같은 브랜드로 느껴지게 하는 묶음</text>
