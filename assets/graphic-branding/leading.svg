<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="리딩: 글 줄 사이의 간격이 좁아졌다 넓어짐">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes l2{0%,20%{transform:translateY(0)}50%,75%{transform:translateY(-10px)}100%{transform:translateY(0)}}@keyframes l3{0%,20%{transform:translateY(0)}50%,75%{transform:translateY(-20px)}100%{transform:translateY(0)}}@keyframes br{0%,20%{transform:scaleY(1)}50%,75%{transform:scaleY(.58)}100%{transform:scaleY(1)}}.l2{animation:l2 4s ease-in-out infinite}.l3{animation:l3 4s ease-in-out infinite}.br{transform-origin:200px 70px;animation:br 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="28">리딩: 줄과 줄 사이</text><rect x="16" y="44" width="150" height="104" rx="10" fill="#1e293b" stroke="#475569"/><text x="28" y="72" style="font-size:13px">좋은 글자는 줄 사이도</text><text class="l2" x="28" y="98" style="font-size:13px">신경 써서 정해요</text><text class="l3" x="28" y="124" style="font-size:13px">숨 쉴 틈을 줍니다</text><g class="br"><path d="M196 70 H206 M196 96 H206 M201 70 V96" stroke="#f59e0b" stroke-width="2.5" fill="none"/></g><text class="m b a" x="216" y="86">리딩</text><text class="s" x="216" y="100">줄 간격</text><text class="s c" x="160" y="178">너무 좁으면 답답, 너무 넓으면 흩어져 보임</text>
</svg>
