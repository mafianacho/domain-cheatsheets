<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="그리드 시스템: 네 개의 열에 맞춰 이미지와 글이 자리를 바꿔도 줄이 맞음">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes ga{0%,25%{transform:translateX(0)}50%,75%{transform:translateX(148px)}100%{transform:translateX(0)}}@keyframes gb{0%,25%{transform:translateX(0)}50%,75%{transform:translateX(-148px)}100%{transform:translateX(0)}}.ga{animation:ga 4s ease-in-out infinite}.gb{animation:gb 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
