<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="트래킹: BRAND 글자들의 사이가 한꺼번에 넓어졌다 좁아짐">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes tr{0%,20%{transform:translateX(0)}50%,75%{transform:translateX(var(--d))}100%{transform:translateX(0)}}.tr{animation:tr 4s ease-in-out infinite}@keyframes ln{0%,20%{transform:scaleX(1)}50%,75%{transform:scaleX(1.5)}100%{transform:scaleX(1)}}.ln{transform-box:fill-box;transform-origin:center;animation:ln 4s ease-in-out infinite}@keyframes t1{0%,20%{opacity:1}30%,75%{opacity:0}90%,100%{opacity:1}}@keyframes t2{0%,25%{opacity:0}45%,75%{opacity:1}90%,100%{opacity:0}}.t1{animation:t1 4s infinite}.t2{opacity:0;animation:t2 4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="28">트래킹: 글자 전체 간격</text><text class="c b tr" x="100" y="110" style="font-size:36px;--d:-32px">B</text><text class="c b tr" x="130" y="110" style="font-size:36px;--d:-16px">R</text><text class="c b tr" x="160" y="110" style="font-size:36px;--d:0px">A</text><text class="c b tr" x="190" y="110" style="font-size:36px;--d:16px">N</text><text class="c b tr" x="220" y="110" style="font-size:36px;--d:32px">D</text><rect class="ln" x="88" y="124" width="144" height="4" rx="2" fill="#f59e0b"/><text class="c m b a t1" x="160" y="156">좁게</text><text class="c m b k t2" x="160" y="156">넓게</text><text class="s c" x="160" y="184">한 단어·한 줄의 글자 사이를 한꺼번에 조절</text>
</svg>
