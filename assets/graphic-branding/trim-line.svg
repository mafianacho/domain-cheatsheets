<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="재단선: 인쇄물 모서리의 재단 표시를 따라 가위(칼)가 점선 위를 지나감">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes sc{0%{transform:translateX(0)}60%,100%{transform:translateX(150px)}}.sc{animation:sc 3s linear infinite}@keyframes ds{to{stroke-dashoffset:-20}}.ds{animation:ds 1.2s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="28">재단선: 칼이 지나가는 선</text><rect x="40" y="46" width="240" height="112" rx="2" fill="#e2e8f0"/><rect x="64" y="66" width="192" height="72" fill="#334155"/><circle cx="160" cy="102" r="18" fill="#f59e0b"/><rect class="ds" x="64" y="66" width="192" height="72" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/><path d="M60 66 h-14 M64 62 v-14" stroke="#0f172a" stroke-width="1.5"/><path d="M260 66 h14 M256 62 v-14" stroke="#0f172a" stroke-width="1.5"/><path d="M60 138 h-14 M64 142 v14" stroke="#0f172a" stroke-width="1.5"/><path d="M260 138 h14 M256 142 v14" stroke="#0f172a" stroke-width="1.5"/><g class="sc"><circle cx="76" cy="66" r="4.5" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/><circle cx="76" cy="75" r="4.5" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/><path d="M80 68 L92 72 M80 73 L92 70" stroke="#f43f5e" stroke-width="2"/></g><text class="s c" x="160" y="178">모서리의 작은 표시(재단 표시)를 따라 잘라요</text>
