<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="RGB는 빛을 섞는 화면용, CMYK는 잉크를 섞는 인쇄용 색 방식">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}.sp{animation:sp 4s linear infinite;transform-box:fill-box;transform-origin:center}.mx{mix-blend-mode:screen}.my{mix-blend-mode:multiply}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text class="t" x="16" y="28">RGB와 CMYK</text><rect x="12" y="40" width="142" height="104" rx="10" fill="#1e293b" stroke="#475569"/><rect x="166" y="40" width="142" height="104" rx="10" fill="#e2e8f0"/><g class="sp" style="isolation:isolate"><circle class="mx" cx="62" cy="86" r="22" fill="#ef4444"/><circle class="mx" cx="102" cy="86" r="22" fill="#22c55e"/><circle class="mx" cx="82" cy="108" r="22" fill="#3b82f6"/></g><g class="sp" style="isolation:isolate"><circle class="my" cx="216" cy="86" r="22" fill="#06b6d4"/><circle class="my" cx="256" cy="86" r="22" fill="#ec4899"/><circle class="my" cx="236" cy="108" r="22" fill="#facc15"/></g><text class="c m b" x="83" y="162">RGB · 빛 · 화면</text><text class="c m b" x="237" y="162">CMYK · 잉크 · 인쇄</text><text class="s c" x="160" y="184">같은 색도 화면과 인쇄에서 다르게 보일 수 있어요</text>
</svg>
