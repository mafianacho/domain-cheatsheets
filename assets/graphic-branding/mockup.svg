<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="목업: 평면 로고 시안을 쇼핑백 같은 실물 사진에 합성해 완성 모습을 미리 봄">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}@keyframes mk{0%,20%{opacity:.2;transform:scale(.85)}50%,85%{opacity:1;transform:scale(1)}100%{opacity:.2;transform:scale(.85)}}.mk{transform-box:fill-box;transform-origin:center;animation:mk 4s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}.ar{animation:ar 2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
