<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="컬러 팔레트: 메인, 보조, 포인트, 배경, 글자색을 정하고 쓰는 비율을 맞춤">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}.h{opacity:0;animation:hl 3.5s infinite}@keyframes hl{0%{opacity:1}16.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}.h0{animation-delay:0.00s}.h1{animation-delay:0.70s}.h2{animation-delay:1.40s}.h3{animation-delay:2.10s}.h4{animation-delay:2.80s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
