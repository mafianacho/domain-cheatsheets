<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="톤앤매너: 같은 인사를 정중하게 또는 친근하게 말하는 두 브랜드">
<style>text{font-family:system-ui,sans-serif;fill:#e2e8f0;font-size:11px}.t{font-size:13px;font-weight:700}.s{font-size:10px;fill:#94a3b8}.m{font-size:10px}.c{text-anchor:middle}.b{font-weight:700}.d{fill:#0f172a}.a{fill:#f59e0b}.k{fill:#38bdf8}.h{opacity:0;animation:hl 3s infinite}@keyframes hl{0%{opacity:1}40.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}.h0{animation-delay:0.00s}.h1{animation-delay:1.50s}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
