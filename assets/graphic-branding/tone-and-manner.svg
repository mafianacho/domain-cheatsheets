<text class="t" x="16" y="28">같은 인사, 다른 말투</text><rect x="12" y="44" width="140" height="104" rx="10" fill="#1e293b" stroke="#475569"/><circle cx="82" cy="72" r="14" fill="#38bdf8"/><circle cx="77" cy="69" r="1.8" class="d"/><circle cx="87" cy="69" r="1.8" class="d"/><path d="M77 76 h10" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/><rect x="24" y="94" width="116" height="38" rx="8" fill="#334155"/><text class="c m" x="82" y="110">방문해 주셔서</text><text class="c m" x="82" y="124">감사합니다.</text><rect class="h h0" x="12" y="44" width="140" height="104" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text class="c s" x="82" y="166">정중 · 믿음직</text><rect x="168" y="44" width="140" height="104" rx="10" fill="#1e293b" stroke="#475569"/><circle cx="238" cy="72" r="14" fill="#f59e0b"/><circle cx="233" cy="69" r="1.8" class="d"/><circle cx="243" cy="69" r="1.8" class="d"/><path d="M233 75 q5 5 10 0" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/><rect x="180" y="94" width="116" height="38" rx="8" fill="#334155"/><text class="c m" x="238" y="110">어서 와요!</text><text class="c m" x="238" y="124">오늘도 반가워요</text><rect class="h h1" x="168" y="44" width="140" height="104" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text class="c s" x="238" y="166">친근 · 가벼움</text><text class="s c" x="160" y="187">브랜드가 말하는 방식 = 톤앤매너</text>
