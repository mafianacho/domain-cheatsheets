<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="방문자를 반반 나눠 A안과 B안을 보여 주고 B안의 클릭률 5퍼센트가 A안 2퍼센트보다 높아 이기는 비교 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes wn{0%,60%{opacity:0}70%,92%{opacity:1}100%{opacity:0}}.win{animation:wn 3.6s infinite}@keyframes v0k{0%{transform:translate(0,0);opacity:0}10%{opacity:1}45%,60%{transform:translate(-75px,24px);opacity:1}70%,100%{opacity:0}}.v0{opacity:0;animation:v0k 3.6s 0.0s infinite}@keyframes v1k{0%{transform:translate(0,0);opacity:0}10%{opacity:1}45%,60%{transform:translate(75px,24px);opacity:1}70%,100%{opacity:0}}.v1{opacity:0;animation:v1k 3.6s 0.3s infinite}@keyframes v2k{0%{transform:translate(0,0);opacity:0}10%{opacity:1}45%,60%{transform:translate(-75px,24px);opacity:1}70%,100%{opacity:0}}.v2{opacity:0;animation:v2k 3.6s 0.6s infinite}@keyframes v3k{0%{transform:translate(0,0);opacity:0}10%{opacity:1}45%,60%{transform:translate(75px,24px);opacity:1}70%,100%{opacity:0}}.v3{opacity:0;animation:v3k 3.6s 0.9s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">A/B 테스트</text>
<rect x="16" y="34" width="138" height="108" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="166" y="34" width="138" height="108" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="85" y="52" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">A안</text><text x="235" y="52" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">B안</text><rect x="36" y="60" width="98" height="24" rx="6" fill="#334155"/><text x="85" y="76" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">가입하기</text><rect x="186" y="60" width="98" height="24" rx="6" fill="#f59e0b"/><text x="235" y="76" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">무료로 시작</text><rect x="40" y="126" width="30" height="6" rx="2" fill="#334155"/><rect x="56" y="126" width="58" height="8" rx="2" fill="#475569" class="ba"/><rect x="206" y="126" width="58" height="8" rx="2" fill="#f59e0b" class="bb"/><text x="85" y="112" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">클릭률 2%</text><text x="235" y="112" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">클릭률 5%</text><circle cx="160" cy="46" r="4" fill="#38bdf8" class="v0"/><circle cx="160" cy="46" r="4" fill="#38bdf8" class="v1"/><circle cx="160" cy="46" r="4" fill="#38bdf8" class="v2"/><circle cx="160" cy="46" r="4" fill="#38bdf8" class="v3"/><g class="win" transform="translate(208 8)"><rect x="0" y="0" width="54" height="16" rx="8" fill="#38bdf8"/><text x="27" y="12" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">승자 ✓</text></g><text x="160" y="164" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">같은 조건에서 한 가지만 다르게 → 반응 비교</text><text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">사람을 반반 나눠 보여 주고 숫자로 승자를 고른다</text>
</svg>
