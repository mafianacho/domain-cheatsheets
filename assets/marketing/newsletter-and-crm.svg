<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="고객 목록을 신규와 재구매로 나눠 각각 다른 맞춤 메일을 보내는 뉴스레터와 CRM 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes en{0%,10%{transform:translate(130px,60px);opacity:0}20%{opacity:1}55%{transform:translate(214px,48px);opacity:1}65%,100%{transform:translate(214px,48px);opacity:0}}@keyframes ea{0%,40%{transform:translate(130px,86px);opacity:0}50%{opacity:1}90%{transform:translate(214px,108px);opacity:1}98%,100%{opacity:0}}.en{animation:en 4s infinite}.ea{animation:ea 4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
