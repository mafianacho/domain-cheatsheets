nt-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">재구매 쿠폰 메일</text><text x="254" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">"단골 감사"</text><g class="en" style="transform:translate(214px,48px)" ><text x="0" y="0" font-size="16" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">✉</text></g><g class="ea" style="transform:translate(214px,108px)" ><text x="0" y="0" font-size="16" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">✉</text></g><text x="160" y="158" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">동의받은 고객 목록을 나눠 맞춤 메일로 관계를 쌓는다</text><text x="160" y="174" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">뉴스레터 = 정기 소식 · CRM = 고객 정보·이력 관리</text><text x="160" y="188" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">(광고성이면 수신동의·(광고) 표시 규칙 적용)</text>
