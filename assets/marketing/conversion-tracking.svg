<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="구매 완료 페이지의 추적 코드가 신호를 보내 광고 관리자의 전환 수가 0건에서 1건으로 오르는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes px{0%,15%{transform:translate(0,0);opacity:0}25%{opacity:1}70%{transform:translate(106px,-30px);opacity:1}80%,100%{transform:translate(106px,-30px);opacity:0}}.px{opacity:0;animation:px 3s infinite}@keyframes c1{0%,70%{opacity:0}80%,95%{opacity:1}100%{opacity:0}}.cv1{animation:c1 3s infinite}.cv0{opacity:0}@keyframes c0{0%,70%{opacity:1}80%,95%{opacity:0}100%{opacity:1}}.cv0{animation:c0 3s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">전환 추적 (픽셀)</text>
<rect x="12" y="42" width="84" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="54" y="60" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">광고 클릭</text><text x="54" y="76" font-size="14" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">👆</text><rect x="118" y="42" width="84" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="160" y="60" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">내 사이트</text><text x="160" y="76" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구매 완료!</text><rect x="224" y="42" width="84" height="58" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="266" y="60" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">광고 관리자</text><g class="cv1"><text x="266" y="84" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">전환 1건</text></g><g class="cv0"><text x="266" y="84" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">전환 0건</text></g><line x1="98" y1="71" x2="116" y2="71" stroke="#475569" stroke-width="2" stroke-linecap="round"/><line x1="204" y1="71" x2="222" y2="71" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="160" cy="104" r="5" fill="#f59e0b" class="px"/><text x="160" y="124" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">구매 완료 페이지의 픽셀(추적 코드)이 신호를 보냄</text><rect x="24" y="136" width="272" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="160" y="154" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">어떤 광고에서 누가 샀는지 광고 플랫폼이 알게 하는 장치</text><text x="160" y="172" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이 숫자가 있어야 전환율·ROAS를 계산할 수 있다</text>
</svg>
