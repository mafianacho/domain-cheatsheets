<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="링크 뒤에 출처, 매체, 캠페인 이름표를 붙여 어디서 온 방문인지 분석 화면에서 구분하는 UTM 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes ut0k{0%,-0.01%{opacity:0}0.00%,93%{opacity:1}98%,100%{opacity:0}}.ut0{opacity:1;animation:ut0k 4.2s infinite}@keyframes ut1k{0%,23.32%{opacity:0}23.33%,93%{opacity:1}98%,100%{opacity:0}}.ut1{opacity:1;animation:ut1k 4.2s infinite}@keyframes ut2k{0%,46.66%{opacity:0}46.67%,93%{opacity:1}98%,100%{opacity:0}}.ut2{opacity:1;animation:ut2k 4.2s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">UTM 태그</text>
<rect x="14" y="32" width="292" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="24" y="48" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">shop.kr/?</text><text x="84" y="48" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">이름표 3개를 링크 뒤에 붙인다</text><g class="ut0"><rect x="14" y="68" width="292" height="28" rx="6" fill="#334155"/><text x="26" y="86" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">utm_source=insta</text><text x="180" y="86" font-size="10" fill="#38bdf8" text-anchor="start" font-family="system-ui, sans-serif">→ 어디서 왔나</text></g><g class="ut1"><rect x="14" y="102" width="292" height="28" rx="6" fill="#334155"/><text x="26" y="120" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">utm_medium=social</text><text x="180" y="120" font-size="10" fill="#38bdf8" text-anchor="start" font-family="system-ui, sans-serif">→ 어떤 종류의 통로</text></g><g class="ut2"><rect x="14" y="136" width="292" height="28" rx="6" fill="#334155"/><text x="26" y="154" font-size="11" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">utm_campaign=fall</text><text x="180" y="154" font-size="10" fill="#38bdf8" text-anchor="start" font-family="system-ui, sans-serif">→ 어느 캠페인</text></g><rect x="14" y="168" width="292" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="160" y="183" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">분석 화면: insta · social · fall → 방문 120명</text>
</svg>
