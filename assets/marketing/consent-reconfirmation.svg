<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="수신동의를 받은 날부터 2년마다 동의 여부를 확인하는 안내를 보내야 함을 보여 주는 시간선 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes mk{0%{transform:translate(32px,66px)}45%,55%{transform:translate(157px,66px)}100%{transform:translate(272px,66px)}}.mk{animation:mk 4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">수신동의 재확인</text>
<line x1="30" y1="100" x2="290" y2="100" stroke="#475569" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="100" r="7" fill="#38bdf8"/><text x="40" y="84" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">동의 받은 날</text><text x="40" y="122" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">수신동의</text><circle cx="165" cy="100" r="7" fill="#f59e0b"/><text x="165" y="84" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">2년 후</text><text x="165" y="122" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">동의 여부 확인 안내</text><circle cx="280" cy="100" r="7" fill="#f59e0b"/><text x="280" y="84" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">다시 2년 후</text><text x="280" y="122" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">또 확인</text><g class="mk" style="transform:translate(272px,66px)"><text x="0" y="0" font-size="20" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">✉</text></g><rect x="24" y="140" width="272" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="160" y="158" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">확인 메일에 밝힐 것: 전송자 명칭 · 동의한 날짜</text><text x="160" y="174" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">· 유지/철회 방법. 확인 안내를 빼먹으면 과태료 대상</text>
</svg>
