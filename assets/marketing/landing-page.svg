<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="광고를 클릭한 사람이 도착해 제목, 혜택, 후기, 신청 버튼 순서로 읽게 만든 한 장짜리 페이지 구성 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes lp0k{0%,-0.01%{opacity:.35}0.00%,93%{opacity:1}98%,100%{opacity:.35}}.lp0{opacity:1;animation:lp0k 4.4s infinite}@keyframes lp1k{0%,17.49%{opacity:.35}17.50%,93%{opacity:1}98%,100%{opacity:.35}}.lp1{opacity:1;animation:lp1k 4.4s infinite}@keyframes lp2k{0%,34.99%{opacity:.35}35.00%,93%{opacity:1}98%,100%{opacity:.35}}.lp2{opacity:1;animation:lp2k 4.4s infinite}@keyframes lp3k{0%,52.49%{opacity:.35}52.50%,93%{opacity:1}98%,100%{opacity:.35}}.lp3{opacity:1;animation:lp3k 4.4s infinite}@keyframes lq0k{0%,-0.01%{opacity:0}0.00%,93%{opacity:1}98%,100%{opacity:0}}.lq0{opacity:1;animation:lq0k 4.4s infinite}@keyframes lq1k{0%,17.49%{opacity:0}17.50%,93%{opacity:1}98%,100%{opacity:0}}.lq1{opacity:1;animation:lq1k 4.4s infinite}@keyframes lq2k{0%,34.99%{opacity:0}35.00%,93%{opacity:1}98%,100%{opacity:0}}.lq2{opacity:1;animation:lq2k 4.4s infinite}@keyframes lq3k{0%,52.49%{opacity:0}52.50%,93%{opacity:1}98%,100%{opacity:0}}.lq3{opacity:1;animation:lq3k 4.4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">랜딩 페이지</text>
<rect x="14" y="32" width="150" height="154" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="14" y="32" width="150" height="12" rx="6" fill="#334155"/><circle cx="24" cy="38" r="2.5" fill="#94a3b8"/><circle cx="32" cy="38" r="2.5" fill="#94a3b8"/><circle cx="40" cy="38" r="2.5" fill="#94a3b8"/><g class="lp0"><rect x="22" y="50" width="134" height="24" rx="4" fill="#334155"/><text x="89" y="66" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">한 줄 약속(제목)</text></g><g class="lp1"><rect x="22" y="80" width="134" height="34" rx="4" fill="#334155"/><text x="89" y="101" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">이미지 · 핵심 혜택 3가지</text></g><g class="lp2"><rect x="22" y="120" width="134" height="24" rx="4" fill="#334155"/><text x="89" y="136" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">후기 · 신뢰 요소</text></g><g class="lp3"><rect x="46" y="152" width="86" height="24" rx="6" fill="#f59e0b"/><text x="89" y="168" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">지금 신청하기</text></g><g class="lq0"><text x="176" y="62" font-size="10" fill="#38bdf8" text-anchor="start" font-family="system-ui, sans-serif">← 무엇을 주는지 바로 보이게</text></g><g class="lq1"><text x="176" y="97" font-size="10" fill="#38bdf8" text-anchor="start" font-family="system-ui, sans-serif">← 왜 좋은지 짧게</text></g><g class="lq2"><text x="176" y="132" font-size="10" fill="#38bdf8" text-anchor="start" font-family="system-ui, sans-serif">← 믿을 근거</text></g><g class="lq3"><text x="176" y="168" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">← 행동 버튼 하나</text></g>
