<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="문자 광고에 사전 동의, (광고) 표시와 보낸 곳, 무료 수신거부 방법을 넣고 밤 시간에는 별도 동의를 받아야 한다는 체크리스트 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes rk0k{0%,-0.01%{opacity:0}0.00%,93%{opacity:1}98%,100%{opacity:0}}.rk0{opacity:1;animation:rk0k 4.6s infinite}@keyframes rk1k{0%,17.49%{opacity:0}17.50%,93%{opacity:1}98%,100%{opacity:0}}.rk1{opacity:1;animation:rk1k 4.6s infinite}@keyframes rk2k{0%,34.99%{opacity:0}35.00%,93%{opacity:1}98%,100%{opacity:0}}.rk2{opacity:1;animation:rk2k 4.6s infinite}@keyframes rk3k{0%,52.49%{opacity:0}52.50%,93%{opacity:1}98%,100%{opacity:0}}.rk3{opacity:1;animation:rk3k 4.6s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">광고성 정보 전송 규칙</text>
<rect x="12" y="34" width="140" height="122" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="82" y="50" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">문자 메시지</text><rect x="20" y="56" width="124" height="94" rx="8" fill="#334155"/><text x="28" y="72" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">(광고) 가을 세일 안내</text><text x="28" y="88" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">전 메뉴 20% 할인</text><text x="28" y="104" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">발신: ○○카페 02-000-0000</text><text x="28" y="120" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">무료수신거부 080-000-0000</text><text x="28" y="140" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">※ 번호는 예시</text><g class="rk0"><text x="166" y="62" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">① 사전 동의 받은 사람에게만</text></g><g class="rk1"><text x="166" y="92" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">② (광고) 표시 + 보내는 곳</text></g><g class="rk2"><text x="166" y="122" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">③ 무료 수신거부 방법</text></g><g class="rk3"><rect x="164" y="138" width="148" height="30" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="238" y="151" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">오후 9시~오전 8시</text><text x="238" y="163" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">별도 동의 필요</text></g>
</svg>
