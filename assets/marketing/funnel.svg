<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="인지 천 명, 관심 삼백 명, 고려 백 명, 구매 삼십 명으로 아래로 갈수록 좁아지는 퍼널 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes fd0k{0%{transform:translateY(0);opacity:0}6%{opacity:1}90%{opacity:1}100%{transform:translateY(110px);opacity:0}100%{opacity:0}}.fd0{opacity:0;animation:fd0k 3.6s 0.00s infinite}@keyframes fd1k{0%{transform:translateY(0);opacity:0}6%{opacity:1}72%{opacity:1}80%{transform:translateY(88px);opacity:0}100%{opacity:0}}.fd1{opacity:0;animation:fd1k 3.6s 0.55s infinite}@keyframes fd2k{0%{transform:translateY(0);opacity:0}6%{opacity:1}50%{opacity:1}55%{transform:translateY(60px);opacity:0}100%{opacity:0}}.fd2{opacity:0;animation:fd2k 3.6s 1.10s infinite}@keyframes fd3k{0%{transform:translateY(0);opacity:0}6%{opacity:1}27%{opacity:1}30%{transform:translateY(33px);opacity:0}100%{opacity:0}}.fd3{opacity:0;animation:fd3k 3.6s 1.65s infinite}@keyframes fd4k{0%{transform:translateY(0);opacity:0}6%{opacity:1}11%{opacity:1}12%{transform:translateY(13px);opacity:0}100%{opacity:0}}.fd4{opacity:0;animation:fd4k 3.6s 2.20s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">퍼널</text>
<rect x="4.0" y="30" width="252" height="26" rx="4" fill="#334155"/><text x="130.0" y="47" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">인지 1,000명</text><rect x="35.0" y="62" width="190" height="26" rx="4" fill="#334155"/><text x="130.0" y="79" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">관심 300명</text><rect x="64.0" y="94" width="132" height="26" rx="4" fill="#334155"/><text x="130.0" y="111" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">고려 100명</text><rect x="90.0" y="126" width="80" height="26" rx="4" fill="#f59e0b"/><text x="130.0" y="143" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구매 30명</text><text x="248" y="47" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">광고를 봄</text><text x="228" y="79" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">클릭·검색</text><text x="204" y="111" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">비교·장바구니</text><text x="186" y="143" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">결제</text><circle cx="106" cy="34" r="4" fill="#38bdf8" class="fd fd0"/><circle cx="142" cy="34" r="4" fill="#38bdf8" class="fd fd1"/><circle cx="124" cy="34" r="4" fill="#38bdf8" class="fd fd2"/><circle cx="160" cy="34" r="4" fill="#38bdf8" class="fd fd3"/><circle cx="130" cy="34" r="4" fill="#38bdf8" class="fd fd4"/><text x="160" y="176" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">위에서 아래로 갈수록 사람이 줄어듭니다</text><text x="160" y="192" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">줄어드는 칸을 찾는 것이 퍼널 개선</text>
</svg>
