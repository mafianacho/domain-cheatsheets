<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="세 경쟁사가 모두 같은 장점을 말할 때 우리만 가진 당일 배송이라는 차별점이 강조되는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes ps{0%,100%{opacity:1}50%{opacity:.35}}.usp{animation:ps 1.6s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">USP · 차별점</text>
