serif">우리</text><text x="269" y="76" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">품질 ✓</text><text x="269" y="94" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">가격 ✓</text><text x="269" y="112" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">친절 ✓</text><g class="usp"><rect x="222" y="120" width="66" height="26" rx="6" fill="#f59e0b"/><text x="255" y="137" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">당일 배송</text></g><text x="160" y="176" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">다 같은 말 속에서 "우리만 되는 한 가지"</text><text x="160" y="192" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이것이 USP(차별점)</text>
