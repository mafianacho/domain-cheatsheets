<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="같은 게시물을 올려도 오가닉은 천천히 조금 퍼지고 유료 광고는 돈을 내면 바로 넓게 퍼지는 도달 범위 비교 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes og{0%{transform:scale(1)}100%{transform:scale(1.9)}}.og{animation:og 4s ease-out infinite}@keyframes pd{0%,10%{transform:scale(1)}25%,100%{transform:scale(3.1)}}.pd{animation:pd 4s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">오가닉 vs 유료</text>
<rect x="14" y="34" width="142" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><rect x="164" y="34" width="142" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="85" y="52" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">오가닉</text><text x="235" y="52" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">유료 광고</text><circle cx="85" cy="102" r="38" fill="none" stroke="#475569" stroke-width="1"/><circle cx="235" cy="102" r="38" fill="none" stroke="#475569" stroke-width="1"/><circle cx="85" cy="102" r="12" fill="#38bdf8" class="f og"/><circle cx="235" cy="102" r="12" fill="#f59e0b" class="f pd"/><text x="85" y="172" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">무료 · 천천히 · 팔로워 중심</text><text x="235" y="172" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">비용 · 바로 · 원하는 타깃</text>
</svg>
