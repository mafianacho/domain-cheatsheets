<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="이미지, 제목 문구, 버튼으로 이루어진 광고 소재 한 세트가 세 가지 변형으로 바뀌는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes cr0k{0%,33.32%{opacity:1}33.33%,100%{opacity:0}}.cr0{opacity:0;animation:cr0k 4.5s infinite}@keyframes cr1k{0%,33.32%{opacity:0}33.33%,66.66%{opacity:1}66.67%,100%{opacity:0}}.cr1{opacity:0;animation:cr1k 4.5s infinite}@keyframes cr2k{0%,66.66%{opacity:0}66.67%,100%{opacity:1}}.cr2{opacity:1;animation:cr2k 4.5s infinite}@keyframes cx0k{0%,33.32%{opacity:1}33.33%,100%{opacity:0}}.cx0{opacity:0;animation:cx0k 4.5s infinite}@keyframes cx1k{0%,33.32%{opacity:0}33.33%,66.66%{opacity:1}66.67%,100%{opacity:0}}.cx1{opacity:0;animation:cx1k 4.5s infinite}@keyframes cx2k{0%,66.66%{opacity:0}66.67%,100%{opacity:1}}.cx2{opacity:1;animation:cx2k 4.5s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">광고 소재 (Creative)</text>
<rect x="110" y="30" width="140" height="130" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="118" y="38" width="124" height="54" rx="6" fill="#38bdf8" class="cr cr0"/><rect x="118" y="38" width="124" height="54" rx="6" fill="#f59e0b" class="cr cr1"/><rect x="118" y="38" width="124" height="54" rx="6" fill="#a78bfa" class="cr cr2"/><text x="180" y="110" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="cx cx0" font-family="system-ui, sans-serif">첫 주문 30% 할인</text><text x="180" y="110" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="cx cx1" font-family="system-ui, sans-serif">오늘만 무료배송</text><text x="180" y="110" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" class="cx cx2" font-family="system-ui, sans-serif">리뷰 4.8점 인기템</text><text x="180" y="126" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">부제·설명 한 줄</text><rect x="142" y="134" width="76" height="20" rx="5" fill="#f59e0b"/><text x="180" y="148" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구매하기</text><text x="18" y="62" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">이미지·영상</text><text x="18" y="112" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">문구(제목)</text><text x="18" y="148" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">버튼</text><line x1="88" y1="62" x2="114" y2="62" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/><line x1="88" y1="112" x2="114" y2="112" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/><line x1="88" y1="148" x2="138" y2="148" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/><text x="160" y="180" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">광고에 실제로 보이는 소재(이미지+문구+버튼) 한 세트</text>
</svg>
