<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="한 사람에게 같은 광고가 하나씩 쌓이며 몇 번 봤는지 세는 빈도 개념 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes ad0k{0%,-0.01%{opacity:0}0.00%,93%{opacity:1}98%,100%{opacity:0}}.ad0{opacity:1;animation:ad0k 4.4s infinite}@keyframes ad1k{0%,19.99%{opacity:0}20.00%,93%{opacity:1}98%,100%{opacity:0}}.ad1{opacity:1;animation:ad1k 4.4s infinite}@keyframes ad2k{0%,39.99%{opacity:0}40.00%,93%{opacity:1}98%,100%{opacity:0}}.ad2{opacity:1;animation:ad2k 4.4s infinite}@keyframes ad3k{0%,59.99%{opacity:0}60.00%,93%{opacity:1}98%,100%{opacity:0}}.ad3{opacity:1;animation:ad3k 4.4s infinite}@keyframes fq0k{0%,24.99%{opacity:1}25.00%,100%{opacity:0}}.fq0{opacity:0;animation:fq0k 4.4s infinite}@keyframes fq1k{0%,24.99%{opacity:0}25.00%,49.99%{opacity:1}50.00%,100%{opacity:0}}.fq1{opacity:0;animation:fq1k 4.4s infinite}@keyframes fq2k{0%,49.99%{opacity:0}50.00%,74.99%{opacity:1}75.00%,100%{opacity:0}}.fq2{opacity:0;animation:fq2k 4.4s infinite}@keyframes fq3k{0%,74.99%{opacity:0}75.00%,100%{opacity:1}}.fq3{opacity:1;animation:fq3k 4.4s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
