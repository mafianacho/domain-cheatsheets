<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="경쟁사가 몰린 곳을 피해 가격과 품질 지도에서 비어 있는 자리로 우리 상품이 이동하는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes mvk{0%,12%{transform:translate(150px,124px)}55%,100%{transform:translate(60px,56px)}}.mv{animation:mvk 3.6s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">포지셔닝</text>
<rect x="24" y="34" width="192" height="136" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><line x1="120" y1="34" x2="120" y2="170" stroke="#475569" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="24" y1="102" x2="216" y2="102" stroke="#475569" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="120" y="183" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">가격 낮음 ← → 높음</text><text transform="rotate(-90 16 102)" x="16" y="102" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">품질</text><circle cx="150" cy="140" r="8" fill="#334155" stroke="#94a3b8" stroke-width="1"/><text x="150" y="143" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">A</text><circle cx="170" cy="118" r="8" fill="#334155" stroke="#94a3b8" stroke-width="1"/><text x="170" y="121" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">B</text><circle cx="186" cy="62" r="8" fill="#334155" stroke="#94a3b8" stroke-width="1"/><text x="186" y="65" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">C</text><circle cx="140" cy="124" r="8" fill="#334155" stroke="#94a3b8" stroke-width="1"/><text x="140" y="127" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">D</text><text x="250" y="60" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">경쟁사는</text><text x="250" y="74" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">가운데에</text><text x="250" y="88" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">몰려 있음</text><g class="mv" style="transform:translate(60px,56px)"><circle cx="0" cy="0" r="11" fill="#f59e0b"/><text x="0" y="3" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">우리</text></g><text x="250" y="122" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">비어 있는 자리:</text><text x="250" y="136" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">합리적 가격 +</text><text x="250" y="150" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">높은 품질</text>
</svg>
