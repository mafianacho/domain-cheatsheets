<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="눌러도 뭐가 되는지 모호한 자세히 보기 버튼과 행동이 분명한 무료 체험 시작 버튼을 비교하는 CTA 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes pu2{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.big{transform-box:fill-box;transform-origin:center;animation:pu2 1.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">CTA · 행동 유도 버튼</text>
<text x="80" y="46" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">약한 버튼</text><text x="240" y="46" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">강한 버튼</text><rect x="20" y="56" width="120" height="38" rx="8" fill="#334155"/><text x="80" y="79" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">자세히 보기</text><g class="big"><rect x="180" y="56" width="120" height="38" rx="8" fill="#f59e0b"/><text x="240" y="79" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">무료 체험 시작</text></g><text x="80" y="112" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">뭘 하라는 건지 불분명</text><text x="240" y="112" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">동사 + 얻는 것이 분명</text><rect x="24" y="128" width="272" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="160" y="146" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">CTA = 다음 행동을 부르는 한 마디 버튼</text><text x="160" y="164" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">"지금 ~하기" "무료로 ~받기" · 한 화면에 핵심 하나</text><text x="160" y="178" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">버튼 문구만 바꿔도 클릭률이 달라질 수 있다</text>
</svg>
