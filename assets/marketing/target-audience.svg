<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="많은 사람 중 우리 상품을 살 가능성이 큰 일부(주황색)를 골라 타깃 고객으로 정하는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}.hi{animation:pu 1.6s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">타깃 고객</text>
<rect x="20" y="34" width="280" height="82" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><circle cx="44" cy="60" r="10" fill="#334155"/><circle cx="77" cy="60" r="10" fill="#334155"/><circle cx="110" cy="60" r="10" fill="#f59e0b" class="f hi"/><circle cx="143" cy="60" r="10" fill="#f59e0b" class="f hi"/><circle cx="176" cy="60" r="10" fill="#334155"/><circle cx="209" cy="60" r="10" fill="#334155"/><circle cx="242" cy="60" r="10" fill="#334155"/><circle cx="275" cy="60" r="10" fill="#334155"/><circle cx="44" cy="96" r="10" fill="#334155"/><circle cx="77" cy="96" r="10" fill="#334155"/><circle cx="110" cy="96" r="10" fill="#334155"/><circle cx="143" cy="96" r="10" fill="#f59e0b" class="f hi"/><circle cx="176" cy="96" r="10" fill="#f59e0b" class="f hi"/><circle cx="209" cy="96" r="10" fill="#334155"/><circle cx="242" cy="96" r="10" fill="#334155"/><circle cx="275" cy="96" r="10" fill="#334155"/><path d="M118 130 L160 142 L202 130" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="146" width="240" height="40" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2"/><text x="160" y="162" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">타깃 고객 = 가장 사 줄 것 같은 사람들</text><text x="160" y="178" font-size="10" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">예: 퇴근 후 운동하는 30대 직장인</text>
</svg>
