<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="방문자 백 명 중 네 명만 결제까지 가서 전환율이 4퍼센트가 되는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes wk0k{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(50px);opacity:1}50%,100%{transform:translateX(50px);opacity:0}}.wk0{opacity:0;animation:wk0k 3s 0.0s infinite}@keyframes wk1k{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(50px);opacity:1}50%,100%{transform:translateX(50px);opacity:0}}.wk1{opacity:0;animation:wk1k 3s 0.5s infinite}@keyframes wk2k{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(50px);opacity:1}50%,100%{transform:translateX(50px);opacity:0}}.wk2{opacity:0;animation:wk2k 3s 1.0s infinite}@keyframes wk3k{0%{transform:translateX(0);opacity:0}8%{opacity:1}40%{transform:translateX(50px);opacity:1}50%,100%{transform:translateX(50px);opacity:0}}.wk3{opacity:0;animation:wk3k 3s 1.5s infinite}@keyframes wk4k{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{transform:translateX(114px);opacity:1}95%,100%{transform:translateX(114px);opacity:0}}.wk4{opacity:0;animation:wk4k 3s 2.0s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">전환율 (Conversion Rate)</text>
<text x="60" y="46" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">방문 100명</text><text x="262" y="46" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">구매 4명</text><rect x="20" y="54" width="80" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="222" y="54" width="80" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><circle cx="32" cy="66" r="5" fill="#334155"/><circle cx="46" cy="66" r="5" fill="#334155"/><circle cx="60" cy="66" r="5" fill="#334155"/><circle cx="74" cy="66" r="5" fill="#334155"/><circle cx="88" cy="66" r="5" fill="#334155"/><circle cx="32" cy="80" r="5" fill="#334155"/><circle cx="46" cy="80" r="5" fill="#334155"/><circle cx="60" cy="80" r="5" fill="#334155"/><circle cx="74" cy="80" r="5" fill="#334155"/><circle cx="88" cy="80" r="5" fill="#334155"/><circle cx="32" cy="94" r="5" fill="#334155"/><circle cx="46" cy="94" r="5" fill="#334155"/><circle cx="60" cy="94" r="5" fill="#334155"/><circle cx="74" cy="94" r="5" fill="#334155"/><circle cx="88" cy="94" r="5" fill="#334155"/><circle cx="32" cy="108" r="5" fill="#334155"/><circle cx="46" cy="108" r="5" fill="#334155"/><circle cx="60" cy="108" r="5" fill="#334155"/><circle cx="74" cy="108" r="5" fill="#334155"/><circle cx="88" cy="108" r="5" fill="#334155"/><circle cx="236" cy="90" r="6" fill="#f59e0b"/><circle cx="253" cy="90" r="6" fill="#f59e0b"/><circle cx="270" cy="90" r="6" fill="#f59e0b"/><circle cx="287" cy="90" r="6" fill="#f59e0b"/><text x="262" y="112" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">✓</text><line x1="104" y1="90" x2="218" y2="90" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="104" cy="90" r="5" fill="#38bdf8" class="wk wk0"/><circle cx="104" cy="90" r="5" fill="#38bdf8" class="wk wk1"/><circle cx="104" cy="90" r="5" fill="#38bdf8" class="wk wk2"/><circle cx="104" cy="90" r="5" fill="#38bdf8" class="wk wk3"/><circle cx="104" cy="90" r="5" fill="#38bdf8" class="wk wk4"/><text x="160" y="82" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">결제</text><rect x="24" y="136" width="272" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="160" y="154" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">전환율 = 목표 행동 수 ÷ 방문자 수</text><text x="160" y="172" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">4 ÷ 100 = 4%</text>
</svg>
