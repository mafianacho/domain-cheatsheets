<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="왼쪽 브랜드 마케팅은 천천히 오르는 선, 오른쪽 퍼포먼스 마케팅은 바로 솟는 막대로 비교한 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes dr{0%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}.bl{animation:dr 4s ease-out infinite}.pb0{transform-origin:50% 100%;animation:gr 2s 0.00s ease-out infinite}.pb1{transform-origin:50% 100%;animation:gr 2s 0.25s ease-out infinite}.pb2{transform-origin:50% 100%;animation:gr 2s 0.50s ease-out infinite}.pb3{transform-origin:50% 100%;animation:gr 2s 0.75s ease-out infinite}.pb4{transform-origin:50% 100%;animation:gr 2s 1.00s ease-out infinite}@keyframes gr{0%{transform:scaleY(.1)}40%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">브랜드 vs 퍼포먼스</text>
<rect x="14" y="34" width="142" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><rect x="164" y="34" width="142" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="85" y="52" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">브랜드 마케팅</text><text x="235" y="52" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">퍼포먼스 마케팅</text><text x="85" y="66" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">기억·호감 쌓기</text><text x="235" y="66" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">클릭·구매 바로 얻기</text><path d="M28 140 Q70 138 100 118 T142 82" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="bl" pathLength="1" stroke-dasharray="1"/><rect x="178" y="120" width="16" height="20" rx="2" fill="#f59e0b" class="f pb pb0"/><rect x="202" y="96" width="16" height="44" rx="2" fill="#f59e0b" class="f pb pb1"/><rect x="226" y="110" width="16" height="30" rx="2" fill="#f59e0b" class="f pb pb2"/><rect x="250" y="84" width="16" height="56" rx="2" fill="#f59e0b" class="f pb pb3"/><rect x="274" y="102" width="16" height="38" rx="2" fill="#f59e0b" class="f pb pb4"/><text x="85" y="170" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">오래 걸리고 측정이 어려움</text><text x="235" y="170" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">빠르고 숫자로 바로 측정</text><text x="160" y="192" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">둘 다 필요: 브랜드가 퍼포먼스 효율을 받쳐 줍니다</text>
</svg>
