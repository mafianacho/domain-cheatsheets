<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="광고 표시를 게시물 첫머리에 바로 보이게 쓴 예와 더보기 뒤에 숨긴 예를 비교한 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes ok{0%,100%{opacity:1}50%{opacity:.4}}.ok{animation:ok 1.8s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">대가성 광고 표시</text>
<rect x="12" y="34" width="142" height="124" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><rect x="166" y="34" width="142" height="124" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="83" y="50" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">✓ 이렇게</text><text x="237" y="50" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">✗ 이러면 안 됨</text><rect x="22" y="58" width="122" height="52" rx="6" fill="#334155"/><g class="ok"><text x="28" y="72" font-size="9" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">#광고  업체로부터 협찬</text></g><text x="28" y="88" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">써 보니 향이 좋아요</text><text x="28" y="102" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">재구매 의사 있음</text><rect x="176" y="58" width="122" height="52" rx="6" fill="#334155"/><text x="182" y="72" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">써 보니 향이 좋아요</text><text x="182" y="86" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">재구매 의사 있음</text><text x="182" y="102" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">… 더보기</text><text x="83" y="128" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">추천 글 가까이, 바로 보이게</text><text x="83" y="142" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">"#광고" "협찬" 등 분명한 말</text><text x="237" y="128" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">더보기·댓글 속에 숨김</text><text x="237" y="142" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">"체험단" "선물"만으론 부족</text><text x="160" y="178" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">돈·물건·할인 등 대가를 받았다면 매 게시물마다 밝히기</text>
</svg>
