<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="인플루언서가 광고 표시를 단 게시물을 올리자 팔로워들이 하트를 누르는 인플루언서 마케팅 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes ht{0%,100%{opacity:.25}50%{opacity:1}}.ht0{animation:ht 2.4s 0.0s infinite}.ht1{animation:ht 2.4s 0.4s infinite}.ht2{animation:ht 2.4s 0.8s infinite}.ht3{animation:ht 2.4s 1.2s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">인플루언서 마케팅</text>
<circle cx="52" cy="56" r="11" fill="#334155"/><path d="M36 90 Q36 70 52 70 Q68 70 68 90 Z" fill="#334155"/><text x="52" y="106" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">인플루언서</text><g transform="translate(70 66)"><rect x="0" y="0" width="36" height="22" rx="5" fill="#f59e0b"/><text x="18" y="15" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">상품</text></g><rect x="116" y="44" width="94" height="54" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="163" y="62" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">#광고 협찬</text><text x="163" y="78" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">"써 보니 좋아요"</text><text x="163" y="91" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">게시물</text><circle cx="246" cy="50" r="8" fill="#334155"/><path d="M234 76 Q234 60 246 60 Q258 60 258 76 Z" fill="#334155"/><text x="256" y="44" font-size="11" fill="#f59e0b" text-anchor="middle" class="ht ht0" font-family="system-ui, sans-serif">♥</text><circle cx="282" cy="50" r="8" fill="#334155"/><path d="M270 76 Q270 60 282 60 Q294 60 294 76 Z" fill="#334155"/><text x="292" y="44" font-size="11" fill="#f59e0b" text-anchor="middle" class="ht ht1" font-family="system-ui, sans-serif">♥</text><circle cx="246" cy="94" r="8" fill="#334155"/><path d="M234 120 Q234 104 246 104 Q258 104 258 120 Z" fill="#334155"/><text x="256" y="88" font-size="11" fill="#f59e0b" text-anchor="middle" class="ht ht2" font-family="system-ui, sans-serif">♥</text><circle cx="282" cy="94" r="8" fill="#334155"/><path d="M270 120 Q270 104 282 104 Q294 104 294 120 Z" fill="#334155"/><text x="292" y="88" font-size="11" fill="#f59e0b" text-anchor="middle" class="ht ht3" font-family="system-ui, sans-serif">♥</text><line x1="212" y1="70" x2="232" y2="70" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="160" y="134" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">팔로워가 믿는 사람의 입을 빌려 알리는 방식</text><text x="160" y="152" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">큰 계정 ≠ 항상 효과 · 우리 타깃과 맞는지가 중요</text><text x="160" y="168" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">대가를 받았다면 광고임을 밝혀야 한다</text>
</svg>
