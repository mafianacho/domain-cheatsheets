<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="광고비 10만 원으로 매출 40만 원을 벌어 광고 수익률 ROAS가 400퍼센트가 되는 막대 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes rg{0%{transform:scaleX(.1)}50%,100%{transform:scaleX(1)}}.rv{animation:rg 3s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">ROAS · 광고 수익률</text>
<text x="24" y="52" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">광고비</text><text x="24" y="98" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">광고로 번 매출</text><rect x="24" y="58" width="50" height="22" rx="4" fill="#f59e0b"/><text x="82" y="74" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">10만 원</text><rect x="24" y="104" width="200" height="22" rx="4" fill="#38bdf8" class="rv" style="transform-origin:0 50%;transform-box:fill-box"/><text x="232" y="120" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">40만 원</text><rect x="24" y="140" width="272" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="160" y="157" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">ROAS = 광고 매출 ÷ 광고비 × 100</text><text x="160" y="175" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">40만 ÷ 10만 = 4배 = 400%</text>
</svg>
