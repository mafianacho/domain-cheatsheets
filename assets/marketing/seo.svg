<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="검색창에 단어를 넣었을 때 우리 글이 네 번째에서 첫 번째로 올라가고 경쟁 글이 한 칸씩 내려가는 검색 순위 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes us{0%,20%{transform:translateY(84px)}55%,100%{transform:translateY(0)}}.us{animation:us 3.6s ease-in-out infinite}@keyframes ot{0%,20%{transform:translateY(-28px)}55%,100%{transform:translateY(0)}}.ot1{animation:ot 3.6s ease-in-out infinite}.ot2{animation:ot 3.6s ease-in-out infinite}.ot3{animation:ot 3.6s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">SEO · 검색 최적화</text>
<rect x="14" y="32" width="292" height="24" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="28" y="48" font-size="11" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">🔍 성수동 수제 케이크</text><g class="us"><rect x="14" y="62" width="292" height="24" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2"/><text x="26" y="78" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">1위</text><text x="66" y="78" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">우리 가게 글</text></g><g class="ot ot1"><rect x="14" y="90" width="292" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="106" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">2위</text><text x="66" y="106" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">경쟁 블로그</text></g><g class="ot ot2"><rect x="14" y="118" width="292" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="134" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">3위</text><text x="66" y="134" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">경쟁 쇼핑몰</text></g><g class="ot ot3"><rect x="14" y="146" width="292" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="26" y="162" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">4위</text><text x="66" y="162" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">커뮤니티 글</text></g><text x="160" y="184" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">SEO: 돈 내지 않고 검색 결과 위쪽에 오르게 다듬기</text>
</svg>
