<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="쇼핑몰에서 장바구니만 담고 나간 사람에게 다른 앱에서 그 상품 광고가 따라가 다시 보이는 흐름 그림">
