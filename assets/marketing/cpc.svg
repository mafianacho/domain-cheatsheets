<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="광고를 한 번 클릭할 때마다 500원이 빠져나가는 모습과 광고비를 클릭 수로 나누는 식을 보여 주는 그림">
<style>.f{transform-box:fill-box;transform-origin:center}@keyframes cu{0%,20%{transform:translate(0,0)}35%{transform:translate(0,4px)}50%,100%{transform:translate(0,0)}}.cur{animation:cu 2.6s infinite}@keyframes rp{0%,30%{opacity:0;transform:scale(.4)}45%{opacity:1}100%{opacity:0;transform:scale(1.6)}}.rip{opacity:0;animation:rp 2.6s infinite}@keyframes co{0%,38%{transform:translate(200px,70px);opacity:0}45%{opacity:1}100%{transform:translate(200px,96px);opacity:0}}.coin{animation:co 2.6s infinite}@keyframes ng{0%,40%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}.neg{animation:ng 2.6s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="22" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">CPC · 클릭당 비용</text>
<rect x="24" y="40" width="110" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><rect x="34" y="50" width="90" height="34" rx="4" fill="#334155"/><text x="79" y="71" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">광고 배너</text><rect x="34" y="92" width="50" height="18" rx="4" fill="#f59e0b"/><text x="59" y="105" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">바로가기</text><g class="cur"><polygon points="80,104 80,120 84,116 87,123 90,122 87,115 92,115" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/></g><circle cx="59" cy="101" r="12" fill="none" stroke="#38bdf8" stroke-width="2" class="f rip"/><g class="coin" style="transform:translate(200px,70px)"><circle cx="0" cy="0" r="13" fill="#f59e0b"/><text x="0" y="4" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">₩</text></g><text x="250" y="74" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="700" class="neg" font-family="system-ui, sans-serif">−500원</text><rect x="24" y="130" width="272" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/><text x="160" y="148" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">CPC = 광고비 ÷ 클릭 수</text><text x="160" y="166" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">25,000원 ÷ 클릭 50번 = 클릭 1번에 500원</text><text x="160" y="180" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">클릭이 일어날 때만 돈이 나가는 과금이 흔함</text>
</svg>
