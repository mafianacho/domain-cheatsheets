<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="십이 개월 전에 떠나면 0퍼센트이고 십이 개월에 25퍼센트가 한 번에 확정된 뒤 매달 조금씩 늘어나는 선 그래프">
