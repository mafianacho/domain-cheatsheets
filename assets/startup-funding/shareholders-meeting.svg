<g class="rv_390"><text x="30" y="165" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">찬성 35% ≥ 총수의 1/4 ✓</text></g>
<g class="rv_480"><text x="30" y="180" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">예: 이사 선임, 재무제표 승인 (정관에 다른 정함 없을 때)</text></g>
