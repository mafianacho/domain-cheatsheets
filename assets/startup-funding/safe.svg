<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="지금 투자금을 먼저 넣고 상환 만기와 이자 없이 기다리다 다음 투자 라운드에서 가격이 정해지면 주식으로 전환되는 시간선 그림">
<style>@keyframes tk_40_50_100_400_250_100{0%,6.67%{opacity:0;transform:translate(50px,100px)}7.17%{opacity:1;transform:translate(50px,100px)}66.67%{opacity:1;transform:translate(250px,100px)}94%{opacity:1;transform:translate(250px,100px)}97%,100%{opacity:0;transform:translate(250px,100px)}}.tk_40_50_100_400_250_100{animation:tk_40_50_100_400_250_100 5.0s linear infinite}@keyframes rv_420{0%,70.0%{opacity:0}73.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_420{animation:rv_420 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">조건부지분인수계약(SAFE형)</text>
<line x1="50" y1="100" x2="250" y2="100" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="50" cy="100" r="9" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<circle cx="250" cy="100" r="9" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
<text x="50" y="126" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">지금 입금</text>
<text x="250" y="126" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">다음 투자 라운드</text>
<text x="150" y="90" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">기업가치 미정 · 이자·상환만기 없음</text>
<g class="tk_40_50_100_400_250_100" opacity="0" transform="translate(50,100)"><circle cx="0" cy="0" r="6" fill="#f59e0b"/></g>
<g class="rv_420"><rect x="228" y="52" width="44" height="18" rx="3" fill="#38bdf8"/><text x="250" y="65" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">주식</text><line x1="250" y1="72" x2="250" y2="90" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/></g>
<text x="160" y="152" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">가격은 나중에 정해지고, 그때 주식으로 바뀐다</text>
<text x="160" y="172" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">벤처투자법 제2조: 상환만기일·이자 없는 계약</text>
