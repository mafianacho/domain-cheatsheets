<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="투자 전 기업가치 8억 원에 투자금 2억 원이 더해져 투자 후 기업가치 10억 원이 되고 투자자 지분이 20퍼센트가 되는 그림">
<style>@keyframes grXleft_100_180{0%,18.18%{transform:scaleX(0)}32.73%,94%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}.grXleft_100_180{transform-box:fill-box;transform-origin:left center;animation:grXleft_100_180 5.0s linear infinite}@keyframes rv_180{0%,32.73%{opacity:0}35.73%,94%{opacity:1}97%,100%{opacity:0}}.rv_180{animation:rv_180 5.0s linear infinite}@keyframes rv_200{0%,36.36%{opacity:0}39.36%,94%{opacity:1}97%,100%{opacity:0}}.rv_200{animation:rv_200 5.0s linear infinite}@keyframes rv_320{0%,58.18%{opacity:0}61.18%,94%{opacity:1}97%,100%{opacity:0}}.rv_320{animation:rv_320 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">투자 전 가치 + 투자금 = 투자 후 가치</text>
<rect x="30" y="52" width="160" height="32" rx="3" fill="#38bdf8"/>
<text x="110" y="72" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">투자 전 8억</text>
<rect x="190" y="52" width="40" height="32" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
<g class="grXleft_100_180"><rect x="190" y="52" width="40" height="32" rx="3" fill="#f59e0b"/></g>
<g class="rv_180"><text x="210" y="72" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">2억</text></g>
<g class="rv_200"><line x1="30" y1="100" x2="230" y2="100" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/><line x1="30" y1="95" x2="30" y2="105" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/><line x1="230" y1="95" x2="230" y2="105" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/><text x="130" y="120" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">투자 후 기업가치 10억</text></g>
<g class="rv_320"><text x="160" y="150" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">투자자 지분 = 2억 ÷ 10억 = 20%</text></g>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">예시 숫자입니다 · 투자 후 = 투자 전 + 투자금</text>
</svg>
