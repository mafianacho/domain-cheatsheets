<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="창업자와 투자자와 공동창업자가 가운데 주주간계약서로 연결되고 이사 선임권, 매각 조건, 정보 열람 권리가 번갈아 표시되는 그림">
<style>@keyframes dr_30_100{0%,5.0%{stroke-dashoffset:1}16.67%,94%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1}}.dr_30_100{stroke-dasharray:1;animation:dr_30_100 5.0s linear infinite}@keyframes dr_50_120{0%,8.33%{stroke-dashoffset:1}20.0%,94%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1}}.dr_50_120{stroke-dasharray:1;animation:dr_50_120 5.0s linear infinite}@keyframes wn_120_260{0%,20.0%{opacity:0}22.0%,43.33%{opacity:1}45.33%,100%{opacity:0}}.wn_120_260{animation:wn_120_260 5.0s linear infinite}@keyframes wn_270_410{0%,45.0%{opacity:0}47.0%,68.33%{opacity:1}70.33%,100%{opacity:0}}.wn_270_410{animation:wn_270_410 5.0s linear infinite}@keyframes wn_420_560{0%,70.0%{opacity:0}72.0%,93.33%{opacity:1}95.33%,100%{opacity:0}}.wn_420_560{animation:wn_420_560 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">주주간계약: 주주끼리의 약속</text>
<circle cx="64" cy="66" r="26" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="64" y="70" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">창업자</text>
<circle cx="256" cy="66" r="26" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="256" y="70" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">투자자</text>
<circle cx="160" cy="150" r="26" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="160" y="154" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">공동창업자</text>
<rect x="122" y="78" width="76" height="42" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
<text x="160" y="96" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">주주간</text>
<text x="160" y="110" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">계약서</text>
<path d="M88,74 L122,90" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dr_30_100" pathLength="1"/>
<path d="M232,74 L198,90" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dr_50_120" pathLength="1"/>
<path d="M160,124 L160,121" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="wn_120_260" opacity="0"><text x="160" y="188" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">이사 선임권을 누가 갖는가</text></g>
<g class="wn_270_410" opacity="0"><text x="160" y="188" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">주식을 팔 때 지켜야 할 조건</text></g>
<g class="wn_420_560" opacity="0"><text x="160" y="188" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">회사 정보를 볼 권리</text></g>
<text x="160" y="40" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">주주들끼리 따로 맺는 약속</text>
