<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="투자금액, 투자 전 가치, 지분율, 이사회 권리 같은 핵심 조건이 한 장의 표에 차례로 채워지는 그림">
<style>@keyframes rv_60{0%,10.91%{opacity:0}13.91%,94%{opacity:1}97%,100%{opacity:0}}.rv_60{animation:rv_60 5.0s linear infinite}@keyframes rv_150{0%,27.27%{opacity:0}30.27%,94%{opacity:1}97%,100%{opacity:0}}.rv_150{animation:rv_150 5.0s linear infinite}@keyframes rv_240{0%,43.64%{opacity:0}46.64%,94%{opacity:1}97%,100%{opacity:0}}.rv_240{animation:rv_240 5.0s linear infinite}@keyframes rv_330{0%,60.0%{opacity:0}63.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_330{animation:rv_330 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">텀싯: 투자 조건 요약서</text>
<rect x="50" y="34" width="220" height="118" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="66" y="58" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">투자금액</text>
<line x1="66" y1="66" x2="254" y2="66" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
<g class="rv_60"><text x="254" y="58" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">3억원</text></g>
<text x="66" y="84" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">투자 전 가치</text>
<line x1="66" y1="92" x2="254" y2="92" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
<g class="rv_150"><text x="254" y="84" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">12억원</text></g>
<text x="66" y="110" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">지분율</text>
<line x1="66" y1="118" x2="254" y2="118" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
<g class="rv_240"><text x="254" y="110" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">20%</text></g>
<text x="66" y="136" font-size="10" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">이사회</text>
<line x1="66" y1="144" x2="254" y2="144" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
<g class="rv_330"><text x="254" y="136" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">투자자 1석</text></g>
<text x="160" y="172" font-size="9" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">조건 요약이라 "계약서"와는 다르다 — 구속력 범위는 확인</text>
<text x="160" y="188" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">예시 숫자입니다 (3억 ÷ 15억 = 20%)</text>
</svg>
