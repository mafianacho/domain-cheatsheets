<g class="wn_330_470" opacity="0"><text x="160" y="148" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">의결권이 없거나 제한되는 주식</text></g>
<rect x="172" y="84" width="124" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
