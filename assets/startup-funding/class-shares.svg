<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="보통주, 배당 우선, 의결권 제한, 상환과 전환 네 가지 주식 종류를 차례로 밝혀 설명하는 그림">
<style>@keyframes wn_30_170{0%,4.62%{opacity:0}6.62%,26.15%{opacity:1}28.15%,100%{opacity:0}}.wn_30_170{animation:wn_30_170 5.0s linear infinite}@keyframes wn_180_320{0%,27.69%{opacity:0}29.69%,49.23%{opacity:1}51.23%,100%{opacity:0}}.wn_180_320{animation:wn_180_320 5.0s linear infinite}@keyframes wn_330_470{0%,50.77%{opacity:0}52.77%,72.31%{opacity:1}74.31%,100%{opacity:0}}.wn_330_470{animation:wn_330_470 5.0s linear infinite}@keyframes wn_480_620{0%,73.85%{opacity:0}75.85%,95.38%{opacity:1}97.38%,100%{opacity:0}}.wn_480_620{animation:wn_480_620 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
