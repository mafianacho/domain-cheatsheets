<g class="wn_180_320" opacity="0"><rect x="172" y="40" width="124" height="34" rx="6" fill="#f59e0b"/><text x="234" y="61" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">배당·분배 우선</text></g>
<g class="wn_180_320" opacity="0"><text x="160" y="148" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">배당·잔여재산을 먼저 받는 주식</text></g>
<rect x="24" y="84" width="124" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
