<g class="wn_480_620" opacity="0"><text x="160" y="148" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">되사 주거나 다른 주식으로 바꾸는 주식</text></g>
<text x="160" y="172" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">종류와 내용은 정관에 정해야 발행할 수 있다</text>
