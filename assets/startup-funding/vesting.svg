<style>@keyframes grYcenter_60_120{0%,10.91%{transform:scaleY(0)}21.82%,94%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}.grYcenter_60_120{transform-box:fill-box;transform-origin:center bottom;animation:grYcenter_60_120 5.0s linear infinite}@keyframes rv_120{0%,21.82%{opacity:0}24.82%,94%{opacity:1}97%,100%{opacity:0}}.rv_120{animation:rv_120 5.0s linear infinite}@keyframes grYcenter_150_210{0%,27.27%{transform:scaleY(0)}38.18%,94%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}.grYcenter_150_210{transform-box:fill-box;transform-origin:center bottom;animation:grYcenter_150_210 5.0s linear infinite}@keyframes rv_210{0%,38.18%{opacity:0}41.18%,94%{opacity:1}97%,100%{opacity:0}}.rv_210{animation:rv_210 5.0s linear infinite}@keyframes grYcenter_240_300{0%,43.64%{transform:scaleY(0)}54.55%,94%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}.grYcenter_240_300{transform-box:fill-box;transform-origin:center bottom;animation:grYcenter_240_300 5.0s linear infinite}@keyframes rv_300{0%,54.55%{opacity:0}57.55%,94%{opacity:1}97%,100%{opacity:0}}.rv_300{animation:rv_300 5.0s linear infinite}@keyframes grYcenter_330_390{0%,60.0%{transform:scaleY(0)}70.91%,94%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}.grYcenter_330_390{transform-box:fill-box;transform-origin:center bottom;animation:grYcenter_330_390 5.0s linear infinite}@keyframes rv_390{0%,70.91%{opacity:0}73.91%,94%{opacity:1}97%,100%{opacity:0}}.rv_390{animation:rv_390 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
