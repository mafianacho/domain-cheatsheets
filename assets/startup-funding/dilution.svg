<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="투자 전 A 60퍼센트 B 40퍼센트가 새 주식 이천오백 주 발행 후 A 48퍼센트 B 32퍼센트 투자자 20퍼센트로 바뀌는 막대 그림">
<style>@keyframes rv_100{0%,18.18%{opacity:0}21.18%,94%{opacity:1}97%,100%{opacity:0}}.rv_100{animation:rv_100 5.0s linear infinite}@keyframes grXleft_200_280{0%,36.36%{transform:scaleX(0)}50.91%,94%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}.grXleft_200_280{transform-box:fill-box;transform-origin:left center;animation:grXleft_200_280 5.0s linear infinite}@keyframes rv_280{0%,50.91%{opacity:0}53.91%,94%{opacity:1}97%,100%{opacity:0}}.rv_280{animation:rv_280 5.0s linear infinite}@keyframes rv_320{0%,58.18%{opacity:0}61.18%,94%{opacity:1}97%,100%{opacity:0}}.rv_320{animation:rv_320 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">투자받으면 내 지분율은 줄어든다</text>
<text x="30" y="54" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">투자 전  10,000주</text>
<rect x="30" y="60" width="156" height="26" rx="3" fill="#f59e0b"/>
<text x="108" y="77" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">A 60%</text>
<rect x="186" y="60" width="104" height="26" rx="3" fill="#38bdf8"/>
<text x="238" y="77" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">B 40%</text>
<text x="30" y="110" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">투자 후  12,500주 (새 주식 2,500주 발행)</text>
<g class="rv_100"><rect x="30" y="116" width="124.8" height="26" rx="3" fill="#f59e0b"/><text x="92" y="133" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">A 48%</text><rect x="154.8" y="116" width="83.2" height="26" rx="3" fill="#38bdf8"/><text x="196" y="133" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">B 32%</text></g>
<g class="grXleft_200_280"><rect x="238" y="116" width="52" height="26" rx="3" fill="#94a3b8"/></g>
<g class="rv_280"><text x="264" y="133" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">20%</text></g>
<g class="rv_320"><text x="160" y="162" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">A 60% → 48%    B 40% → 32%</text></g>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">내 주식 수는 그대로, 전체가 늘어서 비율만 줄어든다</text>
</svg>
