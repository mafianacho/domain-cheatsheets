<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="주주별 주식 수와 지분율을 적은 표에 창업자 A, B, 스톡옵션 풀 행이 차례로 나타나고 합계가 만 주 100퍼센트가 되는 그림">
<style>@keyframes rv_60{0%,10.91%{opacity:0}13.91%,94%{opacity:1}97%,100%{opacity:0}}.rv_60{animation:rv_60 5.0s linear infinite}@keyframes rv_150{0%,27.27%{opacity:0}30.27%,94%{opacity:1}97%,100%{opacity:0}}.rv_150{animation:rv_150 5.0s linear infinite}@keyframes rv_240{0%,43.64%{opacity:0}46.64%,94%{opacity:1}97%,100%{opacity:0}}.rv_240{animation:rv_240 5.0s linear infinite}@keyframes rv_350{0%,63.64%{opacity:0}66.64%,94%{opacity:1}97%,100%{opacity:0}}.rv_350{animation:rv_350 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">지분표: 누가 몇 주를 갖는가</text>
<rect x="20" y="34" width="280" height="22" rx="4" fill="#334155"/>
<text x="32" y="49" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">주주</text>
<text x="196" y="49" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">주식 수</text>
<text x="288" y="49" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">지분율</text>
<rect x="20" y="60" width="280" height="24" rx="4" fill="#1e293b"/>
<g class="rv_60"><circle cx="34" cy="72" r="5" fill="#f59e0b"/><text x="46" y="76" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">창업자 A</text><text x="196" y="76" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">5,000주</text><text x="288" y="76" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">50%</text></g>
<rect x="20" y="86" width="280" height="24" rx="4" fill="#1e293b"/>
<g class="rv_150"><circle cx="34" cy="98" r="5" fill="#38bdf8"/><text x="46" y="102" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">창업자 B</text><text x="196" y="102" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">3,000주</text><text x="288" y="102" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">30%</text></g>
<rect x="20" y="112" width="280" height="24" rx="4" fill="#1e293b"/>
<g class="rv_240"><circle cx="34" cy="124" r="5" fill="#94a3b8"/><text x="46" y="128" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">스톡옵션 풀</text><text x="196" y="128" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">2,000주</text><text x="288" y="128" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">20%</text></g>
<rect x="20" y="138" width="280" height="24" rx="4" fill="#1e293b"/>
<g class="rv_350"><text x="46" y="154" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="700" font-family="system-ui, sans-serif">합계</text><text x="196" y="154" font-size="10" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">10,000주</text><text x="288" y="154" font-size="10" fill="#f59e0b" text-anchor="end" font-weight="700" font-family="system-ui, sans-serif">100%</text></g>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">누가 회사를 몇 퍼센트 가졌는지 한 장으로 (예시)</text>
</svg>
