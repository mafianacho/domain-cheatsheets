<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="한 주 값이 이전 라운드 오천 원에서 이번 라운드 삼천 원으로 떨어진 막대 비교">
<style>@keyframes grYcenter_100_200{0%,20.0%{transform:scaleY(0)}40.0%,94%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}.grYcenter_100_200{transform-box:fill-box;transform-origin:center bottom;animation:grYcenter_100_200 5.0s linear infinite}@keyframes rv_180{0%,36.0%{opacity:0}39.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_180{animation:rv_180 5.0s linear infinite}@keyframes rv_260{0%,52.0%{opacity:0}55.0%,94%{opacity:1}97%,100%{opacity:0}}.rv_260{animation:rv_260 5.0s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="160" y="24" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">다운라운드: 이전보다 낮은 가치</text>
<line x1="30" y1="140" x2="290" y2="140" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<rect x="60" y="60" width="60" height="80" rx="3" fill="#38bdf8"/>
<text x="90" y="54" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">5,000원</text>
<rect x="180" y="60" width="60" height="80" rx="3" fill="#334155"/>
<g class="grYcenter_100_200"><rect x="180" y="92" width="60" height="48" rx="3" fill="#f59e0b"/></g>
<g class="rv_180"><text x="210" y="86" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">3,000원</text></g>
<line x1="120" y1="60" x2="240" y2="60" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<g class="rv_260"><line x1="262" y1="60" x2="262" y2="90" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><path d="M257,84 L262,92 L267,84" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="262" y="110" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif">-40%</text></g>
<text x="90" y="156" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이전 라운드</text>
<text x="210" y="156" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이번 라운드</text>
<text x="160" y="44" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">1주당 가격 비교 (예시)</text>
<text x="160" y="182" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">이전 투자자 지분 가치가 줄고, 희석 방지 조항이 작동할 수 있다</text>
</svg>
