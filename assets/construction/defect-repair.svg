<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>완공 뒤 하자담보책임기간 안에 하자를 발견했을 때의 대응 순서</title>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">하자보수 · 약속한 기간 안의 결함</text>
<text x="16" y="50" font-size="9" fill="#f59e0b" text-anchor="start" font-family="system-ui, sans-serif">완공일 · 사용 시작일 중</text>
<text x="16" y="62" font-size="9" fill="#f59e0b" text-anchor="start" font-family="system-ui, sans-serif">먼저 온 날부터 기간 시작</text>
<rect x="40" y="80" width="200" height="16" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5" fill-opacity="0.25"/>
<line x1="40" y1="70" x2="40" y2="106" stroke="#f59e0b" stroke-width="2.5"/>
<line x1="240" y1="72" x2="240" y2="104" stroke="#38bdf8" stroke-width="2"/>
<text x="120" y="92" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">하자담보책임기간</text>
<circle cx="200" cy="88" r="5" fill="#f59e0b"/>
<text x="200" y="74" font-size="9.5" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">하자 발견</text>
<text x="248" y="92" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">기간 후</text>
<text x="160" y="122" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">발견하면 바로</text>
<rect x="14" y="130" width="84" height="30" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1.5"/>
<text x="56" y="148.325" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">사진 · 영상 기록</text>
<line x1="98" y1="145" x2="114" y2="145" stroke="#38bdf8" stroke-width="1.5"/>
<polygon points="118.0,145.0 113.5,147.2 113.5,142.8" fill="#38bdf8"/>
<rect x="118" y="130" width="84" height="30" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1.5"/>
<text x="160" y="148.325" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">서면 보수 요청</text>
<line x1="202" y1="145" x2="218" y2="145" stroke="#38bdf8" stroke-width="1.5"/>
<polygon points="222.0,145.0 217.5,147.2 217.5,142.8" fill="#38bdf8"/>
<rect x="222" y="130" width="84" height="30" fill="#1e293b" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
<text x="264" y="148.325" font-size="9.5" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">시공사가 보수</text>
<text x="160" y="184" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">하자 ≠ 사용 중 파손 · 계약서의 보증 기간부터 확인</text>
</svg>
