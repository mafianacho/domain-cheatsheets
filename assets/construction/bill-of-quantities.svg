<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>항목별 수량과 단가가 적힌 내역서 표와 수량이 없는 일식 항목</title>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">내역서 · 견적서 (예시 숫자)</text>
<rect x="14" y="30" width="292" height="18" fill="#334155"/>
<text x="22" y="43" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">항목</text>
<text x="148" y="43" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">수량</text>
<text x="214" y="43" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">단가</text>
<text x="298" y="43" font-size="10" fill="#e2e8f0" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">금액</text>
<rect x="14" y="50" width="292" height="22" fill="#1e293b"/>
<text x="22" y="65" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">타일 시공</text>
<text x="148" y="65" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">12㎡</text>
<text x="214" y="65" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">45,000</text>
<text x="298" y="65" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">540,000</text>
<rect x="14" y="72" width="292" height="22" fill="#0f172a"/>
<text x="22" y="87" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">방수 공사</text>
<text x="148" y="87" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">6㎡</text>
<text x="214" y="87" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">30,000</text>
<text x="298" y="87" font-size="10" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">180,000</text>
<rect x="14" y="94" width="292" height="22" fill="#f59e0b" fill-opacity="0.15"/>
<rect x="14" y="94" width="292" height="22" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
<text x="22" y="109" font-size="10" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">철거</text>
<text x="148" y="109" font-size="10" fill="#f59e0b" text-anchor="end" font-weight="bold" font-family="system-ui, sans-serif">일식</text>
<text x="214" y="109" font-size="10" fill="#94a3b8" text-anchor="end" font-family="system-ui, sans-serif">-</text>
<text x="298" y="109" font-size="10" fill="#94a3b8" text-anchor="end" font-family="system-ui, sans-serif">-</text>
<text x="160" y="134" font-size="9.5" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">▲ 일식: 수량 · 단가가 없어 무엇이 들었는지 알 수 없음</text>
<text x="160" y="154" font-size="10" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">견적서 = 총액  ·  내역서 = 항목별 수량 · 단가 · 금액</text>
<text x="160" y="172" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">부가세 · 폐기물 · 자재 등급은 포함인지 별도인지 확인</text>
</svg>
