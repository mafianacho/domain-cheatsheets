<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>전용면적에 공용 면적을 더해 공급면적, 계약면적이 되는 막대 그림</title>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">공급면적 · 전용에 공용을 더한 면적</text>
<rect x="20" y="38" width="110" height="20" fill="#f59e0b"/>
<text x="75" y="52" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">전용</text>
<text x="140" y="52" font-size="10" fill="#f59e0b" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">전용면적</text>
<rect x="20" y="68" width="110" height="20" fill="#f59e0b"/>
<rect x="130" y="68" width="50" height="20" fill="#38bdf8"/>
<text x="75" y="82" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">전용</text>
<text x="155" y="82" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">주거공용</text>
<text x="190" y="82" font-size="10" fill="#38bdf8" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">공급면적</text>
<rect x="20" y="98" width="110" height="20" fill="#f59e0b"/>
<rect x="130" y="98" width="50" height="20" fill="#38bdf8"/>
<rect x="180" y="98" width="70" height="20" fill="#475569"/>
<text x="75" y="112" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">전용</text>
<text x="155" y="112" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">주거공용</text>
<text x="215" y="112" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">기타공용</text>
<text x="258" y="112" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="bold" font-family="system-ui, sans-serif">계약면적</text>
<text x="160" y="138" font-size="10" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">분양 광고의 '몇 평형'은 보통 공급면적</text>
<rect x="20" y="144" width="8" height="8" fill="#f59e0b"/>
<text x="34" y="152" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">전용 = 문 안쪽 우리 집</text>
<rect x="20" y="157" width="8" height="8" fill="#38bdf8"/>
<text x="34" y="165" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">주거공용 = 계단 · 복도 · 엘리베이터 홀 중 일부</text>
<rect x="20" y="170" width="8" height="8" fill="#475569"/>
<text x="34" y="178" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">기타공용 = 지하주차장 · 관리사무소 등</text>
<text x="14" y="194" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">※ 막대 길이는 설명용이며 실제 비율이 아닙니다</text>
</svg>
