<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>전용면적</title>
<defs></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">전용 · 공용 · 서비스(발코니) 면적</text><rect x="40" y="56" width="180" height="100" fill="#f59e0b33" stroke="#f59e0b" stroke-width="2" /><rect x="40" y="36" width="180" height="20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="226" y="56" width="60" height="100" fill="#334155" stroke="#475569" stroke-width="1.5" /><rect x="40" y="56" width="6" height="100" fill="#475569" stroke="none" stroke-width="1" /><rect x="214" y="56" width="6" height="100" fill="#475569" stroke="none" stroke-width="1" /><text x="130" y="112" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">전용</text><text x="130" y="129" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">(우리 집 안쪽)</text><text x="130" y="50" font-size="9" fill="#38bdf8" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">발코니 = 서비스</text><text x="256" y="100" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">복도·계단</text><text x="256" y="114" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">공용</text><text x="40" y="178" font-size="10" fill="#e2e8f0" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">공급 = 전용 + 공용 일부</text>
</svg>
