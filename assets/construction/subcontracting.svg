<text x="168" y="118" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">하도급 계약</text>
<text x="160" y="186" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">공사 전부 · 대부분을 통째로 넘기는 하도급은 법이 제한</text>
