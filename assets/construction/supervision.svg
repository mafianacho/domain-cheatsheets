<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>건축주, 시공사, 감리자 세 주체의 관계</title>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">감리 · 시공사와 별개로 점검하는 사람</text>
<rect x="125" y="32" width="70" height="28" fill="#1e293b" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
<text x="160" y="49.5" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">건축주</text>
<rect x="20" y="118" width="84" height="28" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1.5"/>
<text x="62" y="135.5" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">시공사</text>
<rect x="216" y="118" width="84" height="28" fill="#1e293b" rx="6" stroke="#38bdf8" stroke-width="1.5"/>
<text x="258" y="135.5" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">감리자</text>
<line x1="142" y1="60" x2="75.0801" y2="115.448" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="72.0,118.0 74.1,113.5 76.9,116.8" fill="#94a3b8"/>
<text x="100" y="90" font-size="9" fill="#e2e8f0" text-anchor="end" font-family="system-ui, sans-serif">공사 계약</text>
<line x1="178" y1="60" x2="244.92" y2="115.448" stroke="#38bdf8" stroke-width="1.5"/>
<polygon points="248.0,118.0 243.1,116.8 245.9,113.5" fill="#38bdf8"/>
<text x="220" y="90" font-size="9" fill="#38bdf8" text-anchor="start" font-family="system-ui, sans-serif">감리 지정</text>
<line x1="216" y1="132" x2="108" y2="132" stroke="#38bdf8" stroke-width="2"/>
<polygon points="104.0,132.0 108.5,129.8 108.5,134.2" fill="#38bdf8"/>
<text x="160" y="126" font-size="9" fill="#38bdf8" text-anchor="middle" font-family="system-ui, sans-serif">점검 · 시정 요청</text>
<text x="160" y="168" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">감리 = 도면 · 기준대로 하는지 따로 확인</text>
<text x="160" y="185" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">시공사 소속 현장소장은 감독일 뿐 감리가 아님</text>
</svg>
