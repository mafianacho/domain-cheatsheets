<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>설계도의 벽 위치와 실제 시공된 벽 위치의 차이를 겹쳐 그린 준공도면</title>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">준공도면 · 실제 지어진 대로</text>
<rect x="24" y="34" width="160" height="94" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<line x1="90" y1="36" x2="90" y2="126" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 4"/>
<line x1="112" y1="36" x2="112" y2="126" stroke="#f59e0b" stroke-width="4"/>
<path d="M30,70 H90 V100 H178" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/>
<path d="M30,70 H112 V100 H178" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
<text x="101" y="143" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="system-ui, sans-serif">벽 위치가 달라짐</text>
<line x1="204" y1="62" x2="222" y2="62" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 4"/>
<text x="228" y="66" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">설계도(계획)</text>
<line x1="204" y1="86" x2="222" y2="86" stroke="#f59e0b" stroke-width="4"/>
<text x="228" y="90" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">준공도면(실제)</text>
<line x1="204" y1="110" x2="222" y2="110" stroke="#38bdf8" stroke-width="2"/>
<text x="228" y="114" font-size="9" fill="#e2e8f0" text-anchor="start" font-family="system-ui, sans-serif">배관 · 전기선</text>
<text x="160" y="166" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">공사 중 바뀐 부분을 반영한 도면</text>
<text x="160" y="183" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">→ 벽 속 배관 · 배선 위치를 나중에 알 수 있음</text>
</svg>
