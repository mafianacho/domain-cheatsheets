<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>용적률</title>
<defs></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">용적률 · 땅 대비 모든 층 바닥면적 합</text><line x1="30" y1="140" x2="290" y2="140" stroke="#475569" stroke-width="2"/><rect x="50" y="140" width="220" height="8" fill="#334155" stroke="none" stroke-width="1" /><rect x="100" y="36" width="120" height="22" fill="#f59e0b44" stroke="#f59e0b" stroke-width="1.5" /><text x="160" y="51" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">4층 바닥</text><rect x="100" y="62" width="120" height="22" fill="#f59e0b44" stroke="#f59e0b" stroke-width="1.5" /><text x="160" y="77" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">3층 바닥</text><rect x="100" y="88" width="120" height="22" fill="#f59e0b44" stroke="#f59e0b" stroke-width="1.5" /><text x="160" y="103" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">2층 바닥</text><rect x="100" y="114" width="120" height="22" fill="#f59e0b44" stroke="#f59e0b" stroke-width="1.5" /><text x="160" y="129" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">1층 바닥</text><rect x="50" y="152" width="220" height="18" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/><text x="160" y="165" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">제외: 지하층, 건물에 딸린 지상 주차장 등</text><text x="160" y="190" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">용적률 = (연면적 − 제외분) ÷ 대지면적</text>
</svg>
