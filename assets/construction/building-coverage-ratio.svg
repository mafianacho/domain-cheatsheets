<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>건폐율</title>
<defs></defs>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">건폐율 · 땅 중 건물이 덮은 비율 (위에서 본 모습)</text><rect x="50" y="36" width="220" height="112" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><rect x="90" y="62" width="120" height="62" fill="#f59e0b55" stroke="#f59e0b" stroke-width="2" /><text x="60" y="56" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal" font-family="system-ui, sans-serif">대지(땅)</text><text x="150" y="98" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">건축면적</text><text x="150" y="112" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">(1층이 땅을 덮은 면적)</text><text x="160" y="172" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-family="system-ui, sans-serif">건폐율 = 건축면적 ÷ 대지면적</text>
</svg>
