<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
<title>변경 요청에서 서면 합의, 도면 수정까지의 순서</title>
<rect width="320" height="200" rx="12" fill="#0f172a"/>
<text x="14" y="22" font-size="11" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">설계변경 · 추가 공사는 문서로</text>
<rect x="13" y="38" width="66" height="44" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1.5"/>
<text x="46" y="59" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">변경 요청</text>
<text x="46" y="71" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">무엇을 바꿈?</text>
<line x1="79" y1="60" x2="85" y2="60" stroke="#38bdf8" stroke-width="1.5"/>
<polygon points="89.0,60.0 84.5,62.2 84.5,57.8" fill="#38bdf8"/>
<rect x="89" y="38" width="66" height="44" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1.5"/>
<text x="122" y="59" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">영향 확인</text>
<text x="122" y="71" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">비용 · 일정</text>
<line x1="155" y1="60" x2="161" y2="60" stroke="#38bdf8" stroke-width="1.5"/>
<polygon points="165.0,60.0 160.5,62.2 160.5,57.8" fill="#38bdf8"/>
<rect x="165" y="38" width="66" height="44" fill="#1e293b" rx="6" stroke="#f59e0b" stroke-width="1.5"/>
<text x="198" y="59" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">서면 합의</text>
<text x="198" y="71" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">금액 · 기간</text>
<line x1="231" y1="60" x2="237" y2="60" stroke="#38bdf8" stroke-width="1.5"/>
<polygon points="241.0,60.0 236.5,62.2 236.5,57.8" fill="#38bdf8"/>
<rect x="241" y="38" width="66" height="44" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1.5"/>
<text x="274" y="59" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">도면 수정</text>
<text x="274" y="71" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="system-ui, sans-serif">내역서도 같이</text>
<text x="14" y="112" font-size="9.5" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">변경 전</text>
<rect x="64" y="103" width="150" height="12" fill="#38bdf8"/>
<text x="14" y="134" font-size="9.5" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">변경 후</text>
<rect x="64" y="125" width="150" height="12" fill="#38bdf8"/>
<rect x="214" y="125" width="50" height="12" fill="#f59e0b"/>
<text x="270" y="135" font-size="9.5" fill="#f59e0b" text-anchor="start" font-family="system-ui, sans-serif">+ 추가</text>
<text x="160" y="160" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="system-ui, sans-serif">말로만 합의하면 나중에 금액 분쟁</text>
<text x="160" y="177" font-size="10" fill="#e2e8f0" text-anchor="middle" font-family="system-ui, sans-serif">바꾸기 전에 금액 · 일정을 서면으로 받기</text>
<text x="14" y="194" font-size="9" fill="#94a3b8" text-anchor="start" font-family="system-ui, sans-serif">※ 막대 길이는 설명용입니다</text>
</svg>
